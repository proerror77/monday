name: Build and Push to ACR

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: "Git ref to build"
        required: true
        default: "main"
      push_images:
        description: "Push images to ACR"
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  SCCACHE_CACHE_SIZE: 10G
  TZ: UTC
  LC_ALL: C
  LANG: C
  PLATFORM_TARGET: x86_64-unknown-linux-gnu
  ACR_REGISTRY: registry.ap-northeast-1.aliyuncs.com
  ACR_NAMESPACE: ploy

jobs:
  build-and-push:
    name: Build binaries and Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.git_ref }}

      - name: Capture checked-out commit
        run: echo "BUILD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Enforce immutable image push provenance
        if: ${{ github.event.inputs.push_images == 'true' }}
        run: |
          if [ "${{ github.event.inputs.git_ref }}" != "main" ]; then
            echo "ACR image pushes must use git_ref=main" >&2
            exit 1
          fi

      - name: Set reproducible build environment
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91
          targets: ${{ env.PLATFORM_TARGET }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libpq-dev clang lld
          sudo apt-get install -y sccache || cargo install sccache --locked
          sudo apt-get install -y mold || true

      - name: Capture cache metadata
        id: cache_meta
        run: |
          echo "rustc_version=$(rustc -Vv | sed -n 's/^release: //p')" >> "$GITHUB_OUTPUT"
          echo "sccache_version=$(sccache --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: acr-build-${{ env.PLATFORM_TARGET }}-release-rust-${{ steps.cache_meta.outputs.rustc_version }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache sccache
        uses: actions/cache@v5
        with:
          path: ~/.cache/sccache
          key: ${{ runner.os }}-sccache-acr-build-${{ env.PLATFORM_TARGET }}-release-rust-${{ steps.cache_meta.outputs.rustc_version }}-sccache-${{ steps.cache_meta.outputs.sccache_version }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-sccache-acr-build-${{ env.PLATFORM_TARGET }}-release-rust-${{ steps.cache_meta.outputs.rustc_version }}-sccache-${{ steps.cache_meta.outputs.sccache_version }}-
            ${{ runner.os }}-sccache-acr-build-${{ env.PLATFORM_TARGET }}-release-rust-${{ steps.cache_meta.outputs.rustc_version }}-
            ${{ runner.os }}-sccache-acr-build-${{ env.PLATFORM_TARGET }}-release-
            ${{ runner.os }}-sccache-acr-build-
            ${{ runner.os }}-sccache-

      - name: Build ploy-runner
        run: |
          cargo build --release --locked \
            --target "${PLATFORM_TARGET}" \
            --features full \
            -p new-ploy-runner
          strip "target/${PLATFORM_TARGET}/release/new-ploy-runner" || true

      - name: Build research binaries
        run: |
          cargo build --release --locked \
            --target "${PLATFORM_TARGET}" \
            -p ploy-strategy-bundles \
            --example run_backtest
          strip "target/${PLATFORM_TARGET}/release/examples/run_backtest" || true

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats || true

      - name: Login to ACR
        if: ${{ github.event.inputs.push_images == 'true' }}
        run: |
          docker login "${ACR_REGISTRY}" \
            -u "${{ secrets.ACR_USERNAME }}" \
            -p "${{ secrets.ACR_PASSWORD }}"

      - name: Build and push ploy-runner image
        run: |
          IMAGE="${ACR_REGISTRY}/${ACR_NAMESPACE}/ploy-runner"
          docker build -f Dockerfile.runner -t "${IMAGE}:${BUILD_SHA}" .
          if [ "${{ github.event.inputs.push_images }}" = "true" ]; then
            docker push "${IMAGE}:${BUILD_SHA}"
          fi

      - name: Build and push ploy-collector image
        run: |
          IMAGE="${ACR_REGISTRY}/${ACR_NAMESPACE}/ploy-collector"
          docker build -f Dockerfile.collector -t "${IMAGE}:${BUILD_SHA}" .
          if [ "${{ github.event.inputs.push_images }}" = "true" ]; then
            docker push "${IMAGE}:${BUILD_SHA}"
          fi

      - name: Build and push ploy-research image
        run: |
          IMAGE="${ACR_REGISTRY}/${ACR_NAMESPACE}/ploy-research"
          docker build -f Dockerfile.research -t "${IMAGE}:${BUILD_SHA}" .
          if [ "${{ github.event.inputs.push_images }}" = "true" ]; then
            docker push "${IMAGE}:${BUILD_SHA}"
          fi

      - name: Summary
        run: |
          {
            echo "## Build Summary"
            echo "- ploy-runner: built"
            echo "- ploy-collector: built"
            echo "- ploy-research: built"
            echo "- Image tag: \`${BUILD_SHA}\`"
            echo "- Push images: \`${{ github.event.inputs.push_images }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
