name: Deploy to ACK

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Immutable 40-character image SHA tag to deploy"
        required: true
        default: ""
      provenance_ref:
        description: "Reviewed provenance ref containing image_tag (main, release/*, or version tag)"
        required: true
        default: "main"
      component:
        description: "Component to deploy (all/ployd/strategy/collectors)"
        required: true
        default: "all"

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to ACK cluster
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ack

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Validate immutable image tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image_tag="${{ github.event.inputs.image_tag }}"
          provenance_ref="${{ github.event.inputs.provenance_ref }}"
          if [ -z "${image_tag}" ]; then
            echo "image_tag is required and must be the immutable SHA tag produced by build-push-acr.yml" >&2
            exit 1
          fi
          if [ "${image_tag}" = "latest" ]; then
            echo "ACK deploy cannot use mutable latest image tags" >&2
            exit 1
          fi
          if ! printf '%s' "${image_tag}" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "image_tag must be a full 40-character lowercase git SHA tag" >&2
            exit 1
          fi
          case "${provenance_ref}" in
            main|release/*|v[0-9]*)
              ;;
            *)
              echo "provenance_ref must be main, release/*, or a version tag" >&2
              exit 1
              ;;
          esac
          status="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${image_tag}...${provenance_ref}" --jq .status)"
          case "${status}" in
            ahead|identical)
              ;;
            *)
              echo "image_tag ${image_tag} is not contained in provenance ref ${provenance_ref}" >&2
              exit 1
              ;;
          esac

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.ACK_KUBECONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Verify cluster connection
        run: kubectl get nodes

      - name: Deploy ployd
        if: ${{ github.event.inputs.component == 'all' || github.event.inputs.component == 'ployd' }}
        run: |
          kubectl set image deployment/ployd \
            ployd=registry-vpc.ap-northeast-1.aliyuncs.com/ploy/ploy-runner:${{ github.event.inputs.image_tag }} \
            -n ploy
          kubectl rollout status deployment/ployd -n ploy --timeout=120s

      - name: Deploy strategy
        if: ${{ github.event.inputs.component == 'all' || github.event.inputs.component == 'strategy' }}
        run: |
          kubectl set image deployment/ploy-strategy-dryrun \
            strategy=registry-vpc.ap-northeast-1.aliyuncs.com/ploy/ploy-runner:${{ github.event.inputs.image_tag }} \
            -n ploy
          kubectl rollout status deployment/ploy-strategy-dryrun -n ploy --timeout=120s

      - name: Deploy collectors
        if: ${{ github.event.inputs.component == 'all' || github.event.inputs.component == 'collectors' }}
        run: |
          for dep in binance-price-collector binance-lob-collector binance-aggtrade-collector; do
            kubectl set image deployment/${dep} \
              collector=registry-vpc.ap-northeast-1.aliyuncs.com/ploy/ploy-collector:${{ github.event.inputs.image_tag }} \
              -n ploy
            kubectl rollout status deployment/${dep} -n ploy --timeout=60s
          done

      - name: Verify deployment
        run: |
          kubectl get pods -n ploy
          kubectl get deployments -n ploy
