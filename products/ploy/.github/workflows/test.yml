  open-followup-issue:
    name: Open Follow-up Issue
    needs:
      - workflow-lint
      - rust-format
      - safety-scans
      - audit
      - rust-control-plane
      - rust-runner-lean
      - rust-runner-live
      - rust-market-data
      - rust-research-heavy
      - frontend
      - integration-regressions
    runs-on: ubuntu-latest
    if: ${{ failure() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Create or update CI failure issue
        uses: actions/github-script@v9
        with:
          script: |
            const title = "Main CI failed";
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const body = [
              "Automated CI detected a failure on `main`.",
              "",
              `- Workflow: ${context.workflow}`,
              `- Run: ${runUrl}`,
              `- Commit: ${context.sha}`,
              "",
              "Please investigate and fix."
            ].join("\n");

            const search = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "${title}"`
            });

            if (search.data.items.length > 0) {
              const issueNumber = search.data.items[0].number;
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body
              });
              core.info(`Updated existing issue #${issueNumber}`);
            } else {
              const issue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
              core.info(`Created issue #${issue.data.number}`);
            }
