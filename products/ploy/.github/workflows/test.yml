          SECONDS=0
          cargo test --locked -p ploy --test platform_release_workflow
          cargo test --locked -p ploy --test platform_smoke
          cargo test --locked -p ploy --test workspace_runtime_retirement
          cargo test --locked -p ploy --test workflow_security ci_runs_dependency_vulnerability_audit -- --exact
          cargo test --locked -p ploy --test workflow_security checked_in_platform_service_enforces_guardrails -- --exact
