name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  SQLX_CLI_VERSION: 0.8.6
  SCCACHE_CACHE_SIZE: 10G

jobs:
  commit-hygiene:
    name: Commit hygiene
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check commit subjects
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          range="${BASE_SHA}..HEAD"
          echo "Checking commit subjects in range: ${range}"
          git log --oneline "${range}"

          bad_commits="$(git log --format='%h %s' "${range}" | grep -E '^[0-9a-f]+ (WIP|wip|fixup!|squash!)' || true)"
          if [ -n "${bad_commits}" ]; then
            echo "Found non-atomic/WIP commit subjects:"
            echo "${bad_commits}"
            echo "Please squash or rewrite commit messages before merge."
            exit 1
          fi

  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

      - name: Run actionlint
        run: |
          "${HOME}/go/bin/actionlint" -color

  rust-format:
    name: Rust formatting
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91
          components: rustfmt

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

  safety-scans:
    name: Retired route and SSH safety scans
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Validate frontend route contract
        run: node ploy-frontend/scripts/check-route-contract.mjs

      - name: Reject retired routes, insecure SSH, and reset bypasses
        run: |
          set -euo pipefail
          run_forbidden_scan() {
            label="$1"
            pattern="$2"
            shift 2
            set +e
            if command -v rg >/dev/null 2>&1; then
              rg -n -- "${pattern}" "$@"
            else
              grep -R -n -E -- "${pattern}" "$@"
            fi
            scan_status=$?
            set -e
            case "${scan_status}" in
              0)
                echo "forbidden ${label} match found" >&2
                exit 1
                ;;
              1)
                return 0
                ;;
              *)
                echo "${label} scanner error (rg exit ${scan_status})" >&2
                exit "${scan_status}"
                ;;
            esac
          }

          run_forbidden_scan \
            "retired frontend route" \
            "/stats/|'/(trades|positions|security/events|system/start|config|agent/|sidecar/)" \
            ploy-frontend/src/services/api.ts
          run_forbidden_scan \
            "insecure SSH or reset bypass" \
            'StrictHostKeyChecking[[:space:]=]+no|UserKnownHostsFile[[:space:]=]+/dev/null|allow[_-]?running' \
            .github/workflows

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Run cargo audit
        run: |
          # Temporary exception: sqlx 0.8.6 keeps an unused mysql driver chain in Cargo.lock,
          # which pulls `rsa` despite this workspace having no reachable mysql runtime path.
          # RustSec lists no fixed release; remove this ignore when sqlx drops the lockfile edge.
          cargo audit --ignore RUSTSEC-2023-0071

  rust-control-plane:
    name: Rust control-plane/core
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ploy
          POSTGRES_PASSWORD: ${{ github.run_id }}
          POSTGRES_DB: ploy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91
          components: clippy, rustfmt

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libpq-dev clang lld
          sudo apt-get install -y sccache || cargo install sccache --locked

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-control-plane-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache sccache
        uses: actions/cache@v5
        with:
          path: ~/.cache/sccache
          key: ${{ runner.os }}-sccache-control-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-sccache-control-
            ${{ runner.os }}-sccache-

      - name: Install SQLx CLI
        run: |
          cargo install sqlx-cli \
            --locked \
            --version "${SQLX_CLI_VERSION}" \
            --no-default-features \
            --features rustls,postgres

      - name: Prepare database schema
        env:
          DATABASE_URL: postgres://ploy:${{ github.run_id }}@localhost:5432/ploy_test
        run: sqlx migrate run

      - name: Build and test control-plane/core lane
        env:
          DATABASE_URL: postgres://ploy:${{ github.run_id }}@localhost:5432/ploy_test
          RUSTC_WRAPPER: sccache
        run: |
          set -euo pipefail
          SECONDS=0
          cargo build --locked \
            -p ploy-agent-sidecar \
            -p ploy-daemon-host \
            -p new-ployd \
            -p ployctl \
            -p ploy-control-client \
            -p ploytui \
            -p ploy-deployments \
            -p ploy-operator-contracts \
            -p ploy-platform \
            -p ploy-platform-runtime \
            -p ploy-trading
          cargo test --locked \
            -p ploy-agent-sidecar \
            -p ploy-daemon-host \
            -p new-ployd \
            -p ployctl \
            -p ploy-control-client \
            -p ploytui \
            -p ploy-deployments \
            -p ploy-operator-contracts \
            -p ploy-platform \
            -p ploy-platform-runtime \
            -p ploy-trading
          cargo clippy --locked -p ploy-agent-sidecar --all-targets --no-deps -- -D warnings
          echo "### Rust control-plane/core lane" >> "$GITHUB_STEP_SUMMARY"
          echo "Elapsed seconds: ${SECONDS}" >> "$GITHUB_STEP_SUMMARY"

      - name: Show sccache stats
        if: always()
        run: |
          sccache --show-stats | tee /tmp/sccache-stats.txt || true
          {
            echo "### sccache: rust-control-plane"
            echo '```'
            cat /tmp/sccache-stats.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

