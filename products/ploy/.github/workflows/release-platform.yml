name: Build Platform Bundle

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: "Git ref to release (branch, tag, or SHA)"
        required: true
        default: "main"

concurrency:
  group: release-platform-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  SCCACHE_CACHE_SIZE: 10G
  TZ: UTC
  LC_ALL: C
  LANG: C
  PLATFORM_TARGET: x86_64-unknown-linux-gnu

jobs:
  build:
    name: Build platform bundle
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.git_ref }}

      - name: Set reproducible build environment
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91
          targets: ${{ env.PLATFORM_TARGET }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libpq-dev clang lld
          sudo apt-get install -y sccache || cargo install sccache --locked
          sudo apt-get install -y mold || true

      - name: Capture cache metadata
        id: cache_meta
        run: |
          echo "rustc_version=$(rustc -Vv | sed -n 's/^release: //p')" >> "$GITHUB_OUTPUT"
          echo "sccache_version=$(sccache --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-platform-${{ env.PLATFORM_TARGET }}-release-rust-${{ steps.cache_meta.outputs.rustc_version }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache sccache
        uses: actions/cache@v5
        with:
          path: ~/.cache/sccache
          key: ${{ runner.os }}-sccache-release-platform-${{ env.PLATFORM_TARGET }}-release-rust-${{ steps.cache_meta.outputs.rustc_version }}-sccache-${{ steps.cache_meta.outputs.sccache_version }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-sccache-release-platform-${{ env.PLATFORM_TARGET }}-release-rust-${{ steps.cache_meta.outputs.rustc_version }}-sccache-${{ steps.cache_meta.outputs.sccache_version }}-
            ${{ runner.os }}-sccache-release-platform-${{ env.PLATFORM_TARGET }}-release-rust-${{ steps.cache_meta.outputs.rustc_version }}-
            ${{ runner.os }}-sccache-release-platform-${{ env.PLATFORM_TARGET }}-release-
            ${{ runner.os }}-sccache-release-platform-
            ${{ runner.os }}-sccache-

      - name: Build platform binaries
        run: |
          # Build the new entrypoints, then install them under the compatibility
          # binary names used by existing hosts and systemd units.
          cargo build --release --locked \
            --target "${PLATFORM_TARGET}" \
            --features new-ploy-runner/full \
            -p new-ployd \
            -p ployctl \
            -p ploytui \
            -p new-ploy-runner
          strip "target/${PLATFORM_TARGET}/release/new-ployd" || true
          strip "target/${PLATFORM_TARGET}/release/ployctl" || true
          strip "target/${PLATFORM_TARGET}/release/ploytui" || true
          strip "target/${PLATFORM_TARGET}/release/new-ploy-runner" || true

      - name: Create platform bundle
        run: |
          set -euo pipefail
          bundle_root="dist/platform-bundle"
          mkdir -p \
            "${bundle_root}/bin" \
            "${bundle_root}/config/deployments" \
            "${bundle_root}/data/state" \
            "${bundle_root}/deployment" \
            "${bundle_root}/scripts" \
            "${bundle_root}/scripts/drills"
          install -m 755 "target/${PLATFORM_TARGET}/release/new-ployd" "${bundle_root}/bin/ployd"
          install -m 755 "target/${PLATFORM_TARGET}/release/ployctl" "${bundle_root}/bin/ployctl"
          install -m 755 "target/${PLATFORM_TARGET}/release/ploytui" "${bundle_root}/bin/ploytui"
          install -m 755 "target/${PLATFORM_TARGET}/release/new-ploy-runner" "${bundle_root}/bin/ploy-runner"
          install -m 644 deployment/ployd.service "${bundle_root}/deployment/ployd.service"
          install -m 644 deployment/ploy-maintenance.service "${bundle_root}/deployment/ploy-maintenance.service"
          install -m 644 deployment/ploy-maintenance.timer "${bundle_root}/deployment/ploy-maintenance.timer"
          install -m 644 deployment/ploy-platform-watchdog.service "${bundle_root}/deployment/ploy-platform-watchdog.service"
          install -m 644 deployment/ploy-platform-watchdog.timer "${bundle_root}/deployment/ploy-platform-watchdog.timer"
          install -m 755 scripts/install-platform-service.sh "${bundle_root}/scripts/install-platform-service.sh"
          install -m 755 scripts/ploy_maintenance.sh "${bundle_root}/scripts/ploy_maintenance.sh"
          install -m 755 scripts/ploy_platform_watchdog.sh "${bundle_root}/scripts/ploy_platform_watchdog.sh"
          install -m 755 scripts/drills/live_dry_run.sh "${bundle_root}/scripts/drills/live_dry_run.sh"
          install -m 644 config/deployments/example.live.dry-run.json "${bundle_root}/config/deployments/example.live.dry-run.json.sample"
          install -m 644 data/state/deployments.json.sample "${bundle_root}/data/state/deployments.json.sample"
          tar --sort=name --mtime="@${SOURCE_DATE_EPOCH}" --owner=0 --group=0 --numeric-owner \
            -C "${bundle_root}" -cf - . | gzip -n > dist/ploy-platform.tar.gz
          (cd dist && sha256sum ploy-platform.tar.gz > ploy-platform.tar.gz.sha256)

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats || true

      - name: Upload platform bundle
        uses: actions/upload-artifact@v7
        with:
          name: ploy-platform-bundle
          path: |
            dist/ploy-platform.tar.gz
            dist/ploy-platform.tar.gz.sha256
          retention-days: 14
