name: Approve Predict Account Operation

on:
  workflow_dispatch:
    inputs:
      deploy_sha:
        description: "Exact current main SHA already deployed to ploy-trade-1"
        required: true
      operation:
        description: "One of: order_approve, order_execute, order_reconcile, redeem_approve, redeem_execute, redeem_reconcile"
        required: true
      plan_sha256:
        description: "Exact SHA-256 printed by ploy-predict-account-ops plan"
        required: true
      risk_confirmation:
        description: "Type exactly: I APPROVE THIS PREDICT ACCOUNT OPERATION"
        required: true

concurrency:
  group: ploy-trade-host
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      deploy_sha: ${{ steps.validate.outputs.deploy_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.deploy_sha }}
          fetch-depth: 0
      - id: validate
        env:
          DEPLOY_SHA: ${{ inputs.deploy_sha }}
          OPERATION: ${{ inputs.operation }}
          PLAN_SHA256: ${{ inputs.plan_sha256 }}
          RISK_CONFIRMATION: ${{ inputs.risk_confirmation }}
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF_NAME}" == "main" ]]
          [[ "${DEPLOY_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${PLAN_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          [[ "${RISK_CONFIRMATION}" == "I APPROVE THIS PREDICT ACCOUNT OPERATION" ]]
          case "${OPERATION}" in
            order_approve|order_execute|order_reconcile|redeem_approve|redeem_execute|redeem_reconcile) ;;
            *) echo "unsupported operation" >&2; exit 1 ;;
          esac
          git fetch --no-tags origin main
          [[ "$(git rev-parse HEAD)" == "${DEPLOY_SHA}" ]]
          case "${OPERATION}" in
            *_reconcile) git merge-base --is-ancestor "${DEPLOY_SHA}" origin/main ;;
            *) [[ "$(git rev-parse origin/main)" == "${DEPLOY_SHA}" ]] ;;
          esac
          echo "deploy_sha=${DEPLOY_SHA}" >> "${GITHUB_OUTPUT}"

  execute:
    needs: validate
    runs-on: ubuntu-latest
    environment: ploy-trade-live
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.deploy_sha }}
          fetch-depth: 0

      - name: Revalidate current main after human approval
        env:
          DEPLOY_SHA: ${{ needs.validate.outputs.deploy_sha }}
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          [[ "$(git rev-parse HEAD)" == "${DEPLOY_SHA}" ]]
          case "${OPERATION}" in
            *_reconcile) git merge-base --is-ancestor "${DEPLOY_SHA}" origin/main ;;
            *) [[ "$(git rev-parse origin/main)" == "${DEPLOY_SHA}" ]] ;;
          esac

      - name: Configure pinned SSH
        env:
          PLOY_TRADE_1_KNOWN_HOSTS: ${{ secrets.PLOY_TRADE_1_KNOWN_HOSTS }}
          PLOY_TRADE_1_SSH_KEY: ${{ secrets.PLOY_TRADE_1_SSH_KEY }}
        run: |
          set -euo pipefail
          [[ -n "${PLOY_TRADE_1_KNOWN_HOSTS}" && -n "${PLOY_TRADE_1_SSH_KEY}" ]]
          install -m 700 -d ~/.ssh
          printf '%s\n' "${PLOY_TRADE_1_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          printf '%s\n' "${PLOY_TRADE_1_SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/known_hosts ~/.ssh/deploy_key
          cat > ~/.ssh/config <<EOF
          Host ploy-trade-1
            HostName ${{ secrets.PLOY_TRADE_1_HOST }}
            User root
            IdentityFile ~/.ssh/deploy_key
            HostKeyAlias ploy-trade-1
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            ConnectTimeout 30
          EOF

      - name: Execute exact approved plan once
        env:
          DEPLOY_SHA: ${{ needs.validate.outputs.deploy_sha }}
          OPERATION: ${{ inputs.operation }}
          PLAN_SHA256: ${{ inputs.plan_sha256 }}
        run: |
          set -euo pipefail
          ssh ploy-trade-1 /bin/bash -s -- "${DEPLOY_SHA}" "${OPERATION}" "${PLAN_SHA256}" <<'REMOTE'
          set -euo pipefail
          deploy_sha="$1"
          operation="$2"
          plan_sha256="$3"
          root=/opt/ploy
          [[ "$(readlink -f "${root}/current")" == "${root}/releases/${deploy_sha}" ]]
          grep -Fxq "PLOY_RELEASE_SHA=${deploy_sha}" "${root}/.env"
          require_unique_false() {
            local key="$1"
            [[ "$(grep -cE "^${key}=" "${root}/.env")" == 1 ]]
            grep -Fxq "${key}=false" "${root}/.env"
          }
          require_unique_false PLOY_PREDICT_ACCOUNT_OPS_WRITE_ENABLED
          require_unique_false PLOY_PREDICT_APPROVAL_WRITE_ENABLED
          require_unique_false PLOY_PREDICT_RECONCILE_WRITE_ENABLED
          set -a
          # shellcheck disable=SC1091
          . "${root}/.env"
          set +a
          [[ "${PLOY_PREDICT_ACCOUNT_OPS_WRITE_ENABLED}" == false ]]
          [[ "${PLOY_PREDICT_APPROVAL_WRITE_ENABLED}" == false ]]
          [[ "${PLOY_PREDICT_RECONCILE_WRITE_ENABLED}" == false ]]
          case "${operation}" in
            order_*) plan="${root}/data/account-ops/predict-order-plan.json" ;;
            redeem_*) plan="${root}/data/account-ops/predict-redeem-plan.json" ;;
          esac
          [[ "$(stat -c '%U:%G:%a' "${plan}")" == "root:root:600" ]]
          case "${operation}" in
            order_approve)
              PLOY_PREDICT_APPROVAL_WRITE_ENABLED=true "${root}/bin/ploy-predict-account-ops" order approve --plan "${plan}" --sha256 "${plan_sha256}"
              ;;
            order_execute)
              PLOY_PREDICT_ACCOUNT_OPS_WRITE_ENABLED=true "${root}/bin/ploy-predict-account-ops" order execute --plan "${plan}" --sha256 "${plan_sha256}"
              ;;
            order_reconcile)
              PLOY_PREDICT_RECONCILE_WRITE_ENABLED=true "${root}/bin/ploy-predict-account-ops" order reconcile --plan "${plan}" --sha256 "${plan_sha256}"
              ;;
            redeem_approve)
              PLOY_PREDICT_APPROVAL_WRITE_ENABLED=true "${root}/bin/ploy-predict-account-ops" redeem approve --plan "${plan}" --sha256 "${plan_sha256}"
              ;;
            redeem_execute)
              PLOY_PREDICT_ACCOUNT_OPS_WRITE_ENABLED=true "${root}/bin/ploy-predict-account-ops" redeem execute --plan "${plan}" --sha256 "${plan_sha256}"
              ;;
            redeem_reconcile)
              PLOY_PREDICT_RECONCILE_WRITE_ENABLED=true "${root}/bin/ploy-predict-account-ops" redeem reconcile --plan "${plan}" --sha256 "${plan_sha256}"
              ;;
          esac
          REMOTE
