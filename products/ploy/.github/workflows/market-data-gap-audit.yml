name: Market Data Gap Audit

on:
  workflow_dispatch:
    inputs:
      run_full_audit:
        description: "Run the full retained-window audit"
        type: boolean
        required: true
        default: true
      full_lookback_hours:
        description: "Full audit lookback window in hours"
        required: true
        default: "168"
      bucket_minutes:
        description: "Coverage bucket size in minutes"
        required: true
        default: "5"
      symbols:
        description: "Comma-separated Binance symbols"
        required: true
        default: "BTCUSDT,ETHUSDT,SOLUSDT,XRPUSDT,DOGEUSDT,BNBUSDT"
      fail_on:
        description: "Gate threshold"
        type: choice
        required: true
        default: "critical"
        options:
          - critical
          - warn
          - never
      gate_mode:
        description: "Gate mode: freshness for collector health, coverage for retained-window research quality"
        type: choice
        required: true
        default: "freshness"
        options:
          - freshness
          - coverage
  schedule:
    - cron: "*/30 * * * *"
    - cron: "17 */6 * * *"

concurrency:
  group: market-data-gap-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DEPLOY_HOST: ${{ secrets.TANGO_1_1_HOST }}
  TANGO_1_1_INSTANCE_ID: ${{ vars.TANGO_1_1_INSTANCE_ID || 'i-6we8940uojnsory3ihfw' }}
  DEPLOY_ROOT: ${{ vars.PLOY_DEPLOY_ROOT || '/opt/ploy' }}
  DEPLOY_OSS_REGION: ${{ vars.ALIYUN_REGION || 'ap-northeast-1' }}
  DEFAULT_SYMBOLS: BTCUSDT,ETHUSDT,SOLUSDT,XRPUSDT,DOGEUSDT,BNBUSDT
  REQUIRED_SOURCES: pm5d-vol

jobs:
  audit:
    name: Audit Tango market-data gaps
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: tango-1-1

    steps:
      - name: Ensure SSH client
        run: |
          set -euo pipefail
          if command -v ssh >/dev/null 2>&1; then
            ssh -V
            exit 0
          fi

          if [ "$(id -u)" -eq 0 ]; then
            apt-get update
            apt-get install -y openssh-client
          elif command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
            sudo apt-get update
            sudo apt-get install -y openssh-client
          else
            echo "ssh client is missing and passwordless sudo is unavailable on this runner" >&2
            exit 1
          fi

      - name: Configure SSH
        env:
          TANGO_1_1_KNOWN_HOSTS: ${{ secrets.TANGO_1_1_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          if [ -z "${TANGO_1_1_KNOWN_HOSTS}" ]; then
            echo "TANGO_1_1_KNOWN_HOSTS secret is required for pinned SSH host verification" >&2
            exit 1
          fi
          printf '%s\n' "${TANGO_1_1_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          printf '%s\n' '${{ secrets.TANGO_1_1_SSH_KEY }}' > ~/.ssh/tango_1_1_key
          chmod 600 ~/.ssh/tango_1_1_key
          cat > ~/.ssh/config <<EOF
          Host tango-1-1
            HostName ${DEPLOY_HOST}
            HostKeyAlias tango-1-1
            User root
            IdentityFile ~/.ssh/tango_1_1_key
            BatchMode yes
            ConnectionAttempts 1
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            ServerAliveInterval 10
            ServerAliveCountMax 2
            ConnectTimeout 10
          EOF

      - name: Resolve audit scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_RUN_FULL: ${{ inputs.run_full_audit }}
          INPUT_LOOKBACK_HOURS: ${{ inputs.full_lookback_hours }}
          INPUT_BUCKET_MINUTES: ${{ inputs.bucket_minutes }}
          INPUT_SYMBOLS: ${{ inputs.symbols }}
          INPUT_FAIL_ON: ${{ inputs.fail_on }}
          INPUT_GATE_MODE: ${{ inputs.gate_mode }}
        run: |
          set -euo pipefail

          run_full="false"
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            run_full="${INPUT_RUN_FULL:-true}"
          elif [ "${EVENT_SCHEDULE}" = "17 */6 * * *" ]; then
            run_full="true"
          fi

          lookback_hours="${INPUT_LOOKBACK_HOURS:-168}"
          bucket_minutes="${INPUT_BUCKET_MINUTES:-5}"
          symbols="${INPUT_SYMBOLS:-${DEFAULT_SYMBOLS}}"
          fail_on="${INPUT_FAIL_ON:-critical}"
          gate_mode="${INPUT_GATE_MODE:-freshness}"
          if [ "${EVENT_NAME}" = "schedule" ] && [ "${EVENT_SCHEDULE}" = "17 */6 * * *" ]; then
            gate_mode="coverage"
          fi

          case "${run_full}" in
            true|false) ;;
            *) echo "invalid run_full value: ${run_full}" >&2; exit 1 ;;
          esac
          case "${fail_on}" in
            critical|warn|never) ;;
            *) echo "invalid fail_on value: ${fail_on}" >&2; exit 1 ;;
          esac
          case "${gate_mode}" in
            freshness|coverage) ;;
            *) echo "invalid gate_mode value: ${gate_mode}" >&2; exit 1 ;;
          esac

          {
            echo "run_full=${run_full}"
            echo "lookback_hours=${lookback_hours}"
            echo "bucket_minutes=${bucket_minutes}"
            echo "symbols=${symbols}"
            echo "fail_on=${fail_on}"
            echo "gate_mode=${gate_mode}"
          } >> "$GITHUB_OUTPUT"

      - name: Run remote gap audits
        id: remote_audit_ssh
        continue-on-error: true
        env:
          RUN_FULL: ${{ steps.scope.outputs.run_full }}
          FULL_LOOKBACK_HOURS: ${{ steps.scope.outputs.lookback_hours }}
          BUCKET_MINUTES: ${{ steps.scope.outputs.bucket_minutes }}
          SYMBOLS: ${{ steps.scope.outputs.symbols }}
          GATE_MODE: ${{ steps.scope.outputs.gate_mode }}
          SSH_ATTEMPT_TIMEOUT_SECONDS: "45"
        run: |
          set -euo pipefail
          mkdir -p artifacts/market-data-gap-audit

          run_remote_audit() {
            local audit_kind="$1"
            local lookback_hours="$2"
            local remote_dir="${DEPLOY_ROOT}/reports/market-data-gap-audit"
            local remote_file="${remote_dir}/${audit_kind}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
            local local_file="artifacts/market-data-gap-audit/${audit_kind}.json"
            local attempt

            for attempt in 1 2 3; do
              # shellcheck disable=SC2029
              if timeout "${SSH_ATTEMPT_TIMEOUT_SECONDS}s" ssh tango-1-1 \
                "DEPLOY_ROOT='${DEPLOY_ROOT}' AUDIT_KIND='${audit_kind}' LOOKBACK_HOURS='${lookback_hours}' BUCKET_MINUTES='${BUCKET_MINUTES}' SYMBOLS='${SYMBOLS}' REQUIRED_SOURCES='${REQUIRED_SOURCES}' GATE_MODE='${GATE_MODE}' REMOTE_FILE='${remote_file}' /bin/bash -s" <<'EOF'
          set -euo pipefail
          mkdir -p "$(dirname "${REMOTE_FILE}")"
          test -x "${DEPLOY_ROOT}/scripts/audit_market_data_gaps.py"
          # Keep this workflow on collector health; research metadata is tracked separately.
          "${DEPLOY_ROOT}/scripts/audit_market_data_gaps.py" \
            --lookback-hours "${LOOKBACK_HOURS}" \
            --bucket-minutes "${BUCKET_MINUTES}" \
            --symbols "${SYMBOLS}" \
            --required-sources "${REQUIRED_SOURCES}" \
            --gate-mode "${GATE_MODE}" \
            --statement-timeout-seconds 20 \
            --psql-timeout-seconds 30 \
            --format json \
            --fail-on never > "${REMOTE_FILE}"
          cp "${REMOTE_FILE}" "${DEPLOY_ROOT}/reports/market-data-gap-audit/${AUDIT_KIND}-latest.json"
          EOF
              then
                break
              fi

              if [ "${attempt}" -eq 3 ]; then
                echo "remote ${audit_kind} audit failed after ${attempt} attempts" >&2
                return 1
              fi
              sleep "$((attempt * 15))"
            done

            for attempt in 1 2 3; do
              if timeout "${SSH_ATTEMPT_TIMEOUT_SECONDS}s" scp "tango-1-1:${remote_file}" "${local_file}"; then
                break
              fi
              if [ "${attempt}" -eq 3 ]; then
                echo "copying ${audit_kind} audit report failed after ${attempt} attempts" >&2
                return 1
              fi
              sleep "$((attempt * 15))"
            done
          }

          run_remote_audit quick 1
          if [ "${RUN_FULL}" = "true" ]; then
            run_remote_audit full "${FULL_LOOKBACK_HOURS}"
          fi

      - name: Checkout fallback scripts
        if: ${{ steps.remote_audit_ssh.outcome != 'success' }}
        uses: actions/checkout@v6

      - name: Install Aliyun CLI for audit fallback
        if: ${{ steps.remote_audit_ssh.outcome != 'success' }}
        run: |
          set -euo pipefail
          curl -fsSL https://aliyuncli.alicdn.com/aliyun-cli-linux-latest-amd64.tgz -o aliyun-cli.tgz
          tar -xzf aliyun-cli.tgz
          sudo install -m 0755 aliyun /usr/local/bin/aliyun
          aliyun version

      - name: Install ossutil for audit fallback
        if: ${{ steps.remote_audit_ssh.outcome != 'success' }}
        run: |
          set -euo pipefail
          if ! command -v ossutil >/dev/null 2>&1; then
            curl -fsSL https://gosspublic.alicdn.com/ossutil/install.sh | sudo bash
          fi
          command -v ossutil >/dev/null 2>&1

      - name: Configure Aliyun CLI for audit fallback
        if: ${{ steps.remote_audit_ssh.outcome != 'success' }}
        env:
          ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ECS_ACCESS_KEY_ID || secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ECS_ACCESS_KEY_SECRET || secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
        run: |
          set -euo pipefail
          test -n "${ALIYUN_ACCESS_KEY_ID}"
          test -n "${ALIYUN_ACCESS_KEY_SECRET}"
          aliyun configure set \
            --profile default \
            --mode AK \
            --region "${DEPLOY_OSS_REGION}" \
            --access-key-id "${ALIYUN_ACCESS_KEY_ID}" \
            --access-key-secret "${ALIYUN_ACCESS_KEY_SECRET}"

      - name: Run remote gap audits via Cloud Assistant fallback
        if: ${{ steps.remote_audit_ssh.outcome != 'success' }}
        env:
          RUN_FULL: ${{ steps.scope.outputs.run_full }}
          FULL_LOOKBACK_HOURS: ${{ steps.scope.outputs.lookback_hours }}
          BUCKET_MINUTES: ${{ steps.scope.outputs.bucket_minutes }}
          SYMBOLS: ${{ steps.scope.outputs.symbols }}
          GATE_MODE: ${{ steps.scope.outputs.gate_mode }}
          ALIYUN_OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          ALIYUN_OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
          ALIYUN_OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
        run: python3 scripts/ci/run_tango_market_data_audit_cloud_assist.py

      - name: Summarize and enforce audit gate
        id: gate
        env:
          FAIL_ON: ${{ steps.scope.outputs.fail_on }}
          RUN_FULL: ${{ steps.scope.outputs.run_full }}
          GATE_MODE: ${{ steps.scope.outputs.gate_mode }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import glob
          import json
          import os
          import sys

          status_order = {"ok": 0, "warn": 1, "unknown": 2, "critical": 3}
          fail_on = os.environ["FAIL_ON"]
          paths = sorted(glob.glob("artifacts/market-data-gap-audit/*.json"))
          reports = []
          for path in paths:
              with open(path, encoding="utf-8") as fh:
                  payload = json.load(fh)
              reports.append((os.path.basename(path).removesuffix(".json"), path, payload))

          if not reports:
              raise SystemExit("no audit reports were produced")

          worst = "ok"
          lines = [
              "## Market Data Gap Audit",
              "",
              f"- Gate: `{fail_on}`",
              f"- Gate mode: `{os.environ['GATE_MODE']}`",
              f"- Full audit requested: `{os.environ['RUN_FULL']}`",
              "",
              "| Audit | Overall | Lookback | Bucket | Non-OK sources | Coverage caveats |",
              "| --- | --- | ---: | ---: | --- | --- |",
          ]
          for name, _path, payload in reports:
              status = payload.get("overall_status", "unknown")
              if status_order.get(status, 2) > status_order[worst]:
                  worst = status
              non_ok = []
              coverage_caveats = []
              for item in payload.get("gap_audits", []) + payload.get("window_audits", []):
                  item_status = item.get("status", "unknown")
                  if item_status != "ok":
                      source = item.get("source_id", "unknown")
                      reason = "; ".join(item.get("reasons") or [])
                      non_ok.append(f"`{source}` {item_status}: {reason}")
                  coverage_status = item.get("coverage_status")
                  if coverage_status and coverage_status != "ok":
                      source = item.get("source_id", "unknown")
                      reason = "; ".join(item.get("coverage_reasons") or [])
                      coverage_caveats.append(f"`{source}` {coverage_status}: {reason}")
              lines.append(
                  f"| {name} | `{status}` | {payload.get('lookback_hours', 'n/a')}h "
                  f"| {payload.get('bucket_minutes', 'n/a')}m | "
                  f"{'<br>'.join(non_ok) if non_ok else 'none'} | "
                  f"{'<br>'.join(coverage_caveats) if coverage_caveats else 'none'} |"
              )

          should_fail = False
          if fail_on == "critical" and worst in {"critical", "unknown"}:
              should_fail = True
          elif fail_on == "warn" and worst in {"warn", "unknown", "critical"}:
              should_fail = True

          lines.extend(["", f"Overall gate status: `{worst}`"])
          summary = "\n".join(lines) + "\n"
          print(summary)
          with open("artifacts/market-data-gap-audit/summary.md", "w", encoding="utf-8") as fh:
              fh.write(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write(summary)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"overall_status={worst}\n")

          if should_fail:
              raise SystemExit(f"market data audit gate failed: {worst}")
          PY

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: market-data-gap-audit-${{ github.run_id }}
          path: artifacts/market-data-gap-audit/
          retention-days: 14
