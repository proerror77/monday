name: AutoFactor Strategy Promotion

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: "Repository ref that contains the evaluator script"
        required: false
        default: "main"
      factor_walk_forward_run_id:
        description: "Run id that uploaded factor-walk-forward-v2-*"
        required: true
      artifact_name:
        description: "Artifact name; defaults to factor-walk-forward-v2-<run_id>"
        required: false
        default: ""
      required_strategy_profile:
        description: "Runtime strategy profile required for promotion"
        required: false
        default: "settlement_probability"
      allowed_target:
        description: "Allowed AutoFactor executable target"
        required: false
        default: "full_depth_settlement_executable_pnl"
      issue_number:
        description: "Optional issue number for the promotion summary"
        required: false
        default: ""
      create_handoff_issue:
        description: "Create a dry-run handoff issue when autofactor-strategy-handoff.json is ready"
        required: false
        default: "false"
      create_config_pr:
        description: "Create a dry-run config PR from a ready handoff"
        required: false
        default: "false"
      strategy_config:
        description: "Strategy config path updated by create_config_pr"
        required: false
        default: "config/strategies/02-pm5d-threelayer.settlement-probability-btc-eth-dryrun.toml"
      fail_if_blocked:
        description: "Fail workflow when no AutoFactor strategy qualifies"
        required: false
        default: "false"

permissions:
  contents: write
  actions: read
  issues: write
  pull-requests: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.git_ref }}

      - name: Download factor walk-forward artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id="${{ github.event.inputs.factor_walk_forward_run_id }}"
          artifact_name="${{ github.event.inputs.artifact_name }}"
          if [ -z "${artifact_name}" ]; then
            artifact_name="factor-walk-forward-v2-${run_id}"
          fi
          mkdir -p artifacts/source
          gh run download "${run_id}" \
            --name "${artifact_name}" \
            --dir artifacts/source
          report_path="$(find artifacts/source -path '*/factor-walk-forward-v2/report.txt' -print -quit)"
          if [ -z "${report_path}" ]; then
            echo "Unable to find factor-walk-forward-v2/report.txt in ${artifact_name}" >&2
            find artifacts/source -maxdepth 4 -type f -print >&2
            exit 2
          fi
          replay_path="$(find artifacts/source \( -name 'candidate-strategy-replay.json' -o -name 'autofactor-candidate-strategy-replay.json' \) -print -quit)"
          trace_marker_path="$(find artifacts/source -path '*/research-trace/persisted.env' -print -quit)"
          snapshot_provenance_path="$(find artifacts/source -path '*/snapshot-provenance/source.txt' -print -quit)"
          snapshot_manifest_path="$(find artifacts/source -path '*/snapshot-provenance/manifest.json' -print -quit)"
          registry_preview_path="$(find artifacts/source -path '*/factor-registry-preview.json' -print -quit)"
          execution_surface_path="$(find artifacts/source -path '*/full-depth-execution-surface.json' -print -quit)"
          side_effect_requested="false"
          if [ "${{ github.event.inputs.create_handoff_issue }}" = "true" ] || [ "${{ github.event.inputs.create_config_pr }}" = "true" ]; then
            side_effect_requested="true"
          fi
          if grep -R -E 'direct_db_debug=true|canonical_result=no|registry=runner-local|runner=self-hosted|runner=ploy-ci-1' artifacts/source >/dev/null 2>&1; then
            if [ "${side_effect_requested}" = "true" ]; then
              echo "AutoFactor promotion side effects reject legacy/debug/self-hosted source artifacts." >&2
              exit 2
            fi
            echo "Legacy/debug source marker found; evaluation may run as diagnostic only."
          fi
          if [ "${side_effect_requested}" = "true" ]; then
            if [ -z "${trace_marker_path}" ]; then
              echo "AutoFactor promotion side effects require successful durable Research OS trace persistence." >&2
              exit 2
            fi
            if [ -z "${snapshot_provenance_path}" ] || [ -z "${snapshot_manifest_path}" ]; then
              echo "AutoFactor promotion side effects require snapshot provenance source.txt and manifest.json." >&2
              exit 2
            fi
          fi
          {
            echo "REPORT_PATH=${report_path}"
            echo "CANDIDATE_STRATEGY_REPLAY_PATH=${replay_path}"
            echo "ARTIFACT_NAME=${artifact_name}"
            echo "SOURCE_TRACE_MARKER_PATH=${trace_marker_path}"
            echo "SOURCE_SNAPSHOT_PROVENANCE_PATH=${snapshot_provenance_path}"
            echo "SOURCE_SNAPSHOT_MANIFEST_PATH=${snapshot_manifest_path}"
            echo "SOURCE_FACTOR_REGISTRY_PREVIEW_PATH=${registry_preview_path}"
            echo "SOURCE_FULL_DEPTH_EXECUTION_SURFACE_PATH=${execution_surface_path}"
          } >> "$GITHUB_ENV"

      - name: Evaluate AutoFactor strategy promotion
        run: |
          set -euo pipefail
          mkdir -p artifacts/autofactor-strategy-promotion
          args=(
            --report "${REPORT_PATH}"
            --output-json artifacts/autofactor-strategy-promotion/autofactor-strategy-promotion.json
            --output-md artifacts/autofactor-strategy-promotion/autofactor-strategy-promotion.md
            --output-registry-json artifacts/autofactor-strategy-promotion/autofactor-factor-registry.json
            --output-handoff-json artifacts/autofactor-strategy-promotion/autofactor-strategy-handoff.json
            --output-handoff-md artifacts/autofactor-strategy-promotion/autofactor-strategy-handoff.md
            --required-strategy-profile "${{ github.event.inputs.required_strategy_profile }}"
            --allowed-target "${{ github.event.inputs.allowed_target }}"
          )
          if [ -n "${CANDIDATE_STRATEGY_REPLAY_PATH:-}" ]; then
            args+=(--candidate-strategy-replay-json "${CANDIDATE_STRATEGY_REPLAY_PATH}")
          fi
          if [ -n "${SOURCE_FACTOR_REGISTRY_PREVIEW_PATH:-}" ]; then
            args+=(--factor-registry-preview-json "${SOURCE_FACTOR_REGISTRY_PREVIEW_PATH}" --require-runtime-contract)
          fi
          if [ -n "${SOURCE_SNAPSHOT_MANIFEST_PATH:-}" ]; then
            args+=(--snapshot-manifest-json "${SOURCE_SNAPSHOT_MANIFEST_PATH}")
          fi
          if [ -n "${SOURCE_FULL_DEPTH_EXECUTION_SURFACE_PATH:-}" ]; then
            args+=(--full-depth-execution-surface-json "${SOURCE_FULL_DEPTH_EXECUTION_SURFACE_PATH}")
          fi
          if [ "${{ github.event.inputs.fail_if_blocked }}" = "true" ]; then
            args+=(--fail-if-blocked)
          fi
          python3 scripts/evaluate_autofactor_strategy_promotion.py "${args[@]}" \
            | tee artifacts/autofactor-strategy-promotion/evaluator-output.json

      - name: Publish summary
        if: always()
        run: |
          {
            echo "## AutoFactor Strategy Promotion"
            echo ""
            echo "- Source run: \`${{ github.event.inputs.factor_walk_forward_run_id }}\`"
            echo "- Source artifact: \`${ARTIFACT_NAME:-unknown}\`"
            echo "- Candidate strategy replay artifact: \`${CANDIDATE_STRATEGY_REPLAY_PATH:-missing}\`"
            echo "- Durable Research OS trace marker: \`${SOURCE_TRACE_MARKER_PATH:-missing}\`"
            echo "- Snapshot provenance: \`${SOURCE_SNAPSHOT_PROVENANCE_PATH:-missing}\`"
            echo "- Required strategy profile: \`${{ github.event.inputs.required_strategy_profile }}\`"
            echo "- Allowed target: \`${{ github.event.inputs.allowed_target }}\`"
            echo ""
            if [ -f artifacts/autofactor-strategy-promotion/autofactor-strategy-promotion.md ]; then
              cat artifacts/autofactor-strategy-promotion/autofactor-strategy-promotion.md
            else
              echo "Promotion report was not generated."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload promotion artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: autofactor-strategy-promotion-${{ github.run_id }}
          path: artifacts/autofactor-strategy-promotion/
          compression-level: 0
          retention-days: 14

      - name: Comment issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const issueNumberRaw = "${{ github.event.inputs.issue_number }}";
            if (!issueNumberRaw) {
              core.info("No issue_number provided; skipping issue comment.");
              return;
            }
            const issue_number = Number(issueNumberRaw);
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            let report = "Promotion report was not generated.";
            const reportPath = "artifacts/autofactor-strategy-promotion/autofactor-strategy-promotion.md";
            if (fs.existsSync(reportPath)) {
              report = fs.readFileSync(reportPath, "utf8");
            }
            const body = [
              "AutoFactor strategy-promotion evaluation:",
              "",
              `- Workflow run: ${runUrl}`,
              `- Source factor walk-forward run: \`${{ github.event.inputs.factor_walk_forward_run_id }}\``,
              `- Artifact: \`autofactor-strategy-promotion-${process.env.GITHUB_RUN_ID}\``,
              "",
              report
            ].join("\n");
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body
            });

      - name: Create ready handoff issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CREATE_HANDOFF_ISSUE: ${{ github.event.inputs.create_handoff_issue }}
        run: |
          set -euo pipefail
          if [ "${CREATE_HANDOFF_ISSUE}" != "true" ]; then
            echo "create_handoff_issue is not true; skipping handoff issue creation."
            exit 0
          fi
          if [ ! -f "${SOURCE_TRACE_MARKER_PATH:-}" ]; then
            echo "create_handoff_issue requires successful durable Research OS trace persistence." >&2
            exit 2
          fi
          handoff_json="artifacts/autofactor-strategy-promotion/autofactor-strategy-handoff.json"
          handoff_md="artifacts/autofactor-strategy-promotion/autofactor-strategy-handoff.md"
          if [ ! -f "${handoff_json}" ] || [ ! -f "${handoff_md}" ]; then
            echo "Handoff artifacts missing; skipping issue creation."
            exit 0
          fi
          status="$(python3 - <<'PY'
          import json
          with open("artifacts/autofactor-strategy-promotion/autofactor-strategy-handoff.json", encoding="utf-8") as handle:
              print(json.load(handle).get("status", "blocked"))
          PY
          )"
          if [ "${status}" != "ready" ]; then
            echo "Handoff status is ${status}; no dry-run issue will be created."
            exit 0
          fi
          python3 scripts/validate_autofactor_handoff_replay_gate.py \
            --handoff-json "${handoff_json}"
          title="Promote AutoFactor strategy handoff to dry-run"
          gh issue create \
            --title "${title}" \
            --body-file "${handoff_md}"

      - name: Create config PR from ready handoff
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CREATE_CONFIG_PR: ${{ github.event.inputs.create_config_pr }}
          STRATEGY_CONFIG: ${{ github.event.inputs.strategy_config }}
          BASE_REF: ${{ github.event.inputs.git_ref }}
        run: |
          set -euo pipefail
          if [ "${CREATE_CONFIG_PR}" != "true" ]; then
            echo "create_config_pr is not true; skipping config PR creation."
            exit 0
          fi
          if [ ! -f "${SOURCE_TRACE_MARKER_PATH:-}" ]; then
            echo "create_config_pr requires successful durable Research OS trace persistence." >&2
            exit 2
          fi
          handoff_json="artifacts/autofactor-strategy-promotion/autofactor-strategy-handoff.json"
          case "${STRATEGY_CONFIG}" in
            config/strategies/*.toml) ;;
            *)
              echo "strategy_config must be a config/strategies/*.toml path" >&2
              exit 2
              ;;
          esac
          if [ ! -f "${handoff_json}" ]; then
            echo "Handoff JSON missing; skipping config PR creation."
            exit 0
          fi
          status="$(python3 - <<'PY'
          import json
          with open("artifacts/autofactor-strategy-promotion/autofactor-strategy-handoff.json", encoding="utf-8") as handle:
              print(json.load(handle).get("status", "blocked"))
          PY
          )"
          if [ "${status}" != "ready" ]; then
            echo "Handoff status is ${status}; no config PR will be created."
            exit 0
          fi
          python3 scripts/validate_autofactor_handoff_replay_gate.py \
            --handoff-json "${handoff_json}"
          mkdir -p artifacts/autofactor-config-handoff
          python3 scripts/apply_autofactor_handoff_to_config.py \
            --handoff-json "${handoff_json}" \
            --config "${STRATEGY_CONFIG}" \
            --output-json artifacts/autofactor-config-handoff/config-handoff.json \
            --output-md artifacts/autofactor-config-handoff/config-handoff.md
          changed="$(python3 - <<'PY'
          import json
          with open("artifacts/autofactor-config-handoff/config-handoff.json", encoding="utf-8") as handle:
              print("true" if json.load(handle).get("changed") else "false")
          PY
          )"
          if [ "${changed}" != "true" ]; then
            echo "Config already matches selected handoff; no PR will be created."
            exit 0
          fi

          branch="autofactor/handoff-${GITHUB_RUN_ID}"
          git switch -c "${branch}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${STRATEGY_CONFIG}"
          git commit \
            -m "Promote AutoFactor handoff into dry-run config" \
            -m "A ready AutoFactor strategy handoff selected a runtime score that differs from the checked-in dry-run config. This applies only the promoted runtime score and leaves execution, risk, and kill-switch settings under the existing config." \
            -m "Constraint: Generated from autofactor-strategy-handoff.json status=ready" \
            -m "Constraint: Dry-run config only; no deploy or live order path" \
            -m "Rejected: Direct deployment from promotion workflow | config changes must pass PR review and CI first" \
            -m "Confidence: medium" \
            -m "Scope-risk: narrow" \
            -m "Tested: python3 scripts/apply_autofactor_handoff_to_config.py --handoff-json <artifact> --config ${STRATEGY_CONFIG}" \
            -m "Not-tested: dry-run deployment/replay after config change"
          git push origin "${branch}"

          title="Promote AutoFactor handoff into dry-run config"
          {
            cat artifacts/autofactor-config-handoff/config-handoff.md
            echo ""
            echo "Source promotion run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "Source factor walk-forward run: ${{ github.event.inputs.factor_walk_forward_run_id }}"
            echo ""
            echo "This PR is generated from a ready handoff artifact. It does not deploy and does not enable live trading."
          } > artifacts/autofactor-config-handoff/pr-body.md
          pr_url_file="artifacts/autofactor-config-handoff/pr-create-result.txt"
          if gh pr create \
            --base "${BASE_REF}" \
            --head "${branch}" \
            --title "${title}" \
            --body-file artifacts/autofactor-config-handoff/pr-body.md \
            | tee "${pr_url_file}"; then
            echo "Created config PR from ready AutoFactor handoff."
          else
            status=$?
            manual_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/pull/new/${branch}"
            {
              echo "Config branch was pushed, but automatic PR creation failed with exit code ${status}."
              echo "Manual PR URL: ${manual_url}"
              echo "This commonly happens when repository policy blocks pull requests created by GitHub Actions tokens."
            } | tee "${pr_url_file}"
            {
              echo "### AutoFactor config PR creation"
              echo ""
              echo "Config branch was pushed: \`${branch}\`"
              echo ""
              echo "Automatic PR creation failed with exit code \`${status}\`."
              echo "Manual PR URL: ${manual_url}"
              echo ""
              echo "The workflow result remains successful because the research artifact and reviewable branch were produced."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
