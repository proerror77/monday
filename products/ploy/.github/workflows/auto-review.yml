name: Auto Review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: auto-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  review:
    name: PR Auto Review
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91
          components: rustfmt

      - name: Check formatting
        id: fmt
        run: |
          set +e
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only --diff-filter=ACMRT \
              "${{ github.event.pull_request.base.sha }}"...HEAD \
              -- '*.rs' ':!vendor/**' > fmt-files.txt
          else
            git ls-files '*.rs' ':!vendor/**' > fmt-files.txt
          fi

          if [ -s fmt-files.txt ]; then
            {
              echo "Checked Rust files:"
              sed 's/^/- /' fmt-files.txt
              echo
              xargs rustfmt --check < fmt-files.txt
            } > fmt.log 2>&1
            status=$?
          else
            echo "No changed Rust files to format-check." > fmt.log
            status=0
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          tail -n 80 fmt.log > fmt.tail.log || true
          exit 0

      - name: Create or update auto-review comment
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@v9
        env:
          FMT_STATUS: ${{ steps.fmt.outputs.status }}
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- auto-review-bot -->";
            const fmtOk = process.env.FMT_STATUS === "0";

            const readLog = (path) => {
              try {
                const content = fs.readFileSync(path, "utf8").trim();
                return content.length > 0 ? content : "(no output)";
              } catch {
                return "(log unavailable)";
              }
            };

            const fmtLog = readLog("fmt.tail.log");

            const body = [
              marker,
              "## Auto Review Summary",
              "",
              `- Changed Rust formatting: ${fmtOk ? "PASS" : "NEEDS FIX"}`,
              "- Compile/test matrix: handled by the required `Test` workflow checks.",
              "",
              "<details><summary>fmt output (tail)</summary>",
              "",
              "```text",
              fmtLog,
              "```",
              "",
              "</details>",
            ].join("\n");

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100
            });

            const existing = comments.find(
              (comment) => comment.user?.type === "Bot" && comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body
              });
              core.info(`Updated auto-review comment ${existing.id}`);
            } else {
              const created = await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body
              });
              core.info(`Created auto-review comment ${created.data.id}`);
            }
