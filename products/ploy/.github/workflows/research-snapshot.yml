name: Research Snapshot

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: "Git ref"
        required: true
        default: "main"
      start_date:
        description: "Snapshot start date (YYYY-MM-DD)"
        required: true
        default: "2026-04-21"
      end_date:
        description: "Snapshot end date (YYYY-MM-DD)"
        required: true
        default: "2026-04-25"
      symbols:
        description: "Comma-separated Binance symbols"
        required: true
        default: "BTCUSDT,ETHUSDT,SOLUSDT,DOGEUSDT,BNBUSDT,XRPUSDT"
      stake_usd:
        description: "Fixed notional used by executable labels"
        required: true
        default: "15"
      options_json:
        description: "Advanced options JSON: optional start_ts/end_ts, sampling, optimizer_data_dir, data_profile, audit gate, orderbook_archive_root, and optional complete sampled snapshot upload"
        required: false
        default: '{"start_ts":"","end_ts":"","lob_sample_secs":30,"pm_book_sample_secs":30,"observation_sample_secs":30,"max_quote_age_secs":30,"optimizer_data_dir":"/tmp/ploy-parquet","data_profile":"pm5d-execution","custom_required_sources":"","audit_lookback_hours":168,"data_gate":"never","orderbook_archive_root":"/opt/ploy/data/lake","snapshot_registry_dir":"","upload_sampled_snapshot":true}'

concurrency:
  group: research-snapshot-${{ github.event.inputs.git_ref }}-${{ github.event.inputs.start_date }}-${{ github.event.inputs.end_date }}-${{ github.event.inputs.symbols }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  DEPLOY_HOST: ${{ vars.TANGO_1_1_HOST || vars.ALIYUN_ECS_HOST || secrets.TANGO_1_1_HOST || secrets.ALIYUN_ECS_HOST }}
  TANGO_1_1_INSTANCE_ID: ${{ vars.TANGO_1_1_INSTANCE_ID || 'i-6we8940uojnsory3ihfw' }}
  DEPLOY_ROOT: ${{ vars.PLOY_DEPLOY_ROOT || '/opt/ploy' }}
  DEPLOY_OSS_REGION: ${{ vars.ALIYUN_REGION || 'ap-northeast-1' }}
  REMOTE_DIR: /opt/ploy/tmp/research-snapshot-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  compile:
    name: Compile research snapshot on tango-1-1
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: tango-1-1

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.git_ref }}

      - name: Parse advanced options
        id: snapshot_options
        env:
          OPTIONS_JSON: ${{ github.event.inputs.options_json }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os

          defaults = {
              "start_ts": "",
              "end_ts": "",
              "lob_sample_secs": "30",
              "pm_book_sample_secs": "30",
              "observation_sample_secs": "30",
              "max_quote_age_secs": "30",
              "optimizer_data_dir": "/tmp/ploy-parquet",
              "data_profile": "pm5d-execution",
              "custom_required_sources": "",
              "audit_lookback_hours": "168",
              "data_gate": "never",
              "orderbook_archive_root": "/opt/ploy/data/lake",
              "snapshot_registry_dir": "",
              "upload_sampled_snapshot": "true",
          }
          legacy_aliases = {
              "upload_" + "full_snapshot": "upload_sampled_snapshot",
          }
          bool_keys = {"upload_sampled_snapshot"}
          choices = {
              "data_profile": {"pm5d-execution", "pm5d-vol", "all", "custom"},
              "data_gate": {"critical", "warn", "never"},
          }
          raw = os.environ.get("OPTIONS_JSON", "").strip()
          data = json.loads(raw) if raw else {}
          if not isinstance(data, dict):
              raise SystemExit("options_json must be a JSON object")
          unknown = sorted(set(data) - set(defaults) - set(legacy_aliases))
          if unknown:
              raise SystemExit(f"unknown options_json keys: {', '.join(unknown)}")
          for legacy_key, canonical_key in legacy_aliases.items():
              if legacy_key in data:
                  if canonical_key in data:
                      raise SystemExit(
                          f"options_json cannot include both {legacy_key} and {canonical_key}"
                      )
                  data[canonical_key] = data.pop(legacy_key)

          values = dict(defaults)
          for key, value in data.items():
              if key in bool_keys:
                  if isinstance(value, bool):
                      values[key] = "true" if value else "false"
                  elif str(value).lower() in {"true", "false"}:
                      values[key] = str(value).lower()
                  else:
                      raise SystemExit(f"options_json value for {key} must be boolean")
              else:
                  values[key] = str(value)
          for key, allowed in choices.items():
              if values[key] not in allowed:
                  choices_text = ", ".join(sorted(allowed))
                  raise SystemExit(f"options_json value for {key} must be one of: {choices_text}")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              for key, value in values.items():
                  if "\n" in value:
                      raise SystemExit(f"options_json value for {key} must be single-line")
                  handle.write(f"SNAPSHOT_{key.upper()}={value}\n")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"upload_sampled_snapshot={values['upload_sampled_snapshot']}\n")
          PY

      - name: Configure SSH
        env:
          TANGO_1_1_SSH_KEY: ${{ secrets.TANGO_1_1_SSH_KEY }}
          TANGO_SSH_KEY: ${{ secrets.TANGO_SSH_KEY }}
          ALIYUN_ECS_SSH_KEY: ${{ secrets.ALIYUN_ECS_SSH_KEY }}
          TANGO_1_1_KNOWN_HOSTS: ${{ secrets.TANGO_1_1_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "${DEPLOY_HOST}"
          install -m 700 -d ~/.ssh
          if [ -z "${TANGO_1_1_KNOWN_HOSTS}" ]; then
            echo "TANGO_1_1_KNOWN_HOSTS secret is required for pinned SSH host verification" >&2
            exit 1
          fi
          key_source=""
          selected_key=""
          if [ -n "${TANGO_1_1_SSH_KEY}" ]; then
            selected_key="${TANGO_1_1_SSH_KEY}"
            key_source="TANGO_1_1_SSH_KEY"
          elif [ -n "${TANGO_SSH_KEY}" ]; then
            selected_key="${TANGO_SSH_KEY}"
            key_source="TANGO_SSH_KEY"
          elif [ -n "${ALIYUN_ECS_SSH_KEY}" ]; then
            selected_key="${ALIYUN_ECS_SSH_KEY}"
            key_source="ALIYUN_ECS_SSH_KEY"
          else
            echo "No SSH key secret found for tango-1-1 in this workflow context." >&2
            exit 1
          fi
          printf '%s\n' "${selected_key}" > ~/.ssh/tango_1_1_key
          chmod 600 ~/.ssh/tango_1_1_key
          echo "tango-1-1-key-source=${key_source}"
          ssh-keygen -y -f ~/.ssh/tango_1_1_key >/dev/null
          printf '%s\n' "${TANGO_1_1_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host tango-1-1
            HostName ${DEPLOY_HOST}
            User root
            IdentityFile ~/.ssh/tango_1_1_key
            HostKeyAlias tango-1-1
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            ServerAliveInterval 30
            ServerAliveCountMax 20
            ConnectTimeout 30
          EOF

      - name: Resolve data requirements
        id: data_scope
        run: |
          set -euo pipefail
          DATA_PROFILE="${SNAPSHOT_DATA_PROFILE}"
          CUSTOM_REQUIRED_SOURCES="${SNAPSHOT_CUSTOM_REQUIRED_SOURCES}"
          case "${DATA_PROFILE}" in
            pm5d-execution)
              required_sources="polymarket_quotes,polymarket_orderbooks,binance_price,binance_agg_trades,binance_lob"
              include_deribit="false"
              ;;
            pm5d-vol)
              required_sources="polymarket_quotes,polymarket_orderbooks,deribit_iv,deribit_atm_greeks,binance_price,binance_agg_trades,binance_lob"
              include_deribit="true"
              ;;
            all)
              required_sources="all"
              include_deribit="true"
              ;;
            custom)
              required_sources="${CUSTOM_REQUIRED_SOURCES}"
              if [ -z "${required_sources}" ]; then
                echo "custom_required_sources is required when data_profile=custom" >&2
                exit 2
              fi
              include_deribit="false"
              case ",${required_sources}," in
                *deribit*|*,all,*|*,pm5d-vol,*) include_deribit="true" ;;
              esac
              ;;
            *)
              echo "unsupported data_profile=${DATA_PROFILE}" >&2
              exit 2
              ;;
          esac
          echo "required_sources=${required_sources}" >> "${GITHUB_OUTPUT}"
          echo "include_deribit=${include_deribit}" >> "${GITHUB_OUTPUT}"

      - name: Audit required market data on tango-1-1
        id: data_audit
        continue-on-error: true
        env:
          REQUIRED_SOURCES: ${{ steps.data_scope.outputs.required_sources }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/research-snapshot
          remote_audit="${REMOTE_DIR}/research-snapshot/data-gap-audit.json"
          remote_audit_script="${REMOTE_DIR}/workflow-scripts/audit_market_data_gaps.py"
          audit_start_ts="${SNAPSHOT_START_TS:-${{ github.event.inputs.start_date }}}"
          audit_end_ts="${SNAPSHOT_END_TS:-${{ github.event.inputs.end_date }}}"

          ssh tango-1-1 /bin/bash -s -- "${REMOTE_DIR}/workflow-scripts" <<'EOF'
          set -euo pipefail
          mkdir -p "$1"
          EOF
          scp scripts/audit_market_data_gaps.py "tango-1-1:${remote_audit_script}"
          ssh tango-1-1 /bin/bash -s -- "${remote_audit_script}" <<'EOF'
          set -euo pipefail
          chmod 0755 "$1"
          EOF

          for attempt in 1 2 3; do
            if ssh tango-1-1 /bin/bash -s -- \
              "${DEPLOY_ROOT}" \
              "${REMOTE_DIR}" \
              "${remote_audit_script}" \
              "${remote_audit}" \
              "${SNAPSHOT_AUDIT_LOOKBACK_HOURS}" \
              "${audit_start_ts}" \
              "${audit_end_ts}" \
              "${{ github.event.inputs.symbols }}" \
              "${REQUIRED_SOURCES}" \
              "${SNAPSHOT_ORDERBOOK_ARCHIVE_ROOT}" <<'EOF'
          set -euo pipefail
          deploy_root="$1"
          remote_dir="$2"
          audit_script="$3"
          remote_audit="$4"
          audit_lookback_hours="$5"
          audit_start_ts="$6"
          audit_end_ts="$7"
          symbols="$8"
          required_sources="$9"
          orderbook_archive_root="${10}"

          set -a
          . "${deploy_root}/.env"
          set +a
          : "${PLOY_DATABASE__URL:?PLOY_DATABASE__URL missing in ${deploy_root}/.env}"
          mkdir -p "${remote_dir}/research-snapshot"
          test -x "${audit_script}"
          PLOY_DATABASE__URL="${PLOY_DATABASE__URL}" \
            "${audit_script}" \
              --lookback-hours "${audit_lookback_hours}" \
              --start-ts "${audit_start_ts}" \
              --end-ts "${audit_end_ts}" \
              --bucket-minutes 5 \
              --symbols "${symbols}" \
              --required-sources "${required_sources}" \
              --orderbook-archive-root "${orderbook_archive_root}" \
              --statement-timeout-seconds 20 \
              --psql-timeout-seconds 30 \
              --format json \
              --fail-on never > "${remote_audit}"
          EOF
            then
              break
            fi
            if [ "${attempt}" -eq 3 ]; then
              echo "remote snapshot data audit failed after ${attempt} attempts" >&2
              exit 1
            fi
            sleep "$((attempt * 15))"
          done

          for attempt in 1 2 3; do
            if scp "tango-1-1:${remote_audit}" artifacts/research-snapshot/data-gap-audit.json; then
              break
            fi
            if [ "${attempt}" -eq 3 ]; then
              echo "copying snapshot data audit report failed after ${attempt} attempts" >&2
              exit 1
            fi
            sleep "$((attempt * 15))"
          done
          python3 <<'PY'
          import json
          import os

          status_order = {"ok": 0, "warn": 1, "unknown": 2, "critical": 3}
          gate = os.environ["SNAPSHOT_DATA_GATE"]
          with open("artifacts/research-snapshot/data-gap-audit.json", encoding="utf-8") as fh:
              payload = json.load(fh)
          status = payload.get("overall_status", "unknown")
          lines = [
              "# Scoped Data Audit",
              "",
              f"- Gate: `{gate}`",
              f"- Gate mode: `{payload.get('gate_mode', 'unknown')}`",
              f"- Overall: `{status}`",
              f"- Required sources: `{','.join(payload.get('required_sources') or [])}`",
              f"- Lookback: `{payload.get('lookback_hours')}h`",
              f"- Audit window: `{payload.get('audit_window_start_ts') or '<lookback-start>'} -> {payload.get('audit_window_end_ts') or '<lookback-end>'}`",
              "",
              "| Source | Status | Reasons |",
              "| --- | --- | --- |",
          ]
          for item in payload.get("gap_audits", []) + payload.get("window_audits", []):
              lines.append(
                  f"| `{item.get('source_id')}` | `{item.get('status', 'unknown')}` | "
                  f"{'; '.join(item.get('reasons') or [])} |"
              )
          summary = "\n".join(lines) + "\n"
          with open("artifacts/research-snapshot/data-gap-audit.md", "w", encoding="utf-8") as fh:
              fh.write(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write(summary)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"overall_status={status}\n")
          should_fail = (
              (gate == "critical" and status in {"critical", "unknown"})
              or (gate == "warn" and status_order.get(status, 2) >= status_order["warn"])
          )
          if should_fail:
              raise SystemExit(f"scoped data audit gate failed: {status}")
          PY

      - name: Compile snapshot on tango-1-1
        id: compile_snapshot
        if: ${{ steps.data_audit.outcome == 'success' }}
        continue-on-error: true
        env:
          INCLUDE_DERIBIT: ${{ steps.data_scope.outputs.include_deribit }}
          REQUIRED_SOURCES: ${{ steps.data_scope.outputs.required_sources }}
          DATA_AUDIT_STATUS: ${{ steps.data_audit.outputs.overall_status }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          empty_arg="__ploy_empty__"
          for attempt in 1 2 3; do
            if ssh tango-1-1 /bin/bash -s -- \
              "${DEPLOY_ROOT}" \
              "${REMOTE_DIR}" \
              "${{ github.event.inputs.symbols }}" \
              "${{ github.event.inputs.start_date }}" \
              "${{ github.event.inputs.end_date }}" \
              "${SNAPSHOT_START_TS:-${empty_arg}}" \
              "${SNAPSHOT_END_TS:-${empty_arg}}" \
              "${{ github.event.inputs.stake_usd }}" \
              "${SNAPSHOT_LOB_SAMPLE_SECS}" \
              "${SNAPSHOT_PM_BOOK_SAMPLE_SECS}" \
              "${SNAPSHOT_OBSERVATION_SAMPLE_SECS}" \
              "${SNAPSHOT_MAX_QUOTE_AGE_SECS}" \
              "${SNAPSHOT_OPTIMIZER_DATA_DIR}" \
              "${REQUIRED_SOURCES}" \
              "${DATA_AUDIT_STATUS}" \
              "${INCLUDE_DERIBIT}" \
              "${SNAPSHOT_ORDERBOOK_ARCHIVE_ROOT}" <<'EOF'
          set -euo pipefail
          deploy_root="$1"
          remote_dir="$2"
          symbols="$3"
          start_date="$4"
          end_date="$5"
          start_ts="$6"
          end_ts="$7"
          stake_usd="$8"
          lob_sample_secs="$9"
          pm_book_sample_secs="${10}"
          observation_sample_secs="${11}"
          max_quote_age_secs="${12}"
          optimizer_data_dir="${13}"
          required_sources="${14}"
          data_audit_status="${15}"
          include_deribit="${16}"
          orderbook_archive_root="${17}"
          if [ "${start_ts}" = "__ploy_empty__" ]; then
            start_ts=""
          fi
          if [ "${end_ts}" = "__ploy_empty__" ]; then
            end_ts=""
          fi

          set -a
          . "${deploy_root}/.env"
          set +a
          : "${PLOY_DATABASE__URL:?PLOY_DATABASE__URL missing in ${deploy_root}/.env}"
          compiler="${deploy_root}/bin/research-snapshot-compile"
          test -x "${compiler}"
          mkdir -p "${remote_dir}/research-snapshot"
          deribit_args=()
          if [ "${include_deribit}" != "true" ]; then
            deribit_args+=(--skip-deribit)
          fi
          window_args=()
          if [ -n "${start_ts}" ]; then
            window_args+=(--start-ts "${start_ts}")
          else
            window_args+=(--start-date "${start_date}")
          fi
          if [ -n "${end_ts}" ]; then
            window_args+=(--end-ts "${end_ts}")
          else
            window_args+=(--end-date "${end_date}")
          fi
          set +e
          timeout 3600 "${compiler}" \
            --db-url "${PLOY_DATABASE__URL}" \
            --symbols "${symbols}" \
            "${window_args[@]}" \
            --stake-usd "${stake_usd}" \
            --lob-sample-secs "${lob_sample_secs}" \
            --pm-book-sample-secs "${pm_book_sample_secs}" \
            --pm-book-archive-dir "${orderbook_archive_root}/orderbook_snapshots" \
            --observation-sample-secs "${observation_sample_secs}" \
            --max-quote-age-secs "${max_quote_age_secs}" \
            --output-dir "${remote_dir}/research-snapshot" \
            --optimizer-data-dir "${optimizer_data_dir}" \
            --data-requirements "${required_sources}" \
            --data-audit-status "${data_audit_status}" \
            --data-audit-report data-gap-audit.json \
            "${deribit_args[@]}" \
            2>&1 | tee "${remote_dir}/research-snapshot/compile.log"
          compile_status="${PIPESTATUS[0]}"
          set -e
          printf '%s\n' "${compile_status}" > "${remote_dir}/research-snapshot/compile-status.txt"
          tar -C "${remote_dir}" -cf "${remote_dir}/research-snapshot.tar" research-snapshot
          ls -lh "${remote_dir}/research-snapshot.tar"
          EOF
            then
              break
            fi
            if [ "${attempt}" -eq 3 ]; then
              echo "remote snapshot compile failed before artifact copy after ${attempt} attempts" >&2
              exit 1
            fi
            sleep "$((attempt * 15))"
          done

          for attempt in 1 2 3; do
            if scp "tango-1-1:${REMOTE_DIR}/research-snapshot.tar" artifacts/research-snapshot.tar; then
              break
            fi
            if [ "${attempt}" -eq 3 ]; then
              echo "copying research snapshot tar failed after ${attempt} attempts" >&2
              exit 1
            fi
            sleep "$((attempt * 15))"
          done
          rm -rf artifacts/research-snapshot
          mkdir -p artifacts/research-snapshot
          tar -C artifacts -xf artifacts/research-snapshot.tar
          compile_status="$(cat artifacts/research-snapshot/compile-status.txt)"
          if [ "${compile_status}" != "0" ]; then
            echo "research-snapshot-compile failed with status ${compile_status}" >&2
            exit "${compile_status}"
          fi
          test -s artifacts/research-snapshot/manifest.json
          test -s artifacts/research-snapshot/quality.md

      - name: Install Aliyun CLI for research snapshot fallback
        if: ${{ steps.data_audit.outcome != 'success' || steps.compile_snapshot.outcome != 'success' }}
        run: |
          set -euo pipefail
          curl -fsSL https://aliyuncli.alicdn.com/aliyun-cli-linux-latest-amd64.tgz -o aliyun-cli.tgz
          tar -xzf aliyun-cli.tgz
          sudo install -m 0755 aliyun /usr/local/bin/aliyun
          aliyun version

      - name: Install ossutil for research snapshot fallback
        if: ${{ steps.data_audit.outcome != 'success' || steps.compile_snapshot.outcome != 'success' }}
        run: |
          set -euo pipefail
          if ! command -v ossutil >/dev/null 2>&1; then
            curl -fsSL https://gosspublic.alicdn.com/ossutil/install.sh | sudo bash
          fi
          command -v ossutil >/dev/null 2>&1

      - name: Configure Aliyun CLI for research snapshot fallback
        if: ${{ steps.data_audit.outcome != 'success' || steps.compile_snapshot.outcome != 'success' }}
        env:
          ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ECS_ACCESS_KEY_ID || secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ECS_ACCESS_KEY_SECRET || secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
        run: |
          set -euo pipefail
          test -n "${ALIYUN_ACCESS_KEY_ID}"
          test -n "${ALIYUN_ACCESS_KEY_SECRET}"
          aliyun configure set \
            --profile default \
            --mode AK \
            --region "${DEPLOY_OSS_REGION}" \
            --access-key-id "${ALIYUN_ACCESS_KEY_ID}" \
            --access-key-secret "${ALIYUN_ACCESS_KEY_SECRET}"

      - name: Compile snapshot via Cloud Assistant fallback
        if: ${{ steps.data_audit.outcome != 'success' || steps.compile_snapshot.outcome != 'success' }}
        env:
          INCLUDE_DERIBIT: ${{ steps.data_scope.outputs.include_deribit }}
          REQUIRED_SOURCES: ${{ steps.data_scope.outputs.required_sources }}
          SNAPSHOT_SYMBOLS: ${{ github.event.inputs.symbols }}
          SNAPSHOT_STAKE_USD: ${{ github.event.inputs.stake_usd }}
          ALIYUN_OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          ALIYUN_OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
          ALIYUN_OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
        run: python3 scripts/ci/run_tango_research_snapshot_cloud_assist.py

      - name: Cleanup remote snapshot workspace
        if: always()
        run: |
          ssh tango-1-1 /bin/bash -s -- "${REMOTE_DIR}" <<'EOF' || true
          set -euo pipefail
          rm -rf "$1"
          EOF

      - name: Publish summary
        if: always()
        run: |
          {
            echo "## Research Snapshot"
            echo ""
            echo "- Execution host: \`tango-1-1\`"
            echo "- Workflow runner: \`ubuntu-latest\`"
            echo "- Window: ${{ github.event.inputs.start_date }} -> ${{ github.event.inputs.end_date }}"
            if [ -n "${SNAPSHOT_START_TS}" ] || [ -n "${SNAPSHOT_END_TS}" ]; then
              echo "- Timestamp window override: \`${SNAPSHOT_START_TS:-<date-start>} -> ${SNAPSHOT_END_TS:-<date-end>}\`"
            fi
            echo "- Symbols: ${{ github.event.inputs.symbols }}"
            echo "- Stake: ${{ github.event.inputs.stake_usd }}U"
            echo "- Data profile: ${SNAPSHOT_DATA_PROFILE}"
            echo "- Data requirements: ${{ steps.data_scope.outputs.required_sources }}"
            echo "- Include Deribit: ${{ steps.data_scope.outputs.include_deribit }}"
            echo "- LOB sample secs: ${SNAPSHOT_LOB_SAMPLE_SECS}"
            echo "- PM book sample secs: ${SNAPSHOT_PM_BOOK_SAMPLE_SECS}"
            echo ""
            if [ -f artifacts/research-snapshot/data-gap-audit.md ]; then
              cat artifacts/research-snapshot/data-gap-audit.md
              echo ""
            fi
            if [ -f artifacts/research-snapshot/quality.md ]; then
              cat artifacts/research-snapshot/quality.md
            fi
            if [ -f artifacts/research-snapshot/compile.log ]; then
              echo ""
              echo "## Compile Log"
              echo '```'
              tail -120 artifacts/research-snapshot/compile.log
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stage snapshot provenance artifact
        if: always()
        run: |
          set -euo pipefail
          rm -rf artifacts/research-snapshot-provenance
          mkdir -p artifacts/research-snapshot-provenance
          for file in manifest.json quality.md data-gap-audit.md data-gap-audit.json compile.log compile-status.txt; do
            if [ -f "artifacts/research-snapshot/${file}" ]; then
              cp "artifacts/research-snapshot/${file}" artifacts/research-snapshot-provenance/
            fi
          done
          {
            echo "run_id=${GITHUB_RUN_ID}"
            echo "sampled_snapshot_embedded=${SNAPSHOT_UPLOAD_SAMPLED_SNAPSHOT}"
            echo "registry=tango-remote"
            echo "execution_host=tango-1-1"
            echo "workflow_runner=ubuntu-latest"
          } > artifacts/research-snapshot-provenance/source.txt

      - name: Upload complete sampled snapshot artifact
        if: ${{ steps.snapshot_options.outputs.upload_sampled_snapshot == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: research-snapshot-${{ github.run_id }}
          path: artifacts/research-snapshot/
          compression-level: 0
          retention-days: 3

      - name: Upload snapshot provenance artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: research-snapshot-provenance-${{ github.run_id }}
          path: artifacts/research-snapshot-provenance/
          compression-level: 0
          retention-days: 14
