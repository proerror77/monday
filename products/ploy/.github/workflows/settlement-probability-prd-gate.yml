name: Settlement Probability PRD Gate

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: "Branch or tag used for the downstream snapshot and walk-forward workflows"
        required: true
        default: "main"
      start_date:
        description: "Research window start date (YYYY-MM-DD)"
        required: true
      end_date:
        description: "Research window end date (YYYY-MM-DD)"
        required: true
      symbols:
        description: "Comma-separated Binance symbols"
        required: true
        default: "BTCUSDT,ETHUSDT,SOLUSDT"
      stake_usd:
        description: "Fixed notional used by executable labels"
        required: true
        default: "15"
      snapshot_run_id:
        description: "Required run id with a complete sampled research-snapshot artifact"
        required: true
        default: ""
      issue_number:
        description: "Issue number for posting gate evidence; leave empty to skip comments"
        required: false
        default: "321"
      audit_lookback_hours:
        description: "Data-audit lookback hours, optionally suffixed with :event-complete"
        required: true
        default: "168"
      replay_parity_run_id:
        description: "Optional replay parity run id, or run_id:artifact_name for non-default artifact names"
        required: false
        default: ""
      no_wait:
        description: "Dispatch the next evidence workflow and return"
        required: true
        default: "false"
        type: boolean

concurrency:
  group: settlement-probability-prd-gate-${{ github.event.inputs.git_ref }}-${{ github.event.inputs.start_date }}-${{ github.event.inputs.end_date }}-${{ github.event.inputs.symbols }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  gate:
    name: Run settlement probability PRD gate
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout orchestration code
        uses: actions/checkout@v6

      - name: Run strict settlement probability gate
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_REF: ${{ github.event.inputs.git_ref }}
          START_DATE: ${{ github.event.inputs.start_date }}
          END_DATE: ${{ github.event.inputs.end_date }}
          SYMBOLS: ${{ github.event.inputs.symbols }}
          STAKE_USD: ${{ github.event.inputs.stake_usd }}
          SNAPSHOT_RUN_ID: ${{ github.event.inputs.snapshot_run_id }}
          ISSUE_NUMBER: ${{ github.event.inputs.issue_number }}
          REPLAY_PARITY_RUN_ID: ${{ github.event.inputs.replay_parity_run_id }}
          NO_WAIT: ${{ github.event.inputs.no_wait }}
        run: |
          set -euo pipefail
          audit_lookback_hours="${{ github.event.inputs.audit_lookback_hours }}"
          data_quality_mode="strict-continuous"
          case "${audit_lookback_hours}" in
            *:event-complete)
              audit_lookback_hours="${audit_lookback_hours%:event-complete}"
              data_quality_mode="event-complete"
              ;;
            *:strict-continuous)
              audit_lookback_hours="${audit_lookback_hours%:strict-continuous}"
              data_quality_mode="strict-continuous"
              ;;
          esac
          args=(
            scripts/run_settlement_probability_prd_gate.py
            --git-ref "${GIT_REF}"
            --start-date "${START_DATE}"
            --end-date "${END_DATE}"
            --symbols "${SYMBOLS}"
            --stake-usd "${STAKE_USD}"
            --issue-number "${ISSUE_NUMBER}"
            --audit-lookback-hours "${audit_lookback_hours}"
            --data-quality-mode "${data_quality_mode}"
          )
          if [ -n "${SNAPSHOT_RUN_ID}" ]; then
            args+=(--snapshot-run-id "${SNAPSHOT_RUN_ID}")
          fi
          if [ -n "${REPLAY_PARITY_RUN_ID}" ]; then
            args+=(--replay-parity-run-id "${REPLAY_PARITY_RUN_ID}")
          fi
          if [ "${NO_WAIT}" = "true" ]; then
            args+=(--no-wait)
          fi
          "${args[@]}"

      - name: Write gate summary
        if: always()
        run: |
          {
            echo "## Settlement Probability PRD Gate"
            echo ""
            echo "- Git ref: \`${{ github.event.inputs.git_ref }}\`"
            echo "- Window: \`${{ github.event.inputs.start_date }}..${{ github.event.inputs.end_date }}\`"
            echo "- Symbols: \`${{ github.event.inputs.symbols }}\`"
            echo "- Stake: \`${{ github.event.inputs.stake_usd }}u\`"
            echo "- Snapshot source run: \`${{ github.event.inputs.snapshot_run_id || 'missing-required-snapshot' }}\`"
            echo "- Walk-forward runner: \`ubuntu-latest\` via \`factor-walk-forward-v2-hosted-artifact.yml\`"
            audit_lookback_hours="${{ github.event.inputs.audit_lookback_hours }}"
            data_quality_mode="strict-continuous"
            case "${audit_lookback_hours}" in
              *:event-complete)
                audit_lookback_hours="${audit_lookback_hours%:event-complete}"
                data_quality_mode="event-complete"
                ;;
              *:strict-continuous)
                audit_lookback_hours="${audit_lookback_hours%:strict-continuous}"
                data_quality_mode="strict-continuous"
                ;;
            esac
            if [ "${data_quality_mode}" = "event-complete" ]; then
              echo "- Snapshot data gate: \`never\`"
            else
              echo "- Snapshot data gate: \`critical\`"
            fi
            echo "- Data quality mode: \`${data_quality_mode}\`"
            echo "- Min event-complete events: \`20\`"
            echo "- Min event-complete rows: \`40\`"
            echo "- Data profile: \`pm5d-vol\`"
            echo "- Audit lookback: \`${audit_lookback_hours}h\`"
            echo "- Replay parity run: \`${{ github.event.inputs.replay_parity_run_id || 'none' }}\`"
            echo "- Replay parity artifact: \`default unless encoded as run_id:artifact_name\`"
            echo ""
            echo "A failed workflow can be the correct outcome: the orchestrator exits non-zero when the PRD promotion gate is blocked."
          } >> "$GITHUB_STEP_SUMMARY"
