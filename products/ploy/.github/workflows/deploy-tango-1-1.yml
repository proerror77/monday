name: Deploy to tango-1-1

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: "Git ref to deploy (branch, tag, or SHA)"
        required: true
        default: "main"
      deploy:
        description: "Push the built bundle to OSS and restart tango-1-1 services"
        type: boolean
        required: true
        default: true

concurrency:
  group: deploy-tango-1-1-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  SCCACHE_CACHE_SIZE: 10G
  TZ: UTC
  LC_ALL: C
  LANG: C
  PLATFORM_TARGET: x86_64-unknown-linux-gnu
  DEPLOY_HOST: ${{ secrets.TANGO_1_1_HOST }}
  TANGO_1_1_INSTANCE_ID: ${{ vars.TANGO_1_1_INSTANCE_ID || 'i-6we8940uojnsory3ihfw' }}
  DEPLOY_ROOT: ${{ vars.PLOY_DEPLOY_ROOT || '/opt/ploy' }}
  DEPLOY_OSS_REGION: ${{ vars.ALIYUN_REGION || 'ap-northeast-1' }}
  DEPLOY_OSS_PREFIX: deploy/tango-1-1
  DEPLOY_BUNDLE_NAME: ploy-runner-tango-1-1.tar.gz
  DEPLOY_MIGRATIONS: >-
    027_reference_price_ticks.sql
    028_pm_market_catalog.sql
    029_sports_state_events.sql
    030_strategy_runtime_execution_audit.sql
    031_strategy_runtime_track_record_views.sql
    032_strategy_runtime_track_record_official_settlement.sql
    033_fix_settlement_view_join_and_confirmed_flag.sql
    034_clob_quote_ticks_full_resolution.sql
    035_binance_agg_trade_ticks.sql
    036_research_valid_windows_matview.sql
    037_research_time_conditioned_factor_metrics.sql
    039_fix_strategy_track_record_side_key.sql
    038_track_record_official_residual_settlement.sql
    040_polymarket_v2_indexer_events.sql
    041_repair_strategy_track_record_side_residual.sql
    042_factor_research_os_registry.sql
    043_research_os_trace_constraints.sql
    044_candidate_replay_tapes.sql
    045_candidate_replay_basis_stage_constraint.sql
    046_factor_registry_blockers.sql
    047_full_depth_execution_surfaces.sql
    048_official_settlement_coverage_checks.sql
    049_cex_public_market_data.sql
    050_predict_fun_market_data.sql

jobs:
  build-and-deploy:
    name: Build and deploy to tango-1-1
    # Protected deploy environment for deploy=true: environment: tango-1-1
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # deploy=true protected environment: tango-1-1
    environment: ${{ inputs.deploy && 'tango-1-1' || 'tango-1-1-build-only' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.git_ref }}

      - name: Validate deploy provenance
        if: ${{ inputs.deploy }}
        env:
          INPUT_GIT_REF: ${{ github.event.inputs.git_ref }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "Deployments to tango-1-1 must dispatch the workflow from main; got ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          if [ "${INPUT_GIT_REF}" != "main" ]; then
            echo "Deployments to tango-1-1 must use git_ref=main; got ${INPUT_GIT_REF}" >&2
            exit 1
          fi
          git fetch --no-tags --depth=1 origin main
          checked_out_sha="$(git rev-parse HEAD)"
          main_sha="$(git rev-parse origin/main)"
          if [ "${checked_out_sha}" != "${main_sha}" ]; then
            echo "Checked-out deploy SHA ${checked_out_sha} does not match origin/main ${main_sha}" >&2
            exit 1
          fi
          echo "Deploy provenance verified: git_ref=main sha=${checked_out_sha}"

      - name: Set reproducible build environment
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91
          targets: ${{ env.PLATFORM_TARGET }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libpq-dev clang lld openssh-client
          sudo apt-get install -y sccache || cargo install sccache --locked
          sudo apt-get install -y mold || true

      - name: Capture cache metadata
        id: cache_meta
        run: |
          echo "rustc_version=$(rustc -Vv | sed -n 's/^release: //p')" >> "$GITHUB_OUTPUT"
          echo "sccache_version=$(sccache --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: deploy-tango-1-1-${{ env.PLATFORM_TARGET }}-release-rust-${{ steps.cache_meta.outputs.rustc_version }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache sccache
        uses: actions/cache@v5
        with:
          path: ~/.cache/sccache
          key: ${{ runner.os }}-sccache-deploy-tango-1-1-${{ env.PLATFORM_TARGET }}-release-rust-${{ steps.cache_meta.outputs.rustc_version }}-sccache-${{ steps.cache_meta.outputs.sccache_version }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-sccache-deploy-tango-1-1-${{ env.PLATFORM_TARGET }}-release-rust-${{ steps.cache_meta.outputs.rustc_version }}-sccache-${{ steps.cache_meta.outputs.sccache_version }}-
            ${{ runner.os }}-sccache-deploy-tango-1-1-${{ env.PLATFORM_TARGET }}-release-rust-${{ steps.cache_meta.outputs.rustc_version }}-
            ${{ runner.os }}-sccache-deploy-tango-1-1-${{ env.PLATFORM_TARGET }}-release-
            ${{ runner.os }}-sccache-deploy-tango-1-1-
            ${{ runner.os }}-sccache-

      - name: Build new-ploy-runner
        run: |
          cargo build --release --locked \
            --target "${PLATFORM_TARGET}" \
            --features new-ploy-runner/full \
            -p new-ployd \
            -p ployctl \
            -p new-ploy-runner
          strip "target/${PLATFORM_TARGET}/release/new-ployd" || true
          strip "target/${PLATFORM_TARGET}/release/ployctl" || true
          strip "target/${PLATFORM_TARGET}/release/new-ploy-runner" || true

      - name: Build research tools
        run: |
          cargo build --release --locked \
            --target "${PLATFORM_TARGET}" \
            --features db,polars-export \
            -p ploy-research \
            --example research_snapshot_compile \
            --example persist_research_trace \
            --example research_trace_plan
          strip "target/${PLATFORM_TARGET}/release/examples/research_snapshot_compile" || true
          strip "target/${PLATFORM_TARGET}/release/examples/persist_research_trace" || true
          strip "target/${PLATFORM_TARGET}/release/examples/research_trace_plan" || true

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats || true

      - name: Build deploy bundle
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/bin dist/config/strategies dist/config/deployments dist/migrations dist/deployment/systemd dist/scripts dist/scripts/drills
          cp "target/${PLATFORM_TARGET}/release/new-ployd" dist/bin/ployd
          cp "target/${PLATFORM_TARGET}/release/ployctl" dist/bin/ployctl
          cp "target/${PLATFORM_TARGET}/release/new-ploy-runner" dist/bin/ploy-runner
          cp "target/${PLATFORM_TARGET}/release/examples/research_snapshot_compile" dist/bin/research-snapshot-compile
          cp "target/${PLATFORM_TARGET}/release/examples/persist_research_trace" dist/bin/persist-research-trace
          cp "target/${PLATFORM_TARGET}/release/examples/research_trace_plan" dist/bin/research-trace-plan
          cp config/strategies/02-pm5d.unified.toml dist/config/strategies/02-pm5d.unified.toml
          cp config/strategies/02-pm5d-threelayer.unified.toml dist/config/strategies/02-pm5d-threelayer.unified.toml
          cp config/strategies/02-pm5d-threelayer.obi-soft-dryrun.toml dist/config/strategies/02-pm5d-threelayer.obi-soft-dryrun.toml
          cp config/strategies/02-pm5d-threelayer.obi-hard-dryrun.toml dist/config/strategies/02-pm5d-threelayer.obi-hard-dryrun.toml
          cp config/strategies/02-pm5d-threelayer.champion-dryrun.toml dist/config/strategies/02-pm5d-threelayer.champion-dryrun.toml
          cp config/strategies/02-pm5d-threelayer.continuation-soft-dryrun.toml dist/config/strategies/02-pm5d-threelayer.continuation-soft-dryrun.toml
          cp config/strategies/02-pm5d-threelayer.repricing-momentum-dryrun.toml dist/config/strategies/02-pm5d-threelayer.repricing-momentum-dryrun.toml
          cp config/strategies/02-pm5d-threelayer.settlement-probability-btc-eth-dryrun.toml dist/config/strategies/02-pm5d-threelayer.settlement-probability-btc-eth-dryrun.toml
          python3 - <<'PY'
          import json
          import pathlib
          import shutil

          destination = pathlib.Path("dist/config/deployments")
          for source in pathlib.Path("config/deployments").glob("*.json"):
              payload = json.loads(source.read_text(encoding="utf-8"))
              if payload.get("runtime_mode") == "live":
                  continue
              shutil.copy2(source, destination / source.name)
          PY
          cp scripts/audit_market_data_gaps.py dist/scripts/audit_market_data_gaps.py
          cp scripts/check_dryrun_report_contract.py dist/scripts/check_dryrun_report_contract.py
          cp scripts/import_polymarket_v2_indexer.py dist/scripts/import_polymarket_v2_indexer.py
          cp scripts/archive_clob_orderbook_snapshots_backfill.sh dist/scripts/archive_clob_orderbook_snapshots_backfill.sh
          cp scripts/export_clob_orderbook_snapshots_parquet.sh dist/scripts/export_clob_orderbook_snapshots_parquet.sh
          cp scripts/ploy_orderbook_snapshot_retention.sh dist/scripts/ploy_orderbook_snapshot_retention.sh
          cp scripts/fix_binance_lob_partitions.sql dist/scripts/fix_binance_lob_partitions.sql
          cp scripts/fix_deribit_partitions.sql dist/scripts/fix_deribit_partitions.sql
          cp scripts/fix_clob_trade_partitions.sql dist/scripts/fix_clob_trade_partitions.sql
          cp scripts/repair_strategy_track_record_official_settlement.sql dist/scripts/repair_strategy_track_record_official_settlement.sql
          find scripts/drills -maxdepth 1 -type f -name '*.sh' \
            ! -name 'pm5d_threelayer_live_gate.sh' \
            -exec cp {} dist/scripts/drills/ \;
          for migration in ${DEPLOY_MIGRATIONS}; do
            migration="$(printf '%s' "${migration}" | xargs)"
            [ -n "${migration}" ] || continue
            cp "migrations/${migration}" "dist/migrations/${migration}"
          done
          cp deployment/systemd/ploy-binance-aggtrade-collector.service dist/deployment/systemd/ploy-binance-aggtrade-collector.service
          cp deployment/systemd/ploy-binance-lob-collector.service dist/deployment/systemd/ploy-binance-lob-collector.service
          cp deployment/systemd/ploy-binance-price-collector.service dist/deployment/systemd/ploy-binance-price-collector.service
          cp deployment/systemd/ploy-deribit-iv-collector.service dist/deployment/systemd/ploy-deribit-iv-collector.service
          cp deployment/systemd/ploy-deribit-greeks-collector.service dist/deployment/systemd/ploy-deribit-greeks-collector.service
          cp deployment/systemd/ploy-cex-public-collector.service dist/deployment/systemd/ploy-cex-public-collector.service
          cp deployment/systemd/ploy-predict-fun-collector.service dist/deployment/systemd/ploy-predict-fun-collector.service
          cp deployment/systemd/ploy-market-discovery.service dist/deployment/systemd/ploy-market-discovery.service
          cp deployment/systemd/ploy-pm-trade-collector.service dist/deployment/systemd/ploy-pm-trade-collector.service
          cp deployment/systemd/ploy-polymarket-v2-indexer-import.service dist/deployment/systemd/ploy-polymarket-v2-indexer-import.service
          cp deployment/systemd/ploy-polymarket-v2-indexer-import.timer dist/deployment/systemd/ploy-polymarket-v2-indexer-import.timer
          cp deployment/systemd/ploy-orderbook-snapshot-archive.service dist/deployment/systemd/ploy-orderbook-snapshot-archive.service
          cp deployment/systemd/ploy-orderbook-snapshot-archive.timer dist/deployment/systemd/ploy-orderbook-snapshot-archive.timer
          cp deployment/systemd/ploy-orderbook-snapshot-retention.service dist/deployment/systemd/ploy-orderbook-snapshot-retention.service
          cp deployment/systemd/ploy-orderbook-snapshot-retention.timer dist/deployment/systemd/ploy-orderbook-snapshot-retention.timer
          cp deployment/systemd/polymarket-v2-indexer.service dist/deployment/systemd/polymarket-v2-indexer.service
          cp deployment/systemd/ploy-strategy-directional-dryrun.hardening.conf dist/deployment/systemd/ploy-strategy-directional-dryrun.hardening.conf
          cp deployment/env.polymarket-v2-indexer.example dist/deployment/env.polymarket-v2-indexer.example
          cp deployment/systemd/ploy-quote-collector.hardening.conf dist/deployment/systemd/ploy-quote-collector.hardening.conf
          tar --sort=name --mtime="@${SOURCE_DATE_EPOCH}" --owner=0 --group=0 --numeric-owner \
            -C dist -cf - . | gzip -n > "${DEPLOY_BUNDLE_NAME}"
          sha256sum "${DEPLOY_BUNDLE_NAME}" > "${DEPLOY_BUNDLE_NAME}.sha256"

      - name: Verify research bundle has no live authority
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          for manifest in Path("dist/config/deployments").glob("*.json"):
              data = json.loads(manifest.read_text(encoding="utf-8"))
              if data.get("runtime_mode") == "live":
                  raise SystemExit(f"research host bundle contains a live deployment: {manifest}")
          forbidden = [
              Path("dist/config/strategies/02-pm5d.live.toml"),
              Path("dist/config/strategies/02-pm5d-threelayer.live.toml"),
              Path("dist/scripts/drills/pm5d_threelayer_live_gate.sh"),
          ]
          present = [str(path) for path in forbidden if path.exists()]
          if present:
              raise SystemExit(f"research host bundle contains live authority: {present}")
          print("research host bundle contains data/research/dry-run surfaces only")
          PY

      - name: Validate OSS deploy secrets
        if: ${{ inputs.deploy }}
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
          OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
        run: |
          missing=()
          [ -n "${OSS_ACCESS_KEY_ID}" ] || missing+=("ALIYUN_OSS_ACCESS_KEY_ID")
          [ -n "${OSS_ACCESS_KEY_SECRET}" ] || missing+=("ALIYUN_OSS_ACCESS_KEY_SECRET")
          [ -n "${OSS_BUCKET}" ] || missing+=("ALIYUN_OSS_BUCKET")
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required OSS deploy secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Install ossutil
        if: ${{ inputs.deploy }}
        run: |
          if ! command -v ossutil >/dev/null 2>&1; then
            curl -fsSL https://gosspublic.alicdn.com/ossutil/install.sh | sudo bash
          fi
          export PATH="/usr/local/bin:/usr/bin:/bin:${PATH}"
          command -v ossutil >/dev/null 2>&1

      - name: Upload deploy bundle to OSS
        if: ${{ inputs.deploy }}
        id: upload_bundle_to_oss
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
          OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
        run: |
          export PATH="/usr/local/bin:/usr/bin:/bin:${PATH}"
          test -n "${OSS_ACCESS_KEY_ID}"
          test -n "${OSS_ACCESS_KEY_SECRET}"
          test -n "${OSS_BUCKET}"
          export OSS_REGION="${DEPLOY_OSS_REGION}"
          export OSS_ENDPOINT="https://oss-${DEPLOY_OSS_REGION}.aliyuncs.com"
          object_prefix="${DEPLOY_OSS_PREFIX}/${GITHUB_SHA}"
          bundle_object="oss://${OSS_BUCKET}/${object_prefix}/${DEPLOY_BUNDLE_NAME}"
          checksum_object="oss://${OSS_BUCKET}/${object_prefix}/${DEPLOY_BUNDLE_NAME}.sha256"
          ossutil cp "${DEPLOY_BUNDLE_NAME}" "${bundle_object}" \
            -i "${OSS_ACCESS_KEY_ID}" -k "${OSS_ACCESS_KEY_SECRET}" \
            -e "https://oss-${DEPLOY_OSS_REGION}.aliyuncs.com"
          ossutil cp "${DEPLOY_BUNDLE_NAME}.sha256" "${checksum_object}" \
            -i "${OSS_ACCESS_KEY_ID}" -k "${OSS_ACCESS_KEY_SECRET}" \
            -e "https://oss-${DEPLOY_OSS_REGION}.aliyuncs.com"
          echo "bundle_object=${bundle_object}" >> "${GITHUB_OUTPUT}"
          echo "checksum_object=${checksum_object}" >> "${GITHUB_OUTPUT}"

      - name: Configure SSH for deploy
        if: ${{ inputs.deploy }}
        env:
          TANGO_1_1_KNOWN_HOSTS: ${{ secrets.TANGO_1_1_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          if [ -z "${TANGO_1_1_KNOWN_HOSTS}" ]; then
            echo "TANGO_1_1_KNOWN_HOSTS secret is required for pinned SSH host verification" >&2
            exit 1
          fi
          printf '%s\n' "${TANGO_1_1_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          printf '%s\n' '${{ secrets.TANGO_1_1_SSH_KEY }}' > ~/.ssh/tango_1_1_key
          chmod 600 ~/.ssh/tango_1_1_key
          cat > ~/.ssh/config <<EOF
          Host tango-1-1
            HostName ${DEPLOY_HOST}
            User root
            IdentityFile ~/.ssh/tango_1_1_key
            HostKeyAlias tango-1-1
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            ServerAliveInterval 30
            ServerAliveCountMax 20
            ConnectTimeout 30
          EOF

      - name: Prepare remote directories
        id: prepare_remote_ssh
        if: ${{ inputs.deploy }}
        continue-on-error: true
        run: |
          # shellcheck disable=SC2029
          ssh tango-1-1 "mkdir -p ${DEPLOY_ROOT}/bin ${DEPLOY_ROOT}/config/strategies ${DEPLOY_ROOT}/config/deployments ${DEPLOY_ROOT}/migrations ${DEPLOY_ROOT}/scripts ${DEPLOY_ROOT}/scripts/drills ${DEPLOY_ROOT}/tmp"

      - name: Pull bundle from OSS and restart services
        id: deploy_ssh
        if: ${{ inputs.deploy && steps.prepare_remote_ssh.outcome == 'success' }}
        continue-on-error: true
        env:
          ALIYUN_OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          ALIYUN_OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
          ALIYUN_OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
        run: |
          set -euo pipefail
          python3 scripts/ci/deploy_tango_cloud_assist.py --print-remote-script \
            | ssh tango-1-1 /bin/bash

      - name: Install Aliyun CLI for Cloud Assistant fallback
        if: ${{ inputs.deploy && (steps.prepare_remote_ssh.outcome != 'success' || steps.deploy_ssh.outcome != 'success') }}
        run: |
          set -euo pipefail
          curl -fsSL https://aliyuncli.alicdn.com/aliyun-cli-linux-latest-amd64.tgz -o aliyun-cli.tgz
          tar -xzf aliyun-cli.tgz
          sudo install -m 0755 aliyun /usr/local/bin/aliyun
          aliyun version

      - name: Configure Aliyun CLI for Cloud Assistant fallback
        if: ${{ inputs.deploy && (steps.prepare_remote_ssh.outcome != 'success' || steps.deploy_ssh.outcome != 'success') }}
        env:
          ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ECS_ACCESS_KEY_ID || secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ECS_ACCESS_KEY_SECRET || secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
        run: |
          set -euo pipefail
          test -n "${ALIYUN_ACCESS_KEY_ID}"
          test -n "${ALIYUN_ACCESS_KEY_SECRET}"
          aliyun configure set \
            --profile default \
            --mode AK \
            --region "${DEPLOY_OSS_REGION}" \
            --access-key-id "${ALIYUN_ACCESS_KEY_ID}" \
            --access-key-secret "${ALIYUN_ACCESS_KEY_SECRET}"

      - name: Deploy via Cloud Assistant fallback
        if: ${{ inputs.deploy && (steps.prepare_remote_ssh.outcome != 'success' || steps.deploy_ssh.outcome != 'success') }}
        env:
          ALIYUN_OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          ALIYUN_OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
          ALIYUN_OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
        run: python3 scripts/ci/deploy_tango_cloud_assist.py

      - name: Deployment summary
        if: ${{ inputs.deploy }}
        run: |
          {
            echo "## Deployment to tango-1-1"
            echo "- Binary: \`ploy-runner\`"
            echo "- Target: \`${{ secrets.TANGO_1_1_HOST }}\`"
            echo "- Transport: \`GitHub Actions -> OSS -> SSH, fallback Cloud Assistant\`"
            echo "- OSS object: \`${{ steps.upload_bundle_to_oss.outputs.bundle_object }}\`"
            echo "- Services: \`ployd\` (if installed), existing collectors, and \`ploy-cex-public-collector\`"
            echo "- Git ref: \`${{ github.event.inputs.git_ref }}\`"
            echo "- Migrations: \`${DEPLOY_MIGRATIONS}\`"
            echo "- Postgres pre/postflight: required"
            echo "- Persistence guardrail: deployment fails if dry-run starts without DB-backed recorder"
          } >> "$GITHUB_STEP_SUMMARY"
