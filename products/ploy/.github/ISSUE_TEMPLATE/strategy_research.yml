name: Strategy Research Hypothesis
description: Track one testable strategy research idea, factor, filter, or data question.
title: "[Research] "
labels: "research:hypothesis"
body:
  - type: input
    id: strategy_family
    attributes:
      label: Strategy family
      description: Broad family this hypothesis belongs to.
      placeholder: binary-options, sports, copy-trading, market-making, event-ML
    validations:
      required: true
  - type: input
    id: strategy_profile
    attributes:
      label: Strategy profile / config
      description: Concrete profile or config under test. Use `new` if it does not exist yet.
      placeholder: config/strategies/<family>.<profile>.toml or new
    validations:
      required: true
  - type: textarea
    id: hypothesis
    attributes:
      label: Hypothesis
      description: State the single claim this issue should test.
      placeholder: "Example: Entries improve when the external reference market moves first while the prediction-market quote lags and liquidity remains one-sided."
    validations:
      required: true
  - type: textarea
    id: edge
    attributes:
      label: Expected edge mechanism
      description: Explain why this should make money after spread, fees, stale quotes, and queue effects.
    validations:
      required: true
  - type: textarea
    id: data
    attributes:
      label: Required data
      description: List tables, windows, symbols, labels, settlement fields, or freshness checks.
      placeholder: price ticks, order-book snapshots, prediction-market quotes, settlement labels, runtime order/fill history
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: Workflow plan
      description: Name the workflow and inputs that should test this idea.
      placeholder: research-snapshot.yml, factor-review-v2-hosted-artifact.yml, optimize.yml, backtest.yml, or replay-dryrun-parity.yml with exact inputs
    validations:
      required: true
  - type: textarea
    id: metrics
    attributes:
      label: Success and failure criteria
      description: Define the metrics and thresholds that decide continue, revise, reject, or promote.
    validations:
      required: true
  - type: textarea
    id: accounting
    attributes:
      label: Accounting contract
      description: State whether this is exploratory diagnostics or executable strategy accounting.
      placeholder: One market event counts as one deployable trade unless the runtime can execute multiple entries under the same risk rules.
    validations:
      required: true
  - type: textarea
    id: parity
    attributes:
      label: Replay / dry-run parity plan
      description: Define how replay results will be compared against dry-run behavior.
      value: |
        - Replay window:
        - Dry-run window:
        - Event ids / markets:
        - Compare fields: decision timestamp, quote, signal inputs, side, entry price, fill status, settlement, PnL
        - Expected acceptable mismatch:
        - Follow-up issue trigger:
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Fill this after the workflow run.
      value: |
        - Workflow:
        - Run URL:
        - Git ref:
        - Strategy family/profile:
        - Dataset/window:
        - Symbols/markets:
        - Config:
        - Artifact:
        - Headline metrics:
        - Replay/dry-run parity:
        - Caveats:
        - Decision:
    validations:
      required: false
