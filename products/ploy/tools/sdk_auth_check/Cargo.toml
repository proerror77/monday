[package]
name = "sdk_auth_check"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
alloy = { version = "1", default-features = false, features = ["signer-local"] }
polymarket-client-sdk = { package = "polymarket_client_sdk_v2", version = "=0.6.0", features = ["clob"] }
