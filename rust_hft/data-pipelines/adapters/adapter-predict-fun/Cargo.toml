[package]
name = "hft-data-adapter-predict-fun"
version = "0.1.0"
edition = "2021"
description = "Predict.fun public REST market-data adapter"

[dependencies]
hft-core = { package = "hft-core", path = "../../../market-core/core" }
ports = { package = "hft-ports", path = "../../../market-core/ports" }
async-trait = { workspace = true }
futures = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls-tls"] }
rust_decimal = { workspace = true }
secrecy = { version = "0.10", features = ["serde"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tracing = { workspace = true }
url = "2"

[lib]
name = "adapter_predict_fun_data"
