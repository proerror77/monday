[package]
name = "hft-data"
version = "0.1.0"
edition = "2021"
description = "公共行情：統一 MarketStream；多交易所 adapters"

[dependencies]
hft-core = { package = "hft-core", path = "../../market-core/core" }
ports = { package = "hft-ports", path = "../../market-core/ports" }
integration = { package = "hft-integration", path = "../../market-core/integration" }
anyhow = "1"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
rust_decimal = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
libc = "0.2"
zstd = "0.13"

[dev-dependencies]
tempfile = "3.10"

[features]
default = []
json-simd = ["dep:simd-json"]

[dependencies.simd-json]
workspace = true
optional = true

[lib]
name = "data"
