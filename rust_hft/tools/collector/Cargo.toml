[package]
name = "hft-collector"
version = "0.2.0"
edition = "2021"
description = "多交易所數據收集器：WebSocket → ClickHouse"

[dependencies]
# 核心異步運行時
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "process"] }

# WebSocket + HTTP 客戶端（統一使用 rustls）
tokio-tungstenite = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std"] }

# ClickHouse 客戶端
clickhouse = { version = "0.12", default-features = false, features = ["rustls-tls"] }
duckdb = { version = "1.10504.0", optional = true, features = ["bundled"] }

# JSON 處理
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { workspace = true }
hex = { workspace = true }

# 基礎工具
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
fs4 = { workspace = true }
libc = "0.2"
rust_decimal = { version = "1", features = ["serde"] }
ordered-float = "4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
engine = { package = "hft-engine", path = "../../market-core/engine" }

# CLI 參數解析
clap = { version = "4", features = ["derive"] }

# WebSocket 相關
futures = "0.3"
url = "2"
urlencoding = "2"

# HTTP request builder for custom WS headers
http = "0.2"

# 壓縮支持
flate2 = "1"
lz4 = "1"

# WebSocket 握手
base64 = "0.21"
rand = "0.8"

# 全局變量
once_cell = "1"

[features]
default = ["collector-bitget"]
collector-binance = []
collector-binance-futures = []
collector-bitget = []
collector-bybit = []
collector-hyperliquid = []
collector-okx = []
collector-asterdex = []
duckdb = ["dep:duckdb"]

[dev-dependencies]
tempfile = "3.10"

[[bin]]
name = "hft-collector"
path = "src/main.rs"

[[bin]]
name = "binance-lob-archiver"
path = "src/bin/binance-lob-archiver.rs"

[[bin]]
name = "polymarket-raw-ops"
path = "src/bin/polymarket-raw-ops.rs"

[lib]
name = "hft_collector"
path = "src/lib.rs"
