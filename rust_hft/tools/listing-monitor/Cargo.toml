[package]
name = "listing-monitor"
version = "0.1.0"
edition = "2021"
description = "Binance new listing monitor with Feishu notifications"

[[bin]]
name = "listing-monitor-alpha"
path = "src/bin/alpha.rs"

[[bin]]
name = "listing-monitor-spot"
path = "src/bin/spot.rs"

[[bin]]
name = "binance-bstock-catalog-sync"
path = "src/bin/bstock_catalog_sync.rs"

[[bin]]
name = "binance-web3-tokenized-catalog-sync"
path = "src/bin/binance_web3_tokenized_catalog_sync.rs"

[dependencies]
reqwest = { workspace = true, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
sha2 = { workspace = true }
futures = { workspace = true }
