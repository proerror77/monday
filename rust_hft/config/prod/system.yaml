# Production startup baseline. Runtime execution remains disabled until a
# signed deployment bundle passes the authority and replay checks.
schema_version: v2
quotes_only: true

engine:
  queue_capacity: 16384
  stale_us: 500000
  top_n: 10
  ack_timeout_ms: 3000
  reconcile_interval_ms: 5000
  balance_reconcile_tolerance_usd: 1
  auto_cancel_exchange_only: false

venues:
  - name: bitget
    account_id: bitget_main
    venue_type: BITGET
    ws_public: "wss://ws.bitget.com/v2/ws/public"
    rest: "https://api.bitget.com"
    execution_mode: "Paper"
    symbol_catalog:
      - BTCUSDT@BITGET
      - ETHUSDT@BITGET
    capabilities:
      supports_incremental_book: true
      supports_private_ws: true
      allows_post_only: true
    simulate_execution: true

strategies: []

risk:
  risk_type: Default
  global_position_limit: 100
  global_notional_limit: 50000
  max_daily_trades: 2000
  max_orders_per_second: 50
  staleness_threshold_us: 300000
  max_daily_loss: 1000
  max_drawdown_pct: 5.0
