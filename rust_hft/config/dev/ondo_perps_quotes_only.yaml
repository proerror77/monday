schema_version: v2
quotes_only: true

engine:
  queue_capacity: 16384
  stale_us: 500000
  top_n: 10
  ack_timeout_ms: 3000
  reconcile_interval_ms: 5000
  balance_reconcile_tolerance_usd: 1
  auto_cancel_exchange_only: false

venues:
  - name: ondo-perps
    venue_type: OndoPerps
    ws_public: "wss://api.ondoperps.xyz/ws"
    rest: "https://api.ondoperps.xyz"
    symbol_catalog:
      - AAPL-USD.P@ONDO_PERPS
      - NVDA-USD.P@ONDO_PERPS
      - TSLA-USD.P@ONDO_PERPS
    capabilities:
      ws_order_placement: false
      snapshot_crc: false
      all_in_one_topics: false
      private_ws_heartbeat: false
      use_incremental_books: false
    simulate_execution: false

strategies: []

risk:
  risk_type: Default
  global_position_limit: 0.0
  global_notional_limit: 0.0
  max_daily_trades: 0
  max_orders_per_second: 0
  staleness_threshold_us: 5000
  tokenized_securities:
    allow_trading: false
    max_notional_per_symbol: 0.0
    max_asset_class_notional: 0.0
    min_top_depth_usd: 0.0
    max_spread_bps: 0.0
    freeze_on_corporate_action: true
    restricted_jurisdictions:
      - US
      - PANAMA
      - CANADA
