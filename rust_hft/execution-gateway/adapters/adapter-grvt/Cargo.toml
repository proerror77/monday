[package]
name = "hft-execution-adapter-grvt"
version = "0.1.0"
edition = "2021"

[dependencies]
hft-core = { package = "hft-core", path = "../../../market-core/core" }
ports = { package = "hft-ports", path = "../../../market-core/ports" }
async-trait = "0.1"
tokio = { workspace = true, features = ["sync", "rt", "macros", "time"] }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
simd-json = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls-tls", "cookies"] }
tokio-stream = { version = "0.1", features = ["sync"] }

[lib]
name = "adapter_grvt_execution"
