[workspace]
resolver = "2"
members = ["..", "../market-core/binance-depth", "../market-core/engine", "../infra-services/core/metrics", "../risk-control/oms-core", "../risk-control/portfolio-core", "../strategy-framework/strategies/arbitrage", "../strategy-framework/strategies/imbalance", "../strategy-framework/strategies/trend", "../market-core/runtime", "../execution-gateway/adapters/adapter-asterdex", "../execution-gateway/execution", "../execution-gateway/adapters/adapter-binance", "../execution-gateway/adapters/adapter-binance-prediction", "../execution-gateway/adapters/adapter-bitget", "../execution-gateway/adapters/adapter-bybit", "../execution-gateway/adapters/adapter-grvt", "../execution-gateway/adapters/adapter-okx", "../execution-gateway/adapters/adapter-ondo-perps", "../execution-gateway/adapters/adapter-polymarket", "../infra-services/core/clickhouse", "../infra-services/core/ipc", "../infra-services/core/redis", "../infra-services/core/secrets", "../risk-control/risk", "../strategy-framework/strategy-dl", "../strategy-framework/infer-onnx", "../strategy-framework/strategies/formula", "../strategy-framework/strategies/lob_flow_grid", "../infra-services/core/grpc-server", "../apps/live", "../apps/all-in-one", "../apps/paper", "../apps/replay"]
default-members = ["..", "../market-core/engine", "../market-core/runtime", "../strategy-framework/strategy-dl", "../apps/live", "../apps/paper", "../apps/all-in-one"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive", "rc"] }
thiserror = "2.0"
sha2 = "0.10"
ed25519-dalek = "2"
hex = "0.4"
fs4 = "1.1.0"
tokio = { version = "1.0", default-features = false }
tokio-stream = "0.1"
futures = "0.3"
futures-util = "0.3"
crossbeam = { version = "0.8", default-features = false }
arc-swap = "1.6"
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "stream", "rustls-tls-webpki-roots"] }
reqwest = { version = "0.12", default-features = false }
axum = "0.7"
serde_json = "1.0"
simd-json = "0.14"
clickhouse = "0.14"
redis = "1.0"
prometheus = "0.14"
parking_lot = "0.12"
tracing = "0.1"
rmp-serde = "1.3"
uuid = { version = "1.0", features = ["v4"] }
tracing-subscriber = "0.3"
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
rust_decimal = { version = "1.33", features = ["serde"] }
clap = { version = "4.0", features = ["derive"] }
metrics-exporter-prometheus = "0.17"

[profile.dev]
# 開發模式：編譯快優先
opt-level = 0
debug = true
incremental = true
lto = false

[profile.release]
# 發布模式：執行快優先，並保持可分發產物精簡
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
split-debuginfo = "packed"

# Admitted research builds trade cross-crate LTO for shorter edit/build loops.
# Profile bytes are part of BuildSpec; production release behavior stays separate.
[profile.research]
inherits = "release"
opt-level = 2
lto = false
codegen-units = 16

[profile.bench]
# 基準測試：最高優化
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false

[patch.crates-io]
rust_decimal = { git = "https://github.com/proerror77/monday-rust-decimal-security-694", rev = "4f7bc6f02d7920b6416988914ae86d25f6670b22" }
