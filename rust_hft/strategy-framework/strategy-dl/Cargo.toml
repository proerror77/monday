[package]
name = "hft-strategy-dl"
version = "0.1.0"
edition = "2021"
description = "Pure-Rust Tract ONNX compatibility strategy for LOB models"

[dependencies]
hft-core = { package = "hft-core", path = "../../market-core/core" }
hft-infer-onnx = { path = "../infer-onnx" }
ports = { package = "hft-ports", path = "../../market-core/ports" }
serde = { workspace = true }
tracing = "0.1"
rust_decimal = { workspace = true }

[dev-dependencies]
hex = { workspace = true }
sha2 = { workspace = true }

[features]
default = []

[lib]
name = "strategy_dl"
