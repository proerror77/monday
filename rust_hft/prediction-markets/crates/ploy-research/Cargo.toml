[package]
name = "ploy-research"
build = "build.rs"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Monday prediction-market research and backtesting crate"
autoexamples = false
autobins = false

[features]
default = []
full = ["db", "polars-export", "ml", "rl", "strategy-runtime"]
db = ["dep:sqlx", "dep:ploy-feed-loaders"]
polars-export = ["dep:polars"]
ml = ["dep:burn", "dep:burn-ndarray", "dep:burn-store", "dep:ciborium"]
rl = ["dep:burn", "dep:burn-ndarray"]
strategy-runtime = ["dep:ploy-strategy-bundles", "dep:ploy-trading"]

[dependencies]
data = { package = "hft-data", path = "../../../data-pipelines/core" }
rand.workspace = true
reqwest.workspace = true
chrono.workspace = true
polars = { workspace = true, optional = true }
ploy-market-contracts.workspace = true
ploy-market-data.workspace = true
ploy-feed-loaders = { workspace = true, optional = true }
ploy-strategy-bundles = { workspace = true, optional = true }
ploy-trading = { workspace = true, optional = true }
rust_decimal.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tracing.workspace = true
uuid.workspace = true
anyhow = "1"
fs2 = "0.4"
libc.workspace = true
burn = { version = "0.20.1", default-features = false, features = ["ndarray", "autodiff", "std"], optional = true }
burn-ndarray = { version = "0.20.1", optional = true }
burn-store = { version = "0.20.1", default-features = false, features = ["burnpack", "std"], optional = true }
ciborium = { version = "0.2", optional = true }
optimizer.workspace = true

[dev-dependencies]
ploy-operator-contracts.workspace = true
rust_decimal_macros.workspace = true
tempfile.workspace = true

[build-dependencies]
sha2.workspace = true

[[example]]
name = "event_dataset_baseline"
path = "examples/event_dataset_baseline.rs"
required-features = ["polars-export"]

[[example]]
name = "event_dataset_coverage"
path = "examples/event_dataset_coverage.rs"
required-features = ["polars-export"]

[[example]]
name = "event_dataset_rolling_windows"
path = "examples/event_dataset_rolling_windows.rs"
required-features = ["polars-export"]

[[example]]
name = "event_factor_attribution"
path = "examples/event_factor_attribution.rs"
required-features = ["polars-export"]

[[example]]
name = "event_ml_workflow"
path = "examples/event_ml_workflow.rs"
required-features = ["polars-export"]

[[example]]
name = "event_ml_architecture"
path = "examples/event_ml_architecture.rs"

[[example]]
name = "event_ml_walk_forward"
path = "examples/event_ml_walk_forward.rs"

[[example]]
name = "event_ml_rolling_workflow"
path = "examples/event_ml_rolling_workflow.rs"

[[example]]
name = "factor_review_v2"
path = "examples/factor_review_v2.rs"
required-features = ["db"]

[[example]]
name = "factor_evolve_daily_plan"
path = "examples/factor_evolve_daily_plan.rs"

[[example]]
name = "factor_portfolio_builder"
path = "examples/factor_portfolio_builder.rs"

[[bin]]
name = "monday-prediction-evaluator"
path = "src/bin/monday-prediction-evaluator.rs"
required-features = ["db"]

[[bin]]
name = "monday-prediction-research"
path = "src/bin/monday-prediction-research.rs"

[[bin]]
name = "monday-prediction-snapshot"
path = "src/bin/monday-prediction-snapshot.rs"
required-features = ["db"]

[[example]]
name = "persist_research_trace"
path = "examples/persist_research_trace.rs"
required-features = ["db"]

[[example]]
name = "research_trace_plan"
path = "examples/research_trace_plan.rs"
required-features = ["db"]

[[example]]
name = "research_snapshot_parity"
path = "examples/research_snapshot_parity.rs"

[[example]]
name = "three_layer_snapshot_optimize"
path = "examples/three_layer_snapshot_optimize.rs"
required-features = ["strategy-runtime"]
