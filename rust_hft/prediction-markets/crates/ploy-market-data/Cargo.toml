[package]
name = "ploy-market-data"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Market-data collection, discovery, and scanning infrastructure for Ploy"

[features]
default = []
audit = ["dep:sqlx"]
live = [
    "audit",
    "dep:adapter-binance-data",
    "dep:adapter-deribit-data",
    "dep:adapter-predict-fun-data",
    "dep:data",
    "dep:adapter-polymarket-data",
    "dep:crc32fast",
    "dep:futures",
    "dep:polymarket-client-sdk",
    "dep:reqwest",
    "dep:secrecy",
    "dep:tokio-tungstenite",
]

[dependencies]
adapter-binance-data = { package = "hft-data-adapter-binance", path = "../../../data-pipelines/adapters/adapter-binance", optional = true }
adapter-deribit-data = { package = "hft-data-adapter-deribit-reference", path = "../../../data-pipelines/adapters/adapter-deribit-reference", optional = true }
adapter-predict-fun-data = { package = "hft-data-adapter-predict-fun", path = "../../../data-pipelines/adapters/adapter-predict-fun", optional = true }
data = { package = "hft-data", path = "../../../data-pipelines/core", optional = true }
adapter-polymarket-data = { package = "hft-data-adapter-polymarket", path = "../../../data-pipelines/adapters/adapter-polymarket", optional = true }
anyhow = "1"
chrono.workspace = true
crc32fast = { version = "1", optional = true }
futures = { version = "0.3", optional = true }
libc.workspace = true
ploy-market-contracts.workspace = true
polymarket-client-sdk = { package = "polymarket_client_sdk_v2", version = "=0.6.0", features = ["clob", "data", "gamma", "rtds", "tracing", "ws", "heartbeats"], optional = true }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"], optional = true }
rust_decimal.workspace = true
rust_decimal_macros.workspace = true
secrecy = { version = "0.10", features = ["serde"], optional = true }
serde.workspace = true
serde_json = { workspace = true, features = ["arbitrary_precision"] }
sha2.workspace = true
sqlx = { workspace = true, features = ["runtime-tokio-rustls", "postgres", "chrono", "rust_decimal", "json"], optional = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-tungstenite = { version = "0.28.0", features = ["rustls-tls-native-roots"], optional = true }
tracing.workspace = true
thiserror.workspace = true

[dev-dependencies]
async-trait.workspace = true
chrono.workspace = true
rust_decimal_macros.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[[example]]
name = "market_data_gap_audit"
path = "examples/market_data_gap_audit.rs"
required-features = ["audit"]
