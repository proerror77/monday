[Service]
Environment=PLOY_QUOTE_COLLECTOR_PERSIST_WORKERS=1
Environment=PLOY_QUOTE_COLLECTOR_QUEUE_CAPACITY=2048
Environment=PLOY_QUOTE_COLLECTOR_BATCH_SIZE=100
Environment=PLOY_QUOTE_COLLECTOR_BATCH_WINDOW_MS=100
Environment=PLOY_QUOTE_COLLECTOR_REFRESH_SECS=5
Environment=PLOY_QUOTE_COLLECTOR_SNAPSHOT_SAMPLE_MS=0
Restart=always
RestartSec=5
MemoryHigh=512M
MemoryMax=768M
CPUQuota=60%
OOMPolicy=kill
