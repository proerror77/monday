[package]
name = "hft-cex-research-input"
workspace = "../../shared"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = []
streaming = ["dep:hft-research-manifest"]

[dependencies]
hft-research-manifest = { path = "../manifest", optional = true }
anyhow = "1"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
bincode = "1.3.3"

[dev-dependencies]
tempfile = "3"
