[package]
workspace = ".."
name = "hft-research-ml"
version = "0.1.0"
edition = "2021"
description = "Pure-Rust, point-in-time ML training for continuous contracts"

[dependencies]
anyhow = "1"
hft-cex-research-input = { path = "../cex-input", features = ["streaming"] }
hft-research-manifest = { path = "../manifest" }
burn.workspace = true
burn-ndarray.workspace = true
burn-store.workspace = true
clap.workspace = true
hex.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }
sha2.workspace = true
thiserror.workspace = true
rustix = { version = "0.38", features = ["fs"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "train-contract-model"
path = "src/bin/train_contract_model.rs"
