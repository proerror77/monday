[package]
name = "hft-research-platform"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
anyhow = "1"
hft-cex-research-input = { path = "../cex-input" }
ed25519-dalek = { version = "=2.2.0", optional = true }
tokio = { workspace = true, optional = true, features = ["rt-multi-thread", "macros", "time", "signal", "net", "process", "io-util", "io-std"] }
reqwest = { workspace = true, optional = true, features = ["rustls-tls", "json"] }
axum = { workspace = true, optional = true }
rustix = { version = "0.38", features = ["fs"], optional = true }
tokio-util = { version = "0.7", features = ["io"], optional = true }
futures-util = { version = "0.3", optional = true }
tempfile = { version = "3", optional = true }
# PG only: the umbrella crate resolves unused MySQL/RSA and SQLite drivers.
sqlx-core = { version = "=0.8.6", optional = true, default-features = false, features = ["_rt-tokio", "_tls-rustls-ring-webpki", "json"] }
sqlx-postgres = { version = "=0.8.6", optional = true, default-features = false, features = ["json"] }

[features]
default = []
release-verification = ["dep:ed25519-dalek"]
control = ["dep:tokio", "dep:reqwest", "dep:sqlx-core", "dep:sqlx-postgres", "dep:axum", "native-admission", "release-verification", "dep:rustix"]
native-admission = ["dep:ed25519-dalek"]
publisher = ["control", "dep:rustix", "dep:tokio-util", "dep:tempfile", "tokio/fs", "reqwest/stream"]
gateway = ["control", "dep:rustix", "dep:tokio-util", "dep:futures-util", "tokio/fs", "reqwest/stream"]

[[bin]]
name = "research-orchestrator"
path = "src/bin/research-orchestrator.rs"
required-features = ["control"]

[[bin]]
name = "researchctl"
path = "src/bin/researchctl.rs"
required-features = ["control"]

[[bin]]
name = "research-prepare"
path = "src/bin/research-prepare.rs"
required-features = ["control"]

[[bin]]
name = "research-session"
path = "src/bin/research-session.rs"
required-features = ["control"]

[[bin]]
name = "research-artifact-gateway"
path = "src/bin/research-artifact-gateway.rs"
required-features = ["gateway"]

[[bin]]
name = "research-release-publisher"
path = "src/bin/research-release-publisher.rs"
required-features = ["publisher"]

[dev-dependencies]
tempfile = "3"

[workspace]
resolver = "2"
members = ["."]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive", "rc"] }
sha2 = "0.10"
tokio = { version = "1.0", default-features = false }
reqwest = { version = "0.12", default-features = false }
axum = "0.7"
serde_json = "1.0"

[profile.dev]
# 開發模式：編譯快優先
opt-level = 0
debug = true
incremental = true
lto = false

[profile.release]
# 發布模式：執行快優先，並保持可分發產物精簡
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
split-debuginfo = "packed"

# Admitted research builds trade cross-crate LTO for shorter edit/build loops.
# Profile bytes are part of BuildSpec; production release behavior stays separate.
[profile.research]
inherits = "release"
opt-level = 2
lto = false
codegen-units = 16

[profile.bench]
# 基準測試：最高優化
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
