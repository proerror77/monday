[package]
name = "hft-research-platform"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
bincode = "1.3.3"
anyhow = "1"
tokio = { workspace = true, optional = true, features = ["rt-multi-thread", "macros", "time", "signal", "net"] }
reqwest = { workspace = true, optional = true, features = ["rustls-tls", "json"] }
axum = { workspace = true, optional = true }
# PG only: the umbrella crate resolves unused MySQL/RSA and SQLite drivers.
sqlx-core = { version = "=0.8.6", optional = true, default-features = false, features = ["_rt-tokio", "_tls-rustls-ring-webpki", "json"] }
sqlx-postgres = { version = "=0.8.6", optional = true, default-features = false, features = ["json"] }

[features]
default = []
control = ["dep:tokio", "dep:reqwest", "dep:sqlx-core", "dep:sqlx-postgres", "dep:axum"]

[[bin]]
name = "research-orchestrator"
path = "src/bin/research-orchestrator.rs"
required-features = ["control"]

[[bin]]
name = "researchctl"
path = "src/bin/researchctl.rs"
required-features = ["control"]

[[bin]]
name = "research-prepare"
path = "src/bin/research-prepare.rs"
required-features = ["control"]

[dev-dependencies]
tempfile = "3"
