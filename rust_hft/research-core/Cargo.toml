# research workspace; source paths and runtime behavior are preserved.
[workspace]
resolver = "2"
members = ["ml", "search-kernel", "../alpha-harness/domain", "../alpha-harness/store", "../alpha-harness/engine", "../alpha-harness/onnx-evaluator", "../alpha-harness/app", "../alpha-harness/worker", "../alpha-harness/search-driver", "../apps/backtest", "../tools/harnessctl"]
default-members = ["search-kernel"]
exclude = ["artifacts", "dispatch-io", "factor-dsl", "manifest", "prepared-market-io", "platform", "cex-input"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive", "rc"] }
thiserror = "2.0"
sha2 = "0.10"
ed25519-dalek = "2"
hex = "0.4"
tokio = { version = "1.0", default-features = false }
reqwest = { version = "0.12", default-features = false }
axum = "0.7"
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1.33", features = ["serde"] }
clap = { version = "4.0", features = ["derive"] }
burn = { version = "0.20.1", default-features = false, features = ["ndarray", "autodiff", "std"] }
burn-ndarray = "0.20.1"
burn-store = { version = "0.20.1", default-features = false, features = ["std", "burnpack"] }

[profile.dev]
# 開發模式：編譯快優先
opt-level = 0
debug = true
incremental = true
lto = false

[profile.release]
# 發布模式：執行快優先，並保持可分發產物精簡
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
split-debuginfo = "packed"

# Admitted research builds trade cross-crate LTO for shorter edit/build loops.
# Profile bytes are part of BuildSpec; production release behavior stays separate.
[profile.research]
inherits = "release"
opt-level = 2
lto = false
codegen-units = 16

[profile.bench]
# 基準測試：最高優化
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false

[patch.crates-io]
rust_decimal = { git = "https://github.com/proerror77/monday-rust-decimal-security-694", rev = "4f7bc6f02d7920b6416988914ae86d25f6670b22" }
