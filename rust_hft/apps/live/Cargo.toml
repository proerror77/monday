[package]
workspace = "../../runtime"
name = "hft-live"
version = "0.1.0"
edition = "2021"
description = "Deterministic Rust trading runtime with signed Paper and Shadow activation"

[dependencies]
# 核心依賴
governance = { package = "hft-governance-contracts", path = "../../governance-contracts" }
hft_core = { package = "hft-core", path = "../../market-core/core" }
ports = { package = "hft-ports", path = "../../market-core/ports" }
runtime = { package = "hft-runtime", path = "../../market-core/runtime" }
engine = { package = "hft-engine", path = "../../market-core/engine" }
snapshot = { package = "hft-snapshot", path = "../../market-core/snapshot" }
data = { package = "hft-data", path = "../../data-pipelines/core" }
rust_decimal = { version = "1.33", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
ed25519-dalek = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
fs4 = { workspace = true }

# 注意：所有可選依賴現在通過 runtime 轉發，移除直接依賴

# 運行時依賴 (真盤重特性全開)
tokio = { workspace = true, features = ["full", "tracing"] }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4.0", features = ["derive"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
thiserror = { workspace = true }
prometheus = { workspace = true, optional = true }
infra-metrics = { package = "hft-infra-metrics", path = "../../infra-services/core/metrics", features = ["http-server"], optional = true }
risk = { package = "hft-risk", path = "../../risk-control/risk" }
hft-grpc-server = { path = "../../infra-services/core/grpc-server", optional = true }
anyhow = "1"

[features]
default = ["bitget", "formula-strategy", "metrics", "simd"]

# Market data and execution are independently selectable. Composite venue
# features include both; selecting execution never grants live authority.
bitget-data = ["runtime/adapter-bitget-data"]
bitget-execution = ["runtime/adapter-bitget-execution"]
bitget = ["bitget-data", "bitget-execution"]
binance-data = ["runtime/adapter-binance-data"]
binance-execution = ["runtime/adapter-binance-execution"]
binance = ["binance-data", "binance-execution"]
binance-prediction-data = ["runtime/adapter-binance-prediction-data"]
binance-prediction-execution = ["runtime/adapter-binance-prediction-execution"]
binance-prediction = ["binance-prediction-data", "binance-prediction-execution"]
bybit-data = ["runtime/adapter-bybit-data"]
bybit-execution = ["runtime/adapter-bybit-execution"]
bybit = ["bybit-data", "bybit-execution"]
okx = ["runtime/okx"]
ondo-perps-data = ["runtime/adapter-ondo-perps-data"]
ondo-perps-execution = ["runtime/adapter-ondo-perps-execution"]
ondo-perps = ["ondo-perps-data", "ondo-perps-execution"]
polymarket-data = ["runtime/adapter-polymarket-data"]
polymarket-execution = ["runtime/adapter-polymarket-execution"]
polymarket = ["polymarket-data", "polymarket-execution", "ipc"]
asterdex-data = ["runtime/adapter-asterdex-data"]
asterdex-execution = ["runtime/adapter-asterdex-execution"]
asterdex = ["asterdex-data", "asterdex-execution"]
mock = ["runtime/mock"]
all-exchanges = ["bitget", "binance", "binance-prediction", "bybit", "okx", "ondo-perps", "polymarket", "asterdex"]

# 策略 (轉發到 runtime)
trend-strategy = ["runtime/strategy-trend"]
arbitrage-strategy = ["runtime/strategy-arbitrage"]
imbalance-strategy = ["runtime/strategy-imbalance"]
formula-strategy = ["runtime/strategy-formula"]
probability-reversal-strategy = ["runtime/strategy-probability-reversal"]
dl-strategy = ["runtime/strategy-dl"]
lob-flow-grid-strategy = ["runtime/strategy-lob-flow-grid"]
all-strategies = [
  "trend-strategy",
  "arbitrage-strategy",
  "imbalance-strategy",
  "formula-strategy",
  "probability-reversal-strategy",
  "dl-strategy",
  "lob-flow-grid-strategy"
]

# 基礎設施 (轉發到 runtime)
clickhouse = ["runtime/clickhouse"]
redis = ["runtime/redis"]
metrics = [
  "runtime/metrics",
  "dep:prometheus",
  "dep:infra-metrics",
  "infra-metrics/http-server"
]
grpc = ["dep:hft-grpc-server"]
ipc = ["runtime/infra-ipc"]
full-infra = ["clickhouse", "redis", "metrics", "grpc", "ipc"]

# SIMD 優化 (生產環境應默認啟用)
simd = ["runtime/json-simd"]

# 完整特性集
full = ["all-exchanges", "all-strategies", "full-infra", "simd", "mock"]

[lib]
name = "hft_live"
path = "src/lib.rs"

[dev-dependencies]
alpha-domain = { path = "../../alpha-harness/domain" }
hft-research-manifest = { path = "../../research-core/manifest" }
tempfile = "3"
