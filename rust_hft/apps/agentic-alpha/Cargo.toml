[package]
name = "hft-agentic-alpha"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
chrono = { workspace = true, features = ["serde"] }
clap = { workspace = true, features = ["derive"] }
hft-artifact-store = { path = "../../infra-services/core/artifact-store" }
hft-experiment-store = { path = "../../infra-services/core/experiment-store" }
hft-factor-bank = { path = "../../research-core/factor-bank" }
hft-factor-dsl = { path = "../../research-core/factor-dsl" }
hft-factor-eval = { path = "../../research-core/factor-eval" }
hft-factor-store = { path = "../../infra-services/core/factor-store" }
hft-promotion-gate = { path = "../../research-core/promotion-gate" }
hft-prototype-adapter = { path = "../../research-core/prototype-adapter" }
hft-research-manifest = { path = "../../research-core/manifest" }
hft-search-protocol = { path = "../../research-core/search-protocol" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[[bin]]
name = "hft-agentic-alpha"
path = "src/main.rs"
