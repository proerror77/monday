[package]
name = "hft-agentic-alpha"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
execution_adapter_binance = { package = "hft-execution-adapter-binance", path = "../../execution-gateway/adapters/adapter-binance" }
chrono = { workspace = true, features = ["serde"] }
clap = { workspace = true, features = ["derive"] }
hft-core = { package = "hft-core", path = "../../market-core/core" }
hft-allocator-policy = { path = "../../research-core/allocator-policy" }
hft-artifact-store = { path = "../../infra-services/core/artifact-store" }
hft-audit-trail = { path = "../../research-core/audit-trail" }
hft-experiment-store = { path = "../../infra-services/core/experiment-store" }
hft-factor-bank = { path = "../../research-core/factor-bank" }
hft-factor-dsl = { path = "../../research-core/factor-dsl" }
hft-factor-eval = { path = "../../research-core/factor-eval" }
hft-factor-store = { path = "../../infra-services/core/factor-store" }
hft-live-small-supervisor = { path = "../../research-core/live-small-supervisor" }
hft-loop-engine = { path = "../../research-core/loop-engine" }
hft-promotion-gate = { path = "../../research-core/promotion-gate" }
hft-prototype-adapter = { path = "../../research-core/prototype-adapter" }
hft-research-manifest = { path = "../../research-core/manifest" }
hft-research-memory = { path = "../../research-core/research-memory" }
hft-search-protocol = { path = "../../research-core/search-protocol" }
integration = { package = "hft-integration", path = "../../market-core/integration" }
ports = { package = "hft-ports", path = "../../market-core/ports" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "time"] }

[[bin]]
name = "hft-agentic-alpha"
path = "src/main.rs"
