[package]
name = "polymarket-tape-contract"
version = "0.1.0"
edition = "2021"
publish = false
description = "Versioned incremental validation contract for Monday Polymarket tapes"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
