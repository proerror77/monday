[package]
name = "alpha-harness"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
alpha-domain = { path = "../domain" }
alpha-engine = { path = "../engine" }
alpha-store = { path = "../store" }
anyhow = "1"
chrono = { workspace = true, features = ["serde"] }
clap = { workspace = true }
ed25519-dalek = { workspace = true }
hex = { workspace = true }
hft-collector = { path = "../../tools/collector", features = ["collector-binance"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }

[[bin]]
name = "alpha-harness"
path = "src/main.rs"
