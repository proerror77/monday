[package]
name = "alpha-harness"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
alpha-domain = { path = "../domain" }
alpha-engine = { path = "../engine" }
alpha-onnx-evaluator = { path = "../onnx-evaluator" }
alpha-store = { path = "../store" }
anyhow = "1"
chrono = { workspace = true, features = ["serde"] }
clap = { workspace = true }
ed25519-dalek = { workspace = true }
governance = { package = "hft-governance-contracts", path = "../../governance-contracts" }
hex = { workspace = true }
hft-collector = { path = "../../tools/collector", features = ["collector-binance"] }
hft-factor-dsl = { path = "../../research-core/factor-dsl" }
hft-backtest = { path = "../../apps/backtest" }
hft-research-manifest = { path = "../../research-core/manifest" }
reqwest = { workspace = true, features = ["blocking", "rustls-tls"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt", "sync"] }
zip = { version = "6", default-features = false, features = ["deflate"] }

[[bin]]
name = "alpha-harness"
path = "src/main.rs"

[dev-dependencies]
parquet = { version = "59.1", default-features = false, features = ["zstd"] }
