[package]
workspace = "../../research-core"
name = "alpha-harness"
version = "0.1.0"
edition = "2021"
publish = false

[features]
offline-diagnostic = ["alpha-engine/offline-diagnostic"]
default = ["operator"]
operator = ["hft-cex-research-input/preparation-cli", "alpha-engine/llm", "dep:hft-research-dispatch-io", "dep:hft-research-platform"]
scientific = ["alpha-engine/fitting", "dep:hft-cex-search-driver", "offline-diagnostic"]
onnx-compatibility = ["operator", "dep:alpha-onnx-evaluator"]

[dependencies]
hft-cex-search-driver = { path = "../search-driver", optional = true }
hft-research-platform = { path = "../../research-core/platform", optional = true, default-features = false, features = ["native-admission", "release-verification"] }
hft-research-worker-contracts = { path = "../../research-core/worker-contracts" }
hft-research-worker-io = { path = "../../research-core/worker-io" }
hft-cex-research-input = { path = "../../research-core/cex-input", features = ["feature-jsonl", "streaming", "market-parquet"] }
hft-research-artifacts = { path = "../../research-core/artifacts" }
hft-research-dispatch-io = { path = "../../research-core/dispatch-io", optional = true }
alpha-domain = { path = "../domain" }
alpha-engine = { path = "../engine", default-features = false, features = ["kernel"] }
alpha-onnx-evaluator = { path = "../onnx-evaluator", optional = true }
alpha-store = { path = "../store" }
anyhow = "1"
base64 = "0.22"
rustix = { version = "0.38", features = ["fs"] }
chrono = { workspace = true, features = ["serde"] }
clap = { workspace = true }
ed25519-dalek = { workspace = true }
governance = { package = "hft-governance-contracts", path = "../../governance-contracts" }
hex = { workspace = true }
hft-data = { path = "../../data-pipelines/core" }
hft-factor-dsl = { path = "../../research-core/factor-dsl" }
hft-backtest = { path = "../../apps/backtest" }
hft-research-manifest = { path = "../../research-core/manifest" }
reqwest = { workspace = true, features = ["blocking", "rustls-tls"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt", "sync"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[[bin]]
name = "alpha-harness"
path = "src/main.rs"
required-features = ["operator"]

[[bin]]
name = "monday-offline-baseline"
path = "src/bin/offline_baseline.rs"
required-features = ["offline-diagnostic"]

[[test]]
name = "offline_baseline"
path = "tests/offline_baseline.rs"
required-features = ["offline-diagnostic"]

[dev-dependencies]
hft-research-platform = { path = "../../research-core/platform", default-features = false, features = ["native-admission", "release-verification"] }
hft-research-dispatch-io = { path = "../../research-core/dispatch-io" }
hft-prepared-market-io = { path = "../../research-core/prepared-market-io" }
parquet = { version = "59.1", default-features = false, features = ["zstd"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
