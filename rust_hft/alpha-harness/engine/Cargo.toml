[package]
name = "alpha-engine"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = ["kernel"]
kernel = ["dep:alpha-store"]

[dependencies]
alpha-domain = { path = "../domain" }
alpha-store = { path = "../store", optional = true }
chrono = { workspace = true, features = ["serde"] }
hex = { workspace = true }
hft-factor-dsl = { path = "../../research-core/factor-dsl" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
hft-research-manifest = { path = "../../research-core/manifest" }
