[package]
name = "alpha-store"
version = "0.1.0"
edition = "2021"
publish = false

[features]
test-support = []

[dependencies]
alpha-domain = { path = "../domain" }
chrono = { workspace = true, features = ["serde"] }
duckdb = { version = "1.10504.0", features = ["bundled"] }
getrandom = "0.3"
hex = { workspace = true }
hmac = "0.12"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
ed25519-dalek = { workspace = true }
hft-research-manifest = { path = "../../research-core/manifest" }
hft-factor-dsl = { path = "../../research-core/factor-dsl" }
