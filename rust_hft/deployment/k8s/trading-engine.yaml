# HFT Trading Engine Deployment
# 核心交易引擎 - 需要低延遲和高可用

apiVersion: apps/v1
kind: Deployment
metadata:
  name: trading-engine
  namespace: hft-trading
  labels:
    app: trading-engine
    tier: critical
spec:
  replicas: 1  # 單實例運行，避免狀態衝突
  strategy:
    type: Recreate  # 確保只有一個實例運行
  selector:
    matchLabels:
      app: trading-engine
  template:
    metadata:
      labels:
        app: trading-engine
        tier: critical
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      # 優先級最高
      priorityClassName: system-node-critical

      # 節點選擇 - 使用低延遲節點
      nodeSelector:
        node-type: low-latency
        # kubernetes.io/arch: amd64

      # 容忍污點
      tolerations:
      - key: "dedicated"
        operator: "Equal"
        value: "trading"
        effect: "NoSchedule"

      # 親和性 - 避免與其他 Pod 共存
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - trading-engine
            topologyKey: "kubernetes.io/hostname"

      # 服務帳戶
      serviceAccountName: hft-trading

      # 安全上下文
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000

      containers:
      - name: trading-engine
        image: ${ECR_REGISTRY}/hft-trading:${IMAGE_TAG}
        imagePullPolicy: Always

        args:
        - --config
        - /app/config/system.yaml
        - --deployment-envelope
        - /app/deployment/envelope.json
        - --deployment-policy
        - /app/deployment/policy.json
        - --deployment-trusted-keys
        - /app/deployment/trusted-keys.json
        - --deployment-nonce-ledger
        - /app/state/nonces.jsonl
        - --deployment-audit-log
        - /app/state/audit.jsonl
        - --deployment-feedback-log
        - /app/state/feedback.jsonl
        - --metrics-port
        - "9090"

        ports:
        - name: http
          containerPort: 9090
        - name: grpc
          containerPort: 9092

        # 環境變數
        env:
        - name: RUST_LOG
          value: "info"
        - name: HFT_ENV
          value: "production"
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: hft-secrets
              key: redis-url
        - name: CLICKHOUSE_URL
          valueFrom:
            secretKeyRef:
              name: hft-secrets
              key: clickhouse-url
        # 資源限制
        resources:
          requests:
            cpu: "2"
            memory: 4Gi
          limits:
            cpu: "4"
            memory: 8Gi

        # 卷掛載
        volumeMounts:
        - name: config
          mountPath: /app/config
          readOnly: true
        - name: models
          mountPath: /app/models
          readOnly: true
        - name: logs
          mountPath: /app/logs
        - name: deployment-authority
          mountPath: /app/deployment
          readOnly: true
        - name: runtime-state
          mountPath: /app/state

        # 健康檢查
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /readiness
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3

        # 啟動探針 (給予更多啟動時間)
        startupProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 30  # 最多 150 秒啟動時間

      volumes:
      - name: config
        configMap:
          name: trading-config
      - name: models
        persistentVolumeClaim:
          claimName: models-pvc
      - name: logs
        emptyDir:
          sizeLimit: 1Gi
      - name: deployment-authority
        projected:
          sources:
          - configMap:
              name: alpha-deployment-envelope
              items:
              - key: envelope.json
                path: envelope.json
          - configMap:
              name: runtime-deployment-authority
              items:
              - key: policy.json
                path: policy.json
              - key: trusted-keys.json
                path: trusted-keys.json
      - name: runtime-state
        persistentVolumeClaim:
          claimName: runtime-state-pvc

      # 優雅關閉
      terminationGracePeriodSeconds: 60

---
# Service
apiVersion: v1
kind: Service
metadata:
  name: trading-engine
  namespace: hft-trading
  labels:
    app: trading-engine
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 9090
    targetPort: http
  - name: grpc
    port: 9092
    targetPort: grpc
  selector:
    app: trading-engine

---
# PodDisruptionBudget - 確保始終有實例運行
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: trading-engine-pdb
  namespace: hft-trading
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: trading-engine

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: runtime-state-pvc
  namespace: hft-trading
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
