apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: research-devpod-warm
  namespace: monday-research-dev
  labels:
    app: research-devpod-warm
    role: development
    strategy: warm-pool
spec:
  serviceName: research-devpod-warm
  replicas: 1
  selector:
    matchLabels:
      app: research-devpod-warm
  template:
    metadata:
      labels:
        app: research-devpod-warm
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
        workload: backtest
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
      containers:
        - name: devpod
          image: rust:1.98.1-bookworm
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -c
            - |
              set -e

              echo "🚀 Research DevPod (Warm Pool Strategy)"
              echo "========================================"
              echo ""

              # 检查 Rust 环境
              if command -v rustc &> /dev/null; then
                echo "✓ Rust: $(rustc --version)"
                echo "✓ Cargo: $(cargo --version)"
              else
                echo "⚠️  Rust not found in this image"
              fi

              # 检查或创建 workspace
              if [ ! -d /workspace/.git ]; then
                echo ""
                echo "📦 First-time setup: Cloning repository..."
                cd /workspace
                git clone https://github.com/proerror77/monday.git .
                echo "✓ Repository cloned"
              else
                echo "✓ Workspace exists: /workspace"
              fi

              cd /workspace
              echo ""
              echo "📂 Current branch: $(git branch --show-current)"
              echo "📝 Latest commit: $(git log -1 --oneline)"
              echo ""
              echo "🔧 Cargo cache: /cargo-cache"
              echo "No production lake mounts."
              echo ""
              echo "════════════════════════════════════════"
              echo "✅ DevPod Ready - Startup time: < 1 min"
              echo "════════════════════════════════════════"
              echo ""
              echo "Common workflows:"
              echo ""
              echo "  # Switch branches (10 seconds):"
              echo "  cd /workspace"
              echo "  git fetch && git checkout <branch> && git pull"
              echo ""
              echo "  # Incremental compile (< 1 minute):"
              echo "  cargo build -p hft-collector --release"
              echo ""
              echo "  # Run CLI:"
              echo "  ./target/release/segment-index-cli --help"
              echo ""
              echo ""
              echo "Pod staying alive..."

              # Keep running
              tail -f /dev/null
          env:
            - name: RUST_LOG
              value: "info"
            - name: CARGO_HOME
              value: "/cargo-cache"
            - name: RUST_BACKTRACE
              value: "1"
            # Git 配置
            - name: GIT_AUTHOR_NAME
              value: "Monday Research"
            - name: GIT_AUTHOR_EMAIL
              value: "research@monday.local"
          resources:
            requests:
              cpu: "1"      # 降低请求，warm pool 不需要大量资源
              memory: 2Gi
            limits:
              cpu: "4"      # 编译时可以突发
              memory: 8Gi
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: cargo-cache
              mountPath: /cargo-cache

      volumes:
        - name: workspace
          emptyDir:
            sizeLimit: 12Gi
        - name: cargo-cache
          emptyDir:
            sizeLimit: 8Gi

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: research-devpod-warm-pool-guide
  namespace: monday-research-dev
data:
  README.md: |
    # Research DevPod - Warm Pool Strategy

    ## 🎯 Design Philosophy

    **Keep one relaxed DevPod ready** in `monday-research-dev`.

    - Pods are ALWAYS running
    - Code is pre-cloned
    - Caches are pre-warmed
    - Switching code: < 10 seconds (git pull)
    - Incremental compile: < 1 minute

    ## ⚡ Performance

    | Metric | Cold Start | Warm Pool |
    |--------|-----------|-----------|
    | First deploy | 9-15 min | 2-3 min |
    | Restart | 1-2 min | **10-30 sec** |
    | Code switch | N/A | **< 10 sec** |
    | Incremental build | N/A | **< 1 min** |

    ## 🚀 Quick Start

    ```bash
    # Deploy
    kubectl apply -f dev-namespace.yaml
    kubectl apply -f research-devpod-warm-pool.yaml

    # Connect (wait ~2 min for first startup)
    kubectl exec -it research-devpod-warm-0 -n monday-research-dev -- bash

    # Inside Pod - switch branches
    cd /workspace
    git fetch && git checkout feat/my-branch && git pull

    # Compile (incremental, < 1 min)
    cargo build -p hft-collector --release

    # Run
    ./target/release/segment-index-cli info
    ```

    ## 📊 Cost Analysis

    **Monthly cost for 1 warm Pod (always-on):**
    - CPU: 1 core request, 4 core limit
    - Memory: 2Gi request, 8Gi limit
    - Spot instance: ~¥0.342/hour × 730 hours = ~¥250/month
    - Storage (40Gi ESSD): ~¥40/month

    **Total: ~¥290/month for instant-access development environment**

    Compare to:
    - On-demand restarts: ¥0 when not running, but 9-15 min startup each time
    - Developer time saved: >>> ¥290/month

    ## 🔄 Scaling

    ```bash
    # 保持 1 个副本。backtest 节点上还有 Campaign operator。
    kubectl scale statefulset research-devpod-warm --replicas=1 -n monday-research-dev

    kubectl exec -it research-devpod-warm-0 -n monday-research-dev -- bash
    ```

    ## 🎨 Why This is Fast

    1. **Cached Image**: campaign-cycle-controller already on nodes (4-10s vs 3-5 min)
    2. **Pre-cloned Code**: No git clone delay
    3. **Persistent PVC**: Workspace and cargo cache survive restarts
    4. **Always Running**: No cold start penalty
    5. **Incremental Builds**: Cargo cache makes rebuilds < 1 min

    ## 🔧 Maintenance

    ```bash
    # Update to latest code
    kubectl exec research-devpod-warm-0 -n monday-research-dev -- bash -c \
      "cd /workspace && git fetch && git pull"

    # Clean build cache
    kubectl exec research-devpod-warm-0 -n monday-research-dev -- bash -c \
      "cd /workspace && cargo clean"

    # Restart Pod
    kubectl delete pod research-devpod-warm-0 -n monday-research-dev
    # StatefulSet will recreate it in 10-30 seconds
    ```

    ## 🆚 Comparison to Other Strategies

    | Strategy | Startup | Cost | Best For |
    |----------|---------|------|----------|
    | **Warm Pool** | **10-30s** | Medium | **Active development** |
    | Optimized StatefulSet | 2-3 min | Low | Occasional use |
    | Ephemeral Jobs | 2-3 min | Very Low | CI/CD |
    | DaemonSet | Instant | High | Multi-node dev |

    **Recommendation**: Warm Pool for daily development work.
