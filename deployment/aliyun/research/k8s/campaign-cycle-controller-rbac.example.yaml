# Namespace-scoped readback authority for one approved Campaign generation.
# Replace all resourceNames for every approved generation. Kubernetes RBAC
# cannot restrict a Pod list to one label; native settlement requires that list
# to verify the unique Job-owned Pod. No Secret or Job mutation is granted.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: monday-campaign-cycle-controller
  namespace: monday-research
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: monday-campaign-cycle-controller-readback
  namespace: monday-research
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    resourceNames: ["REPLACE_CAMPAIGN_JOB_NAME"]
    verbs: ["get", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    resourceNames: ["REPLACE_CAMPAIGN_POD_NAME"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: monday-campaign-cycle-controller-readback
  namespace: monday-research
subjects:
  - kind: ServiceAccount
    name: monday-campaign-cycle-controller
    namespace: monday-research
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: monday-campaign-cycle-controller-readback
