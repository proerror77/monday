# Native coordinator for one frozen workflow. Render exact identities and a
# deadline bounded by its control before applying. This template grants no RBAC.
apiVersion: batch/v1
kind: Job
metadata:
  name: REPLACE_WORKFLOW_JOB_NAME
  namespace: monday-research
  labels:
    app.kubernetes.io/name: monday-campaign-workflow
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1 # Replace with the remaining original deadline.
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: monday-campaign-workflow
    spec:
      restartPolicy: Never
      serviceAccountName: REPLACE_APPROVED_WORKFLOW_SERVICE_ACCOUNT
      automountServiceAccountToken: true
      imagePullSecrets:
        - name: monday-acr
      nodeSelector:
        kubernetes.io/arch: amd64
        workload: backtest
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: coordinator
          image: crpi-ygobwehhof7qs9m3-vpc.ap-northeast-1.personal.cr.aliyuncs.com/wildcard0923/campaign-cycle-controller@sha256:REPLACE_WITH_IMMUTABLE_DIGEST
          imagePullPolicy: IfNotPresent
          command: [/usr/bin/tini, --, /usr/local/bin/alpha-harness]
          args:
            - mission
            - campaign-workflow
            - --plan
            - /campaign-root/plans/REPLACE_WORKFLOW_PLAN.json
            - --ledger
            - /authority/ledger.duckdb
            - --work-dir
            - /campaign-root/workflows/REPLACE_WORKFLOW_ID
          env:
            - name: KUBECONFIG
              value: /authority/kubeconfig
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {cpu: "2", memory: 4Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: campaign-root, mountPath: /campaign-root}
            - {name: authority, mountPath: /authority}
            - {name: platform, mountPath: /platform, readOnly: true}
            - {name: trusted-keys, mountPath: /trusted-keys, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: campaign-root
          persistentVolumeClaim: {claimName: REPLACE_CAMPAIGN_ROOT_PVC}
        - name: authority
          persistentVolumeClaim: {claimName: REPLACE_AUTHORITY_PVC}
        - name: platform
          secret:
            secretName: REPLACE_AUDITED_SIGNER_ADAPTER
            defaultMode: 0550
        - name: trusted-keys
          configMap: {name: REPLACE_TRUSTED_KEYS_CONFIGMAP}
        - name: tmp
          emptyDir: {}
