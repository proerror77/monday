# Rendered handoff target for `campaign-cycle-controller.sh start|approve`.
# Replace every REPLACE_* value, review it, and apply it only as a separate
# operator action. This Job never executes Campaign orders or changes runtime
# risk. Its image must contain bash, jq, kubectl, aliyun/ossutil, alpha-harness,
# and campaign-cycle-controller.sh at the path below.
apiVersion: batch/v1
kind: Job
metadata:
  name: REPLACE_CONTROLLER_JOB_NAME
  namespace: monday-research
  annotations:
    research.monday/campaign-id: REPLACE_CAMPAIGN_ID
    research.monday/request-sha256: REPLACE_REQUEST_SHA256
    research.monday/lane: cex_campaign_cycle_readback
  labels:
    app.kubernetes.io/name: monday-campaign-cycle-controller
    app.kubernetes.io/part-of: monday
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 28800
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      annotations:
        research.monday/campaign-id: REPLACE_CAMPAIGN_ID
        research.monday/request-sha256: REPLACE_REQUEST_SHA256
        research.monday/lane: cex_campaign_cycle_readback
      labels:
        app.kubernetes.io/name: monday-campaign-cycle-controller
        app.kubernetes.io/part-of: monday
    spec:
      restartPolicy: Never
      serviceAccountName: monday-campaign-cycle-controller
      automountServiceAccountToken: true
      imagePullSecrets:
        - name: monday-acr
      nodeSelector:
        kubernetes.io/arch: amd64
        workload: backtest
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: campaign-cycle-controller
          image: crpi-ygobwehhof7qs9m3-vpc.ap-northeast-1.personal.cr.aliyuncs.com/wildcard0923/campaign-cycle-controller@sha256:REPLACE_WITH_IMMUTABLE_DIGEST
          imagePullPolicy: IfNotPresent
          env:
            - name: MONDAY_CAMPAIGN_CONTROL
              value: /authority/control.json
            - name: KUBECONFIG
              value: /tmp/monday-campaign-kubeconfig.json
          args:
            - ack-readback
            - --work-dir
            - /campaign-root/cycles/REPLACE_CYCLE_ID
            # Replace after the approved Campaign Job creates its Pod. The
            # controller SA is bound to this exact Pod name.
            - --campaign-pod-name
            - REPLACE_CAMPAIGN_POD_NAME
            - --alpha-harness
            - /usr/local/bin/alpha-harness
            - --aliyun
            - aliyun
            - --kubectl
            - kubectl
          resources:
            requests:
              cpu: "500m"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            # The approved controller checkpoint and all learn artifacts stay
            # on the campaign-root-backed volume, never laptop /tmp.
            - name: campaign-root
              mountPath: /campaign-root
            - name: tmp
              mountPath: /tmp
            - name: authority
              mountPath: /authority
              readOnly: true
            - name: trusted-keys
              mountPath: /trusted-keys
              readOnly: true
      initContainers:
        - name: prepare-controller
          image: crpi-ygobwehhof7qs9m3-vpc.ap-northeast-1.personal.cr.aliyuncs.com/wildcard0923/campaign-cycle-controller@sha256:REPLACE_WITH_IMMUTABLE_DIGEST
          command:
            - /usr/local/bin/alpha-harness
            - mission
            - dispatch
            - prepare-controller
            - --control
            - /authority/control.json
            - --context
            - REPLACE_KUBE_CONTEXT
            - --namespace
            - monday-research
            - --kubeconfig-out
            - /tmp/monday-campaign-kubeconfig.json
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: campaign-root, mountPath: /campaign-root}
            - {name: authority, mountPath: /authority, readOnly: true}
            - {name: trusted-keys, mountPath: /trusted-keys, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: campaign-root
          persistentVolumeClaim:
            claimName: REPLACE_CAMPAIGN_ROOT_PVC
        - name: tmp
          emptyDir: {}
        - name: authority
          secret:
            secretName: REPLACE_CONTROLLER_AUTHORITY_SECRET
            defaultMode: 0440
        - name: trusted-keys
          configMap:
            name: REPLACE_TRUSTED_KEYS_CONFIGMAP
