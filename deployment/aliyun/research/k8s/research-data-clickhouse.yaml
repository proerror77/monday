# Deploy through the issue-1256 controller after recording its resource window.
# Retain data PVCs on scale-to-zero and StatefulSet deletion. No automatic TTL:
# immutable views may be referenced by an in-flight Campaign.
apiVersion: v1
kind: Service
metadata:
  name: monday-clickhouse
  namespace: monday-research
  labels:
    app.kubernetes.io/name: monday-clickhouse
    app.kubernetes.io/part-of: monday
    research.monday/contract: research-data-platform-1256
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: monday-clickhouse
  ports:
    - {name: http, port: 8123, targetPort: http}
    - {name: native, port: 9000, targetPort: native}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: monday-clickhouse
  namespace: monday-research
  labels:
    app.kubernetes.io/name: monday-clickhouse
    app.kubernetes.io/part-of: monday
    research.monday/contract: research-data-platform-1256
spec:
  serviceName: monday-clickhouse
  replicas: 0 # The controller starts one replica within the recorded budget.
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: monday-clickhouse
  template:
    metadata:
      labels:
        app.kubernetes.io/name: monday-clickhouse
        app.kubernetes.io/part-of: monday
        research.monday/contract: research-data-platform-1256
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 120
      nodeSelector:
        kubernetes.io/arch: amd64
        # Separate pool/lifetime from disposable scientific Study workers.
        workload: research-data
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: clickhouse
          # ClickHouse 26.3.36.6 LTS, linux/amd64 manifest, verified 2026-09-30.
          image: clickhouse/clickhouse-server@sha256:6e9c8937d38b3474107a0f1883eaf93a83151abdeb4e7cddf9639748f09a04be
          imagePullPolicy: IfNotPresent
          command: [clickhouse-server]
          args: ["--config-file=/etc/clickhouse-server/config.xml"]
          ports:
            - {name: http, containerPort: 8123}
            - {name: native, containerPort: 9000}
          env:
            - name: MONDAY_CLICKHOUSE_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: {name: monday-clickhouse-admin, key: password}
            - name: MONDAY_CLICKHOUSE_WRITER_PASSWORD
              valueFrom:
                secretKeyRef: {name: monday-clickhouse-writer, key: password}
            - name: MONDAY_CLICKHOUSE_READER_PASSWORD
              valueFrom:
                secretKeyRef: {name: monday-clickhouse-reader, key: password}
            - name: MONDAY_CLICKHOUSE_TASK_PASSWORD
              valueFrom:
                secretKeyRef: {name: monday-clickhouse-task-reader, key: password}
          resources:
            requests: {cpu: "1", memory: 3Gi}
            limits: {cpu: "2", memory: 5Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          readinessProbe:
            httpGet: {path: /ping, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          startupProbe:
            httpGet: {path: /ping, port: http}
            failureThreshold: 60
            periodSeconds: 5
          volumeMounts:
            - {name: data, mountPath: /var/lib/clickhouse}
            - {name: runtime, mountPath: /var/log/clickhouse-server, subPath: logs}
            - {name: runtime, mountPath: /tmp, subPath: tmp}
            - {name: config, mountPath: /etc/clickhouse-server/config.d/monday.xml, subPath: config.xml, readOnly: true}
            - {name: config, mountPath: /etc/clickhouse-server/users.d/monday.xml, subPath: users.xml, readOnly: true}
      volumes:
        - name: runtime
          emptyDir: {sizeLimit: 1Gi}
        - name: config
          configMap: {name: monday-clickhouse-config}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: monday-clickhouse
          app.kubernetes.io/part-of: monday
          research.monday/contract: research-data-platform-1256
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: monday-research-data-essd
        resources:
          requests: {storage: 100Gi}
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: monday-research-data-essd
  labels:
    app.kubernetes.io/name: monday-clickhouse
    app.kubernetes.io/part-of: monday
    research.monday/contract: research-data-platform-1256
provisioner: diskplugin.csi.alibabacloud.com
parameters:
  type: cloud_essd
  performanceLevel: PL1
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: monday-clickhouse
  namespace: monday-research
  labels:
    app.kubernetes.io/name: monday-clickhouse
    app.kubernetes.io/part-of: monday
    research.monday/contract: research-data-platform-1256
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: monday-clickhouse
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              research.monday/data-access: admitted
      ports:
        - {protocol: TCP, port: 8123}
        - {protocol: TCP, port: 9000}
