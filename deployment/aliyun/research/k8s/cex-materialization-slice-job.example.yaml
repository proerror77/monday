# Suspended Indexed slice Job. Resolve every REPLACE_* value, then unsuspend
# only after inventory and PVC identities are read back.
#
# This Job only slices assigned raw segments onto the shared output prefix. It
# does not run PIT, replay, or final receipt publication. backoffLimit stays 0
# so a failed shard is not silently retried.
#
# Benchmark shard-count 1 then 2, 4, and 8 on ACK before raising parallelism.
# Shared OSS CSI can make high fan-out slower if the bottleneck is I/O.
apiVersion: batch/v1
kind: Job
metadata:
  name: REPLACE_MATERIALIZATION_SLICE_JOB_NAME
  namespace: monday-research
  labels:
    app.kubernetes.io/name: monday-cex-materialization-slice
    app.kubernetes.io/part-of: monday
    research.monday/contract: cex-materialization-v1
  annotations:
    research.monday/source-revision: REPLACE_WITH_40_HEX_SOURCE_SHA
    research.monday/image-ref: crpi-ygobwehhof7qs9m3-vpc.ap-northeast-1.personal.cr.aliyuncs.com/wildcard0923/research-runner@sha256:REPLACE_WITH_IMMUTABLE_DIGEST
    research.monday/inventory-configmap: REPLACE_WITH_INVENTORY_CONFIGMAP
    research.monday/raw-pvc: REPLACE_WITH_RAW_PVC_NAME
    research.monday/output-pvc: REPLACE_WITH_OUTPUT_PVC_NAME
    research.monday/output-write: shard-create-once
    research.monday/shard-count: "8"
spec:
  suspend: true
  completionMode: Indexed
  completions: 8
  parallelism: 2
  backoffLimit: 0
  activeDeadlineSeconds: 3600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: monday-cex-materialization-slice
        app.kubernetes.io/part-of: monday
        research.monday/contract: cex-materialization-v1
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: monday-acr
      nodeSelector:
        kubernetes.io/arch: amd64
        workload: backtest
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cex-materialization-slice
          image: crpi-ygobwehhof7qs9m3-vpc.ap-northeast-1.personal.cr.aliyuncs.com/wildcard0923/research-runner@sha256:REPLACE_WITH_IMMUTABLE_DIGEST
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - >
              exec /contract/cex-materialization-entrypoint.sh
              --inventory /inventory/frozen.env
              --raw-root /lake/raw
              --output-root /lake/output
              --work-dir /work
              --binary-dir /usr/local/bin
              --role slice
              --shard-index "$JOB_COMPLETION_INDEX"
              --shard-count 8
          env:
            - name: JOB_COMPLETION_INDEX
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
          resources:
            requests:
              cpu: "3500m"
              memory: 8Gi
            limits:
              cpu: "3500m"
              memory: 12Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: contract
              mountPath: /contract
              readOnly: true
            - name: inventory
              mountPath: /inventory
              readOnly: true
            - name: raw
              mountPath: /lake/raw
              readOnly: true
            - name: output
              mountPath: /lake/output
            - name: work
              mountPath: /work
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: contract
          configMap:
            name: REPLACE_WITH_CONTRACT_CONFIGMAP
            defaultMode: 0444
            items:
              - key: cex-materialization-entrypoint.sh
                path: cex-materialization-entrypoint.sh
        - name: inventory
          configMap:
            name: REPLACE_WITH_INVENTORY_CONFIGMAP
            defaultMode: 0444
            items:
              - key: frozen.env
                path: frozen.env
        - name: raw
          persistentVolumeClaim:
            claimName: REPLACE_WITH_RAW_PVC_NAME
            readOnly: true
        - name: output
          persistentVolumeClaim:
            claimName: REPLACE_WITH_OUTPUT_PVC_NAME
        - name: work
          emptyDir:
            sizeLimit: 20Gi
        - name: tmp
          emptyDir: {}
