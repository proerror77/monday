# Pod-shape reference only. `alpha-harness mission dispatch submit` generates
# the real Job and its immutable, Job-owned input Secret. Do not apply this file
# directly and never commit a campaign request containing signed URLs.
apiVersion: batch/v1
kind: Job
metadata:
  name: REPLACE_CAMPAIGN_JOB_NAME
  namespace: monday-research
  annotations:
    research.monday/attempt-id: REPLACE_ATTEMPT_ID
    research.monday/campaign-id: REPLACE_CAMPAIGN_ID
    research.monday/request-sha256: REPLACE_REQUEST_SHA256
    research.monday/image-digest: REPLACE_IMAGE_SHA256
    research.monday/lane: cex_research_campaign
  labels:
    app.kubernetes.io/name: monday-alpha-campaign
    app.kubernetes.io/part-of: monday
    research.monday/campaign-id: REPLACE_CAMPAIGN_ID
spec:
  suspend: true
  backoffLimit: 0
  activeDeadlineSeconds: 3600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      annotations:
        research.monday/attempt-id: REPLACE_ATTEMPT_ID
        research.monday/campaign-id: REPLACE_CAMPAIGN_ID
        research.monday/request-sha256: REPLACE_REQUEST_SHA256
        research.monday/image-digest: REPLACE_IMAGE_SHA256
        research.monday/lane: cex_research_campaign
      labels:
        app.kubernetes.io/name: monday-alpha-campaign
        app.kubernetes.io/part-of: monday
        research.monday/campaign-id: REPLACE_CAMPAIGN_ID
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: monday-acr
      nodeSelector:
        kubernetes.io/arch: amd64
        workload: backtest
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alpha-campaign
          image: crpi-ygobwehhof7qs9m3-vpc.ap-northeast-1.personal.cr.aliyuncs.com/wildcard0923/research-runner@sha256:REPLACE_IMAGE_SHA256
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/alpha-harness"]
          args:
            - mission
            - campaign-execute
            - --work-dir
            - /work
            - --campaign-id
            - REPLACE_CAMPAIGN_ID
            - --image-identity
            - REPLACE_IMAGE_SHA256
            - --request
            - /inputs/campaign.json
            - --request-sha256
            - REPLACE_REQUEST_SHA256
          resources:
            requests:
              cpu: "3500m"
              memory: 8Gi
            limits:
              cpu: "3500m"
              memory: 12Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: work
              mountPath: /work
            - name: tmp
              mountPath: /tmp
            - name: inputs
              mountPath: /inputs
              readOnly: true
      volumes:
        - name: work
          emptyDir:
            sizeLimit: 20Gi
        - name: tmp
          emptyDir: {}
        - name: inputs
          secret:
            secretName: REPLACE_JOB_OWNED_INPUT_SECRET
            items:
              - key: campaign.json
                path: campaign.json
