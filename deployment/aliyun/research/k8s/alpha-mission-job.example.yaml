apiVersion: batch/v1
kind: Job
metadata:
  name: REPLACE_MISSION_JOB_NAME
  namespace: monday-research
  annotations:
    research.monday/evaluator-version: purged-walk-forward-v4
  labels:
    app.kubernetes.io/name: monday-alpha-mission
    app.kubernetes.io/part-of: monday
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      annotations:
        research.monday/evaluator-version: purged-walk-forward-v4
      labels:
        app.kubernetes.io/name: monday-alpha-mission
        app.kubernetes.io/part-of: monday
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: monday-acr
      nodeSelector:
        kubernetes.io/arch: amd64
        workload: backtest
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alpha-mission
          image: crpi-ygobwehhof7qs9m3-vpc.ap-northeast-1.personal.cr.aliyuncs.com/wildcard0923/research-runner@sha256:REPLACE_WITH_IMMUTABLE_DIGEST
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/alpha-harness"]
          args:
            - mission
            - execute
            - --work-dir
            - /work
            - --mission-url
            - $(MISSION_URL)
            - --mission-sha256
            - $(MISSION_SHA256)
            - --feature-url
            - $(FEATURE_URL)
            - --materialization-url
            - $(MATERIALIZATION_URL)
            - --result-put-url
            - $(RESULT_PUT_URL)
            - --result-readback-url
            - $(RESULT_READBACK_URL)
          env:
            - name: MISSION_URL
              valueFrom:
                secretKeyRef:
                  name: REPLACE_URL_SECRET_NAME
                  key: mission-url
            - name: MISSION_SHA256
              value: REPLACE_MISSION_SHA256
            - name: FEATURE_URL
              valueFrom:
                secretKeyRef:
                  name: REPLACE_URL_SECRET_NAME
                  key: feature-url
            - name: RESULT_PUT_URL
              valueFrom:
                secretKeyRef:
                  name: REPLACE_URL_SECRET_NAME
                  key: result-put-url
            - name: RESULT_READBACK_URL
              valueFrom:
                secretKeyRef:
                  name: REPLACE_URL_SECRET_NAME
                  key: result-readback-url
            - name: MATERIALIZATION_URL
              valueFrom:
                secretKeyRef:
                  name: REPLACE_URL_SECRET_NAME
                  key: materialization-url
          resources:
            requests:
              cpu: "3500m"
              memory: 8Gi
            limits:
              cpu: "3500m"
              memory: 12Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: work
              mountPath: /work
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: work
          emptyDir:
            sizeLimit: 20Gi
        - name: tmp
          emptyDir: {}
