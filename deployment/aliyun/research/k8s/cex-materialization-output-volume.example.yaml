# One-use output PV/PVC pair for one stable lane root. Keep the PV `path`
# stable across attempts in the same lane, and let the frozen inventory's
# `OUTPUT_PREFIX` choose the run-specific subdirectory inside that lane root.
# Once this PV binds its PVC, do not retarget either object at another path.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: REPLACE_WITH_OUTPUT_PV_NAME
  labels:
    alicloud-pvname: REPLACE_WITH_OUTPUT_PV_NAME
spec:
  accessModes:
    - ReadWriteMany
  capacity:
    storage: REPLACE_WITH_OUTPUT_CAPACITY
  csi:
    driver: ossplugin.csi.alibabacloud.com
    nodePublishSecretRef:
      name: REPLACE_WITH_OSS_SECRET_NAME
      namespace: monday-research
    volumeAttributes:
      bucket: monday-lob-apne1-1045353359
      url: oss-ap-northeast-1-internal.aliyuncs.com
      path: research/cex-materialization
      otherOpts: -o max_stat_cache_size=0 -o allow_other -o uid=1000 -o gid=1000 -o mp_umask=0077 -o umask=0077
    volumeHandle: REPLACE_WITH_OUTPUT_PV_NAME
  persistentVolumeReclaimPolicy: Retain
  storageClassName: REPLACE_WITH_OUTPUT_STORAGECLASS
  volumeMode: Filesystem
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: REPLACE_WITH_OUTPUT_PVC_NAME
  namespace: monday-research
# Bind this claim once to the dedicated PV above via the selector label.
# Retire the pair together instead of rebinding the claim to another PV path.
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: REPLACE_WITH_OUTPUT_CAPACITY
  selector:
    matchLabels:
      alicloud-pvname: REPLACE_WITH_OUTPUT_PV_NAME
  storageClassName: REPLACE_WITH_OUTPUT_STORAGECLASS
  volumeMode: Filesystem
