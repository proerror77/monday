# The named controller substitutes every REPLACE_* before server-side admission.
# Source, registry auth and builder state stay in ACK. This is not a runtime Job.
# /work is an ESSD PVC on workload=backtest, never an ack-system host disk.
apiVersion: batch/v1
kind: Job
metadata:
  name: monday-data-build-REPLACE_RUN
  namespace: monday-research
  labels:
    research.monday/contract: research-data-platform-1256
    research.monday/controller: REPLACE_CONTROLLER
  annotations:
    research.monday/source-revision: "REPLACE_SOURCE_SHA"
    research.monday/source-archive-sha256: "REPLACE_SOURCE_ARCHIVE_SHA256"
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 7200
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        research.monday/contract: research-data-platform-1256
        research.monday/controller: REPLACE_CONTROLLER
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/arch: amd64
        workload: backtest
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: verify-source
          image: rust@sha256:c49256cbe5ea0188bc658a689500d70c41eb51f009a7a7be209caf60a944f3ec
          command: [/bin/bash, -ceu]
          args:
            - |
              # A prior controller upload atomically renames the code archive.
              [[ "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]
              [[ "$SOURCE_ARCHIVE_SHA256" =~ ^[0-9a-f]{64}$ ]]
              archive="/work/source-$SOURCE_REVISION.tar.gz"
              source="/work/sources/$SOURCE_REVISION"
              test -f "$archive"
              printf '%s  %s\n' "$SOURCE_ARCHIVE_SHA256" "$archive" | sha256sum -c -
              test ! -e "$source"
              mkdir -p "$source"
              tar --no-same-owner -xzf "$archive" -C "$source"
              printf '%s\n' "$SOURCE_REVISION" > "$source/SOURCE_REVISION"
              printf '{"source_revision":"%s","archive_sha256":"%s","execution_host":"ack"}\n' \
                "$SOURCE_REVISION" "$SOURCE_ARCHIVE_SHA256" > "$source/ACK_SOURCE_RECEIPT.json"
              chmod -R a-w "$source"
          env:
            - {name: SOURCE_REVISION, value: "REPLACE_SOURCE_SHA"}
            - {name: SOURCE_ARCHIVE_SHA256, value: "REPLACE_SOURCE_ARCHIVE_SHA256"}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: work, mountPath: /work}
      containers:
        - name: build
          image: moby/buildkit@sha256:9391745530c1812ca16a14554813268c3472953f12a060494efc86b9bc4b0e53
          imagePullPolicy: IfNotPresent
          # Rootless BuildKit's documented Kubernetes constraints. Admit only
          # after verifying user namespaces/native snapshotter on this worker.
          # Never fall back to a system node or privileged host socket.
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile: {type: Unconfined}
            appArmorProfile: {type: Unconfined}
          command: [/bin/sh, -ceu]
          args:
            - |
              test -d /work/source/.git || test -f /work/source/ACK_SOURCE_RECEIPT.json
              test -f /work/source/rust_hft/Cargo.lock
              test -f /work/source/deployment/aliyun/research/Dockerfile.research-data
              test "$(cat /work/source/SOURCE_REVISION)" = "$SOURCE_REVISION"
              # Source staging and archive verification are a prior ACK Job.
              # The controller must also bind the receipt to its live source.
              mkdir -p /work/buildkit /work/receipts /work/tmp /work/runtime
              export TMPDIR=/work/tmp
              # The controller retains the task-scoped cache across source fixes,
              # then removes it after durable artifact/receipt publication. The
              # finite worker/PVC lifetime is independent of this client shell.
              cleanup() { rm -rf /work/tmp /work/runtime; }
              trap cleanup EXIT
              buildctl-daemonless.sh build \
                --frontend dockerfile.v0 \
                --local context=/work/source \
                --local dockerfile=/work/source/deployment/aliyun/research \
                --opt filename=Dockerfile.research-data \
                --opt target="$BUILD_TARGET" \
                --opt build-arg:SOURCE_REVISION="$SOURCE_REVISION" \
                --opt platform=linux/amd64 \
                --metadata-file /work/receipts/buildkit.json \
                --output "$BUILD_OUTPUT"
          env:
            - {name: SOURCE_REVISION, value: "REPLACE_SOURCE_SHA"}
            # Diagnostic build exports only binaries into this ACK PVC. A
            # production runtime/push output requires exact-main release
            # admission and the controller's immutable publication receipt.
            - {name: BUILD_TARGET, value: binaries}
            - {name: BUILD_OUTPUT, value: "type=local,dest=/work/compiled"}
            - {name: BUILDKITD_FLAGS, value: "--root /work/buildkit --oci-worker-snapshotter=native --oci-worker-no-process-sandbox"}
            - {name: DOCKER_CONFIG, value: /registry}
            - {name: XDG_RUNTIME_DIR, value: /work/runtime}
          resources:
            requests: {cpu: "2", memory: 6Gi}
            limits: {cpu: "3", memory: 10Gi}
          volumeMounts:
            - {name: work, mountPath: /work}
            - {name: work, mountPath: /work/source, subPath: "sources/REPLACE_SOURCE_SHA", readOnly: true}
            - {name: registry, mountPath: /registry, readOnly: true}
      volumes:
        - name: work
          persistentVolumeClaim: {claimName: REPLACE_BUILD_PVC}
        - name: registry
          secret:
            secretName: REPLACE_ACR_PUSH_SECRET
            items:
              - {key: .dockerconfigjson, path: config.json}
