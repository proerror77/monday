# No public ingress or Agent/model egress. Private API IP is an exact host.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: monday-foundation-private, namespace: monday-research}
spec:
  podSelector: {matchLabels: {research.monday/foundation-access: admitted}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{podSelector: {matchLabels: {research.monday/foundation-access: admitted}}}]
      ports: [{protocol: TCP, port: 5432}, {protocol: TCP, port: 8443}, {protocol: TCP, port: 8444}, {protocol: TCP, port: 9440}]
  egress:
    - to: [{podSelector: {matchLabels: {research.monday/foundation-access: admitted}}}]
      ports: [{protocol: TCP, port: 5432}, {protocol: TCP, port: 8443}, {protocol: TCP, port: 8444}, {protocol: TCP, port: 9440}]
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - to: [{ipBlock: {cidr: __KUBE_API_CIDR__}}]
      ports: [{protocol: TCP, port: 443}]
