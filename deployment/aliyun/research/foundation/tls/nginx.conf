# Private TLS front door in the same Pod network namespace as loopback hosts.
# Operator installs reviewed certs/keys; this configuration issues no identity.
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
  access_log off;
  server_tokens off;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_certificate /run/private/tls/server.crt;
  ssl_certificate_key /run/private/tls/server.key;
  ssl_client_certificate /run/private/tls/ca.crt;
  ssl_verify_client on;
  ssl_session_tickets off;
  server {
    listen 8443 ssl;
    server_name _;
    client_max_body_size 64k;
    location = /research {
      limit_except POST { deny all; }
      proxy_pass http://127.0.0.1:7081;
      proxy_set_header Host localhost;
      proxy_set_header Authorization $http_authorization;
      proxy_connect_timeout 5s;
      proxy_read_timeout 20s;
      proxy_send_timeout 20s;
    }
    location / { return 404; }
  }
  server {
    listen 8444 ssl;
    server_name _;
    client_max_body_size 512m;
    client_body_timeout 30s;
    location /research/ {
      limit_except GET PUT { deny all; }
      proxy_pass http://127.0.0.1:7082;
      proxy_set_header Host localhost;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header If-None-Match $http_if_none_match;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_connect_timeout 5s;
      proxy_read_timeout 35s;
      proxy_send_timeout 35s;
    }
    location / { return 404; }
  }
}
