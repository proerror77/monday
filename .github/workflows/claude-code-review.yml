name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, labeled]

concurrency:
  group: claude-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  claude-review:
    if: |
      contains(toJson(github.event.pull_request.labels), 'ai-review') ||
      github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR' ||
      github.event.pull_request.author_association == 'FIRST_TIMER'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          # Optional: Specify model (defaults to Claude Sonnet 4)
          # model: "claude-opus-4-20250514"

          # Automated review prompt
          direct_prompt: |
            Review the current PR diff against the nearest AGENTS.md and the
            requested behavior. Report actionable defects with file/line evidence,
            a concrete trigger, and the resulting impact; omit generic style advice.
            Check affected contracts, especially research/execution separation,
            real-data provenance, sealed holdouts, and fail-closed runtime limits.
            Select validation by changed behavior and credible regression risk.
            Do not demand a full suite or production Gate for ordinary code changes.
            Distinguish verified defects from untested concerns. If no actionable
            defects are found, say so and state any material validation limitations.
