name: Issue Lifecycle

"on":
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  issue-lifecycle:
    name: Issue Lifecycle Audit
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Verify workflow contract
        run: ruby .github/scripts/test-issue-lifecycle-workflow.rb
      - name: Verify proposed workflow contract
        if: github.event_name == 'pull_request_target'
        env:
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh api -H "Accept: application/vnd.github.raw+json" \
            "repos/$PR_HEAD_REPOSITORY/contents/.github/workflows/issue-lifecycle.yml?ref=$PR_HEAD_SHA" \
            > "$RUNNER_TEMP/issue-lifecycle.yml"
          ruby .github/scripts/test-issue-lifecycle-workflow.rb "$RUNNER_TEMP/issue-lifecycle.yml"
      - name: Audit current pull request
        if: github.event_name == 'pull_request_target'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: >-
          ruby .github/scripts/issue-lifecycle-audit.rb
          --repo "$GITHUB_REPOSITORY"
          --pr "$PR_NUMBER"
          --summary "$GITHUB_STEP_SUMMARY"
      - name: Audit live repository
        if: github.event_name != 'pull_request_target'
        run: >-
          ruby .github/scripts/issue-lifecycle-audit.rb
          --repo "$GITHUB_REPOSITORY"
          --summary "$GITHUB_STEP_SUMMARY"
          --violations-json "$RUNNER_TEMP/violations.json"
      - name: Comment violations on issues
        if: github.event_name != 'pull_request_target' && failure()
        env:
          VIOLATIONS_JSON: ${{ runner.temp }}/violations.json
        run: |
          if [[ ! -f "$VIOLATIONS_JSON" ]]; then
            echo "No violations file; skipping issue comments" >&2
            exit 0
          fi
          python3 - "$VIOLATIONS_JSON" "$GITHUB_REPOSITORY" <<'PY'
          import json, subprocess, sys

          violations, repo = json.load(open(sys.argv[1])), sys.argv[2]
          marker = "This is an automated notice from the daily lifecycle audit."
          for issue_number, reasons in violations.items():
              existing = subprocess.run(
                  ["gh", "issue", "view", str(issue_number), "--repo", repo,
                   "--json", "comments", "-q", ".comments[].body"],
                  capture_output=True, text=True,
              ).stdout
              if marker in existing:
                  continue  # already flagged; avoid duplicate noise
              body = "**Issue Lifecycle Audit** flagged this issue:\n\n" + \
                     "\n".join(f"- {r}" for r in reasons) + \
                     f"\n\n{marker}"
              subprocess.run(
                  ["gh", "issue", "comment", str(issue_number), "--repo", repo, "--body", body],
                  check=False,
              )
          PY
