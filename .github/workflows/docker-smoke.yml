name: Docker Smoke Build

on:
  push:
    branches: [main, develop]
    paths:
      - '.github/workflows/docker-smoke.yml'
      - 'deploy/**'
      - 'deployment/docker/**'
      - 'rust_hft/Cargo.toml'
      - 'rust_hft/Cargo.lock'
      - 'rust_hft/docker/**'
      - 'rust_hft/deployment/docker/**'
      - 'rust_hft/deployment/k8s/**'
      - 'rust_hft/alpha-harness/**'
      - 'rust_hft/apps/backtest/**'
      - 'rust_hft/data-pipelines/core/**'
      - 'rust_hft/market-core/**'
      - 'rust_hft/research-core/**'
      - 'rust_hft/strategy-framework/infer-onnx/**'
      - 'rust_hft/tools/collector/**'
      - 'rust_hft/prediction-markets/Cargo.toml'
      - 'rust_hft/prediction-markets/Cargo.lock'
      - 'rust_hft/prediction-markets/config/**'
      - 'rust_hft/prediction-markets/crates/ploy-*/**'
  pull_request:
    branches: [main, develop]
    paths:
      - '.github/workflows/docker-smoke.yml'
      - 'deploy/**'
      - 'deployment/docker/**'
      - 'rust_hft/Cargo.toml'
      - 'rust_hft/Cargo.lock'
      - 'rust_hft/docker/**'
      - 'rust_hft/deployment/docker/**'
      - 'rust_hft/deployment/k8s/**'
      - 'rust_hft/alpha-harness/**'
      - 'rust_hft/apps/backtest/**'
      - 'rust_hft/data-pipelines/core/**'
      - 'rust_hft/market-core/**'
      - 'rust_hft/research-core/**'
      - 'rust_hft/strategy-framework/infer-onnx/**'
      - 'rust_hft/tools/collector/**'
      - 'rust_hft/prediction-markets/Cargo.toml'
      - 'rust_hft/prediction-markets/Cargo.lock'
      - 'rust_hft/prediction-markets/config/**'
      - 'rust_hft/prediction-markets/crates/ploy-*/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker_build:
    name: Build selected Dockerfiles
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: rust_hft/docker/Dockerfile
            context: rust_hft
          - dockerfile: rust_hft/deployment/docker/Dockerfile.trading
            context: rust_hft
          - dockerfile: rust_hft/deployment/docker/Dockerfile.research
            context: rust_hft
          - dockerfile: deploy/Dockerfile.hft
            context: .
            build_args: TARGET=live
          - dockerfile: deploy/Dockerfile.hft
            context: .
            build_args: TARGET=collector
          - dockerfile: deploy/Dockerfile.hft
            context: .
            build_args: TARGET=paper
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: false
          provenance: false
          sbom: false
          build-args: ${{ matrix.build_args }}
