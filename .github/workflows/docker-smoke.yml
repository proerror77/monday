name: Docker Smoke Build

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.image_matrix }}
      selected: ${{ steps.plan.outputs.selected }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          plan=$(mktemp)
          .github/scripts/select-rust-ci-scope.sh --event "$GITHUB_EVENT_NAME" --base "$BASE_SHA" --head "$HEAD_SHA" --output "$plan"
          matrix=$(sed -n 's/^image_matrix=//p' "$plan")
          printf 'image_matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"
          printf 'selected=%s\n' "$(jq '.include|length>0' <<<"$matrix")" >> "$GITHUB_OUTPUT"
          rm "$plan"
  docker_build:
    name: Build selected Dockerfiles
    needs: plan
    if: needs.plan.outputs.selected == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: false
          provenance: false
          sbom: false
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=image-${{ matrix.name }}
          cache-to: type=gha,scope=image-${{ matrix.name }},mode=max
