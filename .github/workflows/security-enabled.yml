name: Security & Quality (ENABLED)

on:
  schedule:
    # Weekly security audit
    - cron: '0 2 * * 1'
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  security-selector:
    name: Security job selector
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image_matrix: ${{ steps.images.outputs.image_matrix || steps.scope.outputs.image_matrix }}
      ack_research: ${{ steps.ack.outputs.ack_research }}
      jobs: ${{ steps.images.outputs.security_jobs || steps.scope.outputs.security_jobs }}
      selection_complete: ${{ steps.scope.outputs.selection_complete }}
      clippy_loop: ${{ steps.scope.outputs.clippy_loop }}
      clippy_handoff: ${{ steps.scope.outputs.clippy_handoff }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Select security jobs
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          .github/scripts/select-rust-ci-scope.sh
          --event "${GITHUB_EVENT_NAME}"
          --base "${BASE_SHA}"
          --head "${HEAD_SHA}"

      - name: Carry unpublished image changes forward on main
        id: images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SELECTED_SECURITY_JOBS: ${{ steps.scope.outputs.security_jobs }}
          SELECTED_IMAGE_MATRIX: ${{ steps.scope.outputs.image_matrix }}
        run: bash .github/scripts/select-main-image-scope.sh "$GITHUB_SHA" "$GITHUB_OUTPUT"

      - name: Classify research execution scope
        id: ack
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SELECTED_LOOP: ${{ steps.scope.outputs.clippy_loop }}
        run: |
          .github/scripts/classify-ack-research-job.sh --detect-scope --repository "$GITHUB_REPOSITORY" --event "$GITHUB_EVENT_NAME" --base "$BASE_SHA" --head "$HEAD_SHA" --loop "$SELECTED_LOOP"

  security-scope:
    name: Security job scope
    needs: security-selector
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image_matrix: ${{ needs.security-selector.outputs.image_matrix }}
      ack_research: ${{ needs.security-selector.outputs.ack_research }}
      jobs: ${{ steps.scope.outputs.jobs }}
      clippy_loop: ${{ steps.scope.outputs.clippy_loop }}
      clippy_handoff: ${{ steps.scope.outputs.clippy_handoff }}
    steps:
      - name: Resolve selector result
        id: scope
        env:
          SELECTOR_RESULT: ${{ needs.security-selector.result }}
          SELECTED_SECURITY_JOBS: ${{ needs.security-selector.outputs.jobs }}
          SELECTED_COMPLETE: ${{ needs.security-selector.outputs.selection_complete }}
          CLIPPY_LOOP: ${{ needs.security-selector.outputs.clippy_loop }}
          CLIPPY_HANDOFF: ${{ needs.security-selector.outputs.clippy_handoff }}
        run: |
          if [[ "$SELECTOR_RESULT" == success && "$SELECTED_COMPLETE" == true ]] &&
             [[ "$SELECTED_SECURITY_JOBS" =~ ^,[a-z0-9/-]*(,[a-z0-9/-]+)*,$ ]] &&
             [[ "$CLIPPY_LOOP,$CLIPPY_HANDOFF" =~ ^(true|false),(true|false)$ ]]; then
            printf 'jobs=%s\n' "$SELECTED_SECURITY_JOBS"
            printf 'clippy_loop=%s\nclippy_handoff=%s\n' "$CLIPPY_LOOP" "$CLIPPY_HANDOFF"
          else
            echo 'CI selection failed or returned an invalid plan; no work is dispatched' >&2
            exit 1
          fi >> "$GITHUB_OUTPUT"

  # ============================================================================
  # SAST - Static Application Security Testing
  # ============================================================================
  sast-semgrep:
    name: SAST - Semgrep
    needs: security-scope
    if: ${{ contains(needs.security-scope.outputs.jobs, ',security/sast-semgrep,') }}
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.164.0
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep
        # Active root workflows, application code, and the rest of the
        # repository remain in scope. Only historical infrastructure is excluded.
        run: >-
          semgrep scan
          --config p/rust
          --config p/security-audit
          --config p/owasp-top-ten
          --exclude rust_hft/prediction-markets/docs/archive/standalone-operations/infra
          --sarif
          --output semgrep.sarif
          .

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # ============================================================================
  # Dependency Security Audit
  # ============================================================================
  cargo-audit:
    name: Dependency Security - Cargo Audit
    needs: security-scope
    if: ${{ contains(needs.security-scope.outputs.jobs, ',security/cargo-audit,') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust_hft
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust_hft

      - name: Install cargo-audit
        run: cargo install --locked cargo-audit

      - name: Run security audit
        run: |
          set -euo pipefail
          cargo audit --json > audit-results.json
          jq -e '.vulnerabilities.list? // [] | arrays' audit-results.json > /dev/null

      - name: Upload audit results
        if: always() && hashFiles('rust_hft/audit-results.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: cargo-audit-results
          path: rust_hft/audit-results.json

  secret-presence:
    name: Security - Repository Secret Presence
    needs: security-scope
    if: ${{ contains(needs.security-scope.outputs.jobs, ',security/secret-presence,') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust_hft

      - name: Check tracked secrets
        run: cargo test --manifest-path rust_hft/Cargo.toml -p hft-infra-secrets --test tracked_secrets_contract --locked -- --nocapture

  # ============================================================================
  # License Compliance
  # ============================================================================
  license-check:
    name: License Compliance
    needs: security-scope
    if: ${{ contains(needs.security-scope.outputs.jobs, ',security/license-check,') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust_hft
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1

      - name: Install cargo-license
        run: cargo install cargo-license

      - name: Check licenses
        run: |
          cargo license --json > licenses.json

          # Fail on incompatible licenses
          INCOMPATIBLE_LICENSES="GPL-2.0|GPL-3.0|AGPL-3.0|LGPL-3.0"

          if jq -r ".[] | .license" licenses.json | grep -E "$INCOMPATIBLE_LICENSES"; then
            echo "::error::Found incompatible licenses"
            exit 1
          fi

          echo "✅ All licenses compatible"

      - name: Upload license report
        uses: actions/upload-artifact@v4
        with:
          name: license-report
          path: rust_hft/licenses.json

  # ============================================================================
  # Code Quality - Strict Clippy
  # ============================================================================
  clippy-strict:
    name: Code Quality - Clippy (STRICT)
    needs: security-scope
    if: ${{ contains(needs.security-scope.outputs.jobs, ',security/clippy-strict,') }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        working-directory: rust_hft
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        if: needs.security-scope.outputs.ack_research != 'true'
        with:
          toolchain: 1.98.1
          components: clippy

      - name: Cache
        if: needs.security-scope.outputs.ack_research != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust_hft
          shared-key: strict-alpha-research-ml-v1

      - name: Run research Clippy (strict)
        if: ${{ (needs.security-scope.outputs.clippy_loop == 'true') && needs.security-scope.outputs.ack_research != 'true' }}
        run: |
          cargo clippy \
            -p alpha-domain \
            -p alpha-store \
            -p alpha-engine \
            -p alpha-onnx-evaluator \
            -p alpha-harness \
            -p hft-harnessctl \
            -p hft-research-ml \
            --all-targets \
            --locked \
            -- \
            -D warnings \
            -D clippy::correctness \
            -D clippy::suspicious

      - name: Run runtime handoff Clippy (strict)
        if: ${{ (needs.security-scope.outputs.clippy_handoff == 'true') && needs.security-scope.outputs.ack_research != 'true' }}
        run: |
          cargo clippy \
            -p hft-live \
            --no-default-features \
            --test deployment_envelope \
            --locked \
            --no-deps \
            -- \
            -D warnings \
            -D clippy::correctness \
            -D clippy::suspicious

  # ============================================================================
  # Unused Dependencies
  # ============================================================================
      - name: Verify strict Clippy from the signed Monorepo batch
        if: needs.security-scope.outputs.ack_research == 'true'
        id: ack
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ $GITHUB_EVENT_NAME == schedule ]]; then
            .github/scripts/wait-ack-research-receipt.sh security-clippy-research "$(git rev-parse HEAD)"
          else
            bash .github/scripts/wait-ack-rust-batch.sh "$(git rev-parse HEAD)"
          fi
  cargo-machete:
    name: Code Quality - Unused Dependencies
    needs: security-scope
    if: ${{ contains(needs.security-scope.outputs.jobs, ',security/cargo-machete,') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust_hft
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1

      - name: Install cargo-machete
        run: cargo install --locked cargo-machete --version 0.9.2

      - name: Check unused dependencies
        run: |
          for crate in \
            alpha-harness/domain \
            alpha-harness/store \
            alpha-harness/engine \
            alpha-harness/onnx-evaluator \
            alpha-harness/app \
            tools/harnessctl \
            data-pipelines/adapters/adapter-ondo-perps \
            execution-gateway/adapters/adapter-ondo-perps; do
            (cd "$crate" && cargo machete --with-metadata)
          done

  # ============================================================================
  # Container Image Scanning
  # ============================================================================
  container-scan:
    name: Container Security - Image Scan
    needs: security-scope
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(needs.security-scope.outputs.jobs, ',security/container-scan,')
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.security-scope.outputs.image_matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: monday-tested:${{ matrix.name }}-${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=image-${{ matrix.name }}
          cache-to: type=gha,scope=image-${{ matrix.name }},mode=max

      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # master resolved 2026-10-01
        with:
          image-ref: monday-tested:${{ matrix.name }}-${{ github.sha }}
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif
          category: trivy-${{ matrix.name }}

      - name: Save the scanned core image for exact-source publication
        if: matrix.name == 'hft-core'
        env:
          IMAGE_NAME: ${{ matrix.name }}
        run: |
          mkdir -p tested-image
          image="monday-tested:$IMAGE_NAME-$GITHUB_SHA"
          docker save "$image" --output tested-image/image.tar
          jq -n --arg source "$GITHUB_SHA" --arg name "$IMAGE_NAME" \
            --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" \
            --arg image_id "$(docker image inspect --format '{{.Id}}' "$image")" \
            --arg archive "$(sha256sum tested-image/image.tar | awk '{print $1}')" \
            '{schema_version:"monday.tested_image.v1",source_sha:$source,image:$name,run_id:$run,run_attempt:$attempt,image_id:$image_id,archive_sha256:$archive}' \
            > tested-image/image.json

      - name: Preserve the tested image
        if: matrix.name == 'hft-core'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tested-image-${{ matrix.name }}-${{ github.sha }}-${{ github.run_attempt }}
          path: tested-image/
          if-no-files-found: error
          retention-days: 7
          compression-level: 1

  # ============================================================================
  # Secrets Detection
  # ============================================================================
  secret-detection:
    name: Security - Secret Detection
    needs: security-scope
    if: ${{ contains(needs.security-scope.outputs.jobs, ',security/secret-detection,') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          extra_args: --only-verified

  # ============================================================================
  # SBOM Generation (Software Bill of Materials)
  # ============================================================================
  sbom:
    name: Security - SBOM Generation
    needs: security-scope
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(needs.security-scope.outputs.jobs, ',security/cargo-audit,')
    steps:
      - uses: actions/checkout@v4

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          format: cyclonedx-json
          output-file: sbom.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

  # ============================================================================
  # Security Summary & Report
  # ============================================================================
  security-summary:
    name: Security Summary Report
    runs-on: ubuntu-latest
    needs:
      - security-selector
      - security-scope
      - sast-semgrep
      - cargo-audit
      - secret-presence
      - license-check
      - clippy-strict
      - cargo-machete
      - container-scan
      - secret-detection
      - sbom
    if: always()
    steps:
      - uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608 # v4.1.0
      - name: Download cargo audit results
        if: ${{ always() && contains(needs.security-scope.outputs.jobs, ',security/cargo-audit,') }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: cargo-audit-results
          path: cargo-audit-results

      - name: Download license report
        if: ${{ always() && contains(needs.security-scope.outputs.jobs, ',security/license-check,') }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: license-report
          path: license-report

      - name: Download SBOM
        if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(needs.security-scope.outputs.jobs, ',security/cargo-audit,') }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: sbom
          path: sbom

      - name: Generate summary
        if: ${{ always() }}
        env:
          CARGO_AUDIT_RESULT: ${{ needs.cargo-audit.result }}
          LICENSE_CHECK_RESULT: ${{ needs.license-check.result }}
        run: |
          {
            echo "# 🔒 HFT System Security Report"
            echo ""
            echo "**Generated**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "**Commit**: ${{ github.sha }}"
            echo ""
            echo "## Status Summary"
            echo ""

            if [ -f cargo-audit-results/audit-results.json ]; then
              CRITICAL=$(jq -r '.vulnerabilities.list[]? | select(.advisory.severity=="critical") | .advisory.id' cargo-audit-results/audit-results.json 2>/dev/null | wc -l)
              HIGH=$(jq -r '.vulnerabilities.list[]? | select(.advisory.severity=="high") | .advisory.id' cargo-audit-results/audit-results.json 2>/dev/null | wc -l)
              echo "- **Cargo Audit**: Critical=$CRITICAL, High=$HIGH"
            else
              echo "- **Cargo Audit**: $CARGO_AUDIT_RESULT"
            fi

            if [ -f license-report/licenses.json ]; then
              LICENSE_COUNT=$(jq length license-report/licenses.json)
              echo "- **License Check**: $LICENSE_COUNT dependencies"
            else
              echo "- **License Check**: $LICENSE_CHECK_RESULT"
            fi

            echo ""
            echo "## Artifacts"
            if [ -f cargo-audit-results/audit-results.json ]; then
              echo "- Audit results: cargo-audit-results/audit-results.json"
            fi
            if [ -f license-report/licenses.json ]; then
              echo "- License report: license-report/licenses.json"
            fi
            if [ -f sbom/sbom.json ]; then
              echo "- SBOM: sbom/sbom.json"
            fi
          } > security-summary.md

          cat security-summary.md

      - name: Upload summary
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: security-summary
          path: security-summary.md

      - name: Require selected security jobs to pass
        if: ${{ always() }}
        env:
          GATE_NEEDS: ${{ toJson(needs) }}
          EXPECTED_JOBS: ${{ needs.security-scope.outputs.jobs }}
        run: printf '%s' "$GATE_NEEDS" | bash .github/scripts/verify-ci-gate.sh --job-prefix security --expected-jobs "$EXPECTED_JOBS"
