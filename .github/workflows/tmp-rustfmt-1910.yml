name: Temporary Rustfmt 1.91.0 check

on:
  push:
    branches:
      - codex/tmp-rustfmt-1910

permissions:
  contents: read

jobs:
  rust-format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: rust_hft/prediction-markets
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.0
          components: rustfmt
      - run: cargo fmt --all -- --check
