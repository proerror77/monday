name: Docker Publish (GHCR)

on:
  workflow_run:
    workflows: ["Monorepo CI", "Prediction Markets CI", "Security & Quality (ENABLED)"]
    types: [completed]
    branches: [main]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ghcr-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  release-admission:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main')
    outputs:
      admitted: ${{ steps.admission.outputs.admitted }}
      source_sha: ${{ steps.admission.outputs.source_sha }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    steps:
      - name: Checkout release source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Admission code always comes from trusted main, before any source
          # from the triggering workflow is considered for a privileged build.
          ref: refs/heads/main
          fetch-depth: 2
      - name: Verify exact-source release admission
        id: admission
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          SOURCE_REF: ${{ github.event_name == 'workflow_run' && 'refs/heads/main' || github.ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          policy=current-main
          if [[ "$SOURCE_REF" == refs/tags/v* ]]; then
            policy=main-history
          elif [[ "$SOURCE_REF" != refs/heads/main ]]; then
            echo 'release must use main or a version tag' >&2
            exit 1
          fi
          if [[ "$EVENT_NAME" == workflow_run ]]; then
            main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
            if [[ "$SOURCE_SHA" != "$main_sha" ]]; then
              echo 'admitted=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # main accepts squash PR merges: inspect that source commit's full
            # change, retaining the previous publisher's path scope.
            changed=0
            git diff --quiet "${SOURCE_SHA}^" "$SOURCE_SHA" -- rust_hft/ .github/workflows/docker-publish.yml || changed=$?
            if [[ $changed == 0 ]]; then
              echo 'admitted=false' >> "$GITHUB_OUTPUT"
              exit 0
            elif [[ $changed != 1 ]]; then
              exit "$changed"
            fi
            export RELEASE_DEFER_PENDING=true
          fi
          status=0
          .github/scripts/wait-release-required-checks.sh "$SOURCE_SHA" "$policy" || status=$?
          if [[ $status == 75 ]]; then
            echo 'admitted=false' >> "$GITHUB_OUTPUT"
          elif [[ $status == 0 ]]; then
            printf 'admitted=true\nsource_sha=%s\n' "$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          else
            exit "$status"
          fi
  build-and-push:
    needs: release-admission
    if: needs.release-admission.outputs.admitted == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: hft
            context: rust_hft
            file: rust_hft/docker/Dockerfile

    steps:
      - name: Checkout admitted source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.release-admission.outputs.source_sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          context: ${{ github.event_name == 'workflow_run' && 'git' || 'workflow' }}
          images: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=raw,value=main,enable=${{ github.event_name == 'workflow_run' || github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=sha
          labels: |
            org.opencontainers.image.revision=${{ needs.release-admission.outputs.source_sha }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
