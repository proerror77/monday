name: Docker Publish (GHCR)

on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact main commit to publish
        required: true
        type: string
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ghcr-${{ inputs.source_sha != '' && inputs.source_sha || github.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  release-admission:
    if: inputs.source_sha != '' || github.event_name != 'workflow_run'
    outputs:
      admitted: ${{ steps.admission.outputs.admitted }}
      source_sha: ${{ steps.admission.outputs.source_sha }}
      source_sha_short: ${{ steps.admission.outputs.source_sha_short }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    steps:
      - name: Checkout release source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Admission code always comes from trusted main, before any source
          # from the triggering workflow is considered for a privileged build.
          ref: refs/heads/main
          fetch-depth: 0
      - name: Verify exact-source release admission
        id: admission
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha != '' && inputs.source_sha || github.sha }}
          SOURCE_REF: ${{ inputs.source_sha != '' && 'refs/heads/main' || github.ref }}
          EVENT_NAME: ${{ inputs.source_sha != '' && 'workflow_run' || github.event_name }}
        run: |
          if [[ ! "$SOURCE_SHA" =~ ^[[:xdigit:]]{40}$ ]]; then
            echo 'release source SHA must be a 40-character hexadecimal object ID' >&2
            exit 1
          fi
          policy=current-main
          if [[ "$SOURCE_REF" == refs/tags/v* ]]; then
            policy=main-history
          elif [[ "$SOURCE_REF" != refs/heads/main ]]; then
            echo 'release must use main or a version tag' >&2
            exit 1
          fi
          if [[ "$EVENT_NAME" == workflow_run ]]; then
            main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
            if [[ "$SOURCE_SHA" != "$main_sha" ]]; then
              echo 'admitted=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # Reuse the same artifact dependency plan as smoke/security CI.
            plan=$(mktemp)
            bash .github/scripts/select-main-image-scope.sh "$SOURCE_SHA" "$plan"
            matrix=$(sed -n 's/^image_matrix=//p' "$plan")
            rm "$plan"
            if ! jq -e 'any(.include[]; .name=="hft-core")' <<<"$matrix" >/dev/null; then
              echo 'admitted=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            export RELEASE_DEFER_PENDING=true
          fi
          status=0
          .github/scripts/wait-release-required-checks.sh "$SOURCE_SHA" "$policy" || status=$?
          if [[ $status == 75 ]]; then
            echo 'admitted=false' >> "$GITHUB_OUTPUT"
          elif [[ $status == 0 ]]; then
            printf 'admitted=true\nsource_sha=%s\nsource_sha_short=%s\n' \
              "$SOURCE_SHA" "${SOURCE_SHA:0:7}" >> "$GITHUB_OUTPUT"
          else
            exit "$status"
          fi
  build-and-push:
    needs: release-admission
    if: needs.release-admission.outputs.admitted == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      checks: read
      packages: write
      pull-requests: read

    steps:
      - name: Checkout admitted source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.release-admission.outputs.source_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Retrieve and verify the tested image
        id: tested
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.release-admission.outputs.source_sha }}
          EVENT_NAME: ${{ inputs.source_sha != '' && 'workflow_run' || github.event_name }}
        run: |
          mode=required
          [[ "$EVENT_NAME" == workflow_run ]] || mode=optional
          status=0
          bash .github/scripts/read-tested-image.sh "$SOURCE_SHA" "$RUNNER_TEMP/tested-image" "$mode" || status=$?
          if [[ $status == 75 && "$mode" == optional ]]; then
            echo 'build=true' >> "$GITHUB_OUTPUT"
          elif [[ $status == 0 ]]; then
            echo 'build=false' >> "$GITHUB_OUTPUT"
          else
            exit "$status"
          fi

      # Explicit manual/tag publication retains its existing build capability
      # when no retained artifact exists. Automatic publication never rebuilds.
      - name: Build explicit release image when no retained artifact exists
        if: steps.tested.outputs.build == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: rust_hft
          file: rust_hft/docker/Dockerfile
          push: false
          load: true
          tags: monday-tested:hft-core-${{ needs.release-admission.outputs.source_sha }}
          labels: org.opencontainers.image.revision=${{ needs.release-admission.outputs.source_sha }}
          cache-from: type=gha,scope=image-hft-core
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,scope=image-hft-core,mode=min' || '' }}

      - name: Scan explicitly built release image
        if: steps.tested.outputs.build == 'true'
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # master resolved 2026-10-01
        with:
          image-ref: monday-tested:hft-core-${{ needs.release-admission.outputs.source_sha }}
          severity: 'CRITICAL,HIGH'

      - name: Bind the explicit build identity
        if: steps.tested.outputs.build == 'true'
        env:
          SOURCE_SHA: ${{ needs.release-admission.outputs.source_sha }}
        run: |
          docker image inspect --format '{{.Id}}' "monday-tested:hft-core-$SOURCE_SHA" > "$RUNNER_TEMP/tested-image/image-id.txt"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          context: workflow
          images: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/hft
          tags: |
            type=raw,value=main,enable=${{ inputs.source_sha != '' || github.event_name == 'workflow_run' || github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=raw,value=sha-${{ needs.release-admission.outputs.source_sha_short }}
            type=raw,value=sha-${{ needs.release-admission.outputs.source_sha }}
          labels: |
            org.opencontainers.image.revision=${{ needs.release-admission.outputs.source_sha }}

      - name: Publish the verified image without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.release-admission.outputs.source_sha }}
          SOURCE_REF: ${{ inputs.source_sha != '' && 'refs/heads/main' || github.ref }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          policy=current-main
          [[ "$SOURCE_REF" != refs/tags/v* ]] || policy=main-history
          .github/scripts/wait-release-required-checks.sh "$SOURCE_SHA" "$policy"
          image_id=$(cat "$RUNNER_TEMP/tested-image/image-id.txt")
          [[ "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ $(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image_id") == "$SOURCE_SHA" ]]
          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            docker tag "$image_id" "$tag"
            docker push "$tag"
            # Buildx formatted Manifest JSON includes its descriptor digest;
            # raw OCI JSON (--raw) does not. See Docker inspect JSON-output docs.
            digest=$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}' | jq -er '.digest|select(test("^sha256:[0-9a-f]{64}$"))')
            immutable="${tag%:*}@$digest"
            docker pull "$immutable"
            [[ $(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$immutable") == "$SOURCE_SHA" ]]
            [[ $(docker image inspect --format '{{.Id}}' "$immutable") == "$image_id" ]]
            printf '%s %s source=%s\n' "$tag" "$digest" "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
          done <<< "$IMAGE_TAGS"
          .github/scripts/write-release-record.sh "$SOURCE_SHA" "$image_id" "$immutable" "$RUNNER_TEMP/ghcr-release-record.json"

      - name: Retain verified GHCR publication record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ghcr-release-record-${{ needs.release-admission.outputs.source_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ghcr-release-record.json
          if-no-files-found: error
          retention-days: 90
