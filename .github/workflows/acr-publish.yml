name: Publish ACR Images

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: acr-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - repository: research-runner
            file: rust_hft/deployment/docker/Dockerfile.research
          - repository: hft-trading
            file: rust_hft/deployment/docker/Dockerfile.trading

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.ACR_REGISTRY }}
          username: ${{ vars.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: rust_hft
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: ${{ vars.ACR_REGISTRY }}/monday/${{ matrix.repository }}:${{ github.sha }}
          cache-from: type=gha,scope=acr-${{ matrix.repository }}
          cache-to: type=gha,mode=max,scope=acr-${{ matrix.repository }}

      - name: Record immutable image
        run: |
          echo '${{ matrix.repository }}=${{ vars.ACR_REGISTRY }}/monday/${{ matrix.repository }}@${{ steps.build.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
