name: Publish ACR Images

on:
  workflow_run:
    workflows: ["Prediction Markets CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Image target to publish (polymarket-raw-ops uses binance-lob-archiver's full collector bundle)
        required: true
        default: all
        type: choice
        options:
          - all
          - research-runner
          - research-source-test
          - hft-trading
          - binance-lob-archiver
          - polymarket-raw-ops
          - polymarket-evidence-compiler
          - polymarket-market-recorder
      rebuild_research_runner:
        description: Explicitly rebuild research binaries for a manual publish
        required: true
        default: false
        type: boolean
      source_test_source_sha:
        description: Exact source commit for a non-production Cargo source-test image
        required: false
        default: ""
        type: string
      source_test_profile:
        description: Offline source-test profile to prove after publication
        required: true
        default: binance-bstocks-attestation
        type: choice
        options:
          - binance-bstocks-attestation
          - bybit-spot

permissions:
  actions: read
  contents: read

concurrency:
  group: acr-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  selector:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      publish_target: ${{ steps.source.outputs.publish_target }}
      research_mode: ${{ steps.source.outputs.research_mode }}
      source_sha: ${{ steps.source.outputs.source_sha }}
      artifact_run_id: ${{ steps.source.outputs.artifact_run_id }}
      source_test_profile: ${{ steps.source.outputs.source_test_profile }}
      source_test_tag: ${{ steps.source.outputs.source_test_tag }}
    steps:
      - name: Checkout source selector
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Read authenticated source job results
        id: source-jobs
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          jobs=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/jobs" \
            --jq '.jobs[] | [.name, .conclusion] | @tsv')
          job_conclusion() {
            local name=$1 matches
            matches=$(awk -F '\t' -v name="$name" '$1 == name {print $2}' <<<"$jobs")
            [[ -n "$matches" && "$matches" != *$'\n'* ]]
            printf '%s\n' "$matches"
          }
          echo "binaries_conclusion=$(job_conclusion 'Research image binaries')" >> "$GITHUB_OUTPUT"
          echo "smoke_conclusion=$(job_conclusion 'Research image smoke')" >> "$GITHUB_OUTPUT"

      - name: Select authenticated publish source
        id: source
        env:
          BINARIES_CONCLUSION: ${{ steps.source-jobs.outputs.binaries_conclusion }}
          SMOKE_CONCLUSION: ${{ steps.source-jobs.outputs.smoke_conclusion }}
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SOURCE_EVENT: ${{ github.event.workflow_run.event }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          PUBLISH_TARGET: ${{ inputs.target }}
          REBUILD_RESEARCH_RUNNER: ${{ inputs.rebuild_research_runner }}
          SOURCE_TEST_SOURCE_SHA: ${{ inputs.source_test_source_sha }}
          SOURCE_TEST_PROFILE: ${{ inputs.source_test_profile }}
          CURRENT_SHA: ${{ github.sha }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          CURRENT_REF: ${{ github.ref }}
        run: |
          .github/scripts/select-acr-publish-source.sh \
            --event "$EVENT_NAME" \
            --conclusion "$SOURCE_CONCLUSION" \
            --source-event "$SOURCE_EVENT" \
            --head-branch "$HEAD_BRANCH" \
            --head-sha "$HEAD_SHA" \
            --run-id "$SOURCE_RUN_ID" \
            --binaries-conclusion "$BINARIES_CONCLUSION" \
            --smoke-conclusion "$SMOKE_CONCLUSION" \
            --target "$PUBLISH_TARGET" \
            --rebuild "$REBUILD_RESEARCH_RUNNER" \
            --source-test-sha "$SOURCE_TEST_SOURCE_SHA" \
            --source-test-profile "$SOURCE_TEST_PROFILE" \
            --current-sha "$CURRENT_SHA" \
            --current-run-id "$CURRENT_RUN_ID" \
            --current-ref "$CURRENT_REF"

      - name: Select publish targets
        id: select
        env:
          TARGET: ${{ steps.source.outputs.publish_target }}
        run: |
          matrix=$(jq -cn --arg target "$TARGET" '
            [{repository:"research-runner",file:"rust_hft/deployment/docker/Dockerfile.research",target:"prebuilt"},
             {repository:"hft-trading",file:"rust_hft/deployment/docker/Dockerfile.trading",target:"runtime"},
             {repository:"binance-lob-archiver",file:"rust_hft/deployment/docker/Dockerfile.binance-lob-archiver",target:"runtime"},
             {repository:"polymarket-evidence-compiler",file:"rust_hft/deployment/docker/Dockerfile.polymarket-evidence-compiler",target:"runtime"},
             {repository:"polymarket-market-recorder",file:"rust_hft/deployment/docker/Dockerfile.polymarket-market-recorder",target:"runtime"}]
            | {include: map(select($target == "all" or .repository == $target))}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  research-runner-binaries:
    needs: selector
    if: needs.selector.outputs.research_mode == 'rebuild'
    runs-on: ubuntu-latest
    container: rust:1.91-bookworm
    defaults:
      run:
        working-directory: rust_hft
        shell: bash
    env:
      CARGO_INCREMENTAL: "0"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.selector.outputs.source_sha }}

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            clang \
            cmake \
            jq \
            mold \
            pkg-config \
            protobuf-compiler
          rm -rf /var/lib/apt/lists/*

      - name: Setup sccache
        id: sccache
        continue-on-error: true
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Disable sccache on setup failure
        if: steps.sccache.outcome == 'failure'
        run: |
          echo 'sccache setup failed; building without the wrapper (see 92991a3e fragility note)'
          echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_ENABLED=false" >> "$GITHUB_ENV"

      - name: Record cache dimensions
        id: cache-info
        shell: bash
        run: |
          echo "rust=$(rustc -Vv | awk '/^release:/ {print $2}')" >> "$GITHUB_OUTPUT"
          echo "sccache=$(${SCCACHE_PATH:-sccache} --version 2>/dev/null | awk '{print $2}' || true)" >> "$GITHUB_OUTPUT"

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust_hft
          key: research-image-bookworm-${{ steps.cache-info.outputs.rust }}-sccache-${{ steps.cache-info.outputs.sccache }}
          cache-all-crates: true

      - name: Build research runner binaries
        run: |
          set -euo pipefail
          cargo build --release --locked -p hft-backtest -p alpha-harness
          cargo build --release --locked -p hft-collector --bin lob-pit-materializer --bin binance-replay-parquet-materializer
          CARGO_TARGET_DIR=target/prediction-markets \
            cargo build \
              --manifest-path prediction-markets/Cargo.toml \
              --release \
              --locked \
              -p ploy-research \
              --features db \
              --bin monday-prediction-research \
              --bin monday-prediction-evaluator \
              --bin monday-prediction-snapshot
          install -D -m 0755 target/release/hft-backtest research-release/research-bin/hft-backtest
          install -D -m 0755 target/release/alpha-harness research-release/research-bin/alpha-harness
          install -D -m 0755 target/release/lob-pit-materializer research-release/research-bin/lob-pit-materializer
          install -D -m 0755 target/release/binance-replay-parquet-materializer research-release/research-bin/binance-replay-parquet-materializer
          install -D -m 0755 target/prediction-markets/release/monday-prediction-research research-release/research-bin/monday-prediction-research
          install -D -m 0755 target/prediction-markets/release/monday-prediction-evaluator research-release/research-bin/monday-prediction-evaluator
          install -D -m 0755 target/prediction-markets/release/monday-prediction-snapshot research-release/research-bin/monday-prediction-snapshot
          ../.github/scripts/research-image-release-artifact.sh create research-release \
            "${{ needs.selector.outputs.source_sha }}" \
            "${{ needs.selector.outputs.artifact_run_id }}" .

      - name: Show sccache stats
        if: always()
        run: ${SCCACHE_PATH:-sccache} --show-stats || true

      - name: Upload manual research image release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: research-image-release-${{ needs.selector.outputs.source_sha }}
          path: rust_hft/research-release/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [selector, research-runner-binaries]
    if: always() && needs.selector.result == 'success' && needs.selector.outputs.publish_target != 'none' && needs.selector.outputs.publish_target != 'research-source-test'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.selector.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.selector.outputs.source_sha }}

      - name: Require selected research release source
        if: matrix.repository == 'research-runner'
        env:
          RESEARCH_MODE: ${{ needs.selector.outputs.research_mode }}
          REBUILD_RESULT: ${{ needs.research-runner-binaries.result }}
        run: |
          [[ "$RESEARCH_MODE" == artifact ]] || \
            [[ "$RESEARCH_MODE" == rebuild && "$REBUILD_RESULT" == success ]]

      - name: Verify Binance fee release contract
        if: matrix.repository == 'binance-lob-archiver'
        run: deployment/aliyun/test-binance-fee-release-contract.sh

      - name: Download research runner binaries
        if: matrix.repository == 'research-runner'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: research-image-release-${{ needs.selector.outputs.source_sha }}
          path: research-release/
          run-id: ${{ needs.selector.outputs.artifact_run_id }}
          github-token: ${{ github.token }}

      - name: Restore research runner binary modes
        if: matrix.repository == 'research-runner'
        run: |
          chmod 0755 \
            research-release/research-bin/hft-backtest \
            research-release/research-bin/alpha-harness \
            research-release/research-bin/lob-pit-materializer \
            research-release/research-bin/binance-replay-parquet-materializer \
            research-release/research-bin/monday-prediction-research \
            research-release/research-bin/monday-prediction-evaluator \
            research-release/research-bin/monday-prediction-snapshot

      - name: Verify research runner binary artifact
        if: matrix.repository == 'research-runner'
        run: |
          .github/scripts/research-image-release-artifact.sh verify research-release \
            "${{ needs.selector.outputs.source_sha }}" \
            "${{ needs.selector.outputs.artifact_run_id }}" rust_hft
          mv research-release/research-bin rust_hft/research-bin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to ACR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ vars.ACR_REGISTRY }}
          username: ${{ vars.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: rust_hft
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          build-args: |
            SOURCE_REVISION=${{ needs.selector.outputs.source_sha }}
          tags: |
            ${{ vars.ACR_REGISTRY }}/wildcard0923/${{ matrix.repository }}:${{ needs.selector.outputs.source_sha }}
            ${{ vars.ACR_REGISTRY }}/wildcard0923/${{ matrix.repository }}:run-${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha,scope=acr-${{ matrix.repository }}
          cache-to: type=gha,mode=max,scope=acr-${{ matrix.repository }}
          labels: |
            org.opencontainers.image.revision=${{ needs.selector.outputs.source_sha }}

      - name: Record immutable image
        run: |
          echo '${{ matrix.repository }}=${{ vars.ACR_REGISTRY }}/wildcard0923/${{ matrix.repository }}@${{ steps.build.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"

      - name: Verify Polymarket compiler source binding
        if: matrix.repository == 'polymarket-evidence-compiler'
        env:
          IMAGE: ${{ vars.ACR_REGISTRY }}/wildcard0923/${{ matrix.repository }}@${{ steps.build.outputs.digest }}
          SOURCE_REVISION: ${{ needs.selector.outputs.source_sha }}
        run: |
          docker pull "$IMAGE"
          actual_source_revision=$(docker image inspect \
            --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' \
            "$IMAGE")
          test "$actual_source_revision" = "$SOURCE_REVISION"
          docker run --rm --entrypoint /usr/local/bin/polymarket-raw-ops "$IMAGE" \
            --version | grep -Fqx "polymarket-raw-ops $SOURCE_REVISION"

      - name: Verify Polymarket market recorder image
        if: matrix.repository == 'polymarket-market-recorder'
        env:
          IMAGE: ${{ vars.ACR_REGISTRY }}/wildcard0923/${{ matrix.repository }}@${{ steps.build.outputs.digest }}
          SOURCE_REVISION: ${{ needs.selector.outputs.source_sha }}
        run: |
          docker pull "$IMAGE"
          actual_source_revision=$(docker image inspect \
            --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' \
            "$IMAGE")
          test "$actual_source_revision" = "$SOURCE_REVISION"
          if output=$(docker run --rm "$IMAGE" --config /nonexistent 2>&1); then
            echo "recorder accepted an invocation without --dry-run" >&2
            exit 1
          fi
          grep -Fq 'requires --dry-run' <<<"$output"
          docker run --rm "$IMAGE" --dry-run --help 2>&1 \
            | grep -Fq -- '--dry-run'

      - name: Extract bare-metal Polymarket market recorder
        if: matrix.repository == 'polymarket-market-recorder'
        env:
          IMAGE: ${{ vars.ACR_REGISTRY }}/wildcard0923/${{ matrix.repository }}@${{ steps.build.outputs.digest }}
          SOURCE_REVISION: ${{ needs.selector.outputs.source_sha }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p polymarket-market-recorder-artifact
          container_id=$(docker create "$IMAGE")
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          docker cp "$container_id:/usr/local/bin/new-ploy-runner" \
            polymarket-market-recorder-artifact/new-ploy-runner
          chmod 0755 polymarket-market-recorder-artifact/new-ploy-runner
          .github/scripts/polymarket-market-recorder-release-artifact.sh create \
            polymarket-market-recorder-artifact "$SOURCE_REVISION" "$IMAGE_DIGEST"
          .github/scripts/polymarket-market-recorder-release-artifact.sh verify \
            polymarket-market-recorder-artifact "$SOURCE_REVISION" "$IMAGE_DIGEST"
          tar --format=ustar -cf polymarket-market-recorder-linux-amd64.tar \
            -C polymarket-market-recorder-artifact .

      - name: Upload bare-metal Polymarket market recorder
        if: matrix.repository == 'polymarket-market-recorder'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: polymarket-market-recorder-linux-amd64-${{ needs.selector.outputs.source_sha }}
          path: polymarket-market-recorder-linux-amd64.tar
          if-no-files-found: error
          retention-days: 90

      - name: Verify research runner image
        if: matrix.repository == 'research-runner'
        env:
          IMAGE: ${{ vars.ACR_REGISTRY }}/wildcard0923/${{ matrix.repository }}@${{ steps.build.outputs.digest }}
          SOURCE_REVISION: ${{ needs.selector.outputs.source_sha }}
        run: |
          set -euo pipefail
          docker pull "$IMAGE"
          actual_source_revision=$(docker image inspect \
            --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' \
            "$IMAGE")
          test "$actual_source_revision" = "$SOURCE_REVISION"
          docker run --rm --entrypoint /bin/sh "$IMAGE" -ceu '
            for binary in hft-backtest alpha-harness lob-pit-materializer binance-replay-parquet-materializer monday-prediction-research monday-prediction-evaluator monday-prediction-snapshot; do
              test -x "/usr/local/bin/$binary"
            done
          '
          docker run --rm \
            --entrypoint /usr/local/bin/monday-prediction-research \
            "$IMAGE" \
            --print-policy-snapshot-id | grep -Eq '^sha256:[0-9a-f]{64}$'
          docker run --rm \
            --entrypoint /usr/local/bin/binance-replay-parquet-materializer \
            "$IMAGE" \
            --help >/dev/null

      - name: Package bare-metal trading host contract
        if: matrix.repository == 'hft-trading'
        env:
          IMAGE_REPOSITORY: ${{ vars.ACR_REGISTRY }}/wildcard0923/hft-trading
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p trading-host-artifact
          trading_control_assets=(
            hft-trading-ecs.service
            trading-ecs-hostctl.sh
            trading-ecs-paper-shadow-policy.jq
            trading-ecs-runtime.sh
          )
          (
            cd deployment/aliyun
            sha256sum "${trading_control_assets[@]}" \
              > ../../trading-host-artifact/trading-ecs-control-assets.sha256
            tar --sort=name --mtime='UTC 1970-01-01' \
              --owner=0 --group=0 --numeric-owner \
              -czf ../../trading-host-artifact/trading-ecs-control.tar.gz \
              "${trading_control_assets[@]}"
          )
          (
            cd trading-host-artifact
            published_registry=${IMAGE_REPOSITORY%%/*}
            repository_path=${IMAGE_REPOSITORY#*/}
            case "$published_registry" in
              *-vpc.ap-northeast-1.personal.cr.aliyuncs.com)
                vpc_registry=$published_registry
                published_registry=${published_registry/-vpc.ap-northeast-1.personal.cr.aliyuncs.com/.ap-northeast-1.personal.cr.aliyuncs.com}
                ;;
              *.ap-northeast-1.personal.cr.aliyuncs.com)
                vpc_registry=${published_registry/.ap-northeast-1.personal.cr.aliyuncs.com/-vpc.ap-northeast-1.personal.cr.aliyuncs.com}
                ;;
              *)
                echo "ACR_REGISTRY must be a Tokyo Personal Edition endpoint" >&2
                exit 1
                ;;
            esac
            published_repository="$published_registry/$repository_path"
            vpc_repository="$vpc_registry/$repository_path"
            control_manifest_sha=$(sha256sum trading-ecs-control-assets.sha256 \
              | awk '{print $1}')
            control_archive_sha=$(sha256sum trading-ecs-control.tar.gz \
              | awk '{print $1}')
            jq -S -n \
              --arg source_revision '${{ needs.selector.outputs.source_sha }}' \
              --arg published_repository "$published_repository" \
              --arg image_repository "$vpc_repository" \
              --arg image_digest "$IMAGE_DIGEST" \
              --arg image_reference "$vpc_repository@$IMAGE_DIGEST" \
              --arg control_manifest_sha256 "$control_manifest_sha" \
              --arg control_archive_sha256 "$control_archive_sha" \
              '{schema:"monday.hft_trading_ecs_release.v1",
                source_revision:$source_revision,
                image:{published_repository:$published_repository,
                  repository:$image_repository,digest:$image_digest,
                  reference:$image_reference},
                control_manifest:{file:"trading-ecs-control-assets.sha256",
                  sha256:$control_manifest_sha256},
                control_archive:{file:"trading-ecs-control.tar.gz",
                  sha256:$control_archive_sha256},
                platform:{region:"ap-northeast-1",host_os:"ubuntu",
                  host_version:"26.04",architecture:"amd64",
                  orchestrator:"none"}}' \
              > hft-trading-ecs-release.json
            sha256sum hft-trading-ecs-release.json \
              > hft-trading-ecs-release.json.sha256
          )

      - name: Upload bare-metal trading host contract
        if: matrix.repository == 'hft-trading'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hft-trading-ecs-linux-amd64-${{ github.sha }}
          path: trading-host-artifact/
          if-no-files-found: error
          retention-days: 90

      - name: Extract collector binaries for bare-metal ECS
        if: matrix.repository == 'binance-lob-archiver'
        env:
          IMAGE: ${{ vars.ACR_REGISTRY }}/wildcard0923/${{ matrix.repository }}@${{ steps.build.outputs.digest }}
        run: |
          mkdir -p artifact
          docker pull "$IMAGE"
          container_id=$(docker create "$IMAGE")
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          docker cp "$container_id:/usr/local/bin/binance-lob-archiver" artifact/binance-lob-archiver
          docker cp "$container_id:/usr/local/bin/polymarket-raw-ops" artifact/polymarket-raw-ops
          docker cp "$container_id:/usr/local/bin/bybit-options-archiver" artifact/bybit-options-archiver
          docker cp "$container_id:/usr/local/bin/binance-usdm-reference-collector" artifact/binance-usdm-reference-collector
          docker cp "$container_id:/usr/local/bin/binance-usdm-reference-artifact-verifier" artifact/binance-usdm-reference-artifact-verifier
          docker cp "$container_id:/usr/local/bin/binance-usdm-reference-upload" artifact/binance-usdm-reference-upload
          docker cp "$container_id:/usr/local/bin/binance-fee-snapshot" artifact/binance-fee-snapshot
          docker cp "$container_id:/usr/local/bin/binance-fee-snapshot-upload" artifact/binance-fee-snapshot-upload
          chmod 0755 artifact/binance-lob-archiver
          chmod 0755 artifact/polymarket-raw-ops
          chmod 0755 artifact/bybit-options-archiver
          chmod 0755 artifact/binance-usdm-reference-collector
          chmod 0755 artifact/binance-usdm-reference-artifact-verifier
          chmod 0755 artifact/binance-usdm-reference-upload
          chmod 0755 artifact/binance-fee-snapshot
          chmod 0755 artifact/binance-fee-snapshot-upload
          artifact/binance-lob-archiver --version \
            | grep -Fqx 'binance-lob-archiver ${{ needs.selector.outputs.source_sha }}'
          artifact/polymarket-raw-ops --version \
            | grep -Fqx 'polymarket-raw-ops ${{ needs.selector.outputs.source_sha }}'
          artifact/bybit-options-archiver --version \
            | grep -Fqx 'bybit-options-archiver ${{ needs.selector.outputs.source_sha }}'
          (
            cd artifact
            sha256sum binance-lob-archiver | tee binance-lob-archiver.sha256
            sha256sum polymarket-raw-ops | tee polymarket-raw-ops.sha256
            sha256sum bybit-options-archiver | tee bybit-options-archiver.sha256
            sha256sum binance-usdm-reference-collector \
              | tee binance-usdm-reference-collector.sha256
            sha256sum binance-usdm-reference-artifact-verifier \
              | tee binance-usdm-reference-artifact-verifier.sha256
            sha256sum binance-usdm-reference-upload \
              | tee binance-usdm-reference-upload.sha256
            sha256sum binance-fee-snapshot \
              | tee binance-fee-snapshot.sha256
            sha256sum binance-fee-snapshot-upload \
              | tee binance-fee-snapshot-upload.sha256
          )
          control_assets=(
            polymarket-raw-ops-gate-control.sh
            polymarket-raw-ops-gate@.service
            polymarket-raw-ops-shadow-gate.sh
            polymarket-raw-ops-cutover.sh
            polymarket-shadow-gate-policy.jq
            polymarket-legacy-health-policy.jq
            polymarket-rust-health-policy.jq
            polymarket-reference-collector-shadow@.service
            polymarket-reference-collector.service
            polymarket-reference-upload.service
            polymarket-reference-upload.timer
            polymarket-market-tape-upload.service
            polymarket-market-tape-upload.timer
          )
          (
            cd deployment/aliyun
            sha256sum "${control_assets[@]}" > ../../artifact/polymarket-raw-ops-control-assets.sha256
            tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
              -czf ../../artifact/polymarket-raw-ops-control.tar.gz "${control_assets[@]}"
          )
          reference_control_assets=(
            binance-usdm-reference-collector-shadow@.service
            binance-usdm-reference-shadow-gate.sh
            binance-usdm-reference-shadow-gate-policy.jq
          )
          (
            cd deployment/aliyun
            sha256sum "${reference_control_assets[@]}" \
              > ../../artifact/binance-usdm-reference-control-assets.sha256
            tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
              -czf ../../artifact/binance-usdm-reference-control.tar.gz \
              "${reference_control_assets[@]}"
          )
          reference_production_assets=(
            binance-usdm-reference-collector.service
            binance-usdm-reference-upload.service
            binance-usdm-reference-upload.timer
            binance-usdm-reference-upload.env
            binance-usdm-reference-cutover.sh
          )
          (
            cd deployment/aliyun
            sha256sum "${reference_production_assets[@]}" \
              > ../../artifact/binance-usdm-reference-production-control-assets.sha256
            tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
              -czf ../../artifact/binance-usdm-reference-production-control.tar.gz \
              "${reference_production_assets[@]}"
          )
          fee_production_assets=(
            binance-fee-snapshot-spot.service
            binance-fee-snapshot-spot.timer
            binance-fee-snapshot-usdm.service
            binance-fee-snapshot-usdm.timer
            binance-fee-upload.service
            binance-fee-upload.timer
            binance-fee-upload.env
            binance-fee.conf
            monday-collector-health.sh
          )
          (
            cd deployment/aliyun
            sha256sum "${fee_production_assets[@]}" \
              > ../../artifact/binance-fee-production-control-assets.sha256
            tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
              -czf ../../artifact/binance-fee-production-control.tar.gz \
              "${fee_production_assets[@]}"
          )
          (
            cd artifact
            candidate_sha=$(awk 'NR == 1 {print $1}' polymarket-raw-ops.sha256)
            control_manifest_sha=$(sha256sum polymarket-raw-ops-control-assets.sha256 \
              | awk '{print $1}')
            control_archive_sha=$(sha256sum polymarket-raw-ops-control.tar.gz \
              | awk '{print $1}')
            reference_candidate_sha=$(awk 'NR == 1 {print $1}' \
              binance-usdm-reference-collector.sha256)
            reference_verifier_sha=$(awk 'NR == 1 {print $1}' \
              binance-usdm-reference-artifact-verifier.sha256)
            reference_control_manifest_sha=$(sha256sum \
              binance-usdm-reference-control-assets.sha256 | awk '{print $1}')
            reference_control_archive_sha=$(sha256sum \
              binance-usdm-reference-control.tar.gz | awk '{print $1}')
            jq -S -n \
              --arg source_revision '${{ needs.selector.outputs.source_sha }}' \
              --arg candidate_sha256 "$reference_candidate_sha" \
              --arg verifier_sha256 "$reference_verifier_sha" \
              --arg control_manifest_sha256 "$reference_control_manifest_sha" \
              --arg control_archive_sha256 "$reference_control_archive_sha" \
              '{schema:"monday.binance_usdm_reference_release.v1",
                source_revision:$source_revision,
                candidate:{file:"binance-usdm-reference-collector",sha256:$candidate_sha256},
                verifier:{file:"binance-usdm-reference-artifact-verifier",sha256:$verifier_sha256},
                control_manifest:{file:"binance-usdm-reference-control-assets.sha256",
                  sha256:$control_manifest_sha256},
                control_archive:{file:"binance-usdm-reference-control.tar.gz",
                  sha256:$control_archive_sha256}}' \
              > binance-usdm-reference-release.json
            sha256sum binance-usdm-reference-release.json \
              > binance-usdm-reference-release.json.sha256
            printf '%s  %s\n' "$reference_control_archive_sha" \
              binance-usdm-reference-control.tar.gz \
              > binance-usdm-reference-control.tar.gz.sha256
            reference_production_control_archive_sha=$(sha256sum \
              binance-usdm-reference-production-control.tar.gz | awk '{print $1}')
            printf '%s  %s\n' "$reference_production_control_archive_sha" \
              binance-usdm-reference-production-control.tar.gz \
              > binance-usdm-reference-production-control.tar.gz.sha256
            fee_candidate_sha=$(awk 'NR == 1 {print $1}' binance-fee-snapshot.sha256)
            fee_uploader_sha=$(awk 'NR == 1 {print $1}' binance-fee-snapshot-upload.sha256)
            fee_control_manifest_sha=$(sha256sum \
              binance-fee-production-control-assets.sha256 | awk '{print $1}')
            fee_control_archive_sha=$(sha256sum \
              binance-fee-production-control.tar.gz | awk '{print $1}')
            printf '%s  %s\n' "$fee_control_archive_sha" \
              binance-fee-production-control.tar.gz \
              > binance-fee-production-control.tar.gz.sha256
            jq -S -n \
              --arg source_revision '${{ needs.selector.outputs.source_sha }}' \
              --arg candidate_sha256 "$fee_candidate_sha" \
              --arg uploader_sha256 "$fee_uploader_sha" \
              --arg control_manifest_sha256 "$fee_control_manifest_sha" \
              --arg control_archive_sha256 "$fee_control_archive_sha" \
              '{schema:"monday.binance_fee_release.v1",
                source_revision:$source_revision,
                candidate:{file:"binance-fee-snapshot",sha256:$candidate_sha256},
                uploader:{file:"binance-fee-snapshot-upload",sha256:$uploader_sha256},
                control_manifest:{file:"binance-fee-production-control-assets.sha256",
                  sha256:$control_manifest_sha256},
                control_archive:{file:"binance-fee-production-control.tar.gz",
                  sha256:$control_archive_sha256}}' \
              > binance-fee-release.json
            sha256sum binance-fee-release.json > binance-fee-release.json.sha256
            jq -S -n \
              --arg source_revision '${{ needs.selector.outputs.source_sha }}' \
              --arg candidate_sha256 "$candidate_sha" \
              --arg control_manifest_sha256 "$control_manifest_sha" \
              --arg control_archive_sha256 "$control_archive_sha" \
              '{schema:"monday.polymarket_raw_ops_release.v1",
                source_revision:$source_revision,
                candidate:{file:"polymarket-raw-ops",sha256:$candidate_sha256},
                control_manifest:{file:"polymarket-raw-ops-control-assets.sha256",
                  sha256:$control_manifest_sha256},
                control_archive:{file:"polymarket-raw-ops-control.tar.gz",
                  sha256:$control_archive_sha256}}' \
              > polymarket-raw-ops-release.json
            sha256sum polymarket-raw-ops-release.json \
              > polymarket-raw-ops-release.json.sha256
            jq -er '.source_revision' polymarket-raw-ops-release.json \
              > source-revision.txt
            jq -er '.control_manifest.sha256' polymarket-raw-ops-release.json \
              > deployment-bundle.sha256
            printf '%s  %s\n' \
              "$(jq -er '.control_archive.sha256' polymarket-raw-ops-release.json)" \
              polymarket-raw-ops-control.tar.gz \
              > polymarket-raw-ops-control.tar.gz.sha256
          )

      - name: Upload collector binary artifact bundle
        if: matrix.repository == 'binance-lob-archiver'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: binance-lob-archiver-linux-amd64-${{ github.sha }}
          path: artifact/
          if-no-files-found: error
          retention-days: 7

      - name: Remove ACR credentials
        if: always()
        env:
          ACR_REGISTRY: ${{ vars.ACR_REGISTRY }}
        run: |
          docker logout "$ACR_REGISTRY" >/dev/null 2>&1 || true
          docker_config_root=${DOCKER_CONFIG:-$HOME/.docker}
          rm -f -- "$docker_config_root/config.json"

  publish-source-test:
    needs: selector
    if: needs.selector.outputs.publish_target == 'research-source-test'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted source-test image contract
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Checkout exact source revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.selector.outputs.source_sha }}
          path: source
          fetch-depth: 1
          sparse-checkout: rust_hft
          persist-credentials: false

      - name: Remove source checkout metadata
        run: rm -rf -- source/.git

      - name: Validate source-test profile
        env:
          TEST_PROFILE: ${{ needs.selector.outputs.source_test_profile }}
        run: |
          case "$TEST_PROFILE" in
            binance-bstocks-attestation|bybit-spot) ;;
            *) echo "unsupported source-test profile: $TEST_PROFILE" >&2; exit 1 ;;
          esac

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to ACR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ vars.ACR_REGISTRY }}
          username: ${{ vars.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Refuse source-test tag overwrite
        env:
          IMAGE_TAG: ${{ vars.ACR_REGISTRY }}/wildcard0923/research-source-test:${{ needs.selector.outputs.source_test_tag }}
        run: |
          if probe_output=$(docker manifest inspect "$IMAGE_TAG" 2>&1); then
            echo "source-test image tag already exists: $IMAGE_TAG" >&2
            exit 1
          fi
          case "${probe_output,,}" in
            *"manifest unknown"*|*"no such manifest"*) ;;
            *) echo 'could not prove source-test image tag is absent' >&2; exit 1 ;;
          esac

      - name: Build source-test image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: rust_hft/deployment/docker/Dockerfile.source-test
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          build-args: |
            SOURCE_REVISION=${{ needs.selector.outputs.source_sha }}
          tags: |
            ${{ vars.ACR_REGISTRY }}/wildcard0923/research-source-test:${{ needs.selector.outputs.source_test_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.selector.outputs.source_sha }}
            com.monday.image.purpose=non-production-source-test
            com.monday.image.retention=single-ack-test
            com.monday.image.source-test-profile=${{ needs.selector.outputs.source_test_profile }}
            com.monday.image.source-test-identity=${{ needs.selector.outputs.source_test_tag }}

      - name: Verify source-test image before publication
        env:
          IMAGE: ${{ vars.ACR_REGISTRY }}/wildcard0923/research-source-test:${{ needs.selector.outputs.source_test_tag }}
          SOURCE_REVISION: ${{ needs.selector.outputs.source_sha }}
          TEST_PROFILE: ${{ needs.selector.outputs.source_test_profile }}
          SOURCE_TEST_TAG: ${{ needs.selector.outputs.source_test_tag }}
        run: |
          set -euo pipefail
          actual_source_revision=$(docker image inspect \
            --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' \
            "$IMAGE")
          actual_source_test_profile=$(docker image inspect \
            --format '{{ index .Config.Labels "com.monday.image.source-test-profile" }}' \
            "$IMAGE")
          actual_source_test_identity=$(docker image inspect \
            --format '{{ index .Config.Labels "com.monday.image.source-test-identity" }}' \
            "$IMAGE")
          test "$actual_source_revision" = "$SOURCE_REVISION"
          test "$actual_source_test_profile" = "$TEST_PROFILE"
          test "$actual_source_test_identity" = "$SOURCE_TEST_TAG"
          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=16g \
            --tmpfs /tmp/monday-source-test-target:rw,exec,nosuid,nodev,mode=0700,uid=1000,gid=1000,size=16g \
            "$IMAGE" "$TEST_PROFILE"

      - name: Push verified source-test image
        id: push
        env:
          IMAGE_TAG: ${{ vars.ACR_REGISTRY }}/wildcard0923/research-source-test:${{ needs.selector.outputs.source_test_tag }}
        run: |
          set -euo pipefail
          docker push "$IMAGE_TAG"
          digest=$(docker buildx imagetools inspect "$IMAGE_TAG" --format '{{json .Manifest}}' | jq -r '.digest')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Record immutable source-test image
        env:
          IMAGE: ${{ vars.ACR_REGISTRY }}/wildcard0923/research-source-test@${{ steps.push.outputs.digest }}
          IMAGE_TAG: ${{ vars.ACR_REGISTRY }}/wildcard0923/research-source-test:${{ needs.selector.outputs.source_test_tag }}
          SOURCE_REVISION: ${{ needs.selector.outputs.source_sha }}
          TEST_PROFILE: ${{ needs.selector.outputs.source_test_profile }}
        run: |
          {
            echo "research-source-test=$IMAGE"
            echo "source_revision=$SOURCE_REVISION"
            echo "verified_profile=$TEST_PROFILE"
            echo "publication_identity=$SOURCE_REVISION/$TEST_PROFILE"
            echo "publication_tag=$IMAGE_TAG"
            echo "retention=single ACK source-test Job; no runtime deployment"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove ACR credentials
        if: always()
        env:
          ACR_REGISTRY: ${{ vars.ACR_REGISTRY }}
        run: |
          docker logout "$ACR_REGISTRY" >/dev/null 2>&1 || true
          docker_config_root=${DOCKER_CONFIG:-$HOME/.docker}
          rm -f -- "$docker_config_root/config.json"
