name: Release

# workflow_run fires once per upstream workflow. Publish only after every
# required check for that same head SHA is success or skipped, and only once.
on:
  workflow_run:
    workflows: ["Monorepo CI", "Prediction Markets CI", "Security & Quality (ENABLED)"]
    types: [completed]
    branches: [main]

concurrency:
  group: release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

permissions:
  actions: read
  checks: read
  contents: read
  packages: write

jobs:
  source:
    name: Release source v1 [${{ github.event.workflow_run.head_sha }}] [${{ github.event.workflow_run.id }}/${{ github.event.workflow_run.run_attempt }}]
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Record original CI identity
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
          CI_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CI_RUN_ID" =~ ^[1-9][0-9]*$ && "$CI_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]

  admit:
    name: Admit release
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    outputs:
      publish_ghcr: ${{ steps.gate.outputs.publish_ghcr }}
      source_sha: ${{ steps.gate.outputs.source_sha }}
      reason: ${{ steps.gate.outputs.reason }}
    permissions:
      actions: read
      checks: read
      contents: read
      packages: read
    steps:
      - name: Checkout release admission
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: refs/heads/main
          fetch-depth: 1
      - name: Publish only once all required checks are green
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: .github/scripts/release-orchestrator-admit.sh "$SOURCE_SHA"

  publish-ghcr:
    name: Publish GHCR
    needs: admit
    if: needs.admit.result == 'success' && needs.admit.outputs.publish_ghcr == 'true'
    permissions:
      actions: read
      checks: read
      contents: read
      packages: write
      pull-requests: read
    uses: ./.github/workflows/docker-publish.yml
    with:
      source_sha: ${{ needs.admit.outputs.source_sha }}
