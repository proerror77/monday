            echo "### sccache: rust-research-heavy"
            echo '```'
            cat /tmp/sccache-stats.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Frontend
    needs: image-smoke-scope
    if: ${{ contains(needs.image-smoke-scope.outputs.jobs, ',ploy/frontend,') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rust_hft/prediction-markets/ploy-frontend/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust_hft/prediction-markets
          shared-key: frontend-contracts-${{ hashFiles('rust_hft/prediction-markets/**/Cargo.lock') }}

      - name: Validate frontend
        run: |
          set -euo pipefail
          SECONDS=0
          cargo run --locked -p ploy-operator-contracts --example export_schemas -- --check
          node scripts/export_operator_contract_types.mjs --check
          npm ci --prefix ploy-frontend
          npm run contracts:check --prefix ploy-frontend
          npm run lint --prefix ploy-frontend
          npm run build --prefix ploy-frontend
          if rg -n -i 'unstable_(RSC(HydratedRouter|StaticRouter|Payload)?|getRSCStream|createCallServer|routeRSCServerRequest|matchRSCServerRequest|reactRouterRSC)|@vitejs/plugin-rsc|react-server-dom' ploy-frontend; then
            echo "frontend must not use RSC APIs while GHSA-qwww-vcr4-c8h2 is excepted" >&2
            exit 1
          fi
          audit_report="$(mktemp)"
          if ! npm audit --omit=dev --audit-level=moderate --json --prefix ploy-frontend > "$audit_report"; then
            node - "$audit_report" <<'NODE'
          const report = JSON.parse(require('node:fs').readFileSync(process.argv[2], 'utf8'));
          const ignored = 'https://github.com/advisories/GHSA-qwww-vcr4-c8h2';
          const rank = { low: 1, moderate: 2, high: 3, critical: 4 };
          const advisories = Object.values(report.vulnerabilities ?? {}).flatMap((vulnerability) =>
            vulnerability.via.filter((via) => typeof via !== 'string'),
          );
          const unexpected = advisories.filter((advisory) =>
            rank[advisory.severity] >= rank.moderate && advisory.url !== ignored,
          );
          if (unexpected.length || !advisories.some((advisory) => advisory.url === ignored)) {
            console.error(JSON.stringify(unexpected.length ? unexpected : advisories, null, 2));
            process.exit(1);
          }
          NODE
          fi
          oversized_chunks="$(find ploy-frontend/dist/assets -type f -name '*.js' -size +500k -print)"
          if [ -n "${oversized_chunks}" ]; then
            echo "frontend JavaScript chunks exceed 500 KiB:" >&2
            echo "${oversized_chunks}" >&2
            exit 1
          fi

      - name: Summarize frontend lane
        run: |
          echo "### Frontend lane" >> "$GITHUB_STEP_SUMMARY"
          echo "TypeScript is limited to the operator UI; the agent sidecar runs in the Rust control-plane lane." >> "$GITHUB_STEP_SUMMARY"

