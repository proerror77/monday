  rust-research-heavy:
    name: Rust research heavy features
    needs: image-smoke-scope
    if: ${{ contains(needs.image-smoke-scope.outputs.jobs, ',ploy/rust-research-heavy,') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
