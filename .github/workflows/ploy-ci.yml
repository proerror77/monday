name: Prediction Markets CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "rust_hft/**"
      - ".cargo/**"
      - "deployment/aliyun/research/**"
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".github/scripts/**"
      - "*"
  workflow_dispatch:

concurrency:
  group: prediction-markets-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: rust_hft/prediction-markets

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  SQLX_CLI_VERSION: 0.8.6
  SCCACHE_CACHE_SIZE: 10G

jobs:
  image-smoke-selector:
    name: CI job selector
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      jobs: ${{ steps.scope.outputs.jobs }}
      selection_complete: ${{ steps.scope.outputs.selection_complete }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Test CI job selector
        run: ../../.github/scripts/test-select-rust-ci-scope.sh

      - name: Select CI jobs
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          ../../.github/scripts/select-rust-ci-scope.sh
          --event "${GITHUB_EVENT_NAME}"
          --base "${BASE_SHA}"
          --head "${HEAD_SHA}"

  image-smoke-scope:
    name: Research image smoke scope
    needs: image-smoke-selector
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      jobs: ${{ steps.scope.outputs.jobs }}
    steps:
      - name: Resolve selector result
        id: scope
        working-directory: .
        env:
          SELECTOR_RESULT: ${{ needs.image-smoke-selector.result }}
          SELECTED_JOBS: ${{ needs.image-smoke-selector.outputs.jobs }}
          SELECTED_COMPLETE: ${{ needs.image-smoke-selector.outputs.selection_complete }}
        run: |
          if [[ "$SELECTOR_RESULT" == success && "$SELECTED_COMPLETE" == true ]] &&
             [[ "$SELECTED_JOBS" =~ ^,(|[a-z0-9/-]+(,[a-z0-9/-]+)*),$ ]]; then
            printf 'jobs=%s\n' "$SELECTED_JOBS"
          else
            printf '%s\n' 'jobs=,ploy/commit-hygiene,ploy/workflow-lint,ploy/research-image-binaries,ploy/research-image-smoke,ploy/rust-format,ploy/safety-scans,ploy/audit,ploy/rust-control-plane,ploy/rust-runner-lean,ploy/rust-runner-full,ploy/rust-market-data,ploy/rust-research-heavy,ploy/frontend,ploy/integration-regressions,'
          fi >> "$GITHUB_OUTPUT"

  commit-hygiene:
    name: Commit hygiene
    needs: image-smoke-scope
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' && contains(needs.image-smoke-scope.outputs.jobs, ',ploy/commit-hygiene,') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check commit subjects
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          range="${BASE_SHA}..HEAD"
          echo "Checking commit subjects in range: ${range}"
          git log --oneline "${range}"

          bad_commits="$(git log --format='%h %s' "${range}" | grep -E '^[0-9a-f]+ (WIP|wip|fixup!|squash!)' || true)"
          if [ -n "${bad_commits}" ]; then
            echo "Found non-atomic/WIP commit subjects:"
            echo "${bad_commits}"
            echo "Please squash or rewrite commit messages before merge."
            exit 1
          fi

  workflow-lint:
    name: Workflow lint
    needs: image-smoke-scope
    if: ${{ contains(needs.image-smoke-scope.outputs.jobs, ',ploy/workflow-lint,') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

      - name: Run actionlint
        run: >-
          "${HOME}/go/bin/actionlint" -color
          ../../.github/workflows/ploy-ci.yml
          ../../.github/workflows/acr-publish.yml

      - name: Test ACR publish workflow contract
        run: ../../.github/scripts/test-acr-publish-workflow.sh

  research-image-binaries:
    name: Research image binaries
    needs: image-smoke-scope
    if: ${{ contains(needs.image-smoke-scope.outputs.jobs, ',ploy/research-image-binaries,') }}
    runs-on: ubuntu-latest
    container: rust:1.91-bookworm
    timeout-minutes: 30
    defaults:
      run:
        working-directory: rust_hft
        shell: bash
    env:
      CARGO_INCREMENTAL: "0"
      RUSTC_WRAPPER: sccache
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            clang \
            cmake \
            jq \
            mold \
            pkg-config \
            protobuf-compiler \
            sccache
          rm -rf /var/lib/apt/lists/*

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust_hft
          key: research-image-bookworm-${{ hashFiles('rust_hft/**/Cargo.lock') }}
          cache-all-crates: true

      - name: Cache sccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/sccache
          key: ${{ runner.os }}-sccache-research-image-${{ hashFiles('rust_hft/**/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-sccache-research-image-${{ hashFiles('rust_hft/**/Cargo.lock') }}-

      - name: Build research image binaries
        run: |
          set -euo pipefail
          sccache --zero-stats
          cargo build \
            --release \
            --locked \
            -p hft-backtest \
            -p alpha-harness
          cargo build \
            --release \
            --locked \
            -p hft-collector \
            --bin lob-pit-materializer
          CARGO_TARGET_DIR=target/prediction-markets \
            cargo build \
              --manifest-path prediction-markets/Cargo.toml \
              --release \
              --locked \
              -p ploy-research \
              --features db \
              --bin monday-prediction-research \
              --bin monday-prediction-evaluator \
              --bin monday-prediction-snapshot
          install -D -m 0755 target/release/hft-backtest research-release/research-bin/hft-backtest
          install -D -m 0755 target/release/alpha-harness research-release/research-bin/alpha-harness
          install -D -m 0755 target/release/lob-pit-materializer research-release/research-bin/lob-pit-materializer
          install -D -m 0755 target/prediction-markets/release/monday-prediction-research research-release/research-bin/monday-prediction-research
          install -D -m 0755 target/prediction-markets/release/monday-prediction-evaluator research-release/research-bin/monday-prediction-evaluator
          install -D -m 0755 target/prediction-markets/release/monday-prediction-snapshot research-release/research-bin/monday-prediction-snapshot

      - name: Create authenticated research image release manifest
        run: |
          ../.github/scripts/research-image-release-artifact.sh create \
            research-release "$GITHUB_SHA" "$GITHUB_RUN_ID" .

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats || true

      - name: Upload research image release
        uses: actions/upload-artifact@v4
        with:
          name: research-image-release-${{ github.sha }}
          path: rust_hft/research-release/
          if-no-files-found: error
          retention-days: 1

  research-image-smoke:
    name: Research image smoke
    needs:
      - image-smoke-scope
      - research-image-binaries
    if: ${{ contains(needs.image-smoke-scope.outputs.jobs, ',ploy/research-image-smoke,') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Download research image release
        uses: actions/download-artifact@v4
        with:
          name: research-image-release-${{ github.sha }}
          path: research-release/

      - name: Verify research image release
        working-directory: .
        run: |
          chmod 0755 research-release/research-bin/*
          .github/scripts/research-image-release-artifact.sh verify research-release \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" rust_hft
          mv research-release/research-bin rust_hft/research-bin

      - name: Build the unified research image
        uses: docker/build-push-action@v7
        with:
          context: rust_hft
          file: rust_hft/deployment/docker/Dockerfile.research
          target: prebuilt
          load: true
          tags: monday-research-smoke:local
          cache-from: type=gha,scope=prediction-research-image
          cache-to: type=gha,mode=max,scope=prediction-research-image

      - name: Probe precompiled prediction entrypoints
        run: |
          set -euo pipefail
          docker run --rm \
            --entrypoint /usr/local/bin/monday-prediction-research \
            monday-research-smoke:local \
            --print-policy-snapshot-id | grep -Eq '^sha256:[0-9a-f]{64}$'
          docker run --rm \
            --entrypoint /usr/local/bin/alpha-harness \
            monday-research-smoke:local \
            prediction --help

  rust-format:
    name: Rust formatting
    needs: image-smoke-scope
    if: ${{ contains(needs.image-smoke-scope.outputs.jobs, ',ploy/rust-format,') }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.0
          components: rustfmt

      - name: Check Rust formatting
        run: |
          mapfile -t packages < <(
            cargo +1.91.0 metadata --locked --no-deps --format-version 1 |
              jq -r '. as $metadata | .packages[] | select(.id as $id | $metadata.workspace_members | index($id)) | .name'
          )
          test "${#packages[@]}" -gt 0
          fmt_args=()
          for package in "${packages[@]}"; do
            fmt_args+=(--package "$package")
          done
          cargo +1.91.0 fmt "${fmt_args[@]}" -- --check

  safety-scans:
    name: Retired route and SSH safety scans
    needs: image-smoke-scope
    if: ${{ contains(needs.image-smoke-scope.outputs.jobs, ',ploy/safety-scans,') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Validate frontend route contract
        run: node ploy-frontend/scripts/check-route-contract.mjs

      - name: Enforce Rust-only research surface
        run: |
          set -euo pipefail

          forbidden_paths="$(git ls-files \
            ':(icase,glob)**/*.py' \
            ':(icase,glob)**/*.pyw' \
            ':(icase,glob)**/*.ipynb' \
            ':(icase,glob)**/*.py[cod]' \
            ':(icase,glob)**/requirements*.txt' \
            ':(icase,glob)**/pyproject.toml' \
            ':(icase,glob)**/Pipfile' \
            ':(icase,glob)**/poetry.lock' \
            ':(icase,glob)**/pytest.ini' \
            ':(icase,glob)**/tox.ini' \
            ':(icase,glob)**/setup.py')"
          if [ -n "${forbidden_paths}" ]; then
            echo "tracked Py""thon source, notebook, bytecode, or packaging artifact is forbidden" >&2
            printf '%s\n' "${forbidden_paths}" >&2
            exit 1
          fi

          reject_python_text() {
            label="$1"
            pattern="$2"
            shift 2
            grep_args=(-n -I -E)
            if [ "${1:-}" = "--ignore-case" ]; then
              grep_args+=(-i)
              shift
            fi
            set +e
            matches="$(git grep "${grep_args[@]}" "${pattern}" -- "$@")"
            scan_status=$?
            set -e
            case "${scan_status}" in
              0)
                echo "tracked ${label} is forbidden" >&2
                printf '%s\n' "${matches}" >&2
                exit 1
                ;;
              1)
                return 0
                ;;
              *)
                echo "${label} scanner failed with status ${scan_status}" >&2
                exit "${scan_status}"
                ;;
            esac
          }

          shebang_pathspecs=(
            ':(exclude,glob)**/*.md'
            ':(exclude,glob)**/docs/archive/**'
            ':(exclude,glob)**/docs/plans/**'
            ':(exclude,glob)**/docs/reviews/**'
            ':(exclude,glob)**/docs/superpowers/**'
            ':(exclude,glob)**/tasks/research_evidence/**'
          )
          reject_python_text \
            "Python shebang" \
            '^#!.*python([0-9]+([.][0-9]+)?)?([[:space:]]|$)' \
            --ignore-case \
            "${shebang_pathspecs[@]}"

          inline_command_pathspecs=(
            ':(icase,glob)**/*.sh'
            ':(icase,glob)**/*.bash'
            ':(icase,glob)**/*.zsh'
            ':(icase,glob)**/*.yml'
            ':(icase,glob)**/*.yaml'
            ':(icase,glob)**/*.toml'
            ':(icase,glob)**/*.service'
            ':(icase,glob)**/*.timer'
            ':(icase,glob)**/*.socket'
            ':(icase,glob)**/*.conf'
            ':(icase,glob)**/Dockerfile*'
            ':(icase,glob)**/Makefile'
            ':(icase,glob)**/Justfile'
            ':(icase,glob)**/bin/*'
            ':(icase,glob)**/scripts/*'
            ':(icase,glob)**/scripts/**/*'
            ':(exclude,glob)**/docs/archive/**'
            ':(exclude,glob)**/docs/plans/**'
            ':(exclude,glob)**/docs/reviews/**'
            ':(exclude,glob)**/docs/superpowers/**'
            ':(exclude,glob)**/tasks/research_evidence/**'
          )
          reject_python_text \
            "Python runtime or package-manager command" \
            'actions/setup-pyth[o]n@|astral-sh/setup-u[v]@|(^|[;&|()/[:space:]])(python([0-9]+([.][0-9]+)?)?|pip([0-9]+)?|pipx|pytest|poetry|pdm|rye|conda|mamba|hatch|tox|virtualenv)([[:space:]]|$)|(^|[;&|()/[:space:]])uv[[:space:]]+(run|sync|pip|venv|python)([[:space:]]|$)' \
            --ignore-case \
            "${inline_command_pathspecs[@]}"

          if git grep -n -E '(name = "(burn-tch|tch|torch-sys|pyo3[^"]*|cpython|rust-cpython|python3-sys|rustpython[^"]*)"|^[[:space:]]*(burn-tch|tch|torch-sys|pyo3([-_][A-Za-z0-9_-]+)?|cpython|rust-cpython|python3-sys|rustpython([-_][A-Za-z0-9_-]+)?)[[:space:]]*=)' -- \
            ':(glob)**/Cargo.toml' ':(glob)**/Cargo.lock'; then
            echo "PyTorch/libtorch and Python-runtime Rust bindings are forbidden" >&2
            exit 1
          fi

      - name: Reject retired routes, insecure SSH, and reset bypasses
        run: |
          set -euo pipefail
          run_forbidden_scan() {
            label="$1"
            pattern="$2"
            shift 2
            set +e
            if command -v rg >/dev/null 2>&1; then
              rg -n -- "${pattern}" "$@"
            else
              grep -R -n -E -- "${pattern}" "$@"
            fi
            scan_status=$?
            set -e
            case "${scan_status}" in
              0)
                echo "forbidden ${label} match found" >&2
                exit 1
                ;;
              1)
                return 0
                ;;
              *)
                echo "${label} scanner error (rg exit ${scan_status})" >&2
                exit "${scan_status}"
                ;;
            esac
          }

          run_forbidden_scan \
            "retired frontend route" \
            "/stats/|'/(trades|positions|security/events|system/start|config|agent/|sidecar/)" \
            ploy-frontend/src/services/api.ts
          run_forbidden_scan \
            "insecure SSH or reset bypass" \
            'StrictHostKeyChecking[[:space:]=]+no|UserKnownHostsFile[[:space:]=]+/dev/null|allow[_-]?running' \
            ../../.github/workflows

  audit:
    name: Dependency audit
    needs: image-smoke-scope
    if: ${{ contains(needs.image-smoke-scope.outputs.jobs, ',ploy/audit,') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Run cargo audit
        run: |
          # Temporary exception: sqlx 0.8.6 keeps an unused mysql driver chain in Cargo.lock,
          # which pulls `rsa` despite this workspace having no reachable mysql runtime path.
          # RustSec lists no fixed release; remove this ignore when sqlx drops the lockfile edge.
          cargo audit --ignore RUSTSEC-2023-0071

  rust-control-plane:
    name: Rust control-plane/core
    needs: image-smoke-scope
    if: ${{ contains(needs.image-smoke-scope.outputs.jobs, ',ploy/rust-control-plane,') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ploy
          POSTGRES_PASSWORD: ${{ github.run_id }}
          POSTGRES_DB: ploy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91
          components: clippy, rustfmt

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libpq-dev clang lld
          sudo apt-get install -y sccache || cargo install sccache --locked

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust_hft/prediction-markets
          shared-key: rust-control-plane-${{ hashFiles('rust_hft/prediction-markets/**/Cargo.lock') }}

      - name: Cache sccache
        uses: actions/cache@v5
        with:
          path: ~/.cache/sccache
          key: ${{ runner.os }}-sccache-control-${{ hashFiles('rust_hft/prediction-markets/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-sccache-control-
            ${{ runner.os }}-sccache-

      - name: Install SQLx CLI
        run: |
          cargo install sqlx-cli \
            --locked \
            --version "${SQLX_CLI_VERSION}" \
            --no-default-features \
            --features rustls,postgres

      - name: Prepare database schema
        env:
          DATABASE_URL: postgres://ploy:${{ github.run_id }}@localhost:5432/ploy_test
        run: sqlx migrate run

      - name: Build and test control-plane/core lane
        env:
          DATABASE_URL: postgres://ploy:${{ github.run_id }}@localhost:5432/ploy_test
          RUSTC_WRAPPER: sccache
        run: |
          set -euo pipefail
          SECONDS=0
          cargo build --locked \
            -p ploy-agent-sidecar \
            -p ploy-daemon-host \
            -p new-ployd \
            -p ployctl \
            -p ploy-control-client \
            -p ploytui \
            -p ploy-deployments \
            -p ploy-operator-contracts \
            -p ploy-platform \
            -p ploy-platform-runtime \
            -p ploy-trading
          cargo test --locked \
            -p ploy-agent-sidecar \
            -p ploy-daemon-host \
            -p new-ployd \
            -p ployctl \
            -p ploy-control-client \
            -p ploytui \
            -p ploy-deployments \
            -p ploy-operator-contracts \
            -p ploy-platform \
            -p ploy-platform-runtime \
            -p ploy-trading
          cargo clippy --locked -p ploy-agent-sidecar --all-targets --no-deps -- -D warnings
          echo "### Rust control-plane/core lane" >> "$GITHUB_STEP_SUMMARY"
          echo "Elapsed seconds: ${SECONDS}" >> "$GITHUB_STEP_SUMMARY"

      - name: Show sccache stats
        if: always()
        run: |
          sccache --show-stats | tee /tmp/sccache-stats.txt || true
          {
            echo "### sccache: rust-control-plane"
            echo '```'
            cat /tmp/sccache-stats.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  rust-runner-lean:
    name: Rust runner lean replay/backtest
    needs: image-smoke-scope
    if: ${{ contains(needs.image-smoke-scope.outputs.jobs, ',ploy/rust-runner-lean,') }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev clang lld
          sudo apt-get install -y sccache || cargo install sccache --locked

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust_hft/prediction-markets
          shared-key: rust-runner-lean-${{ hashFiles('rust_hft/prediction-markets/**/Cargo.lock') }}

      - name: Cache sccache
        uses: actions/cache@v5
        with:
          path: ~/.cache/sccache
          key: ${{ runner.os }}-sccache-runner-lean-${{ hashFiles('rust_hft/prediction-markets/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-sccache-runner-lean-
            ${{ runner.os }}-sccache-

      - name: Check lean runner lane
        env:
          RUSTC_WRAPPER: sccache
        run: |
          set -euo pipefail
          SECONDS=0
          cargo check --locked -p ploy-strategy-bundles --no-default-features --lib
          cargo check --locked -p ploy-market-data --no-default-features --lib
          cargo check --locked -p ploy-strategy-runtime --no-default-features --lib
          cargo check --locked -p ploy-replay
          echo "### Rust runner lean lane" >> "$GITHUB_STEP_SUMMARY"
          echo "Elapsed seconds: ${SECONDS}" >> "$GITHUB_STEP_SUMMARY"

      - name: Show sccache stats
        if: always()
        run: |
          sccache --show-stats | tee /tmp/sccache-stats.txt || true
          {
            echo "### sccache: rust-runner-lean"
            echo '```'
            cat /tmp/sccache-stats.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  rust-runner-full:
    name: Rust runner full/default (live execution disabled)
    needs: image-smoke-scope
    if: ${{ contains(needs.image-smoke-scope.outputs.jobs, ',ploy/rust-runner-full,') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev clang lld
          sudo apt-get install -y sccache || cargo install sccache --locked

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust_hft/prediction-markets
          shared-key: rust-runner-full-${{ hashFiles('rust_hft/prediction-markets/**/Cargo.lock') }}

      - name: Cache sccache
        uses: actions/cache@v5
        with:
          path: ~/.cache/sccache
          key: ${{ runner.os }}-sccache-runner-full-${{ hashFiles('rust_hft/prediction-markets/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-sccache-runner-full-
            ${{ runner.os }}-sccache-

      - name: Check runner slim/default and full non-executing contracts
        env:
          RUSTC_WRAPPER: sccache
        run: |
          set -euo pipefail
          SECONDS=0
          cargo test --locked \
            -p new-ploy-runner \
            -p ploy-backtest \
            -p ploy-runner-host \
            -p ploy-strategy-runtime \
            -p ploy-strategy-bundles \
            -p ploy-connectivity
          cargo check --locked \
            -p new-ploy-runner \
            --features full
          cargo check --locked \
            -p ploy-backtest \
            -p ploy-runner-host \
            -p ploy-strategy-runtime \
            -p ploy-strategy-bundles \
            -p ploy-connectivity \
            --features ploy-runner-host/full,ploy-strategy-runtime/full
          if cargo tree --locked -p new-ploy-runner --features full -e features \
            | grep -q 'live-execution'; then
            echo "new-ploy-runner full feature must not enable live-execution" >&2
            exit 1
          fi
          echo "### Rust runner full/default non-executing lane" >> "$GITHUB_STEP_SUMMARY"
          echo "Elapsed seconds: ${SECONDS}" >> "$GITHUB_STEP_SUMMARY"

      - name: Show sccache stats
        if: always()
        run: |
          sccache --show-stats | tee /tmp/sccache-stats.txt || true
          {
            echo "### sccache: rust-runner-full"
            echo '```'
            cat /tmp/sccache-stats.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

