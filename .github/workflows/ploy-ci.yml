name: Prediction Markets CI

on:
  pull_request:
    branches: [main]
    paths:
      - "rust_hft/prediction-markets/**"
      - "rust_hft/alpha-harness/**"
      - "rust_hft/deployment/docker/Dockerfile.research"
      - "deployment/aliyun/research/**"
      - ".github/workflows/ploy-ci.yml"
  push:
    branches: [main]
    paths:
      - "rust_hft/prediction-markets/**"
      - "rust_hft/alpha-harness/**"
      - "rust_hft/deployment/docker/Dockerfile.research"
      - "deployment/aliyun/research/**"
      - ".github/workflows/ploy-ci.yml"
  workflow_dispatch:

concurrency:
  group: prediction-markets-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: rust_hft/prediction-markets

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  SQLX_CLI_VERSION: 0.8.6
  SCCACHE_CACHE_SIZE: 10G

jobs:
  commit-hygiene:
    name: Commit hygiene
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check commit subjects
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          range="${BASE_SHA}..HEAD"
          echo "Checking commit subjects in range: ${range}"
          git log --oneline "${range}"

          bad_commits="$(git log --format='%h %s' "${range}" | grep -E '^[0-9a-f]+ (WIP|wip|fixup!|squash!)' || true)"
          if [ -n "${bad_commits}" ]; then
            echo "Found non-atomic/WIP commit subjects:"
            echo "${bad_commits}"
            echo "Please squash or rewrite commit messages before merge."
            exit 1
          fi

  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

      - name: Run actionlint
        run: >-
          "${HOME}/go/bin/actionlint" -color ../../.github/workflows/ploy-ci.yml

  research-image-smoke:
    name: Research image smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the unified research image
        uses: docker/build-push-action@v7
        with:
          context: rust_hft
          file: rust_hft/deployment/docker/Dockerfile.research
          load: true
          tags: monday-research-smoke:local
          cache-from: type=gha,scope=prediction-research-image
          cache-to: type=gha,mode=max,scope=prediction-research-image

      - name: Probe precompiled prediction entrypoints
        run: |
          set -euo pipefail
          docker run --rm \
            --entrypoint /usr/local/bin/monday-prediction-research \
            monday-research-smoke:local \
            --print-policy-snapshot-id | grep -Eq '^sha256:[0-9a-f]{64}$'
          docker run --rm \
            --entrypoint /usr/local/bin/alpha-harness \
            monday-research-smoke:local \
            prediction --help

  rust-format:
    name: Rust formatting
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91
          components: rustfmt

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

  safety-scans:
    name: Retired route and SSH safety scans
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Validate frontend route contract
        run: node ploy-frontend/scripts/check-route-contract.mjs

      - name: Enforce Rust-only research surface
        run: |
          set -euo pipefail

          forbidden_paths="$(git ls-files \
            ':(icase,glob)**/*.py' \
            ':(icase,glob)**/*.pyw' \
            ':(icase,glob)**/*.ipynb' \
            ':(icase,glob)**/*.py[cod]' \
            ':(icase,glob)**/requirements*.txt' \
            ':(icase,glob)**/pyproject.toml' \
            ':(icase,glob)**/Pipfile' \
            ':(icase,glob)**/poetry.lock' \
            ':(icase,glob)**/pytest.ini' \
            ':(icase,glob)**/tox.ini' \
            ':(icase,glob)**/setup.py')"
          if [ -n "${forbidden_paths}" ]; then
            echo "tracked Py""thon source, notebook, bytecode, or packaging artifact is forbidden" >&2
            printf '%s\n' "${forbidden_paths}" >&2
            exit 1
          fi

          reject_python_text() {
            label="$1"
            pattern="$2"
            shift 2
            grep_args=(-n -I -E)
            if [ "${1:-}" = "--ignore-case" ]; then
              grep_args+=(-i)
              shift
            fi
            set +e
            matches="$(git grep "${grep_args[@]}" "${pattern}" -- "$@")"
            scan_status=$?
            set -e
            case "${scan_status}" in
              0)
                echo "tracked ${label} is forbidden" >&2
                printf '%s\n' "${matches}" >&2
                exit 1
                ;;
              1)
                return 0
                ;;
              *)
                echo "${label} scanner failed with status ${scan_status}" >&2
                exit "${scan_status}"
                ;;
            esac
          }

          shebang_pathspecs=(
            ':(exclude,glob)**/*.md'
            ':(exclude,glob)**/docs/archive/**'
            ':(exclude,glob)**/docs/plans/**'
            ':(exclude,glob)**/docs/reviews/**'
            ':(exclude,glob)**/docs/superpowers/**'
            ':(exclude,glob)**/tasks/research_evidence/**'
          )
          reject_python_text \
            "Python shebang" \
            '^#!.*python([0-9]+([.][0-9]+)?)?([[:space:]]|$)' \
            --ignore-case \
            "${shebang_pathspecs[@]}"

          inline_command_pathspecs=(
            ':(icase,glob)**/*.sh'
            ':(icase,glob)**/*.bash'
            ':(icase,glob)**/*.zsh'
            ':(icase,glob)**/*.yml'
            ':(icase,glob)**/*.yaml'
            ':(icase,glob)**/*.toml'
            ':(icase,glob)**/*.service'
            ':(icase,glob)**/*.timer'
            ':(icase,glob)**/*.socket'
            ':(icase,glob)**/*.conf'
            ':(icase,glob)**/Dockerfile*'
            ':(icase,glob)**/Makefile'
            ':(icase,glob)**/Justfile'
            ':(icase,glob)**/bin/*'
            ':(icase,glob)**/scripts/*'
            ':(icase,glob)**/scripts/**/*'
            ':(exclude,glob)**/docs/archive/**'
            ':(exclude,glob)**/docs/plans/**'
            ':(exclude,glob)**/docs/reviews/**'
            ':(exclude,glob)**/docs/superpowers/**'
            ':(exclude,glob)**/tasks/research_evidence/**'
          )
          reject_python_text \
            "Python runtime or package-manager command" \
            'actions/setup-pyth[o]n@|astral-sh/setup-u[v]@|(^|[;&|()/[:space:]])(python([0-9]+([.][0-9]+)?)?|pip([0-9]+)?|pipx|pytest|poetry|pdm|rye|conda|mamba|hatch|tox|virtualenv)([[:space:]]|$)|(^|[;&|()/[:space:]])uv[[:space:]]+(run|sync|pip|venv|python)([[:space:]]|$)' \
            --ignore-case \
            "${inline_command_pathspecs[@]}"

          if git grep -n -E '(name = "(burn-tch|tch|torch-sys|pyo3[^"]*|cpython|rust-cpython|python3-sys|rustpython[^"]*)"|^[[:space:]]*(burn-tch|tch|torch-sys|pyo3([-_][A-Za-z0-9_-]+)?|cpython|rust-cpython|python3-sys|rustpython([-_][A-Za-z0-9_-]+)?)[[:space:]]*=)' -- \
            ':(glob)**/Cargo.toml' ':(glob)**/Cargo.lock'; then
            echo "PyTorch/libtorch and Python-runtime Rust bindings are forbidden" >&2
            exit 1
          fi

      - name: Reject retired routes, insecure SSH, and reset bypasses
        run: |
          set -euo pipefail
          run_forbidden_scan() {
            label="$1"
            pattern="$2"
            shift 2
            set +e
            if command -v rg >/dev/null 2>&1; then
              rg -n -- "${pattern}" "$@"
            else
              grep -R -n -E -- "${pattern}" "$@"
            fi
            scan_status=$?
            set -e
            case "${scan_status}" in
              0)
                echo "forbidden ${label} match found" >&2
                exit 1
                ;;
              1)
                return 0
                ;;
              *)
                echo "${label} scanner error (rg exit ${scan_status})" >&2
                exit "${scan_status}"
                ;;
            esac
          }

          run_forbidden_scan \
            "retired frontend route" \
            "/stats/|'/(trades|positions|security/events|system/start|config|agent/|sidecar/)" \
            ploy-frontend/src/services/api.ts
          run_forbidden_scan \
            "insecure SSH or reset bypass" \
            'StrictHostKeyChecking[[:space:]=]+no|UserKnownHostsFile[[:space:]=]+/dev/null|allow[_-]?running' \
            ../../.github/workflows

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Run cargo audit
        run: |
          # Temporary exception: sqlx 0.8.6 keeps an unused mysql driver chain in Cargo.lock,
          # which pulls `rsa` despite this workspace having no reachable mysql runtime path.
          # RustSec lists no fixed release; remove this ignore when sqlx drops the lockfile edge.
          cargo audit --ignore RUSTSEC-2023-0071

  rust-control-plane:
    name: Rust control-plane/core
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ploy
          POSTGRES_PASSWORD: ${{ github.run_id }}
          POSTGRES_DB: ploy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91
          components: clippy, rustfmt

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libpq-dev clang lld
          sudo apt-get install -y sccache || cargo install sccache --locked

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust_hft/prediction-markets
          shared-key: rust-control-plane-${{ hashFiles('rust_hft/prediction-markets/**/Cargo.lock') }}

      - name: Cache sccache
        uses: actions/cache@v5
        with:
          path: ~/.cache/sccache
          key: ${{ runner.os }}-sccache-control-${{ hashFiles('rust_hft/prediction-markets/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-sccache-control-
            ${{ runner.os }}-sccache-

      - name: Install SQLx CLI
        run: |
          cargo install sqlx-cli \
            --locked \
            --version "${SQLX_CLI_VERSION}" \
            --no-default-features \
            --features rustls,postgres

      - name: Prepare database schema
        env:
          DATABASE_URL: postgres://ploy:${{ github.run_id }}@localhost:5432/ploy_test
        run: sqlx migrate run

      - name: Build and test control-plane/core lane
        env:
          DATABASE_URL: postgres://ploy:${{ github.run_id }}@localhost:5432/ploy_test
          RUSTC_WRAPPER: sccache
        run: |
          set -euo pipefail
          SECONDS=0
          cargo build --locked \
            -p ploy-agent-sidecar \
            -p ploy-daemon-host \
            -p new-ployd \
            -p ployctl \
            -p ploy-control-client \
            -p ploytui \
            -p ploy-deployments \
            -p ploy-operator-contracts \
            -p ploy-platform \
            -p ploy-platform-runtime \
            -p ploy-trading
          cargo test --locked \
            -p ploy-agent-sidecar \
            -p ploy-daemon-host \
            -p new-ployd \
            -p ployctl \
            -p ploy-control-client \
            -p ploytui \
            -p ploy-deployments \
            -p ploy-operator-contracts \
            -p ploy-platform \
            -p ploy-platform-runtime \
            -p ploy-trading
          cargo clippy --locked -p ploy-agent-sidecar --all-targets --no-deps -- -D warnings
          echo "### Rust control-plane/core lane" >> "$GITHUB_STEP_SUMMARY"
          echo "Elapsed seconds: ${SECONDS}" >> "$GITHUB_STEP_SUMMARY"

      - name: Show sccache stats
        if: always()
        run: |
          sccache --show-stats | tee /tmp/sccache-stats.txt || true
          {
            echo "### sccache: rust-control-plane"
            echo '```'
            cat /tmp/sccache-stats.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  rust-runner-lean:
    name: Rust runner lean replay/backtest
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev clang lld
          sudo apt-get install -y sccache || cargo install sccache --locked

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust_hft/prediction-markets
          shared-key: rust-runner-lean-${{ hashFiles('rust_hft/prediction-markets/**/Cargo.lock') }}

      - name: Cache sccache
        uses: actions/cache@v5
        with:
          path: ~/.cache/sccache
          key: ${{ runner.os }}-sccache-runner-lean-${{ hashFiles('rust_hft/prediction-markets/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-sccache-runner-lean-
            ${{ runner.os }}-sccache-

      - name: Check lean runner lane
        env:
          RUSTC_WRAPPER: sccache
        run: |
          set -euo pipefail
          SECONDS=0
          cargo check --locked -p ploy-strategy-bundles --no-default-features --lib
          cargo check --locked -p ploy-market-data --no-default-features --lib
          cargo check --locked -p ploy-strategy-runtime --no-default-features --lib
          cargo check --locked -p ploy-replay
          echo "### Rust runner lean lane" >> "$GITHUB_STEP_SUMMARY"
          echo "Elapsed seconds: ${SECONDS}" >> "$GITHUB_STEP_SUMMARY"

      - name: Show sccache stats
        if: always()
        run: |
          sccache --show-stats | tee /tmp/sccache-stats.txt || true
          {
            echo "### sccache: rust-runner-lean"
            echo '```'
            cat /tmp/sccache-stats.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  rust-runner-full:
    name: Rust runner full/default (live execution disabled)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev clang lld
          sudo apt-get install -y sccache || cargo install sccache --locked

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust_hft/prediction-markets
          shared-key: rust-runner-full-${{ hashFiles('rust_hft/prediction-markets/**/Cargo.lock') }}

      - name: Cache sccache
        uses: actions/cache@v5
        with:
          path: ~/.cache/sccache
          key: ${{ runner.os }}-sccache-runner-full-${{ hashFiles('rust_hft/prediction-markets/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-sccache-runner-full-
            ${{ runner.os }}-sccache-

      - name: Check runner slim/default and full non-executing contracts
        env:
          RUSTC_WRAPPER: sccache
        run: |
          set -euo pipefail
          SECONDS=0
          cargo test --locked \
            -p new-ploy-runner \
            -p ploy-backtest \
            -p ploy-runner-host \
            -p ploy-strategy-runtime \
            -p ploy-strategy-bundles \
            -p ploy-connectivity
          cargo check --locked \
            -p new-ploy-runner \
            --features full
          cargo check --locked \
            -p ploy-backtest \
            -p ploy-runner-host \
            -p ploy-strategy-runtime \
            -p ploy-strategy-bundles \
            -p ploy-connectivity \
            --features ploy-runner-host/full,ploy-strategy-runtime/full
          if cargo tree --locked -p new-ploy-runner --features full -e features \
            | grep -q 'live-execution'; then
            echo "new-ploy-runner full feature must not enable live-execution" >&2
            exit 1
          fi
          echo "### Rust runner full/default non-executing lane" >> "$GITHUB_STEP_SUMMARY"
          echo "Elapsed seconds: ${SECONDS}" >> "$GITHUB_STEP_SUMMARY"

      - name: Show sccache stats
        if: always()
        run: |
          sccache --show-stats | tee /tmp/sccache-stats.txt || true
          {
            echo "### sccache: rust-runner-full"
            echo '```'
            cat /tmp/sccache-stats.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  rust-market-data:
    name: Rust market-data ops
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev clang lld
          sudo apt-get install -y sccache || cargo install sccache --locked

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust_hft/prediction-markets
          shared-key: rust-market-data-${{ hashFiles('rust_hft/prediction-markets/**/Cargo.lock') }}

      - name: Cache sccache
        uses: actions/cache@v5
        with:
          path: ~/.cache/sccache
          key: ${{ runner.os }}-sccache-market-data-${{ hashFiles('rust_hft/prediction-markets/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-sccache-market-data-
            ${{ runner.os }}-sccache-

      - name: Check market-data ops lane
        env:
          RUSTC_WRAPPER: sccache
        run: |
          set -euo pipefail
          SECONDS=0
          cargo check --locked -p ploy-market-data --features live --lib
          echo "### Rust market-data ops lane" >> "$GITHUB_STEP_SUMMARY"
          echo "Elapsed seconds: ${SECONDS}" >> "$GITHUB_STEP_SUMMARY"

      - name: Show sccache stats
        if: always()
        run: |
          sccache --show-stats | tee /tmp/sccache-stats.txt || true
          {
            echo "### sccache: rust-market-data"
            echo '```'
            cat /tmp/sccache-stats.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  rust-research-heavy:
    name: Rust research heavy features
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ploy
          POSTGRES_PASSWORD: ${{ github.run_id }}
          POSTGRES_DB: ploy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91
          components: clippy

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libpq-dev clang lld
          sudo apt-get install -y sccache || cargo install sccache --locked

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust_hft/prediction-markets
          shared-key: rust-research-heavy-${{ hashFiles('rust_hft/prediction-markets/**/Cargo.lock') }}

      - name: Cache sccache
        uses: actions/cache@v5
        with:
          path: ~/.cache/sccache
          key: ${{ runner.os }}-sccache-research-heavy-${{ hashFiles('rust_hft/prediction-markets/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-sccache-research-heavy-
            ${{ runner.os }}-sccache-

      - name: Test research core lane
        env:
          RUSTC_WRAPPER: sccache
        run: |
          cargo test --locked -p ploy-feed-loaders --lib
          cargo test --locked -p ploy-research --lib
          cargo test --locked -p ploy-research --features ml --lib
          cargo clippy --locked -p ploy-research --features ml --all-targets --no-deps -- -D warnings
          cargo check --locked -p ploy-research --bin monday-prediction-research
          cargo check --locked -p ploy-research --features db --bin monday-prediction-evaluator
          cargo test --locked -p ploy-market-data --features audit --lib --examples
          cargo test --locked -p ploy-research --features db --bin monday-prediction-snapshot

      - name: Install SQLx CLI
        run: |
          cargo install sqlx-cli \
            --locked \
            --version "${SQLX_CLI_VERSION}" \
            --no-default-features \
            --features rustls,postgres

      - name: Prepare database schema
        env:
          DATABASE_URL: postgres://ploy:${{ github.run_id }}@localhost:5432/ploy_test
        run: sqlx migrate run

      - name: Check research heavy lane
        env:
          DATABASE_URL: postgres://ploy:${{ github.run_id }}@localhost:5432/ploy_test
          PLOY_TEST_DATABASE_URL: postgres://ploy:${{ github.run_id }}@localhost:5432/ploy_test
          RUSTC_WRAPPER: sccache
        run: |
          set -euo pipefail
          SECONDS=0
          cargo check --locked -p ploy-research --features db,polars-export,ml,rl,strategy-runtime --lib
          cargo test --locked -p ploy-research --features db --lib -- --ignored --list \
            | grep -F 'research_snapshot::tests::postgres_official_outcomes_use_token_primary_keys_and_version_clocks: test'
          cargo test --locked -p ploy-research --features db \
            research_snapshot::tests::postgres_official_outcomes_use_token_primary_keys_and_version_clocks \
            --lib -- --ignored --exact
          echo "### Rust research heavy lane" >> "$GITHUB_STEP_SUMMARY"
          echo "Elapsed seconds: ${SECONDS}" >> "$GITHUB_STEP_SUMMARY"

      - name: Show sccache stats
        if: always()
        run: |
          sccache --show-stats | tee /tmp/sccache-stats.txt || true
          {
            echo "### sccache: rust-research-heavy"
            echo '```'
            cat /tmp/sccache-stats.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rust_hft/prediction-markets/ploy-frontend/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust_hft/prediction-markets
          shared-key: frontend-contracts-${{ hashFiles('rust_hft/prediction-markets/**/Cargo.lock') }}

      - name: Validate frontend
        run: |
          set -euo pipefail
          SECONDS=0
          cargo run --locked -p ploy-operator-contracts --example export_schemas -- --check
          node scripts/export_operator_contract_types.mjs --check
          npm ci --prefix ploy-frontend
          npm run contracts:check --prefix ploy-frontend
          npm run lint --prefix ploy-frontend
          npm run build --prefix ploy-frontend
          npm audit --omit=dev --audit-level=moderate --prefix ploy-frontend
          oversized_chunks="$(find ploy-frontend/dist/assets -type f -name '*.js' -size +500k -print)"
          if [ -n "${oversized_chunks}" ]; then
            echo "frontend JavaScript chunks exceed 500 KiB:" >&2
            echo "${oversized_chunks}" >&2
            exit 1
          fi

      - name: Summarize frontend lane
        run: |
          echo "### Frontend lane" >> "$GITHUB_STEP_SUMMARY"
          echo "TypeScript is limited to the operator UI; the agent sidecar runs in the Rust control-plane lane." >> "$GITHUB_STEP_SUMMARY"

  integration-regressions:
    name: Rust integration regressions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ploy
          POSTGRES_PASSWORD: ${{ github.run_id }}
          POSTGRES_DB: ploy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libpq-dev clang lld
          sudo apt-get install -y sccache || cargo install sccache --locked

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust_hft/prediction-markets
          shared-key: rust-integration-${{ hashFiles('rust_hft/prediction-markets/**/Cargo.lock') }}

      - name: Cache sccache
        uses: actions/cache@v5
        with:
          path: ~/.cache/sccache
          key: ${{ runner.os }}-sccache-integration-${{ hashFiles('rust_hft/prediction-markets/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-sccache-integration-
            ${{ runner.os }}-sccache-

      - name: Install SQLx CLI
        run: |
          cargo install sqlx-cli \
            --locked \
            --version "${SQLX_CLI_VERSION}" \
            --no-default-features \
            --features rustls,postgres

      - name: Prepare database schema
        env:
          DATABASE_URL: postgres://ploy:${{ github.run_id }}@localhost:5432/ploy_test
        run: sqlx migrate run

      - name: Run integration regressions
        env:
          DATABASE_URL: postgres://ploy:${{ github.run_id }}@localhost:5432/ploy_test
          RUSTC_WRAPPER: sccache
        run: |
          set -euo pipefail
          SECONDS=0
          cargo test --locked -p ploy --test platform_smoke
          cargo test --locked -p ploy --test workspace_runtime_retirement
          echo "### Rust integration regressions lane" >> "$GITHUB_STEP_SUMMARY"
          echo "Elapsed seconds: ${SECONDS}" >> "$GITHUB_STEP_SUMMARY"

      - name: Show sccache stats
        if: always()
        run: |
          sccache --show-stats | tee /tmp/sccache-stats.txt || true
          {
            echo "### sccache: rust-integration"
            echo '```'
            cat /tmp/sccache-stats.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
