name: Monorepo CI

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: monorepo-${{ github.ref }}
  # PR runs may be superseded; main runs must finish their exact-source
  # validation and publication handoff.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  selector:
    name: CI job selector
    runs-on: ubuntu-latest
    outputs:
      jobs: ${{ steps.scope.outputs.jobs }}
      owning_packages: ${{ steps.scope.outputs.owning_packages }}
      loop_packages: ${{ steps.scope.outputs.loop_packages }}
      focused_packages: ${{ steps.scope.outputs.focused_packages }}
      clippy_loop: ${{ steps.scope.outputs.clippy_loop }}
      clippy_handoff: ${{ steps.scope.outputs.clippy_handoff }}
      loop: ${{ steps.scope.outputs.loop }}
      handoff: ${{ steps.scope.outputs.handoff }}
      json: ${{ steps.scope.outputs.json }}
      ondo: ${{ steps.scope.outputs.ondo }}
      collector: ${{ steps.scope.outputs.collector }}
      control: ${{ steps.scope.outputs.control }}
      focused: ${{ steps.scope.outputs.focused }}
      toolchain: ${{ steps.scope.outputs.toolchain }}
      production_trading_image: ${{ steps.scope.outputs.production_trading_image }}
      production_collector_image: ${{ steps.scope.outputs.production_collector_image }}
      selection_complete: ${{ steps.scope.outputs.selection_complete }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Select CI jobs
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          .github/scripts/select-rust-ci-scope.sh \
            --event "${{ github.event_name }}" \
            --base "${BASE_SHA}" \
            --head "${HEAD_SHA}"


  scope:
    name: CI job scope
    needs: selector
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      jobs: ${{ steps.scope.outputs.jobs }}
      owning_packages: ${{ steps.scope.outputs.owning_packages }}
      loop_packages: ${{ steps.scope.outputs.loop_packages }}
      focused_packages: ${{ steps.scope.outputs.focused_packages }}
      clippy_loop: ${{ steps.scope.outputs.clippy_loop }}
      clippy_handoff: ${{ steps.scope.outputs.clippy_handoff }}
      loop: ${{ steps.scope.outputs.loop }}
      handoff: ${{ steps.scope.outputs.handoff }}
      json: ${{ steps.scope.outputs.json }}
      ondo: ${{ steps.scope.outputs.ondo }}
      collector: ${{ steps.scope.outputs.collector }}
      control: ${{ steps.scope.outputs.control }}
      focused: ${{ steps.scope.outputs.focused }}
      toolchain: ${{ steps.scope.outputs.toolchain }}
      production_trading_image: ${{ steps.scope.outputs.production_trading_image }}
      production_collector_image: ${{ steps.scope.outputs.production_collector_image }}
    steps:
      - name: Resolve selector result
        id: scope
        env:
          SELECTOR_RESULT: ${{ needs.selector.result }}
          SELECTED_JOBS: ${{ needs.selector.outputs.jobs }}
          SELECTED_OWNING_PACKAGES: ${{ needs.selector.outputs.owning_packages }}
          SELECTED_LOOP_PACKAGES: ${{ needs.selector.outputs.loop_packages }}
          SELECTED_FOCUSED_PACKAGES: ${{ needs.selector.outputs.focused_packages }}
          SELECTED_CLIPPY_LOOP: ${{ needs.selector.outputs.clippy_loop }}
          SELECTED_CLIPPY_HANDOFF: ${{ needs.selector.outputs.clippy_handoff }}
          SELECTED_LOOP: ${{ needs.selector.outputs.loop }}
          SELECTED_HANDOFF: ${{ needs.selector.outputs.handoff }}
          SELECTED_JSON: ${{ needs.selector.outputs.json }}
          SELECTED_ONDO: ${{ needs.selector.outputs.ondo }}
          SELECTED_COLLECTOR: ${{ needs.selector.outputs.collector }}
          SELECTED_CONTROL: ${{ needs.selector.outputs.control }}
          SELECTED_FOCUSED: ${{ needs.selector.outputs.focused }}
          SELECTED_TOOLCHAIN: ${{ needs.selector.outputs.toolchain }}
          SELECTED_PRODUCTION_TRADING_IMAGE: ${{ needs.selector.outputs.production_trading_image }}
          SELECTED_PRODUCTION_COLLECTOR_IMAGE: ${{ needs.selector.outputs.production_collector_image }}
          SELECTED_COMPLETE: ${{ needs.selector.outputs.selection_complete }}
        run: |
          if [[ "$SELECTOR_RESULT" == success && "$SELECTED_COMPLETE" == true ]] &&
             [[ "$SELECTED_JOBS" =~ ^,[a-z0-9/-]*(,[a-z0-9/-]+)*,$ ]] &&
             [[ "$SELECTED_OWNING_PACKAGES" =~ ^,[A-Za-z0-9_-]*(,[A-Za-z0-9_-]+)*,$ ]] &&
             [[ "$SELECTED_FOCUSED_PACKAGES" =~ ^,[A-Za-z0-9_-]*(,[A-Za-z0-9_-]+)*,$ ]] &&
             [[ "$SELECTED_LOOP_PACKAGES" =~ ^,[A-Za-z0-9_-]*(,[A-Za-z0-9_-]+)*,$ ]] &&
             [[ "${SELECTED_CLIPPY_LOOP},${SELECTED_CLIPPY_HANDOFF},$SELECTED_LOOP,$SELECTED_HANDOFF,$SELECTED_JSON,$SELECTED_ONDO,$SELECTED_COLLECTOR,$SELECTED_CONTROL,$SELECTED_FOCUSED,$SELECTED_TOOLCHAIN,$SELECTED_PRODUCTION_TRADING_IMAGE,$SELECTED_PRODUCTION_COLLECTOR_IMAGE" =~ ^(true|false)(,(true|false)){11}$ ]]; then
            printf '%s\n' \
              "jobs=$SELECTED_JOBS" \
              "owning_packages=$SELECTED_OWNING_PACKAGES" \
              "loop_packages=$SELECTED_LOOP_PACKAGES" \
              "focused_packages=$SELECTED_FOCUSED_PACKAGES" \
              "clippy_loop=$SELECTED_CLIPPY_LOOP" \
              "clippy_handoff=$SELECTED_CLIPPY_HANDOFF" \
              "loop=$SELECTED_LOOP" \
              "handoff=$SELECTED_HANDOFF" \
              "json=$SELECTED_JSON" \
              "ondo=$SELECTED_ONDO" \
              "collector=$SELECTED_COLLECTOR" \
              "control=$SELECTED_CONTROL" \
              "focused=$SELECTED_FOCUSED" \
              "toolchain=$SELECTED_TOOLCHAIN" \
              "production_trading_image=$SELECTED_PRODUCTION_TRADING_IMAGE" \
              "production_collector_image=$SELECTED_PRODUCTION_COLLECTOR_IMAGE"
          else
            echo 'CI selection failed or returned an invalid plan; no work is dispatched' >&2
            exit 1
          fi >> "$GITHUB_OUTPUT"

      - name: Summarize check plan
        env:
          SELECTED_JOBS: ${{ steps.scope.outputs.jobs }}
          SELECTED_OWNING_PACKAGES: ${{ steps.scope.outputs.owning_packages }}
          SELECTED_CONTROL: ${{ steps.scope.outputs.control }}
        run: |
          printf '### CI check plan\n\n- Jobs: %s\n- Direct Rust package tests: %s\n- Collector control contract: %s\n' \
            "$SELECTED_JOBS" "$SELECTED_OWNING_PACKAGES" "$SELECTED_CONTROL" \
            >> "$GITHUB_STEP_SUMMARY"

  control_contracts:
    name: Collector control contracts
    needs: scope
    if: ${{ !cancelled() && contains(needs.scope.outputs.jobs, ',ci/control-contracts,') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout collector controls
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install shellcheck
        run: bash "$GITHUB_WORKSPACE/.github/workflows/install-ubuntu-packages.sh" shellcheck

      - name: Verify Campaign controller recovery
        run: |
          bash -n deployment/aliyun/research/scripts/campaign-cycle-controller.sh \
            deployment/aliyun/research/scripts/campaign-job-watch.sh \
            deployment/aliyun/research/test-campaign-cycle-controller.sh
          shellcheck -x -e SC2154 \
            deployment/aliyun/research/scripts/campaign-cycle-controller.sh \
            deployment/aliyun/research/scripts/campaign-job-watch.sh \
            deployment/aliyun/research/test-campaign-cycle-controller.sh
          deployment/aliyun/research/test-campaign-cycle-controller.sh

      - name: Verify collector release shell contracts
        working-directory: rust_hft
        run: |
          for script in ../deployment/aliyun/*.sh; do
            bash -n "$script"
          done
          shellcheck ../deployment/aliyun/*.sh
          bash ../.github/scripts/run-collector-control-contracts.sh

  monitor_contracts:
    name: Collector monitor contracts
    needs: scope
    if: ${{ !cancelled() && contains(needs.scope.outputs.jobs, ',ci/monitor-contracts,') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Install shellcheck
        run: bash "$GITHUB_WORKSPACE/.github/workflows/install-ubuntu-packages.sh" shellcheck
      - name: Verify monitor and atomic unit deployment
        run: |
          shellcheck deployment/aliyun/monday-collector-health.sh deployment/aliyun/host-collector-health-unit-release.sh
          deployment/aliyun/test-monday-collector-health.sh
          deployment/aliyun/test-collector-health-unit-release.sh
          .github/scripts/test-monitor-collector-host.sh
          deployment/aliyun/test-collector-monitor-release.sh

  ci_contracts:
    name: CI policy contracts
    needs: scope
    if: ${{ !cancelled() && contains(needs.scope.outputs.jobs, ',ci/ci-contracts,') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Verify selection, cancellation and aggregate admission
        run: |
          bash .github/scripts/test-collector-control-scheduling.sh
          bash .github/scripts/test-main-image-scope.sh
          bash .github/scripts/test-main-research-scope.sh
          bash .github/scripts/test-research-release-products.sh
          bash .github/scripts/test-image-build-plan.sh
          ruby .github/scripts/test-rust-docker-workspaces.rb --self-test
          bash .github/scripts/test-tested-image.sh
          node .github/scripts/test-local-lock-impact.mjs
          bash .github/scripts/test-ack-rust-batch.sh
          bash .github/scripts/test-ci-rust-evidence.sh
          .github/scripts/test-ci-rust-same-run.sh
          .github/scripts/test-select-rust-ci-scope.sh
          .github/scripts/test-ci-monitor-scope.sh
          .github/scripts/test-agent-validation-gates.sh
          .github/scripts/test-classify-ack-research-job.sh
          bash .github/scripts/test-ack-preflight-relay.sh
          bash .github/scripts/test-preflight-workflow-gate.sh
          .github/scripts/test-research-image-release-artifact.sh

  rust_shell_scripts:
    name: Rust shell scripts
    needs: scope
    if: ${{ contains(needs.scope.outputs.jobs, ',ci/rust-shell-scripts,') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Check shell syntax
        run: find rust_hft/scripts -type f -name '*.sh' -exec bash -n {} \;

  rust_loop_nextest_archive:
    # Loop-engineer tests are archived once, then split across four hash
    # partitions. nextest 0.9 hashes each test name, which spreads the slow
    # mission_campaign tests; sorted count/slice partitions leave them adjacent.
    name: Loop nextest archive
    needs: scope
    if: ${{ needs.scope.result == 'success' && contains(needs.scope.outputs.jobs, ',ci/rust,') && needs.scope.outputs.loop == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      CARGO_TARGET_DIR: ${{ github.workspace }}/rust_hft/target
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    defaults:
      run:
        working-directory: rust_hft
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: 1.98.1

      - name: Install Linux build tools
        run: bash "$GITHUB_WORKSPACE/.github/workflows/install-ubuntu-packages.sh" clang mold protobuf-compiler

      - name: Record cache dimensions
        id: cache-info
        shell: bash
        run: echo "rust=$(rustc -Vv | awk '/^release:/ {print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            rust_hft
          key: loop-nextest-archive-${{ steps.cache-info.outputs.rust }}
          cache-all-crates: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-nextest 0.9.146
        run: |
          set -euo pipefail
          bindir="${CARGO_HOME:-$HOME/.cargo}/bin"
          mkdir -p "$bindir"
          curl -LsSf https://get.nexte.st/0.9.146/linux | tar zxf - -C "$bindir"
          version=$(cargo nextest --version | head -n 1)
          [[ $version == cargo-nextest\ 0.9.146\ * ]] || { echo "unexpected nextest version: $version" >&2; exit 1; }

      - name: Archive loop tests and record expected counts
        env:
          LOOP_PACKAGES: ${{ needs.scope.outputs.loop_packages }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/loop-nextest-build"
          mkdir -p "$work"
          packages=${LOOP_PACKAGES#,}
          packages=${packages%,}
          [[ -n ${packages} ]] || { echo 'loop package selection is empty' >&2; exit 1; }
          IFS=',' read -ra selected <<<"$packages"
          args=()
          seen=' '
          for package in "${selected[@]}"; do
            [[ $package =~ ^[A-Za-z0-9_-]+$ ]] || { echo "invalid package name: $package" >&2; exit 1; }
            [[ $seen != *" $package "* ]] || { echo "duplicate package: $package" >&2; exit 1; }
            seen+=" $package "
            args+=(-p "$package")
          done
          printf '%s\n' "${selected[@]}" > "$work/packages.txt"
          cargo metadata --manifest-path research-core/Cargo.toml --locked --no-deps --format-version 1 > "$work/metadata.json"
          export WORK="$work"
          python3 - <<'PY'
          import json
          import os
          selected = [pkg for pkg in os.environ["LOOP_PACKAGES"].strip(",").split(",") if pkg]
          names = {pkg["name"] for pkg in json.load(open(os.environ["WORK"] + "/metadata.json"))["packages"]}
          missing = [pkg for pkg in selected if pkg not in names]
          if missing:
              raise SystemExit("selected package is outside research-core: " + ", ".join(missing))
          if len(selected) != len(set(selected)):
              raise SystemExit("duplicate loop package selection")
          PY
          config=research-core/.config/nextest.toml
          test -f "$config"
          start=$(date +%s)
          cargo nextest archive \
            --manifest-path research-core/Cargo.toml \
            --locked \
            --config-file "$config" \
            --user-config-file none \
            "${args[@]}" \
            --archive-file "$work/archive.tar.zst"
          build_seconds=$(( $(date +%s) - start ))
          export BUILD_SECONDS="$build_seconds"
          cargo nextest list \
            --archive-file "$work/archive.tar.zst" \
            --config-file "$config" \
            --user-config-file none \
            --message-format json > "$work/nextest-list.json"
          env CARGO_TERM_COLOR=never cargo test \
            --manifest-path research-core/Cargo.toml \
            --locked \
            --color never \
            "${args[@]}" \
            -- --list > "$work/cargo-list.txt" 2>&1
          env CARGO_TERM_COLOR=never cargo test \
            --manifest-path research-core/Cargo.toml \
            --locked \
            --color never \
            "${args[@]}" \
            -- --ignored --list > "$work/cargo-ignored.txt" 2>&1
          python3 - <<'PY'
          # nextest-ci-lib-begin
          """Count cargo test and nextest shard runs for the loop-engineer CI job."""

          import json
          import re
          from datetime import datetime, timezone


          class ProofError(Exception):
              pass


          def parse_cargo_list(text):
              text = text.replace("\r", "")
              text = re.sub(r"\x1b\[[0-9;]*[A-Za-z]", "", text)
              sections = []
              current = None

              def close(summary_tests):
                  counted = current["listed_test"] + current["listed_ignore"]
                  if counted != summary_tests:
                      raise ProofError(
                          f"cargo list section {current['id']} counted {counted}, summary {summary_tests}"
                      )
                  current["summary"] = summary_tests
                  sections.append(current)

              for raw in text.splitlines():
                  line = raw.strip()
                  if not line:
                      continue
                  run = re.search(r"deps/([A-Za-z0-9_]+-[0-9a-f]{16})\)?$", line)
                  doc = re.fullmatch(r"Doc-tests\s+(\S+)", line)
                  if "Running " in line or line.startswith("Doc-tests "):
                      if current is not None:
                          raise ProofError(f"cargo list section {current['id']} missing summary")
                      if run:
                          current = {
                              "id": run.group(1),
                              "kind": "target",
                              "listed_test": 0,
                              "listed_ignore": 0,
                          }
                          continue
                      if doc:
                          current = {
                              "id": f"doctest:{doc.group(1)}",
                              "kind": "doctest",
                              "listed_test": 0,
                              "listed_ignore": 0,
                          }
                          continue
                      raise ProofError(f"unparsed cargo list header: {line}")
                  if current is None:
                      continue
                  summary = re.fullmatch(r"(\d+) tests?, (\d+) benchmarks?", line)
                  if summary:
                      close(int(summary.group(1)))
                      current = None
                      continue
                  if line.endswith(": test"):
                      current["listed_test"] += 1
                      continue
                  if line.endswith(": ignore"):
                      current["listed_ignore"] += 1
                      continue
                  if line.endswith(": benchmark"):
                      continue
                  raise ProofError(f"unparsed cargo list line in {current['id']}: {line}")
              if current is not None:
                  raise ProofError(f"cargo list section {current['id']} missing summary")
              return sections


          def _index_sections(sections):
              indexed = {}
              for section in sections:
                  if section["id"] in indexed:
                      raise ProofError(f"duplicate cargo list section {section['id']}")
                  indexed[section["id"]] = section
              return indexed


          def diff_cargo_lists(all_sections, ignored_sections):
              all_index = _index_sections(all_sections)
              ignored_index = _index_sections(ignored_sections)
              if set(all_index) != set(ignored_index):
                  missing = sorted(set(all_index) ^ set(ignored_index))
                  raise ProofError("cargo list sections differ from ignored list: " + ", ".join(missing))
              runnable = 0
              doctests = 0
              ignored = 0
              sections = []
              for section_id in sorted(all_index):
                  full = all_index[section_id]
                  ignored_summary = ignored_index[section_id]["summary"]
                  if ignored_summary > full["summary"]:
                      raise ProofError(f"ignored count exceeds list count for {section_id}")
                  count = full["summary"] - ignored_summary
                  if full["kind"] == "doctest":
                      doctests += count
                  else:
                      runnable += count
                  ignored += ignored_summary
                  sections.append(
                      {
                          "id": section_id,
                          "kind": full["kind"],
                          "listed": full["summary"],
                          "ignored": ignored_summary,
                          "runnable": count,
                      }
                  )
              return {
                  "cargo_runnable": runnable,
                  "cargo_ignored": ignored,
                  "doctests_listed": doctests,
                  "cargo_sections": sections,
              }


          def parse_nextest_list(data):
              binaries = {}
              for suite in data["rust-suites"].values():
                  status = suite.get("status")
                  if status not in (None, "listed"):
                      raise ProofError(f"nextest suite status {status} for {suite.get('binary-name')}")
                  key = f"{suite['package-name']}::{suite['binary-name']} ({suite['kind']})"
                  count = 0
                  for case in suite["testcases"].values():
                      if case.get("kind") not in (None, "test"):
                          continue
                      if case.get("ignored"):
                          continue
                      if (case.get("filter-match") or {}).get("status") == "matches":
                          count += 1
                  binaries[key] = binaries.get(key, 0) + count
              return {key: count for key, count in binaries.items() if count}


          def parse_doctest_results(text):
              passed = 0
              results = 0
              for line in text.splitlines():
                  if "test result: FAILED" in line:
                      raise ProofError("doctest result failed")
                  matched = re.search(r"test result: ok\. (\d+) passed;", line)
                  if matched:
                      passed += int(matched.group(1))
                      results += 1
              return passed, results


          def parse_shard_events(text):
              passed = {}
              failed = {}
              failed_tests = []
              slow = []
              finished = 0
              for line in text.splitlines():
                  line = line.strip()
                  if not line.startswith("{"):
                      continue
                  try:
                      event = json.loads(line)
                  except json.JSONDecodeError as exc:
                      raise ProofError(f"invalid shard event: {exc}") from exc
                  if event.get("type") == "suite" and event.get("event") in ("ok", "failed"):
                      meta = event["nextest"]
                      key = f"{meta['crate']}::{meta['test_binary']} ({meta['kind']})"
                      passed[key] = passed.get(key, 0) + int(event["passed"])
                      failed[key] = failed.get(key, 0) + int(event["failed"])
                  elif event.get("type") == "test" and event.get("event") in ("ok", "failed"):
                      finished += 1
                      if event["event"] == "failed":
                          failed_tests.append(event["name"])
                      exec_time = float(event.get("exec_time") or 0)
                      if exec_time >= 60:
                          slow.append({"name": event["name"], "seconds": exec_time})
              executed = sum(passed.values()) + sum(failed.values())
              if finished != executed:
                  raise ProofError(f"shard events {finished} != suite total {executed}")
              return passed, failed, failed_tests, slow


          def coverage_counts(all_text, ignored_text, nextest_data):
              cargo = diff_cargo_lists(parse_cargo_list(all_text), parse_cargo_list(ignored_text))
              binaries = parse_nextest_list(nextest_data)
              nextest_runnable = sum(binaries.values())
              if cargo["cargo_runnable"] != nextest_runnable:
                  raise ProofError(
                      "cargo runnable "
                      f"{cargo['cargo_runnable']} != nextest runnable {nextest_runnable}"
                  )
              cargo["nextest_runnable"] = nextest_runnable
              cargo["nextest_binaries"] = dict(sorted(binaries.items()))
              return cargo


          def shard_report(shard, events_text, seconds, exit_status, recompiled):
              passed, failed, failed_tests, slow = parse_shard_events(events_text)
              keys = sorted(set(passed) | set(failed))
              return {
                  "shard": shard,
                  "partition": f"hash:{shard}/4",
                  "seconds": seconds,
                  "exit_status": exit_status,
                  "recompiled": recompiled,
                  "passed": sum(passed.values()),
                  "failed": sum(failed.values()),
                  "binaries": {
                      key: {"passed": passed.get(key, 0), "failed": failed.get(key, 0)} for key in keys
                  },
                  "failed_tests": failed_tests,
                  "slow_tests": slow,
              }


          def _wall_seconds(job):
              start = datetime.fromisoformat(job["started_at"].replace("Z", "+00:00"))
              end = datetime.fromisoformat(job["completed_at"].replace("Z", "+00:00"))
              if start.tzinfo is None:
                  start = start.replace(tzinfo=timezone.utc)
                  end = end.replace(tzinfo=timezone.utc)
              return int((end - start).total_seconds())


          def _job_index(payload):
              total = payload.get("total_count")
              jobs = payload.get("jobs")
              if not isinstance(total, int) or not isinstance(jobs, list):
                  raise ProofError("jobs payload is missing total_count")
              if total != len(jobs) or total > 100:
                  raise ProofError(f"jobs page is incomplete: total_count={total} returned={len(jobs)}")
              return jobs


          def aggregate_shards(expected, events_by_shard, reports_by_shard, jobs_payload, archive_result, shard_result):
              proof = {
                  "ok": False,
                  "errors": [],
                  "partition": "hash",
                  "shards": 4,
                  "archive_result": archive_result,
                  "shard_result": shard_result,
                  "cargo_runnable": expected.get("cargo_runnable"),
                  "nextest_runnable": expected.get("nextest_runnable"),
                  "doctests_listed": expected.get("doctests_listed"),
                  "doctests_passed": expected.get("doctests_passed"),
                  "build_seconds": expected.get("build_seconds"),
                  "cargo_sections": expected.get("cargo_sections"),
                  "nextest_binaries": expected.get("nextest_binaries"),
              }
              errors = proof["errors"]
              if archive_result != "success" or shard_result != "success":
                  errors.append(
                      f"loop nextest jobs did not succeed: archive={archive_result} shard={shard_result}"
                  )
              if expected.get("doctests_listed") != expected.get("doctests_passed"):
                  errors.append(
                      "doctests listed "
                      f"{expected.get('doctests_listed')} != passed {expected.get('doctests_passed')}"
                  )
              if expected.get("cargo_runnable") != expected.get("nextest_runnable"):
                  errors.append("archive expected counts are not equal")
              try:
                  jobs = _job_index(jobs_payload)
              except ProofError as exc:
                  errors.append(str(exc))
                  jobs = []
              by_name = {}
              for job in jobs:
                  by_name.setdefault(job.get("name"), []).append(job)

              def take(name):
                  matches = by_name.get(name, [])
                  if len(matches) != 1:
                      close = [job.get("name") for job in jobs if "nextest" in (job.get("name") or "")]
                      errors.append(
                          f"expected one job named {name}, found {len(matches)}; nextest jobs={close}"
                      )
                      return None
                  job = matches[0]
                  if job.get("status") != "completed" or job.get("conclusion") != "success":
                      errors.append(
                          f"{name} status={job.get('status')} conclusion={job.get('conclusion')}"
                      )
                  try:
                      job["wall_seconds"] = _wall_seconds(job)
                  except (KeyError, TypeError, ValueError) as exc:
                      errors.append(f"{name} wall time missing: {exc}")
                  return job

              archive_job = take("Loop nextest archive")
              if archive_job is not None:
                  proof["archive_wall_seconds"] = archive_job.get("wall_seconds")
              executed = {}
              failed_total = 0
              passed_total = 0
              shard_rows = []
              slow = []
              failed_tests = []
              for shard in (1, 2, 3, 4):
                  job = take(f"Loop nextest shard ({shard})")
                  row = {
                      "shard": shard,
                      "partition": f"hash:{shard}/4",
                      "job_wall_seconds": None if job is None else job.get("wall_seconds"),
                  }
                  events = events_by_shard.get(shard)
                  report = reports_by_shard.get(shard)
                  if events is None or report is None:
                      errors.append(f"shard {shard} result is missing")
                      shard_rows.append(row)
                      continue
                  try:
                      parsed = shard_report(
                          shard,
                          events,
                          report.get("seconds"),
                          report.get("exit_status"),
                          report.get("recompiled"),
                      )
                  except ProofError as exc:
                      errors.append(f"shard {shard}: {exc}")
                      shard_rows.append(row)
                      continue
                  if report.get("partition") != parsed["partition"]:
                      errors.append(f"shard {shard} partition {report.get('partition')}")
                  if report.get("recompiled") is True or parsed["recompiled"] is True:
                      errors.append(f"shard {shard} recompiled")
                  if report.get("exit_status") != 0:
                      errors.append(f"shard {shard} exit status {report.get('exit_status')}")
                  if report.get("passed") != parsed["passed"] or report.get("failed") != parsed["failed"]:
                      errors.append(f"shard {shard} report does not match events")
                  if report.get("binaries") != parsed["binaries"]:
                      errors.append(f"shard {shard} binary report does not match events")
                  row.update(
                      {
                          "passed": parsed["passed"],
                          "failed": parsed["failed"],
                          "seconds": report.get("seconds"),
                          "slow_tests": parsed["slow_tests"],
                      }
                  )
                  passed_total += parsed["passed"]
                  failed_total += parsed["failed"]
                  failed_tests.extend(parsed["failed_tests"])
                  slow.extend(parsed["slow_tests"])
                  for key, counts in parsed["binaries"].items():
                      slot = executed.setdefault(key, {"passed": 0, "failed": 0})
                      slot["passed"] += counts["passed"]
                      slot["failed"] += counts["failed"]
                  shard_rows.append(row)
              expected_binaries = expected.get("nextest_binaries") or {}
              compared = {}
              for key in sorted(set(expected_binaries) | set(executed)):
                  want = expected_binaries.get(key, 0)
                  got = executed.get(key, {"passed": 0, "failed": 0})
                  ran = got["passed"] + got["failed"]
                  compared[key] = {"expected": want, "passed": got["passed"], "failed": got["failed"]}
                  if ran != want or got["failed"] != 0:
                      errors.append(f"{key}: expected {want}, passed {got['passed']}, failed {got['failed']}")
              if passed_total != expected.get("nextest_runnable") or failed_total != 0:
                  errors.append(
                      f"executed {passed_total} passed and {failed_total} failed, "
                      f"expected {expected.get('nextest_runnable')} passed"
                  )
              proof.update(
                  {
                      "ok": not errors,
                      "shards_detail": shard_rows,
                      "executed_total": passed_total,
                      "failed_total": failed_total,
                      "binaries": compared,
                      "failed_tests": failed_tests,
                      "slow_tests": slow,
                  }
              )
              return proof


          def render_summary(proof):
              lines = ["## Loop nextest shards", ""]
              lines.append("| Shard | Passed | Failed | Command s | Job wall s |")
              lines.append("| --- | ---: | ---: | ---: | ---: |")
              for row in proof.get("shards_detail") or []:
                  lines.append(
                      "| {shard} | {passed} | {failed} | {seconds} | {wall} |".format(
                          shard=row.get("shard", ""),
                          passed=row.get("passed", ""),
                          failed=row.get("failed", ""),
                          seconds=row.get("seconds", ""),
                          wall=row.get("job_wall_seconds", ""),
                      )
                  )
              lines.extend(
                  [
                      "",
                      f"Archive build seconds: {proof.get('build_seconds')}",
                      f"Archive job wall seconds: {proof.get('archive_wall_seconds')}",
                      (
                          f"Cargo runnable {proof.get('cargo_runnable')}; "
                          f"nextest runnable {proof.get('nextest_runnable')}; "
                          f"executed {proof.get('executed_total')}"
                      ),
                      (
                          f"Doctests listed {proof.get('doctests_listed')}; "
                          f"passed {proof.get('doctests_passed')}"
                      ),
                      "",
                      "| Binary | Expected | Passed | Failed |",
                      "| --- | ---: | ---: | ---: |",
                  ]
              )
              for key, counts in (proof.get("binaries") or {}).items():
                  lines.append(
                      f"| `{key}` | {counts['expected']} | {counts['passed']} | {counts['failed']} |"
                  )
              if proof.get("slow_tests"):
                  lines.extend(["", "Slow tests (>= 60s):"])
                  for test in proof["slow_tests"]:
                      lines.append(f"- `{test['name']}` {test['seconds']}s")
              if proof.get("errors"):
                  lines.extend(["", "Errors:"])
                  for error in proof["errors"]:
                      lines.append(f"- {error}")
              lines.append("")
              return "\n".join(lines)
          # nextest-ci-lib-end
          import json
          import os
          import subprocess
          import sys
          import time
          from pathlib import Path

          work = Path(os.environ["WORK"])
          packages = work.joinpath("packages.txt").read_text().splitlines()
          try:
              counts = coverage_counts(
                  work.joinpath("cargo-list.txt").read_text(),
                  work.joinpath("cargo-ignored.txt").read_text(),
                  json.loads(work.joinpath("nextest-list.json").read_text()),
              )
          except ProofError as exc:
              raise SystemExit(str(exc))
          listed = counts["doctests_listed"]
          passed = 0
          doctest_seconds = 0
          if listed:
              command = [
                  "cargo", "test",
                  "--manifest-path", "research-core/Cargo.toml",
                  "--locked", "--color", "never",
              ]
              for package in packages:
                  command.extend(["-p", package])
              command.append("--doc")
              env = os.environ.copy()
              env["CARGO_TERM_COLOR"] = "never"
              started = time.time()
              completed = subprocess.run(
                  command, text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, env=env
              )
              doctest_seconds = int(time.time() - started)
              if completed.returncode != 0:
                  sys.stderr.write(completed.stdout)
                  raise SystemExit("cargo test --doc failed")
              try:
                  passed, results = parse_doctest_results(completed.stdout)
              except ProofError as exc:
                  raise SystemExit(str(exc))
              if results < 1 or passed != listed:
                  raise SystemExit(f"doctests passed {passed} across {results} results, listed {listed}")
          payload = {
              "partition": "hash",
              "shards": 4,
              "packages": packages,
              "build_seconds": int(os.environ["BUILD_SECONDS"]),
              "doctest_seconds": doctest_seconds,
              "doctests_passed": passed,
          }
          payload.update(counts)
          work.joinpath("expected-counts.json").write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n")
          print(
              "cargo_runnable={cargo_runnable} nextest_runnable={nextest_runnable} "
              "doctests_listed={doctests_listed} doctests_passed={doctests_passed} "
              "build_seconds={build_seconds}".format(**payload)
          )
          for key, count in payload["nextest_binaries"].items():
              print(f"{count}\t{key}")
          PY

      - name: Upload loop nextest archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: loop-nextest-archive-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/loop-nextest-build/archive.tar.zst
          if-no-files-found: error
          retention-days: 7

      - name: Upload loop nextest expected counts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: loop-nextest-expected-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/loop-nextest-build/expected-counts.json
          if-no-files-found: error
          retention-days: 7

  rust_loop_nextest_shard:
    name: Loop nextest shard (${{ matrix.shard }})
    needs: rust_loop_nextest_archive
    if: ${{ needs.rust_loop_nextest_archive.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: rust_hft
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: 1.98.1

      - name: Install Linux build tools
        run: bash "$GITHUB_WORKSPACE/.github/workflows/install-ubuntu-packages.sh" clang mold protobuf-compiler

      - name: Install cargo-nextest 0.9.146
        run: |
          set -euo pipefail
          bindir="${CARGO_HOME:-$HOME/.cargo}/bin"
          mkdir -p "$bindir"
          curl -LsSf https://get.nexte.st/0.9.146/linux | tar zxf - -C "$bindir"
          version=$(cargo nextest --version | head -n 1)
          [[ $version == cargo-nextest\ 0.9.146\ * ]] || { echo "unexpected nextest version: $version" >&2; exit 1; }

      - name: Download loop nextest archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: loop-nextest-archive-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/loop-nextest-archive

      - name: Run archived tests
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/loop-nextest-shard"
          mkdir -p "$work"
          archive="$RUNNER_TEMP/loop-nextest-archive/archive.tar.zst"
          test -f "$archive"
          [[ $SHARD =~ ^[1-4]$ ]] || { echo "invalid shard: $SHARD" >&2; exit 1; }
          config="$GITHUB_WORKSPACE/rust_hft/research-core/.config/nextest.toml"
          test -f "$config"
          export WORK="$work"
          start=$(date +%s)
          set +e
          NEXTEST_EXPERIMENTAL_LIBTEST_JSON=1 \
            cargo nextest run \
            --archive-file "$archive" \
            --partition "hash:${SHARD}/4" \
            --config-file "$config" \
            --user-config-file none \
            --retries 0 \
            --no-fail-fast \
            --no-tests=pass \
            --message-format libtest-json-plus \
            > "$work/shard-${SHARD}-events.jsonl" 2> "$work/stderr.txt"
          status=$?
          set -e
          seconds=$(( $(date +%s) - start ))
          recompiled=0
          if grep -Eq '^[[:space:]]*Compiling [^[:space:]]+ v[0-9]' "$work/stderr.txt"; then
            recompiled=1
          fi
          cat "$work/stderr.txt"
          export SHARD_SECONDS="$seconds"
          export SHARD_STATUS="$status"
          export SHARD_RECOMPILED="$recompiled"
          python3 - <<'PY'
          # nextest-ci-lib-begin
          """Count cargo test and nextest shard runs for the loop-engineer CI job."""

          import json
          import re
          from datetime import datetime, timezone


          class ProofError(Exception):
              pass


          def parse_cargo_list(text):
              text = text.replace("\r", "")
              text = re.sub(r"\x1b\[[0-9;]*[A-Za-z]", "", text)
              sections = []
              current = None

              def close(summary_tests):
                  counted = current["listed_test"] + current["listed_ignore"]
                  if counted != summary_tests:
                      raise ProofError(
                          f"cargo list section {current['id']} counted {counted}, summary {summary_tests}"
                      )
                  current["summary"] = summary_tests
                  sections.append(current)

              for raw in text.splitlines():
                  line = raw.strip()
                  if not line:
                      continue
                  run = re.search(r"deps/([A-Za-z0-9_]+-[0-9a-f]{16})\)?$", line)
                  doc = re.fullmatch(r"Doc-tests\s+(\S+)", line)
                  if "Running " in line or line.startswith("Doc-tests "):
                      if current is not None:
                          raise ProofError(f"cargo list section {current['id']} missing summary")
                      if run:
                          current = {
                              "id": run.group(1),
                              "kind": "target",
                              "listed_test": 0,
                              "listed_ignore": 0,
                          }
                          continue
                      if doc:
                          current = {
                              "id": f"doctest:{doc.group(1)}",
                              "kind": "doctest",
                              "listed_test": 0,
                              "listed_ignore": 0,
                          }
                          continue
                      raise ProofError(f"unparsed cargo list header: {line}")
                  if current is None:
                      continue
                  summary = re.fullmatch(r"(\d+) tests?, (\d+) benchmarks?", line)
                  if summary:
                      close(int(summary.group(1)))
                      current = None
                      continue
                  if line.endswith(": test"):
                      current["listed_test"] += 1
                      continue
                  if line.endswith(": ignore"):
                      current["listed_ignore"] += 1
                      continue
                  if line.endswith(": benchmark"):
                      continue
                  raise ProofError(f"unparsed cargo list line in {current['id']}: {line}")
              if current is not None:
                  raise ProofError(f"cargo list section {current['id']} missing summary")
              return sections


          def _index_sections(sections):
              indexed = {}
              for section in sections:
                  if section["id"] in indexed:
                      raise ProofError(f"duplicate cargo list section {section['id']}")
                  indexed[section["id"]] = section
              return indexed


          def diff_cargo_lists(all_sections, ignored_sections):
              all_index = _index_sections(all_sections)
              ignored_index = _index_sections(ignored_sections)
              if set(all_index) != set(ignored_index):
                  missing = sorted(set(all_index) ^ set(ignored_index))
                  raise ProofError("cargo list sections differ from ignored list: " + ", ".join(missing))
              runnable = 0
              doctests = 0
              ignored = 0
              sections = []
              for section_id in sorted(all_index):
                  full = all_index[section_id]
                  ignored_summary = ignored_index[section_id]["summary"]
                  if ignored_summary > full["summary"]:
                      raise ProofError(f"ignored count exceeds list count for {section_id}")
                  count = full["summary"] - ignored_summary
                  if full["kind"] == "doctest":
                      doctests += count
                  else:
                      runnable += count
                  ignored += ignored_summary
                  sections.append(
                      {
                          "id": section_id,
                          "kind": full["kind"],
                          "listed": full["summary"],
                          "ignored": ignored_summary,
                          "runnable": count,
                      }
                  )
              return {
                  "cargo_runnable": runnable,
                  "cargo_ignored": ignored,
                  "doctests_listed": doctests,
                  "cargo_sections": sections,
              }


          def parse_nextest_list(data):
              binaries = {}
              for suite in data["rust-suites"].values():
                  status = suite.get("status")
                  if status not in (None, "listed"):
                      raise ProofError(f"nextest suite status {status} for {suite.get('binary-name')}")
                  key = f"{suite['package-name']}::{suite['binary-name']} ({suite['kind']})"
                  count = 0
                  for case in suite["testcases"].values():
                      if case.get("kind") not in (None, "test"):
                          continue
                      if case.get("ignored"):
                          continue
                      if (case.get("filter-match") or {}).get("status") == "matches":
                          count += 1
                  binaries[key] = binaries.get(key, 0) + count
              return {key: count for key, count in binaries.items() if count}


          def parse_doctest_results(text):
              passed = 0
              results = 0
              for line in text.splitlines():
                  if "test result: FAILED" in line:
                      raise ProofError("doctest result failed")
                  matched = re.search(r"test result: ok\. (\d+) passed;", line)
                  if matched:
                      passed += int(matched.group(1))
                      results += 1
              return passed, results


          def parse_shard_events(text):
              passed = {}
              failed = {}
              failed_tests = []
              slow = []
              finished = 0
              for line in text.splitlines():
                  line = line.strip()
                  if not line.startswith("{"):
                      continue
                  try:
                      event = json.loads(line)
                  except json.JSONDecodeError as exc:
                      raise ProofError(f"invalid shard event: {exc}") from exc
                  if event.get("type") == "suite" and event.get("event") in ("ok", "failed"):
                      meta = event["nextest"]
                      key = f"{meta['crate']}::{meta['test_binary']} ({meta['kind']})"
                      passed[key] = passed.get(key, 0) + int(event["passed"])
                      failed[key] = failed.get(key, 0) + int(event["failed"])
                  elif event.get("type") == "test" and event.get("event") in ("ok", "failed"):
                      finished += 1
                      if event["event"] == "failed":
                          failed_tests.append(event["name"])
                      exec_time = float(event.get("exec_time") or 0)
                      if exec_time >= 60:
                          slow.append({"name": event["name"], "seconds": exec_time})
              executed = sum(passed.values()) + sum(failed.values())
              if finished != executed:
                  raise ProofError(f"shard events {finished} != suite total {executed}")
              return passed, failed, failed_tests, slow


          def coverage_counts(all_text, ignored_text, nextest_data):
              cargo = diff_cargo_lists(parse_cargo_list(all_text), parse_cargo_list(ignored_text))
              binaries = parse_nextest_list(nextest_data)
              nextest_runnable = sum(binaries.values())
              if cargo["cargo_runnable"] != nextest_runnable:
                  raise ProofError(
                      "cargo runnable "
                      f"{cargo['cargo_runnable']} != nextest runnable {nextest_runnable}"
                  )
              cargo["nextest_runnable"] = nextest_runnable
              cargo["nextest_binaries"] = dict(sorted(binaries.items()))
              return cargo


          def shard_report(shard, events_text, seconds, exit_status, recompiled):
              passed, failed, failed_tests, slow = parse_shard_events(events_text)
              keys = sorted(set(passed) | set(failed))
              return {
                  "shard": shard,
                  "partition": f"hash:{shard}/4",
                  "seconds": seconds,
                  "exit_status": exit_status,
                  "recompiled": recompiled,
                  "passed": sum(passed.values()),
                  "failed": sum(failed.values()),
                  "binaries": {
                      key: {"passed": passed.get(key, 0), "failed": failed.get(key, 0)} for key in keys
                  },
                  "failed_tests": failed_tests,
                  "slow_tests": slow,
              }


          def _wall_seconds(job):
              start = datetime.fromisoformat(job["started_at"].replace("Z", "+00:00"))
              end = datetime.fromisoformat(job["completed_at"].replace("Z", "+00:00"))
              if start.tzinfo is None:
                  start = start.replace(tzinfo=timezone.utc)
                  end = end.replace(tzinfo=timezone.utc)
              return int((end - start).total_seconds())


          def _job_index(payload):
              total = payload.get("total_count")
              jobs = payload.get("jobs")
              if not isinstance(total, int) or not isinstance(jobs, list):
                  raise ProofError("jobs payload is missing total_count")
              if total != len(jobs) or total > 100:
                  raise ProofError(f"jobs page is incomplete: total_count={total} returned={len(jobs)}")
              return jobs


          def aggregate_shards(expected, events_by_shard, reports_by_shard, jobs_payload, archive_result, shard_result):
              proof = {
                  "ok": False,
                  "errors": [],
                  "partition": "hash",
                  "shards": 4,
                  "archive_result": archive_result,
                  "shard_result": shard_result,
                  "cargo_runnable": expected.get("cargo_runnable"),
                  "nextest_runnable": expected.get("nextest_runnable"),
                  "doctests_listed": expected.get("doctests_listed"),
                  "doctests_passed": expected.get("doctests_passed"),
                  "build_seconds": expected.get("build_seconds"),
                  "cargo_sections": expected.get("cargo_sections"),
                  "nextest_binaries": expected.get("nextest_binaries"),
              }
              errors = proof["errors"]
              if archive_result != "success" or shard_result != "success":
                  errors.append(
                      f"loop nextest jobs did not succeed: archive={archive_result} shard={shard_result}"
                  )
              if expected.get("doctests_listed") != expected.get("doctests_passed"):
                  errors.append(
                      "doctests listed "
                      f"{expected.get('doctests_listed')} != passed {expected.get('doctests_passed')}"
                  )
              if expected.get("cargo_runnable") != expected.get("nextest_runnable"):
                  errors.append("archive expected counts are not equal")
              try:
                  jobs = _job_index(jobs_payload)
              except ProofError as exc:
                  errors.append(str(exc))
                  jobs = []
              by_name = {}
              for job in jobs:
                  by_name.setdefault(job.get("name"), []).append(job)

              def take(name):
                  matches = by_name.get(name, [])
                  if len(matches) != 1:
                      close = [job.get("name") for job in jobs if "nextest" in (job.get("name") or "")]
                      errors.append(
                          f"expected one job named {name}, found {len(matches)}; nextest jobs={close}"
                      )
                      return None
                  job = matches[0]
                  if job.get("status") != "completed" or job.get("conclusion") != "success":
                      errors.append(
                          f"{name} status={job.get('status')} conclusion={job.get('conclusion')}"
                      )
                  try:
                      job["wall_seconds"] = _wall_seconds(job)
                  except (KeyError, TypeError, ValueError) as exc:
                      errors.append(f"{name} wall time missing: {exc}")
                  return job

              archive_job = take("Loop nextest archive")
              if archive_job is not None:
                  proof["archive_wall_seconds"] = archive_job.get("wall_seconds")
              executed = {}
              failed_total = 0
              passed_total = 0
              shard_rows = []
              slow = []
              failed_tests = []
              for shard in (1, 2, 3, 4):
                  job = take(f"Loop nextest shard ({shard})")
                  row = {
                      "shard": shard,
                      "partition": f"hash:{shard}/4",
                      "job_wall_seconds": None if job is None else job.get("wall_seconds"),
                  }
                  events = events_by_shard.get(shard)
                  report = reports_by_shard.get(shard)
                  if events is None or report is None:
                      errors.append(f"shard {shard} result is missing")
                      shard_rows.append(row)
                      continue
                  try:
                      parsed = shard_report(
                          shard,
                          events,
                          report.get("seconds"),
                          report.get("exit_status"),
                          report.get("recompiled"),
                      )
                  except ProofError as exc:
                      errors.append(f"shard {shard}: {exc}")
                      shard_rows.append(row)
                      continue
                  if report.get("partition") != parsed["partition"]:
                      errors.append(f"shard {shard} partition {report.get('partition')}")
                  if report.get("recompiled") is True or parsed["recompiled"] is True:
                      errors.append(f"shard {shard} recompiled")
                  if report.get("exit_status") != 0:
                      errors.append(f"shard {shard} exit status {report.get('exit_status')}")
                  if report.get("passed") != parsed["passed"] or report.get("failed") != parsed["failed"]:
                      errors.append(f"shard {shard} report does not match events")
                  if report.get("binaries") != parsed["binaries"]:
                      errors.append(f"shard {shard} binary report does not match events")
                  row.update(
                      {
                          "passed": parsed["passed"],
                          "failed": parsed["failed"],
                          "seconds": report.get("seconds"),
                          "slow_tests": parsed["slow_tests"],
                      }
                  )
                  passed_total += parsed["passed"]
                  failed_total += parsed["failed"]
                  failed_tests.extend(parsed["failed_tests"])
                  slow.extend(parsed["slow_tests"])
                  for key, counts in parsed["binaries"].items():
                      slot = executed.setdefault(key, {"passed": 0, "failed": 0})
                      slot["passed"] += counts["passed"]
                      slot["failed"] += counts["failed"]
                  shard_rows.append(row)
              expected_binaries = expected.get("nextest_binaries") or {}
              compared = {}
              for key in sorted(set(expected_binaries) | set(executed)):
                  want = expected_binaries.get(key, 0)
                  got = executed.get(key, {"passed": 0, "failed": 0})
                  ran = got["passed"] + got["failed"]
                  compared[key] = {"expected": want, "passed": got["passed"], "failed": got["failed"]}
                  if ran != want or got["failed"] != 0:
                      errors.append(f"{key}: expected {want}, passed {got['passed']}, failed {got['failed']}")
              if passed_total != expected.get("nextest_runnable") or failed_total != 0:
                  errors.append(
                      f"executed {passed_total} passed and {failed_total} failed, "
                      f"expected {expected.get('nextest_runnable')} passed"
                  )
              proof.update(
                  {
                      "ok": not errors,
                      "shards_detail": shard_rows,
                      "executed_total": passed_total,
                      "failed_total": failed_total,
                      "binaries": compared,
                      "failed_tests": failed_tests,
                      "slow_tests": slow,
                  }
              )
              return proof


          def render_summary(proof):
              lines = ["## Loop nextest shards", ""]
              lines.append("| Shard | Passed | Failed | Command s | Job wall s |")
              lines.append("| --- | ---: | ---: | ---: | ---: |")
              for row in proof.get("shards_detail") or []:
                  lines.append(
                      "| {shard} | {passed} | {failed} | {seconds} | {wall} |".format(
                          shard=row.get("shard", ""),
                          passed=row.get("passed", ""),
                          failed=row.get("failed", ""),
                          seconds=row.get("seconds", ""),
                          wall=row.get("job_wall_seconds", ""),
                      )
                  )
              lines.extend(
                  [
                      "",
                      f"Archive build seconds: {proof.get('build_seconds')}",
                      f"Archive job wall seconds: {proof.get('archive_wall_seconds')}",
                      (
                          f"Cargo runnable {proof.get('cargo_runnable')}; "
                          f"nextest runnable {proof.get('nextest_runnable')}; "
                          f"executed {proof.get('executed_total')}"
                      ),
                      (
                          f"Doctests listed {proof.get('doctests_listed')}; "
                          f"passed {proof.get('doctests_passed')}"
                      ),
                      "",
                      "| Binary | Expected | Passed | Failed |",
                      "| --- | ---: | ---: | ---: |",
                  ]
              )
              for key, counts in (proof.get("binaries") or {}).items():
                  lines.append(
                      f"| `{key}` | {counts['expected']} | {counts['passed']} | {counts['failed']} |"
                  )
              if proof.get("slow_tests"):
                  lines.extend(["", "Slow tests (>= 60s):"])
                  for test in proof["slow_tests"]:
                      lines.append(f"- `{test['name']}` {test['seconds']}s")
              if proof.get("errors"):
                  lines.extend(["", "Errors:"])
                  for error in proof["errors"]:
                      lines.append(f"- {error}")
              lines.append("")
              return "\n".join(lines)
          # nextest-ci-lib-end
          import json
          import os
          from pathlib import Path

          work = Path(os.environ["WORK"])
          shard = int(os.environ["SHARD"])
          events = work.joinpath(f"shard-{shard}-events.jsonl").read_text()
          try:
              report = shard_report(
                  shard,
                  events,
                  int(os.environ["SHARD_SECONDS"]),
                  int(os.environ["SHARD_STATUS"]),
                  os.environ["SHARD_RECOMPILED"] == "1",
              )
          except ProofError as exc:
              raise SystemExit(str(exc))
          work.joinpath(f"shard-{shard}.json").write_text(json.dumps(report, indent=2, sort_keys=True) + "\n")
          print(
              f"shard {shard} passed={report['passed']} failed={report['failed']} "
              f"recompiled={report['recompiled']} exit={report['exit_status']}"
          )
          PY

          if [[ $recompiled -ne 0 ]]; then
            echo 'shard rebuilt a crate; archive execution must not compile' >&2
            exit 1
          fi
          exit "$status"

      - name: Upload shard result
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: loop-nextest-shard-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/loop-nextest-shard/shard-${{ matrix.shard }}.json
            ${{ runner.temp }}/loop-nextest-shard/shard-${{ matrix.shard }}-events.jsonl
          if-no-files-found: error
          retention-days: 7

  rust:
    name: Rust Workspace
    outputs:
      evidence: ${{ steps.rust_evidence.outputs.evidence }}
    permissions:
      contents: read
      actions: read
    needs: [scope, rust_loop_nextest_archive, rust_loop_nextest_shard]
    if: ${{ always() && !cancelled() && needs.scope.result == 'success' && contains(needs.scope.outputs.jobs, ',ci/rust,') }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      CARGO_TERM_COLOR: always
      CARGO_TARGET_DIR: ${{ github.workspace }}/rust_hft/target
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    defaults:
      run:
        working-directory: rust_hft
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Rust toolchain
        if: ${{ (needs.scope.outputs.toolchain == 'true') }}
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Install Linux build tools
        if: ${{ (needs.scope.outputs.toolchain == 'true') }}
        run: bash "$GITHUB_WORKSPACE/.github/workflows/install-ubuntu-packages.sh" clang mold protobuf-compiler

      - name: Record cache dimensions
        if: ${{ (needs.scope.outputs.toolchain == 'true') }}
        id: cache-info
        shell: bash
        run: echo "rust=$(rustc -Vv | awk '/^release:/ {print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Rust
        if: ${{ (needs.scope.outputs.toolchain == 'true') }}
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            rust_hft
          key: rust_hft-ci-rust-${{ steps.cache-info.outputs.rust }}
          cache-all-crates: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Download loop nextest expected counts
        if: ${{ needs.scope.outputs.loop == 'true' && needs.rust_loop_nextest_archive.result == 'success' && needs.rust_loop_nextest_shard.result == 'success' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: loop-nextest-expected-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/loop-nextest

      - name: Download loop nextest shard results
        if: ${{ needs.scope.outputs.loop == 'true' && needs.rust_loop_nextest_archive.result == 'success' && needs.rust_loop_nextest_shard.result == 'success' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: loop-nextest-shard-*-${{ github.run_id }}-${{ github.run_attempt }}
          merge-multiple: true
          path: ${{ runner.temp }}/loop-nextest

      - name: Test Loop Engineer packages
        id: loop
        if: ${{ always() && !cancelled() && needs.scope.outputs.loop == 'true' }}
        env:
          ARCHIVE_RESULT: ${{ needs.rust_loop_nextest_archive.result }}
          SHARD_RESULT: ${{ needs.rust_loop_nextest_shard.result }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/loop-nextest"
          mkdir -p "$work"
          export WORK="$work"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs?per_page=100" > "$work/jobs.json"
          python3 - <<'PY'
          # nextest-ci-lib-begin
          """Count cargo test and nextest shard runs for the loop-engineer CI job."""

          import json
          import re
          from datetime import datetime, timezone


          class ProofError(Exception):
              pass


          def parse_cargo_list(text):
              text = text.replace("\r", "")
              text = re.sub(r"\x1b\[[0-9;]*[A-Za-z]", "", text)
              sections = []
              current = None

              def close(summary_tests):
                  counted = current["listed_test"] + current["listed_ignore"]
                  if counted != summary_tests:
                      raise ProofError(
                          f"cargo list section {current['id']} counted {counted}, summary {summary_tests}"
                      )
                  current["summary"] = summary_tests
                  sections.append(current)

              for raw in text.splitlines():
                  line = raw.strip()
                  if not line:
                      continue
                  run = re.search(r"deps/([A-Za-z0-9_]+-[0-9a-f]{16})\)?$", line)
                  doc = re.fullmatch(r"Doc-tests\s+(\S+)", line)
                  if "Running " in line or line.startswith("Doc-tests "):
                      if current is not None:
                          raise ProofError(f"cargo list section {current['id']} missing summary")
                      if run:
                          current = {
                              "id": run.group(1),
                              "kind": "target",
                              "listed_test": 0,
                              "listed_ignore": 0,
                          }
                          continue
                      if doc:
                          current = {
                              "id": f"doctest:{doc.group(1)}",
                              "kind": "doctest",
                              "listed_test": 0,
                              "listed_ignore": 0,
                          }
                          continue
                      raise ProofError(f"unparsed cargo list header: {line}")
                  if current is None:
                      continue
                  summary = re.fullmatch(r"(\d+) tests?, (\d+) benchmarks?", line)
                  if summary:
                      close(int(summary.group(1)))
                      current = None
                      continue
                  if line.endswith(": test"):
                      current["listed_test"] += 1
                      continue
                  if line.endswith(": ignore"):
                      current["listed_ignore"] += 1
                      continue
                  if line.endswith(": benchmark"):
                      continue
                  raise ProofError(f"unparsed cargo list line in {current['id']}: {line}")
              if current is not None:
                  raise ProofError(f"cargo list section {current['id']} missing summary")
              return sections


          def _index_sections(sections):
              indexed = {}
              for section in sections:
                  if section["id"] in indexed:
                      raise ProofError(f"duplicate cargo list section {section['id']}")
                  indexed[section["id"]] = section
              return indexed


          def diff_cargo_lists(all_sections, ignored_sections):
              all_index = _index_sections(all_sections)
              ignored_index = _index_sections(ignored_sections)
              if set(all_index) != set(ignored_index):
                  missing = sorted(set(all_index) ^ set(ignored_index))
                  raise ProofError("cargo list sections differ from ignored list: " + ", ".join(missing))
              runnable = 0
              doctests = 0
              ignored = 0
              sections = []
              for section_id in sorted(all_index):
                  full = all_index[section_id]
                  ignored_summary = ignored_index[section_id]["summary"]
                  if ignored_summary > full["summary"]:
                      raise ProofError(f"ignored count exceeds list count for {section_id}")
                  count = full["summary"] - ignored_summary
                  if full["kind"] == "doctest":
                      doctests += count
                  else:
                      runnable += count
                  ignored += ignored_summary
                  sections.append(
                      {
                          "id": section_id,
                          "kind": full["kind"],
                          "listed": full["summary"],
                          "ignored": ignored_summary,
                          "runnable": count,
                      }
                  )
              return {
                  "cargo_runnable": runnable,
                  "cargo_ignored": ignored,
                  "doctests_listed": doctests,
                  "cargo_sections": sections,
              }


          def parse_nextest_list(data):
              binaries = {}
              for suite in data["rust-suites"].values():
                  status = suite.get("status")
                  if status not in (None, "listed"):
                      raise ProofError(f"nextest suite status {status} for {suite.get('binary-name')}")
                  key = f"{suite['package-name']}::{suite['binary-name']} ({suite['kind']})"
                  count = 0
                  for case in suite["testcases"].values():
                      if case.get("kind") not in (None, "test"):
                          continue
                      if case.get("ignored"):
                          continue
                      if (case.get("filter-match") or {}).get("status") == "matches":
                          count += 1
                  binaries[key] = binaries.get(key, 0) + count
              return {key: count for key, count in binaries.items() if count}


          def parse_doctest_results(text):
              passed = 0
              results = 0
              for line in text.splitlines():
                  if "test result: FAILED" in line:
                      raise ProofError("doctest result failed")
                  matched = re.search(r"test result: ok\. (\d+) passed;", line)
                  if matched:
                      passed += int(matched.group(1))
                      results += 1
              return passed, results


          def parse_shard_events(text):
              passed = {}
              failed = {}
              failed_tests = []
              slow = []
              finished = 0
              for line in text.splitlines():
                  line = line.strip()
                  if not line.startswith("{"):
                      continue
                  try:
                      event = json.loads(line)
                  except json.JSONDecodeError as exc:
                      raise ProofError(f"invalid shard event: {exc}") from exc
                  if event.get("type") == "suite" and event.get("event") in ("ok", "failed"):
                      meta = event["nextest"]
                      key = f"{meta['crate']}::{meta['test_binary']} ({meta['kind']})"
                      passed[key] = passed.get(key, 0) + int(event["passed"])
                      failed[key] = failed.get(key, 0) + int(event["failed"])
                  elif event.get("type") == "test" and event.get("event") in ("ok", "failed"):
                      finished += 1
                      if event["event"] == "failed":
                          failed_tests.append(event["name"])
                      exec_time = float(event.get("exec_time") or 0)
                      if exec_time >= 60:
                          slow.append({"name": event["name"], "seconds": exec_time})
              executed = sum(passed.values()) + sum(failed.values())
              if finished != executed:
                  raise ProofError(f"shard events {finished} != suite total {executed}")
              return passed, failed, failed_tests, slow


          def coverage_counts(all_text, ignored_text, nextest_data):
              cargo = diff_cargo_lists(parse_cargo_list(all_text), parse_cargo_list(ignored_text))
              binaries = parse_nextest_list(nextest_data)
              nextest_runnable = sum(binaries.values())
              if cargo["cargo_runnable"] != nextest_runnable:
                  raise ProofError(
                      "cargo runnable "
                      f"{cargo['cargo_runnable']} != nextest runnable {nextest_runnable}"
                  )
              cargo["nextest_runnable"] = nextest_runnable
              cargo["nextest_binaries"] = dict(sorted(binaries.items()))
              return cargo


          def shard_report(shard, events_text, seconds, exit_status, recompiled):
              passed, failed, failed_tests, slow = parse_shard_events(events_text)
              keys = sorted(set(passed) | set(failed))
              return {
                  "shard": shard,
                  "partition": f"hash:{shard}/4",
                  "seconds": seconds,
                  "exit_status": exit_status,
                  "recompiled": recompiled,
                  "passed": sum(passed.values()),
                  "failed": sum(failed.values()),
                  "binaries": {
                      key: {"passed": passed.get(key, 0), "failed": failed.get(key, 0)} for key in keys
                  },
                  "failed_tests": failed_tests,
                  "slow_tests": slow,
              }


          def _wall_seconds(job):
              start = datetime.fromisoformat(job["started_at"].replace("Z", "+00:00"))
              end = datetime.fromisoformat(job["completed_at"].replace("Z", "+00:00"))
              if start.tzinfo is None:
                  start = start.replace(tzinfo=timezone.utc)
                  end = end.replace(tzinfo=timezone.utc)
              return int((end - start).total_seconds())


          def _job_index(payload):
              total = payload.get("total_count")
              jobs = payload.get("jobs")
              if not isinstance(total, int) or not isinstance(jobs, list):
                  raise ProofError("jobs payload is missing total_count")
              if total != len(jobs) or total > 100:
                  raise ProofError(f"jobs page is incomplete: total_count={total} returned={len(jobs)}")
              return jobs


          def aggregate_shards(expected, events_by_shard, reports_by_shard, jobs_payload, archive_result, shard_result):
              proof = {
                  "ok": False,
                  "errors": [],
                  "partition": "hash",
                  "shards": 4,
                  "archive_result": archive_result,
                  "shard_result": shard_result,
                  "cargo_runnable": expected.get("cargo_runnable"),
                  "nextest_runnable": expected.get("nextest_runnable"),
                  "doctests_listed": expected.get("doctests_listed"),
                  "doctests_passed": expected.get("doctests_passed"),
                  "build_seconds": expected.get("build_seconds"),
                  "cargo_sections": expected.get("cargo_sections"),
                  "nextest_binaries": expected.get("nextest_binaries"),
              }
              errors = proof["errors"]
              if archive_result != "success" or shard_result != "success":
                  errors.append(
                      f"loop nextest jobs did not succeed: archive={archive_result} shard={shard_result}"
                  )
              if expected.get("doctests_listed") != expected.get("doctests_passed"):
                  errors.append(
                      "doctests listed "
                      f"{expected.get('doctests_listed')} != passed {expected.get('doctests_passed')}"
                  )
              if expected.get("cargo_runnable") != expected.get("nextest_runnable"):
                  errors.append("archive expected counts are not equal")
              try:
                  jobs = _job_index(jobs_payload)
              except ProofError as exc:
                  errors.append(str(exc))
                  jobs = []
              by_name = {}
              for job in jobs:
                  by_name.setdefault(job.get("name"), []).append(job)

              def take(name):
                  matches = by_name.get(name, [])
                  if len(matches) != 1:
                      close = [job.get("name") for job in jobs if "nextest" in (job.get("name") or "")]
                      errors.append(
                          f"expected one job named {name}, found {len(matches)}; nextest jobs={close}"
                      )
                      return None
                  job = matches[0]
                  if job.get("status") != "completed" or job.get("conclusion") != "success":
                      errors.append(
                          f"{name} status={job.get('status')} conclusion={job.get('conclusion')}"
                      )
                  try:
                      job["wall_seconds"] = _wall_seconds(job)
                  except (KeyError, TypeError, ValueError) as exc:
                      errors.append(f"{name} wall time missing: {exc}")
                  return job

              archive_job = take("Loop nextest archive")
              if archive_job is not None:
                  proof["archive_wall_seconds"] = archive_job.get("wall_seconds")
              executed = {}
              failed_total = 0
              passed_total = 0
              shard_rows = []
              slow = []
              failed_tests = []
              for shard in (1, 2, 3, 4):
                  job = take(f"Loop nextest shard ({shard})")
                  row = {
                      "shard": shard,
                      "partition": f"hash:{shard}/4",
                      "job_wall_seconds": None if job is None else job.get("wall_seconds"),
                  }
                  events = events_by_shard.get(shard)
                  report = reports_by_shard.get(shard)
                  if events is None or report is None:
                      errors.append(f"shard {shard} result is missing")
                      shard_rows.append(row)
                      continue
                  try:
                      parsed = shard_report(
                          shard,
                          events,
                          report.get("seconds"),
                          report.get("exit_status"),
                          report.get("recompiled"),
                      )
                  except ProofError as exc:
                      errors.append(f"shard {shard}: {exc}")
                      shard_rows.append(row)
                      continue
                  if report.get("partition") != parsed["partition"]:
                      errors.append(f"shard {shard} partition {report.get('partition')}")
                  if report.get("recompiled") is True or parsed["recompiled"] is True:
                      errors.append(f"shard {shard} recompiled")
                  if report.get("exit_status") != 0:
                      errors.append(f"shard {shard} exit status {report.get('exit_status')}")
                  if report.get("passed") != parsed["passed"] or report.get("failed") != parsed["failed"]:
                      errors.append(f"shard {shard} report does not match events")
                  if report.get("binaries") != parsed["binaries"]:
                      errors.append(f"shard {shard} binary report does not match events")
                  row.update(
                      {
                          "passed": parsed["passed"],
                          "failed": parsed["failed"],
                          "seconds": report.get("seconds"),
                          "slow_tests": parsed["slow_tests"],
                      }
                  )
                  passed_total += parsed["passed"]
                  failed_total += parsed["failed"]
                  failed_tests.extend(parsed["failed_tests"])
                  slow.extend(parsed["slow_tests"])
                  for key, counts in parsed["binaries"].items():
                      slot = executed.setdefault(key, {"passed": 0, "failed": 0})
                      slot["passed"] += counts["passed"]
                      slot["failed"] += counts["failed"]
                  shard_rows.append(row)
              expected_binaries = expected.get("nextest_binaries") or {}
              compared = {}
              for key in sorted(set(expected_binaries) | set(executed)):
                  want = expected_binaries.get(key, 0)
                  got = executed.get(key, {"passed": 0, "failed": 0})
                  ran = got["passed"] + got["failed"]
                  compared[key] = {"expected": want, "passed": got["passed"], "failed": got["failed"]}
                  if ran != want or got["failed"] != 0:
                      errors.append(f"{key}: expected {want}, passed {got['passed']}, failed {got['failed']}")
              if passed_total != expected.get("nextest_runnable") or failed_total != 0:
                  errors.append(
                      f"executed {passed_total} passed and {failed_total} failed, "
                      f"expected {expected.get('nextest_runnable')} passed"
                  )
              proof.update(
                  {
                      "ok": not errors,
                      "shards_detail": shard_rows,
                      "executed_total": passed_total,
                      "failed_total": failed_total,
                      "binaries": compared,
                      "failed_tests": failed_tests,
                      "slow_tests": slow,
                  }
              )
              return proof


          def render_summary(proof):
              lines = ["## Loop nextest shards", ""]
              lines.append("| Shard | Passed | Failed | Command s | Job wall s |")
              lines.append("| --- | ---: | ---: | ---: | ---: |")
              for row in proof.get("shards_detail") or []:
                  lines.append(
                      "| {shard} | {passed} | {failed} | {seconds} | {wall} |".format(
                          shard=row.get("shard", ""),
                          passed=row.get("passed", ""),
                          failed=row.get("failed", ""),
                          seconds=row.get("seconds", ""),
                          wall=row.get("job_wall_seconds", ""),
                      )
                  )
              lines.extend(
                  [
                      "",
                      f"Archive build seconds: {proof.get('build_seconds')}",
                      f"Archive job wall seconds: {proof.get('archive_wall_seconds')}",
                      (
                          f"Cargo runnable {proof.get('cargo_runnable')}; "
                          f"nextest runnable {proof.get('nextest_runnable')}; "
                          f"executed {proof.get('executed_total')}"
                      ),
                      (
                          f"Doctests listed {proof.get('doctests_listed')}; "
                          f"passed {proof.get('doctests_passed')}"
                      ),
                      "",
                      "| Binary | Expected | Passed | Failed |",
                      "| --- | ---: | ---: | ---: |",
                  ]
              )
              for key, counts in (proof.get("binaries") or {}).items():
                  lines.append(
                      f"| `{key}` | {counts['expected']} | {counts['passed']} | {counts['failed']} |"
                  )
              if proof.get("slow_tests"):
                  lines.extend(["", "Slow tests (>= 60s):"])
                  for test in proof["slow_tests"]:
                      lines.append(f"- `{test['name']}` {test['seconds']}s")
              if proof.get("errors"):
                  lines.extend(["", "Errors:"])
                  for error in proof["errors"]:
                      lines.append(f"- {error}")
              lines.append("")
              return "\n".join(lines)
          # nextest-ci-lib-end
          import json
          import os
          import sys
          import traceback
          from pathlib import Path

          work = Path(os.environ["WORK"])
          expected_path = work / "expected-counts.json"
          expected = json.loads(expected_path.read_text()) if expected_path.exists() else {}
          events = {}
          reports = {}
          for shard in (1, 2, 3, 4):
              events_path = work / f"shard-{shard}-events.jsonl"
              report_path = work / f"shard-{shard}.json"
              if events_path.exists():
                  events[shard] = events_path.read_text()
              if report_path.exists():
                  reports[shard] = json.loads(report_path.read_text())
          jobs_payload = json.loads((work / "jobs.json").read_text())
          try:
              proof = aggregate_shards(
                  expected,
                  events,
                  reports,
                  jobs_payload,
                  os.environ["ARCHIVE_RESULT"],
                  os.environ["SHARD_RESULT"],
              )
          except Exception:
              proof = {"ok": False, "errors": [traceback.format_exc()]}
          proof_path = Path(os.environ["RUNNER_TEMP"]) / "loop-nextest-proof.json"
          proof_path.write_text(json.dumps(proof, indent=2, sort_keys=True) + "\n")
          summary = render_summary(proof)
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as handle:
              handle.write(summary)
          print(summary)
          if not proof["ok"]:
              raise SystemExit(1)
          PY

      - name: Upload loop nextest proof
        if: ${{ always() && !cancelled() && steps.loop.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: loop-nextest-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/loop-nextest-proof.json
          if-no-files-found: error
          retention-days: 7

      - name: Test directly changed Rust packages
        id: owning
        if: ${{ (needs.scope.outputs.owning_packages != ',,') }}
        env:
          OWNING_PACKAGES: ${{ needs.scope.outputs.owning_packages }}
        run: |
          package_list=${OWNING_PACKAGES#,}
          package_list=${package_list%,}
          IFS=',' read -ra packages <<<"$package_list"
          args=()
          for package in "${packages[@]}"; do
            args+=(-p "$package")
          done
          "$GITHUB_WORKSPACE/rust_hft/scripts/cargo-scoped.sh" test "${args[@]}" --locked
          clippy_args=()
          for package in "${packages[@]}"; do
            [[ ",${{ needs.scope.outputs.loop_packages }}," == *",$package,"* ]] || clippy_args+=(-p "$package")
          done
          if (( ${#clippy_args[@]} )); then "$GITHUB_WORKSPACE/rust_hft/scripts/cargo-scoped.sh" clippy "${clippy_args[@]}" --all-targets --locked --no-deps -- -D warnings; fi

      - name: Verify signed runtime handoff
        id: handoff
        if: ${{ (needs.scope.outputs.handoff == 'true') }}
        run: |
          "$GITHUB_WORKSPACE/rust_hft/scripts/cargo-scoped.sh" test -p hft-live --no-default-features --test deployment_envelope --locked
          "$GITHUB_WORKSPACE/rust_hft/scripts/cargo-scoped.sh" test -p hft-live --no-default-features --test deployment_artifacts --locked
          "$GITHUB_WORKSPACE/rust_hft/scripts/cargo-scoped.sh" test -p hft-live --no-default-features --features formula-strategy,binance --test deployment_envelope --locked
          "$GITHUB_WORKSPACE/rust_hft/scripts/cargo-scoped.sh" test -p hft-live --no-default-features --features formula-strategy,bitget --test deployment_artifacts --locked
          "$GITHUB_WORKSPACE/rust_hft/scripts/cargo-scoped.sh" test -p hft-live --no-default-features --features probability-reversal-strategy --test prediction_probability --locked
          "$GITHUB_WORKSPACE/rust_hft/scripts/cargo-scoped.sh" test -p hft-runtime --features strategy-probability-reversal --test prediction_probability --locked
          "$GITHUB_WORKSPACE/rust_hft/scripts/cargo-scoped.sh" clippy -p hft-live --no-default-features --features probability-reversal-strategy --all-targets --locked --no-deps -- -D warnings
          "$GITHUB_WORKSPACE/rust_hft/scripts/cargo-scoped.sh" test -p hft-runtime --no-default-features --features adapter-binance-execution,adapter-binance-prediction-execution --lib system_builder::execution_registry::tests --locked
          "$GITHUB_WORKSPACE/rust_hft/scripts/cargo-scoped.sh" clippy -p hft-live --no-default-features --features binance-data,binance-prediction-data,polymarket-data --all-targets --locked --no-deps -- -D warnings

      - name: Check JSON feature matrix
        id: json
        if: ${{ (needs.scope.outputs.json == 'true') }}
        run: |
          "$GITHUB_WORKSPACE/rust_hft/scripts/cargo-scoped.sh" test -p hft-integration --no-default-features --locked
          "$GITHUB_WORKSPACE/rust_hft/scripts/cargo-scoped.sh" test -p hft-integration --no-default-features --features json-simd --locked
          "$GITHUB_WORKSPACE/rust_hft/scripts/cargo-scoped.sh" test -p hft-data-adapter-binance --no-default-features --locked
          "$GITHUB_WORKSPACE/rust_hft/scripts/cargo-scoped.sh" test -p hft-data-adapter-binance --no-default-features --features json-simd --locked
          "$GITHUB_WORKSPACE/rust_hft/scripts/cargo-scoped.sh" test -p hft-infra-redis --features redis --locked
          "$GITHUB_WORKSPACE/rust_hft/scripts/cargo-scoped.sh" check -p hft-live --features clickhouse,redis,grpc,polymarket --locked

      - name: Verify Ondo Perps feature boundary
        id: ondo
        if: ${{ (needs.scope.outputs.ondo == 'true') }}
        run: |
          "$GITHUB_WORKSPACE/rust_hft/scripts/cargo-scoped.sh" test -p hft-data-adapter-ondo-perps -p hft-execution-adapter-ondo-perps --locked
          "$GITHUB_WORKSPACE/rust_hft/scripts/cargo-scoped.sh" clippy -p hft-data-adapter-ondo-perps -p hft-execution-adapter-ondo-perps --all-targets --no-deps --locked -- -D warnings
          "$GITHUB_WORKSPACE/rust_hft/scripts/cargo-scoped.sh" check -p hft-live --features ondo-perps --locked

      - name: Verify governed data collector
        id: collector
        if: ${{ (needs.scope.outputs.collector == 'true') }}
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/check-collector-test-presence.sh"
          "$GITHUB_WORKSPACE/rust_hft/scripts/cargo-scoped.sh" check -p hft-collector --locked
          "$GITHUB_WORKSPACE/rust_hft/scripts/cargo-scoped.sh" clippy -p hft-collector --all-targets --features collector-binance --no-deps --locked -- -D warnings
          "$GITHUB_WORKSPACE/rust_hft/scripts/cargo-scoped.sh" test -p hft-collector --features collector-binance --locked

      - name: Verify collector release control plane
        id: control
        if: ${{ (needs.scope.outputs.control == 'true') }}
        run: |
          ../deployment/aliyun/test-polymarket-raw-ops-control-plane.sh
          "$GITHUB_WORKSPACE/rust_hft/scripts/cargo-scoped.sh" test -p hft-collector --lib systemd_reference_resource_envelope_is_pinned --locked

      - name: Build focused packages
        id: focused
        if: ${{ (needs.scope.outputs.focused == 'true') }}
        env:
          FOCUSED_PACKAGES: ${{ needs.scope.outputs.focused_packages }}
        run: |
          selected=${FOCUSED_PACKAGES#,}; selected=${selected%,}
          [[ -n $selected ]] || { echo 'focused package selection is empty' >&2; exit 1; }
          IFS=',' read -ra packages <<<"$selected"
          args=(); for package in "${packages[@]}"; do args+=(-p "$package"); done
          "$GITHUB_WORKSPACE/rust_hft/scripts/cargo-scoped.sh" build "${args[@]}" --locked

      - name: Package binaries (if present)
        if: ${{ (github.event_name == 'push') }}
        run: |
          mkdir -p dist
          for bin in hft-live hft-paper hft-all-in-one hft-replay; do
            if [ -f target/debug/$bin ]; then
              cp target/debug/$bin dist/
            fi
          done
          ls -la dist || true

      - name: Upload artifacts
        if: ${{ (success() && github.event_name == 'push') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-dev-binaries-${{ github.sha }}
          path: rust_hft/dist/*
          if-no-files-found: ignore

      - name: Strict research Clippy
        id: clippy_loop
        if: needs.scope.outputs.loop == 'true'
        env:
          LOOP_PACKAGES: ${{ needs.scope.outputs.loop_packages }}
        run: |
          packages=${LOOP_PACKAGES#,}; packages=${packages%,}
          IFS=',' read -ra selected <<<"$packages"
          args=(); for package in "${selected[@]}"; do args+=(-p "$package"); done
          "$GITHUB_WORKSPACE/rust_hft/scripts/cargo-scoped.sh" clippy "${args[@]}" --all-targets --locked -- -D warnings -D clippy::correctness -D clippy::suspicious

      - name: Strict runtime handoff Clippy
        id: clippy_handoff
        if: needs.scope.outputs.handoff == 'true'
        run: |
          "$GITHUB_WORKSPACE/rust_hft/scripts/cargo-scoped.sh" clippy -p hft-live --no-default-features --test deployment_envelope --locked --no-deps -- -D warnings -D clippy::correctness -D clippy::suspicious

      - name: Write native validation evidence
        id: rust_evidence
        if: success() && (github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          CI_STEPS: ${{ toJSON(steps) }}
        run: bash .github/scripts/write-ci-rust-evidence.sh "${RUNNER_TEMP}/rust-batch.json"

      - name: Upload native validation evidence
        if: success() && (github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-rust-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rust-batch.json
          if-no-files-found: error
          retention-days: 7

  clippy_strict:
    name: Code Quality - Clippy (STRICT)
    needs: [scope, rust]
    if: ${{ always() && !cancelled() && contains(needs.scope.outputs.jobs, ',ci/clippy-strict,') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify same-run native Clippy result
        env:
          RUST_JOB_RESULT: ${{ needs.rust.result }}
          CI_EVIDENCE: ${{ needs.rust.outputs.evidence }}
          SELECTED_SCOPE: ${{ toJSON(needs.scope.outputs) }}
        run: |
          test "$RUST_JOB_RESULT" = success
          test -n "$CI_EVIDENCE"
          printf '%s' "$CI_EVIDENCE" >"${RUNNER_TEMP}/rust-evidence.json"
          jq -r 'to_entries[] | "\(.key)=\(.value)"' <<<"$SELECTED_SCOPE" >"${RUNNER_TEMP}/rust-scope.out"
          bash .github/scripts/verify-ci-rust-same-run.sh "${RUNNER_TEMP}/rust-evidence.json" "${RUNNER_TEMP}/rust-scope.out"

  research_foundation:
    name: Research foundation contracts
    needs: scope
    if: ${{ contains(needs.scope.outputs.jobs, ',ci/research-foundation,') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: ${{ github.run_id }}
          POSTGRES_DB: monday_foundation_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      clickhouse:
        image: clickhouse/clickhouse-server:26.8.6.5
        env:
          CLICKHOUSE_USER: fixture
          CLICKHOUSE_PASSWORD: ${{ github.run_id }}
        ports: ["18123:8123"]
        options: --health-cmd "clickhouse-client --user fixture --password ${{ github.run_id }} --query 'SELECT 1'" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/rust_hft/target
      MONDAY_TEST_DATABASE_URL: postgres://fixture:${{ github.run_id }}@127.0.0.1:5432/monday_foundation_test
      MONDAY_TEST_CH_ENDPOINT: http://127.0.0.1:18123
