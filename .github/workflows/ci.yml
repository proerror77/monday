          MONDAY_TEST_DATABASE_URL="${MONDAY_TEST_DATABASE_URL%/monday_foundation_test}/monday_foundation_roles_test" \
            "$GITHUB_WORKSPACE/rust_hft/scripts/cargo-scoped.sh" test -p hft-research-platform --features control,gateway,publisher --test persistent_platform paused_database_roles_enforce_real_read_write_and_lock_boundaries --locked -- --ignored

  rust_fast_gates:
    name: Rust Fast Gates
    needs: scope
    if: ${{ contains(needs.scope.outputs.jobs, ',ci/rust,') || contains(needs.scope.outputs.jobs, ',ci/rust-shell-scripts,') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CARGO_TERM_COLOR: always
      CARGO_TARGET_DIR: ${{ github.workspace }}/rust_hft/target
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Enforce Monday module layout
        working-directory: .
        run: |
          set -euo pipefail
          test ! -e products/ploy
          test -f rust_hft/prediction-markets/Cargo.toml
          test -f rust_hft/data-pipelines/adapters/adapter-polymarket/Cargo.toml
          test -f rust_hft/execution-gateway/adapters/adapter-polymarket/Cargo.toml

      - name: Enforce Rust-only research and runtime source
        working-directory: .
        run: |
          set -euo pipefail

          forbidden_paths="$(git ls-files \
            ':(icase,glob)**/*.py' \
            ':(icase,glob)**/*.pyw' \
            ':(icase,glob)**/*.ipynb' \
            ':(icase,glob)**/*.py[cod]' \
            ':(icase,glob)**/requirements*.txt' \
            ':(icase,glob)**/pyproject.toml' \
            ':(icase,glob)**/Pipfile' \
            ':(icase,glob)**/poetry.lock' \
            ':(icase,glob)**/pytest.ini' \
            ':(icase,glob)**/tox.ini' \
            ':(icase,glob)**/setup.py')"
          if [ -n "${forbidden_paths}" ]; then
            echo "tracked Py""thon source, notebook, bytecode, or packaging artifact is forbidden" >&2
            printf '%s\n' "${forbidden_paths}" >&2
            exit 1
          fi

          reject_python_text() {
            label="$1"
            pattern="$2"
            shift 2
            grep_args=(-n -I -E)
            allow_match_regex=
            while :; do
              case "${1:-}" in
                --ignore-case)
                  grep_args+=(-i)
                  shift
                  ;;
                --allow-match-regex)
                  allow_match_regex="$2"
                  shift 2
                  ;;
                *) break ;;
              esac
            done
            set +e
            matches="$(git grep "${grep_args[@]}" "${pattern}" -- "$@")"
            scan_status=$?
            set -e
            case "${scan_status}" in
              0)
                if [ -n "${allow_match_regex}" ]; then
                  set +e
                  unexpected_matches="$(printf '%s\n' "${matches}" \
                    | grep -E -v "${allow_match_regex}")"
                  allow_status=$?
                  set -e
                  case "${allow_status}" in
                    0) matches="${unexpected_matches}" ;;
                    1) return 0 ;;
                    *)
                      echo "${label} allowlist scanner failed with status ${allow_status}" >&2
                      exit "${allow_status}"
                      ;;
                  esac
                fi
                echo "tracked ${label} is forbidden" >&2
                printf '%s\n' "${matches}" >&2
                exit 1
                ;;
              1)
                return 0
                ;;
              *)
                echo "${label} scanner failed with status ${scan_status}" >&2
                exit "${scan_status}"
                ;;
            esac
          }

          shebang_pathspecs=(
            ':(exclude,glob)**/*.md'
            ':(exclude,glob)**/docs/archive/**'
            ':(exclude,glob)**/docs/plans/**'
            ':(exclude,glob)**/docs/reviews/**'
            ':(exclude,glob)**/docs/superpowers/**'
            ':(exclude,glob)**/tasks/research_evidence/**'
          )
          reject_python_text \
            "Python shebang" \
            '^#!.*python([0-9]+([.][0-9]+)?)?([[:space:]]|$)' \
            --ignore-case \
            "${shebang_pathspecs[@]}"

          inline_command_pathspecs=(
            ':(icase,glob)**/*.sh'
            ':(icase,glob)**/*.bash'
            ':(icase,glob)**/*.zsh'
            ':(icase,glob)**/*.yml'
            ':(icase,glob)**/*.yaml'
            ':(icase,glob)**/*.toml'
            ':(icase,glob)**/*.service'
            ':(icase,glob)**/*.timer'
            ':(icase,glob)**/*.socket'
            ':(icase,glob)**/*.conf'
            ':(icase,glob)**/Dockerfile*'
            ':(icase,glob)**/Makefile'
            ':(icase,glob)**/Justfile'
            ':(icase,glob)**/bin/*'
            ':(icase,glob)**/scripts/*'
            ':(icase,glob)**/scripts/**/*'
            ':(exclude,glob)**/docs/archive/**'
            ':(exclude,glob)**/docs/plans/**'
            ':(exclude,glob)**/docs/reviews/**'
            ':(exclude,glob)**/docs/superpowers/**'
            ':(exclude,glob)**/tasks/research_evidence/**'
          )
          # Root-only migration controls may identify the already-installed
          # legacy runtime for parity and rollback, but may not add executable
          # Python/package-manager commands. Every permitted match is anchored
          # to an exact file and identity-only line; everything else is rejected.
          legacy_runtime_reference_allowlist='^(deployment/aliyun/polymarket-raw-ops-cutover[.]sh:[0-9]+:readonly LEGACY_EXEC="/usr/bin/pyth[o]n3 [$]LEGACY_COLLECTOR"|deployment/aliyun/polymarket-raw-ops-cutover[.]sh:[0-9]+:readonly LEGACY_REFERENCE_UPLOAD_EXEC="/usr/bin/pyth[o]n3 [$]LEGACY_UPLOADER --spool-dir /data/monday/spool/polymarket-reference --dataset crypto_expiry_reference --quote-depth-levels 0 --quote-sample-ms 0"|deployment/aliyun/polymarket-raw-ops-shadow-gate[.]sh:[0-9]+:readonly LEGACY_EXEC=[^[:alnum:]]/usr/bin/pyth[o]n3 /opt/monday/bin/polymarket_reference_collector[.]py[^[:alnum:]]|deployment/aliyun/test-polymarket-raw-ops-control-plane[.]sh:[0-9]+:[[:space:]]+(exec_start|cmdline):"/usr/bin/pyth[o]n3 /opt/monday/bin/polymarket_reference_collector[.]py",|deployment/aliyun/test-polymarket-raw-ops-control-plane[.]sh:[0-9]+:[[:space:]]+LEGACY_EXEC=[^[:alnum:]]/usr/bin/pyth[o]n3 /opt/monday/bin/polymarket_reference_collector[.]py[^[:alnum:]])$'
          reject_python_text \
            "Python runtime or package-manager command" \
            'actions/setup-pyth[o]n@|astral-sh/setup-u[v]@|(^|[;&|()/[:space:]])(python([0-9]+([.][0-9]+)?)?|pip([0-9]+)?|pipx|pytest|poetry|pdm|rye|conda|mamba|hatch|tox|virtualenv)([[:space:]]|$)|(^|[;&|()/[:space:]])uv[[:space:]]+(run|sync|pip|venv|python)([[:space:]]|$)' \
            --ignore-case \
            --allow-match-regex "${legacy_runtime_reference_allowlist}" \
            "${inline_command_pathspecs[@]}"

          if git grep -n -E '(name = "(burn-tch|tch|torch-sys|pyo3[^"]*|cpython|rust-cpython|python3-sys|rustpython[^"]*)"|^[[:space:]]*(burn-tch|tch|torch-sys|pyo3([-_][A-Za-z0-9_-]+)?|cpython|rust-cpython|python3-sys|rustpython([-_][A-Za-z0-9_-]+)?)[[:space:]]*=)' -- \
            ':(glob)**/Cargo.toml' ':(glob)**/Cargo.lock'; then
            echo "PyTorch/libtorch and Python-runtime Rust bindings are forbidden" >&2
            exit 1
          fi

      - name: Setup Rust toolchain (fmt)
        if: ${{ (needs.scope.outputs.loop == 'true') }}
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: 1.98.1
          components: rustfmt

      - name: Format Loop Engineer packages
        if: ${{ (needs.scope.outputs.loop == 'true') }}
        working-directory: rust_hft
        run: |
          "$GITHUB_WORKSPACE/rust_hft/scripts/cargo-scoped.sh" fmt --check --package alpha-domain
          "$GITHUB_WORKSPACE/rust_hft/scripts/cargo-scoped.sh" fmt --check --package alpha-store
          "$GITHUB_WORKSPACE/rust_hft/scripts/cargo-scoped.sh" fmt --check --package alpha-engine
          "$GITHUB_WORKSPACE/rust_hft/scripts/cargo-scoped.sh" fmt --check --package alpha-onnx-evaluator
          "$GITHUB_WORKSPACE/rust_hft/scripts/cargo-scoped.sh" fmt --check --package alpha-harness
          "$GITHUB_WORKSPACE/rust_hft/scripts/cargo-scoped.sh" fmt --check --package hft-harnessctl
          "$GITHUB_WORKSPACE/rust_hft/scripts/cargo-scoped.sh" fmt --check --package hft-research-ml

  market_recorder_contract:
    name: Market Recorder Release Contract
    needs: scope
    if: ${{ contains(needs.scope.outputs.jobs, ',ci/market-recorder-contract,') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify market recorder release contract
        working-directory: rust_hft
        run: |
          MONDAY_TEST_RECORDER_IMAGE=1 SOURCE_REVISION="$GITHUB_SHA" \
            ../deployment/aliyun/test-polymarket-market-recorder-release.sh

  deployment_artifacts:
    name: Production Image And Kubernetes Contract
    needs: scope
    if: ${{ contains(needs.scope.outputs.jobs, ',ci/deployment-artifacts,') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        if: needs.scope.outputs.production_trading_image == 'true' || needs.scope.outputs.production_collector_image == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build production trading image
        if: needs.scope.outputs.production_trading_image == 'true'
        uses: docker/build-push-action@v7
        with:
          context: rust_hft
          file: rust_hft/deployment/docker/Dockerfile.trading
          push: false
          tags: hft-trading:${{ github.sha }}
          cache-from: type=gha,scope=hft-trading-image
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=min,scope=hft-trading-image' || '' }}

      # This is the same production collector Dockerfile and cache used by ACR.
      # A build-dependency failure must fail the required CI gate before release.
      - name: Build production collector image
        if: needs.scope.outputs.production_collector_image == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: rust_hft
          file: rust_hft/deployment/docker/Dockerfile.binance-lob-archiver
          target: runtime
          platforms: linux/amd64
          push: false
          load: true
          tags: monday-collector-check:${{ github.sha }}
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=acr-binance-lob-archiver
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=min,scope=acr-binance-lob-archiver' || '' }}
          provenance: false
          sbom: false
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Verify production collector binary source and self-test
        if: needs.scope.outputs.production_collector_image == 'true'
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          image="monday-collector-check:$SOURCE_REVISION"
          docker run --rm --network none --read-only --cap-drop ALL \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777 \
            --entrypoint /usr/local/bin/binance-lob-archiver "$image" --version \
            | grep -Fqx "binance-lob-archiver $SOURCE_REVISION"
          docker run --rm --network none --read-only --cap-drop ALL \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777 \
            --entrypoint /usr/local/bin/binance-lob-archiver "$image" --self-test

      - name: Preserve the tested collector image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.scope.outputs.production_collector_image == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/save-tested-image.sh "monday-collector-check:$GITHUB_SHA" binance-lob-archiver 'Production Image And Kubernetes Contract' tested-collector

      - name: Upload the tested collector image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.scope.outputs.production_collector_image == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tested-image-binance-lob-archiver-${{ github.sha }}-${{ github.run_attempt }}
          path: tested-collector/
          if-no-files-found: error
          retention-days: 7

      - name: Validate Kubernetes manifests without a cluster
        run: |
          docker run --rm \
            -v "$PWD:/work:ro" \
            ghcr.io/yannh/kubeconform:v0.7.0 \
            -strict -summary \
            /work/rust_hft/deployment/k8s \
            /work/deployment/aliyun/research/k8s

  polymarket_evidence_compiler_image:
    name: Polymarket Evidence Compiler Image
    needs: scope
    if: ${{ contains(needs.scope.outputs.jobs, ',ci/polymarket-evidence-compiler-image,') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build and inspect Polymarket evidence compiler image
        run: |
          image=polymarket-evidence-compiler:${{ github.sha }}
          docker build \
            --build-arg "SOURCE_REVISION=${{ github.sha }}" \
            --file rust_hft/deployment/docker/Dockerfile.polymarket-evidence-compiler \
            --tag "$image" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            rust_hft
          docker run --rm --entrypoint /usr/local/bin/polymarket-raw-ops "$image" \
            publish-polymarket-evidence --help >/dev/null
          docker run --rm --entrypoint /usr/local/bin/polymarket-raw-ops "$image" \
            --version | grep -Fqx "polymarket-raw-ops ${{ github.sha }}"
          docker run --rm --entrypoint /usr/local/bin/aliyun "$image" version >/dev/null
          docker run --rm --entrypoint /bin/sh "$image" -ec \
            'test ! -e /usr/local/bin/binance-lob-archiver'
          actual_source_revision=$(docker image inspect \
            --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' \
            "$image")
          test "$actual_source_revision" = "${{ github.sha }}"

  rust_hft_engine_fast_lane:
    name: Rust HFT Engine Fast Lane
    needs: scope
    if: ${{ contains(needs.scope.outputs.jobs, ',ci/rust-hft-engine-fast-lane,') }}
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      CARGO_TARGET_DIR: ${{ github.workspace }}/rust_hft/target
      CARGO_INCREMENTAL: "0"
    defaults:
      run:
        working-directory: rust_hft
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: 1.98.1
          components: rustfmt

      - name: Install Linux build tools
        run: bash "$GITHUB_WORKSPACE/.github/workflows/install-ubuntu-packages.sh" clang mold protobuf-compiler

      - name: Record cache dimensions
        id: cache-info
        shell: bash
        run: echo "rust=$(rustc -Vv | awk '/^release:/ {print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            rust_hft
          key: hft-engine-fast-lane-${{ steps.cache-info.outputs.rust }}-${{ hashFiles('rust_hft/runtime/Cargo.lock') }}
          cache-all-crates: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Audit unbounded channels
        run: |
          "$GITHUB_WORKSPACE/rust_hft/scripts/cargo-scoped.sh" test -p hft-engine --test queue_topology_contract --locked

      - name: Format hft-engine
        run: |
          "$GITHUB_WORKSPACE/rust_hft/scripts/cargo-scoped.sh" fmt --check --package hft-engine

      - name: Check hft-engine
        run: |
          "$GITHUB_WORKSPACE/rust_hft/scripts/cargo-scoped.sh" check -p hft-engine --locked

      - name: Test Binance MD fast lane
        run: |
          "$GITHUB_WORKSPACE/rust_hft/scripts/cargo-scoped.sh" test -p hft-binance-depth --locked --lib

      - name: Enforce quote-to-worker latency budgets
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/rust_hft/scripts/cargo-scoped.sh" test -p hft-engine --bench hotpath_latency_p99 --release --locked -- --nocapture \
            | tee "$RUNNER_TEMP/engine-latency.log"

      - name: Record engine latency metrics
        if: ${{ always() }}
        run: |
          if [[ -f "$RUNNER_TEMP/engine-latency.log" ]]; then
            {
              printf '### Local quote-to-worker latency\n\nSource: %s\n\n' "$GITHUB_SHA"
              grep '^quote_to_worker_queue ' "$RUNNER_TEMP/engine-latency.log" || true
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  node_install:
    name: Node Install (root)
    needs: scope
    if: ${{ contains(needs.scope.outputs.jobs, ',ci/node-install,') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Detect Node lockfile
        id: node-lock
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            echo "manager=npm" >> "$GITHUB_OUTPUT"
            echo "cache=npm" >> "$GITHUB_OUTPUT"
          elif [ -f pnpm-lock.yaml ]; then
            echo "manager=pnpm" >> "$GITHUB_OUTPUT"
            echo "cache=pnpm" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "manager=yarn" >> "$GITHUB_OUTPUT"
            echo "cache=yarn" >> "$GITHUB_OUTPUT"
          else
            echo "manager=none" >> "$GITHUB_OUTPUT"
            echo "cache=npm" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.node-lock.outputs.manager != 'none'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: ${{ steps.node-lock.outputs.cache }}

      - name: Install dependencies
        if: steps.node-lock.outputs.manager != 'none'
        run: |
          case "${{ steps.node-lock.outputs.manager }}" in
            npm)
              npm ci --prefer-offline --no-audit --fund=false
              ;;
            pnpm)
              corepack enable
              pnpm install --frozen-lockfile
              ;;
            yarn)
              corepack enable
              yarn install --immutable || yarn install --frozen-lockfile
              ;;
          esac

      - name: Skip Node install
        if: steps.node-lock.outputs.manager == 'none'
        run: echo "No root Node lockfile found; skipping Node install."

  ci-gate:
    name: Monorepo CI gate
    needs:
      - selector
      - scope
      - control_contracts
      - monitor_contracts
      - ci_contracts
      - rust_shell_scripts
      - rust
      - clippy_strict
      - rust_fast_gates
      - research_foundation
      - market_recorder_contract
      - deployment_artifacts
      - polymarket_evidence_compiler_image
      - rust_hft_engine_fast_lane
      - node_install
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608 # v4.1.0
      - name: Require selected jobs to pass
        working-directory: .
        env:
          GATE_NEEDS: ${{ toJson(needs) }}
          EXPECTED_JOBS: ${{ needs.scope.outputs.jobs }}
        run: printf '%s' "$GATE_NEEDS" | bash .github/scripts/verify-ci-gate.sh --job-prefix ci --expected-jobs "$EXPECTED_JOBS"
