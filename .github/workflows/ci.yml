name: Monorepo CI

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - "products/ploy/**"
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - "products/ploy/**"

permissions:
  contents: read

concurrency:
  group: monorepo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust Workspace
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    defaults:
      run:
        working-directory: rust_hft
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enforce Rust-only research and runtime source
        working-directory: .
        run: |
          set -euo pipefail

          forbidden_paths="$(git ls-files \
            ':(glob)**/*.py' \
            ':(glob)**/*.pyw' \
            ':(glob)**/*.ipynb' \
            ':(glob)**/*.py[cod]' \
            ':(glob)**/requirements*.txt' \
            ':(glob)**/pyproject.toml' \
            ':(glob)**/Pipfile' \
            ':(glob)**/poetry.lock' \
            ':(glob)**/pytest.ini' \
            ':(glob)**/tox.ini' \
            ':(glob)**/setup.py')"
          if [ -n "${forbidden_paths}" ]; then
            echo "tracked Python source, notebook, bytecode, or packaging artifact is forbidden" >&2
            printf '%s\n' "${forbidden_paths}" >&2
            exit 1
          fi

          reject_python_text() {
            label="$1"
            pattern="$2"
            shift 2
            grep_args=(-n -I -E)
            if [ "${1:-}" = "--ignore-case" ]; then
              grep_args+=(-i)
              shift
            fi
            set +e
            matches="$(git grep "${grep_args[@]}" "${pattern}" -- "$@")"
            scan_status=$?
            set -e
            case "${scan_status}" in
              0)
                echo "tracked ${label} is forbidden" >&2
                printf '%s\n' "${matches}" >&2
                exit 1
                ;;
              1)
                return 0
                ;;
              *)
                echo "${label} scanner failed with status ${scan_status}" >&2
                exit "${scan_status}"
                ;;
            esac
          }

          shebang_pathspecs=(
            ':(exclude,glob)**/*.md'
            ':(exclude,glob)**/docs/archive/**'
            ':(exclude,glob)**/docs/plans/**'
            ':(exclude,glob)**/docs/reviews/**'
            ':(exclude,glob)**/docs/superpowers/**'
            ':(exclude,glob)**/tasks/research_evidence/**'
          )
          reject_python_text \
            "Python shebang" \
            '^#!.*python([0-9]+([.][0-9]+)?)?([[:space:]]|$)' \
            "${shebang_pathspecs[@]}"

          inline_command_pathspecs=(
            ':(glob)**/*.sh'
            ':(glob)**/*.bash'
            ':(glob)**/*.zsh'
            ':(glob)**/*.yml'
            ':(glob)**/*.yaml'
            ':(glob)**/*.toml'
            ':(glob)**/*.service'
            ':(glob)**/*.timer'
            ':(glob)**/*.socket'
            ':(glob)**/*.conf'
            ':(glob)**/Dockerfile*'
            ':(glob)**/Makefile'
            ':(glob)**/Justfile'
            ':(glob)**/bin/*'
            ':(glob)**/scripts/*'
            ':(glob)**/scripts/**/*'
            ':(exclude,glob)**/docs/archive/**'
            ':(exclude,glob)**/docs/plans/**'
            ':(exclude,glob)**/docs/reviews/**'
            ':(exclude,glob)**/docs/superpowers/**'
            ':(exclude,glob)**/tasks/research_evidence/**'
          )
          reject_python_text \
            "Python runtime or package-manager command" \
            'actions/setup-pyth[o]n@|astral-sh/setup-u[v]@|(^|[;&|()/[:space:]])(python([0-9]+([.][0-9]+)?)?|pip([0-9]+)?|pipx|pytest|poetry|pdm|rye|conda|mamba|hatch|tox|virtualenv)([[:space:]]|$)|(^|[;&|()/[:space:]])uv[[:space:]]+(run|sync|pip|venv|python)([[:space:]]|$)' \
            "${inline_command_pathspecs[@]}"

          rust_template_pathspecs=(
            ':(glob)rust_hft/.specify/templates/*.md'
            ':(glob)rust_hft/.specify/templates/**/*.md'
          )
          reject_python_text \
            "Python scaffolding in active Rust templates" \
            'actions/setup-pyth[o]n@|astral-sh/setup-u[v]@|(^|[^[:alnum:]_])(python([0-9]+([.][0-9]+)?)?|pip([0-9]+)?|pipx|pytest|poetry|pdm|rye|conda|mamba|hatch|tox|virtualenv|pyproject[.]toml|requirements[^/[:space:]]*[.]txt|setup[.]py|[^/[:space:]`"]+[.]py)([^[:alnum:]_]|$)|(^|[;&|()/[:space:]])uv[[:space:]]+(run|sync|pip|venv|python)([[:space:]]|$)' \
            --ignore-case \
            "${rust_template_pathspecs[@]}"

          if git grep -n -E '(name = "(burn-tch|tch|torch-sys|pyo3[^"]*|cpython|rust-cpython|python3-sys|rustpython[^"]*)"|^[[:space:]]*(burn-tch|tch|torch-sys|pyo3([-_][A-Za-z0-9_-]+)?|cpython|rust-cpython|python3-sys|rustpython([-_][A-Za-z0-9_-]+)?)[[:space:]]*=)' -- \
            ':(glob)**/Cargo.toml' ':(glob)**/Cargo.lock'; then
            echo "PyTorch/libtorch and Python-runtime Rust bindings are forbidden" >&2
            exit 1
          fi

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux build tools
        run: sudo apt-get update && sudo apt-get install -y clang mold protobuf-compiler

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Record cache dimensions
        id: cache-info
        shell: bash
        run: |
          echo "rust=$(rustc -Vv | awk '/^release:/ {print $2}')" >> "$GITHUB_OUTPUT"
          echo "sccache=$(${SCCACHE_PATH:-sccache} --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust_hft
          key: rust_hft-ci-rust-${{ steps.cache-info.outputs.rust }}-sccache-${{ steps.cache-info.outputs.sccache }}-${{ hashFiles('rust_hft/Cargo.lock') }}
          cache-all-crates: true
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Format Loop Engineer packages
        run: |
          cargo fmt --check --package alpha-domain
          cargo fmt --check --package alpha-store
          cargo fmt --check --package alpha-engine
          cargo fmt --check --package alpha-onnx-evaluator
          cargo fmt --check --package alpha-harness
          cargo fmt --check --package hft-harnessctl
          cargo fmt --check --package hft-research-ml

      - name: Clippy Loop Engineer packages
        run: |
          cargo clippy \
            -p alpha-domain \
            -p alpha-store \
            -p alpha-engine \
            -p alpha-onnx-evaluator \
            -p alpha-harness \
            -p hft-harnessctl \
            -p hft-research-ml \
            --all-targets \
            --locked \
            -- \
            -D warnings

      - name: Test Loop Engineer packages
        run: cargo test -p alpha-domain -p alpha-store -p alpha-engine -p alpha-onnx-evaluator -p alpha-harness -p hft-harnessctl -p hft-research-ml --locked

      - name: Verify signed runtime handoff
        run: |
          cargo test -p hft-live --no-default-features --test deployment_envelope --locked
          cargo test -p hft-live --no-default-features --test deployment_artifacts --locked
          cargo test -p hft-live --no-default-features --features formula-strategy,binance --test deployment_envelope --locked
          cargo test -p hft-live --no-default-features --features formula-strategy,bitget --test deployment_artifacts --locked

      - name: Check JSON feature matrix
        run: |
          cargo test -p hft-integration --no-default-features --locked
          cargo test -p hft-integration --no-default-features --features json-simd --locked
          cargo test -p hft-data-adapter-binance --no-default-features --locked
          cargo test -p hft-data-adapter-binance --no-default-features --features json-simd --locked
          cargo test -p hft-infra-redis --features redis --locked
          cargo check -p hft-live --features clickhouse,redis,grpc --locked

      - name: Verify Ondo Perps feature boundary
        run: |
          cargo test -p hft-data-adapter-ondo-perps -p hft-execution-adapter-ondo-perps --locked
          cargo clippy -p hft-data-adapter-ondo-perps -p hft-execution-adapter-ondo-perps --all-targets --no-deps --locked -- -D warnings
          cargo check -p hft-live --features ondo-perps --locked

      - name: Verify governed data collector
        run: |
          cargo check -p hft-collector --locked
          cargo clippy -p hft-collector --all-targets --features collector-binance --no-deps --locked -- -D warnings
          cargo test -p hft-collector --features collector-binance --locked

      - name: Build focused packages
        run: cargo build -p hft-live -p hft-paper -p hft-all-in-one -p alpha-harness -p hft-harnessctl --locked

      - name: Package binaries (if present)
        if: github.event_name == 'push'
        run: |
          mkdir -p dist
          for bin in hft-live hft-paper hft-all-in-one hft-replay; do
            if [ -f target/debug/$bin ]; then
              cp target/debug/$bin dist/
            fi
          done
          ls -la dist || true

      - name: Upload artifacts
        if: success() && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: rust-dev-binaries-${{ github.sha }}
          path: rust_hft/dist/*
          if-no-files-found: ignore

  deployment_artifacts:
    name: Production Image And Kubernetes Contract
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build production trading image
        uses: docker/build-push-action@v7
        with:
          context: rust_hft
          file: rust_hft/deployment/docker/Dockerfile.trading
          push: false
          tags: hft-trading:${{ github.sha }}
          cache-from: type=gha,scope=hft-trading-image
          cache-to: type=gha,mode=max,scope=hft-trading-image

      - name: Validate Kubernetes manifests without a cluster
        run: |
          docker run --rm \
            -v "$PWD:/work:ro" \
            ghcr.io/yannh/kubeconform:v0.7.0 \
            -strict -summary /work/rust_hft/deployment/k8s

  rust_hft_engine_fast_lane:
    name: Rust HFT Engine Fast Lane
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    defaults:
      run:
        working-directory: rust_hft
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install Linux build tools
        run: sudo apt-get update && sudo apt-get install -y clang mold protobuf-compiler

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Record cache dimensions
        id: cache-info
        shell: bash
        run: |
          echo "rust=$(rustc -Vv | awk '/^release:/ {print $2}')" >> "$GITHUB_OUTPUT"
          echo "sccache=$(${SCCACHE_PATH:-sccache} --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust_hft
          key: hft-engine-fast-lane-${{ steps.cache-info.outputs.rust }}-sccache-${{ steps.cache-info.outputs.sccache }}-${{ hashFiles('rust_hft/Cargo.lock') }}
          cache-all-crates: true
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Audit unbounded channels
        run: cargo test -p hft-engine --test queue_topology_contract --locked

      - name: Format hft-engine
        run: cargo fmt --check --package hft-engine

      - name: Check hft-engine
        run: cargo check -p hft-engine --locked

      - name: Test Binance MD fast lane
        run: cargo test -p hft-engine --locked binance_md

  node_install:
    name: Node Install (root)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Node lockfile
        id: node-lock
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            echo "manager=npm" >> "$GITHUB_OUTPUT"
            echo "cache=npm" >> "$GITHUB_OUTPUT"
          elif [ -f pnpm-lock.yaml ]; then
            echo "manager=pnpm" >> "$GITHUB_OUTPUT"
            echo "cache=pnpm" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "manager=yarn" >> "$GITHUB_OUTPUT"
            echo "cache=yarn" >> "$GITHUB_OUTPUT"
          else
            echo "manager=none" >> "$GITHUB_OUTPUT"
            echo "cache=npm" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.node-lock.outputs.manager != 'none'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: ${{ steps.node-lock.outputs.cache }}

      - name: Install dependencies
        if: steps.node-lock.outputs.manager != 'none'
        run: |
          case "${{ steps.node-lock.outputs.manager }}" in
            npm)
              npm ci --prefer-offline --no-audit --fund=false
              ;;
            pnpm)
              corepack enable
              pnpm install --frozen-lockfile
              ;;
            yarn)
              corepack enable
              yarn install --immutable || yarn install --frozen-lockfile
              ;;
          esac

      - name: Skip Node install
        if: steps.node-lock.outputs.manager == 'none'
        run: echo "No root Node lockfile found; skipping Node install."
