        working-directory: rust_hft
        run: cargo clippy --manifest-path data-pipelines/Cargo.toml -p hft-market-pipeline --features import --all-targets --locked -- -D warnings
      - name: Validate paused application roles against isolated PG
        working-directory: rust_hft
        run: |
