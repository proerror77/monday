          MONDAY_TEST_DATABASE_URL="${MONDAY_TEST_DATABASE_URL%/monday_foundation_test}/monday_foundation_retirement_test" \
            "$GITHUB_WORKSPACE/rust_hft/scripts/cargo-scoped.sh" test -p hft-research-platform --features control,gateway,publisher --lib retirement::tests::native_retirement_real_pg_archive_delete_unknown_and_recovery --locked -- --ignored
      - name: Validate actual Build import against isolated PG
