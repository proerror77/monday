name: Monorepo CI

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths-ignore:
      - "rust_hft/prediction-markets/**"
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: monorepo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selector:
    name: CI job selector
    runs-on: ubuntu-latest
    outputs:
      jobs: ${{ steps.scope.outputs.jobs }}
      loop: ${{ steps.scope.outputs.loop }}
      handoff: ${{ steps.scope.outputs.handoff }}
      json: ${{ steps.scope.outputs.json }}
      ondo: ${{ steps.scope.outputs.ondo }}
      collector: ${{ steps.scope.outputs.collector }}
      control: ${{ steps.scope.outputs.control }}
      focused: ${{ steps.scope.outputs.focused }}
      toolchain: ${{ steps.scope.outputs.toolchain }}
      selection_complete: ${{ steps.scope.outputs.selection_complete }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select CI jobs
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          .github/scripts/test-select-rust-ci-scope.sh
          .github/scripts/select-rust-ci-scope.sh \
            --event "${{ github.event_name }}" \
            --base "${BASE_SHA}" \
            --head "${HEAD_SHA}"

  scope:
    name: CI job scope
    needs: selector
    if: ${{ always() }}
    runs-on: ubuntu-latest
    outputs:
      jobs: ${{ steps.scope.outputs.jobs }}
      loop: ${{ steps.scope.outputs.loop }}
      handoff: ${{ steps.scope.outputs.handoff }}
      json: ${{ steps.scope.outputs.json }}
      ondo: ${{ steps.scope.outputs.ondo }}
      collector: ${{ steps.scope.outputs.collector }}
      control: ${{ steps.scope.outputs.control }}
      focused: ${{ steps.scope.outputs.focused }}
      toolchain: ${{ steps.scope.outputs.toolchain }}
    steps:
      - name: Resolve selector result
        id: scope
        env:
          SELECTOR_RESULT: ${{ needs.selector.result }}
          SELECTED_JOBS: ${{ needs.selector.outputs.jobs }}
          SELECTED_LOOP: ${{ needs.selector.outputs.loop }}
          SELECTED_HANDOFF: ${{ needs.selector.outputs.handoff }}
          SELECTED_JSON: ${{ needs.selector.outputs.json }}
          SELECTED_ONDO: ${{ needs.selector.outputs.ondo }}
          SELECTED_COLLECTOR: ${{ needs.selector.outputs.collector }}
          SELECTED_CONTROL: ${{ needs.selector.outputs.control }}
          SELECTED_FOCUSED: ${{ needs.selector.outputs.focused }}
          SELECTED_TOOLCHAIN: ${{ needs.selector.outputs.toolchain }}
          SELECTED_COMPLETE: ${{ needs.selector.outputs.selection_complete }}
        run: |
          if [[ "$SELECTOR_RESULT" == success && "$SELECTED_COMPLETE" == true ]] &&
             [[ "$SELECTED_JOBS" =~ ^,(|[a-z0-9/-]+(,[a-z0-9/-]+)*),$ ]] &&
             [[ "$SELECTED_LOOP,$SELECTED_HANDOFF,$SELECTED_JSON,$SELECTED_ONDO,$SELECTED_COLLECTOR,$SELECTED_CONTROL,$SELECTED_FOCUSED,$SELECTED_TOOLCHAIN" =~ ^(true|false)(,(true|false)){7}$ ]]; then
            printf '%s\n' \
              "jobs=$SELECTED_JOBS" \
              "loop=$SELECTED_LOOP" \
              "handoff=$SELECTED_HANDOFF" \
              "json=$SELECTED_JSON" \
              "ondo=$SELECTED_ONDO" \
              "collector=$SELECTED_COLLECTOR" \
              "control=$SELECTED_CONTROL" \
              "focused=$SELECTED_FOCUSED" \
              "toolchain=$SELECTED_TOOLCHAIN"
          else
            printf '%s\n' \
              'jobs=,ci/rust,ci/deployment-artifacts,ci/polymarket-evidence-compiler-image,ci/rust-hft-engine-fast-lane,ci/node-install,' \
              'loop=true' \
              'handoff=true' \
              'json=true' \
              'ondo=true' \
              'collector=true' \
              'control=true' \
              'focused=true' \
              'toolchain=true'
          fi >> "$GITHUB_OUTPUT"

  rust:
    name: Rust Workspace
    needs: scope
    if: ${{ contains(needs.scope.outputs.jobs, ',ci/rust,') }}
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    defaults:
      run:
        working-directory: rust_hft
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce Monday module layout
        working-directory: .
        run: |
          set -euo pipefail
          test ! -e products/ploy
          test -f rust_hft/prediction-markets/Cargo.toml
          test -f rust_hft/data-pipelines/adapters/adapter-polymarket/Cargo.toml
          test -f rust_hft/execution-gateway/adapters/adapter-polymarket/Cargo.toml

      - name: Enforce Rust-only research and runtime source
        working-directory: .
        run: |
          set -euo pipefail

          forbidden_paths="$(git ls-files \
            ':(icase,glob)**/*.py' \
            ':(icase,glob)**/*.pyw' \
            ':(icase,glob)**/*.ipynb' \
            ':(icase,glob)**/*.py[cod]' \
            ':(icase,glob)**/requirements*.txt' \
            ':(icase,glob)**/pyproject.toml' \
            ':(icase,glob)**/Pipfile' \
            ':(icase,glob)**/poetry.lock' \
            ':(icase,glob)**/pytest.ini' \
            ':(icase,glob)**/tox.ini' \
            ':(icase,glob)**/setup.py')"
          if [ -n "${forbidden_paths}" ]; then
            echo "tracked Py""thon source, notebook, bytecode, or packaging artifact is forbidden" >&2
            printf '%s\n' "${forbidden_paths}" >&2
            exit 1
          fi

          reject_python_text() {
            label="$1"
            pattern="$2"
            shift 2
            grep_args=(-n -I -E)
            allow_match_regex=
            while :; do
              case "${1:-}" in
                --ignore-case)
                  grep_args+=(-i)
                  shift
                  ;;
                --allow-match-regex)
                  allow_match_regex="$2"
                  shift 2
                  ;;
                *) break ;;
              esac
            done
            set +e
            matches="$(git grep "${grep_args[@]}" "${pattern}" -- "$@")"
            scan_status=$?
            set -e
            case "${scan_status}" in
              0)
                if [ -n "${allow_match_regex}" ]; then
                  set +e
                  unexpected_matches="$(printf '%s\n' "${matches}" \
                    | grep -E -v "${allow_match_regex}")"
                  allow_status=$?
                  set -e
                  case "${allow_status}" in
                    0) matches="${unexpected_matches}" ;;
                    1) return 0 ;;
                    *)
                      echo "${label} allowlist scanner failed with status ${allow_status}" >&2
                      exit "${allow_status}"
                      ;;
                  esac
                fi
                echo "tracked ${label} is forbidden" >&2
                printf '%s\n' "${matches}" >&2
                exit 1
                ;;
              1)
                return 0
                ;;
              *)
                echo "${label} scanner failed with status ${scan_status}" >&2
                exit "${scan_status}"
                ;;
            esac
          }

          shebang_pathspecs=(
            ':(exclude,glob)**/*.md'
            ':(exclude,glob)**/docs/archive/**'
            ':(exclude,glob)**/docs/plans/**'
            ':(exclude,glob)**/docs/reviews/**'
            ':(exclude,glob)**/docs/superpowers/**'
            ':(exclude,glob)**/tasks/research_evidence/**'
          )
          reject_python_text \
            "Python shebang" \
            '^#!.*python([0-9]+([.][0-9]+)?)?([[:space:]]|$)' \
            --ignore-case \
            "${shebang_pathspecs[@]}"

          inline_command_pathspecs=(
            ':(icase,glob)**/*.sh'
            ':(icase,glob)**/*.bash'
            ':(icase,glob)**/*.zsh'
            ':(icase,glob)**/*.yml'
            ':(icase,glob)**/*.yaml'
            ':(icase,glob)**/*.toml'
            ':(icase,glob)**/*.service'
            ':(icase,glob)**/*.timer'
            ':(icase,glob)**/*.socket'
            ':(icase,glob)**/*.conf'
            ':(icase,glob)**/Dockerfile*'
            ':(icase,glob)**/Makefile'
            ':(icase,glob)**/Justfile'
            ':(icase,glob)**/bin/*'
            ':(icase,glob)**/scripts/*'
            ':(icase,glob)**/scripts/**/*'
            ':(exclude,glob)**/docs/archive/**'
            ':(exclude,glob)**/docs/plans/**'
            ':(exclude,glob)**/docs/reviews/**'
            ':(exclude,glob)**/docs/superpowers/**'
            ':(exclude,glob)**/tasks/research_evidence/**'
          )
          # Root-only migration controls may identify the already-installed
          # legacy runtime for parity and rollback, but may not add executable
          # Python/package-manager commands. Every permitted match is anchored
          # to an exact file and identity-only line; everything else is rejected.
          legacy_runtime_reference_allowlist='^(deployment/aliyun/polymarket-raw-ops-cutover[.]sh:[0-9]+:readonly LEGACY_EXEC="/usr/bin/pyth[o]n3 [$]LEGACY_COLLECTOR"|deployment/aliyun/polymarket-raw-ops-cutover[.]sh:[0-9]+:readonly LEGACY_REFERENCE_UPLOAD_EXEC="/usr/bin/pyth[o]n3 [$]LEGACY_UPLOADER --spool-dir /data/monday/spool/polymarket-reference --dataset crypto_expiry_reference --quote-depth-levels 0 --quote-sample-ms 0"|deployment/aliyun/polymarket-raw-ops-shadow-gate[.]sh:[0-9]+:readonly LEGACY_EXEC=[^[:alnum:]]/usr/bin/pyth[o]n3 /opt/monday/bin/polymarket_reference_collector[.]py[^[:alnum:]]|deployment/aliyun/test-polymarket-raw-ops-control-plane[.]sh:[0-9]+:[[:space:]]+(exec_start|cmdline):"/usr/bin/pyth[o]n3 /opt/monday/bin/polymarket_reference_collector[.]py",)$'
          reject_python_text \
            "Python runtime or package-manager command" \
            'actions/setup-pyth[o]n@|astral-sh/setup-u[v]@|(^|[;&|()/[:space:]])(python([0-9]+([.][0-9]+)?)?|pip([0-9]+)?|pipx|pytest|poetry|pdm|rye|conda|mamba|hatch|tox|virtualenv)([[:space:]]|$)|(^|[;&|()/[:space:]])uv[[:space:]]+(run|sync|pip|venv|python)([[:space:]]|$)' \
            --ignore-case \
            --allow-match-regex "${legacy_runtime_reference_allowlist}" \
            "${inline_command_pathspecs[@]}"

          rust_template_pathspecs=(
            ':(glob)rust_hft/.specify/templates/*.md'
            ':(glob)rust_hft/.specify/templates/**/*.md'
          )
          reject_python_text \
            "Python scaffolding in active Rust templates" \
            'actions/setup-pyth[o]n@|astral-sh/setup-u[v]@|(^|[^[:alnum:]_])(python([0-9]+([.][0-9]+)?)?|pip([0-9]+)?|pipx|pytest|poetry|pdm|rye|conda|mamba|hatch|tox|virtualenv|pyproject[.]toml|requirements[^/[:space:]]*[.]txt|setup[.]py|[^/[:space:]`"]+[.]py)([^[:alnum:]_]|$)|(^|[;&|()/[:space:]])uv[[:space:]]+(run|sync|pip|venv|python)([[:space:]]|$)' \
            --ignore-case \
            "${rust_template_pathspecs[@]}"

          if git grep -n -E '(name = "(burn-tch|tch|torch-sys|pyo3[^"]*|cpython|rust-cpython|python3-sys|rustpython[^"]*)"|^[[:space:]]*(burn-tch|tch|torch-sys|pyo3([-_][A-Za-z0-9_-]+)?|cpython|rust-cpython|python3-sys|rustpython([-_][A-Za-z0-9_-]+)?)[[:space:]]*=)' -- \
            ':(glob)**/Cargo.toml' ':(glob)**/Cargo.lock'; then
            echo "PyTorch/libtorch and Python-runtime Rust bindings are forbidden" >&2
            exit 1
          fi

      - name: Setup Rust toolchain
        if: needs.scope.outputs.toolchain == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux build tools
        if: needs.scope.outputs.toolchain == 'true'
        run: sudo apt-get update && sudo apt-get install -y clang mold protobuf-compiler shellcheck

      - name: Record cache dimensions
        if: needs.scope.outputs.toolchain == 'true'
        id: cache-info
        shell: bash
        run: |
          echo "rust=$(rustc -Vv | awk '/^release:/ {print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Rust
        if: needs.scope.outputs.toolchain == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust_hft
          key: rust_hft-ci-rust-${{ steps.cache-info.outputs.rust }}-${{ hashFiles('rust_hft/Cargo.lock') }}
          cache-all-crates: false
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Format Loop Engineer packages
        if: needs.scope.outputs.loop == 'true'
        run: |
          cargo fmt --check --package alpha-domain
          cargo fmt --check --package alpha-store
          cargo fmt --check --package alpha-engine
          cargo fmt --check --package alpha-onnx-evaluator
          cargo fmt --check --package alpha-harness
          cargo fmt --check --package hft-harnessctl
          cargo fmt --check --package hft-research-ml

      - name: Test Loop Engineer packages
        if: needs.scope.outputs.loop == 'true'
        run: cargo test -p alpha-domain -p alpha-store -p alpha-engine -p alpha-onnx-evaluator -p alpha-harness -p hft-harnessctl -p hft-research-ml --locked

      - name: Verify signed runtime handoff
        if: needs.scope.outputs.handoff == 'true'
        run: |
          cargo test -p hft-live --no-default-features --test deployment_envelope --locked
          cargo test -p hft-live --no-default-features --test deployment_artifacts --locked
          cargo test -p hft-live --no-default-features --features formula-strategy,binance --test deployment_envelope --locked
          cargo test -p hft-live --no-default-features --features formula-strategy,bitget --test deployment_artifacts --locked

      - name: Check JSON feature matrix
        if: needs.scope.outputs.json == 'true'
        run: |
          cargo test -p hft-integration --no-default-features --locked
          cargo test -p hft-integration --no-default-features --features json-simd --locked
          cargo test -p hft-data-adapter-binance --no-default-features --locked
          cargo test -p hft-data-adapter-binance --no-default-features --features json-simd --locked
          cargo test -p hft-infra-redis --features redis --locked
          cargo check -p hft-live --features clickhouse,redis,grpc --locked

      - name: Verify Ondo Perps feature boundary
        if: needs.scope.outputs.ondo == 'true'
        run: |
          cargo test -p hft-data-adapter-ondo-perps -p hft-execution-adapter-ondo-perps --locked
          cargo clippy -p hft-data-adapter-ondo-perps -p hft-execution-adapter-ondo-perps --all-targets --no-deps --locked -- -D warnings
          cargo check -p hft-live --features ondo-perps --locked

      - name: Verify governed data collector
        if: needs.scope.outputs.collector == 'true'
        run: |
          cargo check -p hft-collector --locked
          cargo clippy -p hft-collector --all-targets --features collector-binance --no-deps --locked -- -D warnings
          cargo test -p hft-collector --features collector-binance --locked

      - name: Verify collector release control plane
        if: needs.scope.outputs.control == 'true'
        run: |
          for script in ../deployment/aliyun/*.sh; do
            bash -n "$script"
          done
          shellcheck ../deployment/aliyun/*.sh
          ../deployment/aliyun/test-rust-lob-control-plane.sh
          ../deployment/aliyun/test-rust-lob-release-adoption.sh
          ../deployment/aliyun/test-polymarket-raw-ops-control-plane.sh
          ../deployment/aliyun/test-polymarket-raw-ops-stage.sh
          MONDAY_TEST_RECORDER_IMAGE=1 SOURCE_REVISION="$GITHUB_SHA" \
            ../deployment/aliyun/test-polymarket-market-recorder-release.sh
          ../deployment/aliyun/test-trading-ecs-host-contract.sh
          cargo test -p hft-collector --lib systemd_reference_resource_envelope_is_pinned --locked

      - name: Build focused packages
        if: needs.scope.outputs.focused == 'true'
        run: cargo build -p hft-live -p hft-paper -p hft-all-in-one -p alpha-harness -p hft-harnessctl --locked

      - name: Package binaries (if present)
        if: github.event_name == 'push'
        run: |
          mkdir -p dist
          for bin in hft-live hft-paper hft-all-in-one hft-replay; do
            if [ -f target/debug/$bin ]; then
              cp target/debug/$bin dist/
            fi
          done
          ls -la dist || true

      - name: Upload artifacts
        if: success() && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: rust-dev-binaries-${{ github.sha }}
          path: rust_hft/dist/*
          if-no-files-found: ignore

  deployment_artifacts:
    name: Production Image And Kubernetes Contract
    needs: scope
    if: ${{ contains(needs.scope.outputs.jobs, ',ci/deployment-artifacts,') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build production trading image
        uses: docker/build-push-action@v7
        with:
          context: rust_hft
          file: rust_hft/deployment/docker/Dockerfile.trading
          push: false
          tags: hft-trading:${{ github.sha }}
          cache-from: type=gha,scope=hft-trading-image
          cache-to: type=gha,mode=max,scope=hft-trading-image

      - name: Validate Kubernetes manifests without a cluster
        run: |
          docker run --rm \
            -v "$PWD:/work:ro" \
            ghcr.io/yannh/kubeconform:v0.7.0 \
            -strict -summary \
            /work/rust_hft/deployment/k8s \
            /work/deployment/aliyun/research/k8s

  polymarket_evidence_compiler_image:
    name: Polymarket Evidence Compiler Image
    needs: scope
    if: ${{ contains(needs.scope.outputs.jobs, ',ci/polymarket-evidence-compiler-image,') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and inspect Polymarket evidence compiler image
        run: |
          image=polymarket-evidence-compiler:${{ github.sha }}
          docker build \
            --build-arg "SOURCE_REVISION=${{ github.sha }}" \
            --file rust_hft/deployment/docker/Dockerfile.polymarket-evidence-compiler \
            --tag "$image" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            rust_hft
          docker run --rm --entrypoint /usr/local/bin/polymarket-raw-ops "$image" \
            publish-polymarket-evidence --help >/dev/null
          docker run --rm --entrypoint /usr/local/bin/polymarket-raw-ops "$image" \
            --version | grep -Fqx "polymarket-raw-ops ${{ github.sha }}"
          docker run --rm --entrypoint /usr/local/bin/aliyun "$image" version >/dev/null
          docker run --rm --entrypoint /bin/sh "$image" -ec \
            'test ! -e /usr/local/bin/binance-lob-archiver'
          actual_source_revision=$(docker image inspect \
            --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' \
            "$image")
          test "$actual_source_revision" = "${{ github.sha }}"

  rust_hft_engine_fast_lane:
    name: Rust HFT Engine Fast Lane
    needs: scope
    if: ${{ contains(needs.scope.outputs.jobs, ',ci/rust-hft-engine-fast-lane,') }}
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    defaults:
      run:
        working-directory: rust_hft
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install Linux build tools
        run: sudo apt-get update && sudo apt-get install -y clang mold protobuf-compiler

      - name: Record cache dimensions
        id: cache-info
        shell: bash
        run: |
          echo "rust=$(rustc -Vv | awk '/^release:/ {print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust_hft
          key: hft-engine-fast-lane-${{ steps.cache-info.outputs.rust }}-${{ hashFiles('rust_hft/Cargo.lock') }}
          cache-all-crates: false
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Audit unbounded channels
        run: cargo test -p hft-engine --test queue_topology_contract --locked

      - name: Format hft-engine
        run: cargo fmt --check --package hft-engine

      - name: Check hft-engine
        run: cargo check -p hft-engine --locked

      - name: Test Binance MD fast lane
        run: cargo test -p hft-engine --locked binance_md

  node_install:
    name: Node Install (root)
    needs: scope
    if: ${{ contains(needs.scope.outputs.jobs, ',ci/node-install,') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Node lockfile
        id: node-lock
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            echo "manager=npm" >> "$GITHUB_OUTPUT"
            echo "cache=npm" >> "$GITHUB_OUTPUT"
          elif [ -f pnpm-lock.yaml ]; then
            echo "manager=pnpm" >> "$GITHUB_OUTPUT"
            echo "cache=pnpm" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "manager=yarn" >> "$GITHUB_OUTPUT"
            echo "cache=yarn" >> "$GITHUB_OUTPUT"
          else
            echo "manager=none" >> "$GITHUB_OUTPUT"
            echo "cache=npm" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.node-lock.outputs.manager != 'none'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: ${{ steps.node-lock.outputs.cache }}

      - name: Install dependencies
        if: steps.node-lock.outputs.manager != 'none'
        run: |
          case "${{ steps.node-lock.outputs.manager }}" in
            npm)
              npm ci --prefer-offline --no-audit --fund=false
              ;;
            pnpm)
              corepack enable
              pnpm install --frozen-lockfile
              ;;
            yarn)
              corepack enable
              yarn install --immutable || yarn install --frozen-lockfile
              ;;
          esac

      - name: Skip Node install
        if: steps.node-lock.outputs.manager == 'none'
        run: echo "No root Node lockfile found; skipping Node install."

  ci-gate:
    name: Monorepo CI gate
    needs:
      - selector
      - scope
      - rust
      - deployment_artifacts
      - polymarket_evidence_compiler_image
      - rust_hft_engine_fast_lane
      - node_install
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608 # v4.1.0
      - name: Require selected jobs to pass
        working-directory: .
        env:
          GATE_NEEDS: ${{ toJson(needs) }}
        run: printf '%s' "$GATE_NEEDS" | bash .github/scripts/verify-ci-gate.sh
