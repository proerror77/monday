name: Monorepo CI

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: monorepo-${{ github.ref }}
  # PR runs may be superseded; main runs must finish their exact-source
  # validation and publication handoff.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  selector:
    name: CI job selector
    runs-on: ubuntu-latest
    outputs:
      jobs: ${{ steps.scope.outputs.jobs }}
      owning_packages: ${{ steps.scope.outputs.owning_packages }}
      loop_packages: ${{ steps.scope.outputs.loop_packages }}
      focused_packages: ${{ steps.scope.outputs.focused_packages }}
      clippy_loop: ${{ steps.scope.outputs.clippy_loop }}
      clippy_handoff: ${{ steps.scope.outputs.clippy_handoff }}
      loop: ${{ steps.scope.outputs.loop }}
      handoff: ${{ steps.scope.outputs.handoff }}
      json: ${{ steps.scope.outputs.json }}
      ondo: ${{ steps.scope.outputs.ondo }}
      collector: ${{ steps.scope.outputs.collector }}
      control: ${{ steps.scope.outputs.control }}
      focused: ${{ steps.scope.outputs.focused }}
      toolchain: ${{ steps.scope.outputs.toolchain }}
      production_trading_image: ${{ steps.scope.outputs.production_trading_image }}
      production_collector_image: ${{ steps.scope.outputs.production_collector_image }}
      selection_complete: ${{ steps.scope.outputs.selection_complete }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Select CI jobs
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          .github/scripts/select-rust-ci-scope.sh \
            --event "${{ github.event_name }}" \
            --base "${BASE_SHA}" \
            --head "${HEAD_SHA}"


  scope:
    name: CI job scope
    needs: selector
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      jobs: ${{ steps.scope.outputs.jobs }}
      owning_packages: ${{ steps.scope.outputs.owning_packages }}
      loop_packages: ${{ steps.scope.outputs.loop_packages }}
      focused_packages: ${{ steps.scope.outputs.focused_packages }}
      clippy_loop: ${{ steps.scope.outputs.clippy_loop }}
      clippy_handoff: ${{ steps.scope.outputs.clippy_handoff }}
      loop: ${{ steps.scope.outputs.loop }}
      handoff: ${{ steps.scope.outputs.handoff }}
      json: ${{ steps.scope.outputs.json }}
      ondo: ${{ steps.scope.outputs.ondo }}
      collector: ${{ steps.scope.outputs.collector }}
      control: ${{ steps.scope.outputs.control }}
      focused: ${{ steps.scope.outputs.focused }}
      toolchain: ${{ steps.scope.outputs.toolchain }}
      production_trading_image: ${{ steps.scope.outputs.production_trading_image }}
      production_collector_image: ${{ steps.scope.outputs.production_collector_image }}
    steps:
      - name: Resolve selector result
        id: scope
        env:
          SELECTOR_RESULT: ${{ needs.selector.result }}
          SELECTED_JOBS: ${{ needs.selector.outputs.jobs }}
          SELECTED_OWNING_PACKAGES: ${{ needs.selector.outputs.owning_packages }}
          SELECTED_LOOP_PACKAGES: ${{ needs.selector.outputs.loop_packages }}
          SELECTED_FOCUSED_PACKAGES: ${{ needs.selector.outputs.focused_packages }}
          SELECTED_CLIPPY_LOOP: ${{ needs.selector.outputs.clippy_loop }}
          SELECTED_CLIPPY_HANDOFF: ${{ needs.selector.outputs.clippy_handoff }}
          SELECTED_LOOP: ${{ needs.selector.outputs.loop }}
          SELECTED_HANDOFF: ${{ needs.selector.outputs.handoff }}
          SELECTED_JSON: ${{ needs.selector.outputs.json }}
          SELECTED_ONDO: ${{ needs.selector.outputs.ondo }}
          SELECTED_COLLECTOR: ${{ needs.selector.outputs.collector }}
          SELECTED_CONTROL: ${{ needs.selector.outputs.control }}
          SELECTED_FOCUSED: ${{ needs.selector.outputs.focused }}
          SELECTED_TOOLCHAIN: ${{ needs.selector.outputs.toolchain }}
          SELECTED_PRODUCTION_TRADING_IMAGE: ${{ needs.selector.outputs.production_trading_image }}
          SELECTED_PRODUCTION_COLLECTOR_IMAGE: ${{ needs.selector.outputs.production_collector_image }}
          SELECTED_COMPLETE: ${{ needs.selector.outputs.selection_complete }}
        run: |
          if [[ "$SELECTOR_RESULT" == success && "$SELECTED_COMPLETE" == true ]] &&
             [[ "$SELECTED_JOBS" =~ ^,[a-z0-9/-]*(,[a-z0-9/-]+)*,$ ]] &&
             [[ "$SELECTED_OWNING_PACKAGES" =~ ^,[A-Za-z0-9_-]*(,[A-Za-z0-9_-]+)*,$ ]] &&
             [[ "$SELECTED_FOCUSED_PACKAGES" =~ ^,[A-Za-z0-9_-]*(,[A-Za-z0-9_-]+)*,$ ]] &&
             [[ "$SELECTED_LOOP_PACKAGES" =~ ^,[A-Za-z0-9_-]*(,[A-Za-z0-9_-]+)*,$ ]] &&
             [[ "${SELECTED_CLIPPY_LOOP},${SELECTED_CLIPPY_HANDOFF},$SELECTED_LOOP,$SELECTED_HANDOFF,$SELECTED_JSON,$SELECTED_ONDO,$SELECTED_COLLECTOR,$SELECTED_CONTROL,$SELECTED_FOCUSED,$SELECTED_TOOLCHAIN,$SELECTED_PRODUCTION_TRADING_IMAGE,$SELECTED_PRODUCTION_COLLECTOR_IMAGE" =~ ^(true|false)(,(true|false)){11}$ ]]; then
            printf '%s\n' \
              "jobs=$SELECTED_JOBS" \
              "owning_packages=$SELECTED_OWNING_PACKAGES" \
              "loop_packages=$SELECTED_LOOP_PACKAGES" \
              "focused_packages=$SELECTED_FOCUSED_PACKAGES" \
              "clippy_loop=$SELECTED_CLIPPY_LOOP" \
              "clippy_handoff=$SELECTED_CLIPPY_HANDOFF" \
              "loop=$SELECTED_LOOP" \
              "handoff=$SELECTED_HANDOFF" \
              "json=$SELECTED_JSON" \
              "ondo=$SELECTED_ONDO" \
              "collector=$SELECTED_COLLECTOR" \
              "control=$SELECTED_CONTROL" \
              "focused=$SELECTED_FOCUSED" \
              "toolchain=$SELECTED_TOOLCHAIN" \
              "production_trading_image=$SELECTED_PRODUCTION_TRADING_IMAGE" \
              "production_collector_image=$SELECTED_PRODUCTION_COLLECTOR_IMAGE"
          else
            echo 'CI selection failed or returned an invalid plan; no work is dispatched' >&2
            exit 1
          fi >> "$GITHUB_OUTPUT"

      - name: Summarize check plan
        env:
          SELECTED_JOBS: ${{ steps.scope.outputs.jobs }}
          SELECTED_OWNING_PACKAGES: ${{ steps.scope.outputs.owning_packages }}
          SELECTED_CONTROL: ${{ steps.scope.outputs.control }}
        run: |
          printf '### CI check plan\n\n- Jobs: %s\n- Direct Rust package tests: %s\n- Collector control contract: %s\n' \
            "$SELECTED_JOBS" "$SELECTED_OWNING_PACKAGES" "$SELECTED_CONTROL" \
            >> "$GITHUB_STEP_SUMMARY"

  control_contracts:
    name: Collector control contracts
    needs: scope
    if: ${{ !cancelled() && contains(needs.scope.outputs.jobs, ',ci/control-contracts,') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout collector controls
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install shellcheck
        run: bash "$GITHUB_WORKSPACE/.github/workflows/install-ubuntu-packages.sh" shellcheck

      - name: Verify Campaign controller recovery
        run: |
          bash -n deployment/aliyun/research/scripts/campaign-cycle-controller.sh \
            deployment/aliyun/research/scripts/campaign-job-watch.sh \
            deployment/aliyun/research/test-campaign-cycle-controller.sh
          shellcheck -x -e SC2154 \
            deployment/aliyun/research/scripts/campaign-cycle-controller.sh \
            deployment/aliyun/research/scripts/campaign-job-watch.sh \
            deployment/aliyun/research/test-campaign-cycle-controller.sh
          deployment/aliyun/research/test-campaign-cycle-controller.sh

      - name: Verify collector release shell contracts
        working-directory: rust_hft
        run: |
          for script in ../deployment/aliyun/*.sh; do
            bash -n "$script"
          done
          shellcheck ../deployment/aliyun/*.sh
          bash ../.github/scripts/run-collector-control-contracts.sh

  monitor_contracts:
    name: Collector monitor contracts
    needs: scope
    if: ${{ !cancelled() && contains(needs.scope.outputs.jobs, ',ci/monitor-contracts,') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Install shellcheck
        run: bash "$GITHUB_WORKSPACE/.github/workflows/install-ubuntu-packages.sh" shellcheck
      - name: Verify monitor and atomic unit deployment
        run: |
          shellcheck deployment/aliyun/monday-collector-health.sh deployment/aliyun/host-collector-health-unit-release.sh
          deployment/aliyun/test-monday-collector-health.sh
          deployment/aliyun/test-collector-health-unit-release.sh
          .github/scripts/test-monitor-collector-host.sh
          deployment/aliyun/test-collector-monitor-release.sh

  ci_contracts:
    name: CI policy contracts
    needs: scope
    if: ${{ !cancelled() && contains(needs.scope.outputs.jobs, ',ci/ci-contracts,') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Verify selection, cancellation and aggregate admission
        run: |
          bash .github/scripts/test-collector-control-scheduling.sh
          bash .github/scripts/test-main-image-scope.sh
          bash .github/scripts/test-main-research-scope.sh
          bash .github/scripts/test-research-release-products.sh
          bash .github/scripts/test-image-build-plan.sh
          ruby .github/scripts/test-rust-docker-workspaces.rb --self-test
          bash .github/scripts/test-tested-image.sh
          node .github/scripts/test-local-lock-impact.mjs
          bash .github/scripts/test-ack-rust-batch.sh
          bash .github/scripts/test-ci-rust-evidence.sh
          bash .github/scripts/test-loop-nextest.sh
          .github/scripts/test-ci-rust-same-run.sh
          .github/scripts/test-select-rust-ci-scope.sh
          .github/scripts/test-ci-monitor-scope.sh
          .github/scripts/test-agent-validation-gates.sh
          .github/scripts/test-classify-ack-research-job.sh
          bash .github/scripts/test-ack-preflight-relay.sh
          bash .github/scripts/test-preflight-workflow-gate.sh
          .github/scripts/test-research-image-release-artifact.sh

  rust_shell_scripts:
    name: Rust shell scripts
    needs: scope
    if: ${{ contains(needs.scope.outputs.jobs, ',ci/rust-shell-scripts,') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Check shell syntax
        run: find rust_hft/scripts -type f -name '*.sh' -exec bash -n {} \;

  rust_loop_nextest_archive:
    name: Loop nextest archive
    needs: scope
    if: ${{ !cancelled() && needs.scope.result == 'success' && contains(needs.scope.outputs.jobs, ',ci/rust,') && needs.scope.outputs.loop == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      CARGO_TARGET_DIR: ${{ github.workspace }}/rust_hft/target
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: 1.98.1

      - name: Install Linux build tools
        run: bash "$GITHUB_WORKSPACE/.github/workflows/install-ubuntu-packages.sh" clang mold protobuf-compiler

      - name: Record cache dimensions
        id: cache-info
        shell: bash
        run: echo "rust=$(rustc -Vv | awk '/^release:/ {print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            rust_hft
          key: rust_hft-ci-rust-${{ steps.cache-info.outputs.rust }}
          cache-all-crates: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-nextest
        run: bash "$GITHUB_WORKSPACE/.github/scripts/install-cargo-nextest.sh"

      - name: Archive loop tests
        env:
          LOOP_PACKAGES: ${{ needs.scope.outputs.loop_packages }}
          LOOP_NEXTEST_WORK: ${{ runner.temp }}/loop-nextest
        run: bash "$GITHUB_WORKSPACE/.github/scripts/loop-nextest-archive.sh"

      - name: Upload nextest archive
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: loop-nextest-archive-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/loop-nextest/archive.tar.zst
          if-no-files-found: error
          retention-days: 1

      - name: Upload expected test counts
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: loop-nextest-expected-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/loop-nextest/expected-counts.json
          if-no-files-found: error
          retention-days: 7

  rust_loop_nextest_shard:
    name: Loop nextest shard (${{ matrix.shard }})
    needs: rust_loop_nextest_archive
    if: ${{ !cancelled() && needs.rust_loop_nextest_archive.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: 1.98.1

      - name: Install Linux build tools
        run: bash "$GITHUB_WORKSPACE/.github/workflows/install-ubuntu-packages.sh" clang mold protobuf-compiler

      - name: Install cargo-nextest
        run: bash "$GITHUB_WORKSPACE/.github/scripts/install-cargo-nextest.sh"

      - name: Download nextest archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: loop-nextest-archive-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/loop-nextest-archive

      - name: Run shard
        env:
          LOOP_SHARD: ${{ matrix.shard }}
          LOOP_NEXTEST_ARCHIVE: ${{ runner.temp }}/loop-nextest-archive/archive.tar.zst
          LOOP_NEXTEST_WORK: ${{ runner.temp }}/loop-nextest-shard
        run: bash "$GITHUB_WORKSPACE/.github/scripts/loop-nextest-shard.sh"

      - name: Upload shard counts
        if: ${{ success() || failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: loop-nextest-shard-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/loop-nextest-shard/shard-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 7

  rust:
    name: Rust Workspace
    outputs:
      evidence: ${{ steps.rust_evidence.outputs.evidence }}
    permissions:
      contents: read
      actions: read
    needs: scope
    if: ${{ always() && !cancelled() && needs.scope.result == 'success' && contains(needs.scope.outputs.jobs, ',ci/rust,') }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      CARGO_TERM_COLOR: always
      CARGO_TARGET_DIR: ${{ github.workspace }}/rust_hft/target
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    defaults:
      run:
        working-directory: rust_hft
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Rust toolchain
        if: ${{ (needs.scope.outputs.toolchain == 'true') }}
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Install Linux build tools
        if: ${{ (needs.scope.outputs.toolchain == 'true') }}
        run: bash "$GITHUB_WORKSPACE/.github/workflows/install-ubuntu-packages.sh" clang mold protobuf-compiler

      - name: Record cache dimensions
        if: ${{ (needs.scope.outputs.toolchain == 'true') }}
        id: cache-info
        shell: bash
        run: echo "rust=$(rustc -Vv | awk '/^release:/ {print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Rust
        if: ${{ (needs.scope.outputs.toolchain == 'true') }}
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            rust_hft
          key: rust_hft-ci-rust-${{ steps.cache-info.outputs.rust }}
          cache-all-crates: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Test directly changed Rust packages
        id: owning
        if: ${{ (needs.scope.outputs.owning_packages != ',,') }}
        env:
          OWNING_PACKAGES: ${{ needs.scope.outputs.owning_packages }}
        run: |
          package_list=${OWNING_PACKAGES#,}
          package_list=${package_list%,}
          IFS=',' read -ra packages <<<"$package_list"
          args=()
          for package in "${packages[@]}"; do
            args+=(-p "$package")
          done
          "$GITHUB_WORKSPACE/rust_hft/scripts/cargo-scoped.sh" test "${args[@]}" --locked
          clippy_args=()
          for package in "${packages[@]}"; do
            [[ ",${{ needs.scope.outputs.loop_packages }}," == *",$package,"* ]] || clippy_args+=(-p "$package")
          done
          if (( ${#clippy_args[@]} )); then "$GITHUB_WORKSPACE/rust_hft/scripts/cargo-scoped.sh" clippy "${clippy_args[@]}" --all-targets --locked --no-deps -- -D warnings; fi

      - name: Verify signed runtime handoff
        id: handoff
        if: ${{ (needs.scope.outputs.handoff == 'true') }}
        run: |
          "$GITHUB_WORKSPACE/rust_hft/scripts/cargo-scoped.sh" test -p hft-live --no-default-features --test deployment_envelope --locked
          "$GITHUB_WORKSPACE/rust_hft/scripts/cargo-scoped.sh" test -p hft-live --no-default-features --test deployment_artifacts --locked
          "$GITHUB_WORKSPACE/rust_hft/scripts/cargo-scoped.sh" test -p hft-live --no-default-features --features formula-strategy,binance --test deployment_envelope --locked
          "$GITHUB_WORKSPACE/rust_hft/scripts/cargo-scoped.sh" test -p hft-live --no-default-features --features formula-strategy,bitget --test deployment_artifacts --locked
          "$GITHUB_WORKSPACE/rust_hft/scripts/cargo-scoped.sh" test -p hft-live --no-default-features --features probability-reversal-strategy --test prediction_probability --locked
          "$GITHUB_WORKSPACE/rust_hft/scripts/cargo-scoped.sh" test -p hft-runtime --features strategy-probability-reversal --test prediction_probability --locked
          "$GITHUB_WORKSPACE/rust_hft/scripts/cargo-scoped.sh" clippy -p hft-live --no-default-features --features probability-reversal-strategy --all-targets --locked --no-deps -- -D warnings
          "$GITHUB_WORKSPACE/rust_hft/scripts/cargo-scoped.sh" test -p hft-runtime --no-default-features --features adapter-binance-execution,adapter-binance-prediction-execution --lib system_builder::execution_registry::tests --locked
          "$GITHUB_WORKSPACE/rust_hft/scripts/cargo-scoped.sh" clippy -p hft-live --no-default-features --features binance-data,binance-prediction-data,polymarket-data --all-targets --locked --no-deps -- -D warnings

      - name: Check JSON feature matrix
        id: json
        if: ${{ (needs.scope.outputs.json == 'true') }}
        run: |
          "$GITHUB_WORKSPACE/rust_hft/scripts/cargo-scoped.sh" test -p hft-integration --no-default-features --locked
          "$GITHUB_WORKSPACE/rust_hft/scripts/cargo-scoped.sh" test -p hft-integration --no-default-features --features json-simd --locked
          "$GITHUB_WORKSPACE/rust_hft/scripts/cargo-scoped.sh" test -p hft-data-adapter-binance --no-default-features --locked
          "$GITHUB_WORKSPACE/rust_hft/scripts/cargo-scoped.sh" test -p hft-data-adapter-binance --no-default-features --features json-simd --locked
          "$GITHUB_WORKSPACE/rust_hft/scripts/cargo-scoped.sh" test -p hft-infra-redis --features redis --locked
          "$GITHUB_WORKSPACE/rust_hft/scripts/cargo-scoped.sh" check -p hft-live --features clickhouse,redis,grpc,polymarket --locked

      - name: Verify Ondo Perps feature boundary
        id: ondo
        if: ${{ (needs.scope.outputs.ondo == 'true') }}
        run: |
          "$GITHUB_WORKSPACE/rust_hft/scripts/cargo-scoped.sh" test -p hft-data-adapter-ondo-perps -p hft-execution-adapter-ondo-perps --locked
          "$GITHUB_WORKSPACE/rust_hft/scripts/cargo-scoped.sh" clippy -p hft-data-adapter-ondo-perps -p hft-execution-adapter-ondo-perps --all-targets --no-deps --locked -- -D warnings
          "$GITHUB_WORKSPACE/rust_hft/scripts/cargo-scoped.sh" check -p hft-live --features ondo-perps --locked

      - name: Verify governed data collector
        id: collector
        if: ${{ (needs.scope.outputs.collector == 'true') }}
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/check-collector-test-presence.sh"
          "$GITHUB_WORKSPACE/rust_hft/scripts/cargo-scoped.sh" check -p hft-collector --locked
          "$GITHUB_WORKSPACE/rust_hft/scripts/cargo-scoped.sh" clippy -p hft-collector --all-targets --features collector-binance --no-deps --locked -- -D warnings
          "$GITHUB_WORKSPACE/rust_hft/scripts/cargo-scoped.sh" test -p hft-collector --features collector-binance --locked

      - name: Verify collector release control plane
        id: control
        if: ${{ (needs.scope.outputs.control == 'true') }}
        run: |
          ../deployment/aliyun/test-polymarket-raw-ops-control-plane.sh
          "$GITHUB_WORKSPACE/rust_hft/scripts/cargo-scoped.sh" test -p hft-collector --lib systemd_reference_resource_envelope_is_pinned --locked

      - name: Build focused packages
        id: focused
        if: ${{ (needs.scope.outputs.focused == 'true') }}
        env:
          FOCUSED_PACKAGES: ${{ needs.scope.outputs.focused_packages }}
        run: |
          selected=${FOCUSED_PACKAGES#,}; selected=${selected%,}
          [[ -n $selected ]] || { echo 'focused package selection is empty' >&2; exit 1; }
          IFS=',' read -ra packages <<<"$selected"
          args=(); for package in "${packages[@]}"; do args+=(-p "$package"); done
          "$GITHUB_WORKSPACE/rust_hft/scripts/cargo-scoped.sh" build "${args[@]}" --locked

      - name: Package binaries (if present)
        if: ${{ (github.event_name == 'push') }}
        run: |
          mkdir -p dist
          for bin in hft-live hft-paper hft-all-in-one hft-replay; do
            if [ -f target/debug/$bin ]; then
              cp target/debug/$bin dist/
            fi
          done
          ls -la dist || true

      - name: Upload artifacts
        if: ${{ (success() && github.event_name == 'push') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-dev-binaries-${{ github.sha }}
          path: rust_hft/dist/*
          if-no-files-found: ignore

      - name: Strict research Clippy
        id: clippy_loop
        if: needs.scope.outputs.loop == 'true'
        env:
          LOOP_PACKAGES: ${{ needs.scope.outputs.loop_packages }}
        run: |
          packages=${LOOP_PACKAGES#,}; packages=${packages%,}
          IFS=',' read -ra selected <<<"$packages"
          args=(); for package in "${selected[@]}"; do args+=(-p "$package"); done
          "$GITHUB_WORKSPACE/rust_hft/scripts/cargo-scoped.sh" clippy "${args[@]}" --all-targets --locked -- -D warnings -D clippy::correctness -D clippy::suspicious

      - name: Strict runtime handoff Clippy
        id: clippy_handoff
        if: needs.scope.outputs.handoff == 'true'
        run: |
          "$GITHUB_WORKSPACE/rust_hft/scripts/cargo-scoped.sh" clippy -p hft-live --no-default-features --test deployment_envelope --locked --no-deps -- -D warnings -D clippy::correctness -D clippy::suspicious

      - name: Test Loop Engineer packages
        id: loop
        if: ${{ success() && needs.scope.outputs.loop == 'true' }}
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/loop-nextest-wait.sh"

      - name: Write native validation evidence
        id: rust_evidence
        if: success() && (github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          CI_STEPS: ${{ toJSON(steps) }}
        run: bash .github/scripts/write-ci-rust-evidence.sh "${RUNNER_TEMP}/rust-batch.json"

      - name: Upload native validation evidence
        if: success() && (github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-rust-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rust-batch.json
          if-no-files-found: error
          retention-days: 7

  clippy_strict:
    name: Code Quality - Clippy (STRICT)
    needs: [scope, rust]
    if: ${{ always() && !cancelled() && contains(needs.scope.outputs.jobs, ',ci/clippy-strict,') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify same-run native Clippy result
        env:
          RUST_JOB_RESULT: ${{ needs.rust.result }}
          CI_EVIDENCE: ${{ needs.rust.outputs.evidence }}
          SELECTED_SCOPE: ${{ toJSON(needs.scope.outputs) }}
        run: |
          test "$RUST_JOB_RESULT" = success
          test -n "$CI_EVIDENCE"
          printf '%s' "$CI_EVIDENCE" >"${RUNNER_TEMP}/rust-evidence.json"
          jq -r 'to_entries[] | "\(.key)=\(.value)"' <<<"$SELECTED_SCOPE" >"${RUNNER_TEMP}/rust-scope.out"
          bash .github/scripts/verify-ci-rust-same-run.sh "${RUNNER_TEMP}/rust-evidence.json" "${RUNNER_TEMP}/rust-scope.out"

  research_foundation:
    name: Research foundation contracts
    needs: scope
    if: ${{ contains(needs.scope.outputs.jobs, ',ci/research-foundation,') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: ${{ github.run_id }}
          POSTGRES_DB: monday_foundation_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      clickhouse:
        image: clickhouse/clickhouse-server:26.8.6.5
        env:
          CLICKHOUSE_USER: fixture
          CLICKHOUSE_PASSWORD: ${{ github.run_id }}
        ports: ["18123:8123"]
        options: --health-cmd "clickhouse-client --user fixture --password ${{ github.run_id }} --query 'SELECT 1'" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/rust_hft/target
      MONDAY_TEST_DATABASE_URL: postgres://fixture:${{ github.run_id }}@127.0.0.1:5432/monday_foundation_test
      MONDAY_TEST_CH_ENDPOINT: http://127.0.0.1:18123
      MONDAY_TEST_CH_PASSWORD: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: rust_hft
          key: research-foundation-contracts
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Validate workspace ownership and dependency closures
        run: bash .github/scripts/test-rust-workspaces.sh
      - name: Validate typed inputs, lifecycle and durable PG claims
        working-directory: rust_hft
        run: |
          "$GITHUB_WORKSPACE/rust_hft/scripts/cargo-scoped.sh" fmt -p hft-research-platform -- --check
          "$GITHUB_WORKSPACE/rust_hft/scripts/cargo-scoped.sh" test -p hft-research-platform --features control,gateway,publisher --locked
          "$GITHUB_WORKSPACE/rust_hft/scripts/cargo-scoped.sh" test -p hft-research-platform --features control,gateway,publisher --test postgres --locked -- --ignored
          "$GITHUB_WORKSPACE/rust_hft/scripts/cargo-scoped.sh" test -p hft-research-platform --features control,gateway,publisher --test native_attempt_identity --locked -- --ignored
          "$GITHUB_WORKSPACE/rust_hft/scripts/cargo-scoped.sh" clippy -p hft-research-platform --features control,gateway,publisher --all-targets --locked -- -D warnings
      - name: Validate native terminal retirement against isolated PG
        working-directory: rust_hft
        run: |
          docker exec "${{ job.services.postgres.id }}" psql -U fixture -d monday_foundation_test -v ON_ERROR_STOP=1 -c 'CREATE DATABASE monday_foundation_retirement_test'
          MONDAY_TEST_DATABASE_URL="${MONDAY_TEST_DATABASE_URL%/monday_foundation_test}/monday_foundation_retirement_test" \
            "$GITHUB_WORKSPACE/rust_hft/scripts/cargo-scoped.sh" test -p hft-research-platform --features control,gateway,publisher --lib retirement::tests::native_retirement_real_pg_archive_delete_unknown_and_recovery --locked -- --ignored
      - name: Validate actual Build import against isolated PG
        working-directory: rust_hft
        run: |
          docker exec "${{ job.services.postgres.id }}" psql -U fixture -d monday_foundation_test -v ON_ERROR_STOP=1 -c 'CREATE DATABASE monday_foundation_build_import_test'
          MONDAY_TEST_DATABASE_URL="${MONDAY_TEST_DATABASE_URL%/monday_foundation_test}/monday_foundation_build_import_test" \
            "$GITHUB_WORKSPACE/rust_hft/scripts/cargo-scoped.sh" test -p hft-research-platform --features control,gateway,publisher --test build_import signed_release_requires_actual_blob_and_only_strong_import_reaches_pg --locked -- --ignored
          docker exec "${{ job.services.postgres.id }}" psql -U fixture -d monday_foundation_test -v ON_ERROR_STOP=1 -c 'CREATE DATABASE monday_foundation_build_admission_test'
          MONDAY_TEST_DATABASE_URL="${MONDAY_TEST_DATABASE_URL%/monday_foundation_test}/monday_foundation_build_admission_test" \
            "$GITHUB_WORKSPACE/rust_hft/scripts/cargo-scoped.sh" test -p hft-research-platform --features control,gateway,publisher --test build_import independent_pg_admission_orders_revocation_and_rejects_replay_and_sql_bypass --locked -- --ignored
      - name: Validate packaged CH SQL against the fixture server
        run: bash .github/scripts/test-clickhouse-preparation.sh
      - name: Validate raw protocol, standard Parquet and durable CH/PG import
        run: bash .github/scripts/test-market-import.sh
      - name: Validate optional data importer boundaries
        working-directory: rust_hft
        run: cargo clippy --manifest-path data-pipelines/Cargo.toml -p hft-market-pipeline --features import --all-targets --locked -- -D warnings
      - name: Validate paused application roles against isolated PG
        working-directory: rust_hft
        run: |
          docker exec "${{ job.services.postgres.id }}" psql -U fixture -d monday_foundation_test -v ON_ERROR_STOP=1 -c 'CREATE DATABASE monday_foundation_roles_test'
          MONDAY_TEST_DATABASE_URL="${MONDAY_TEST_DATABASE_URL%/monday_foundation_test}/monday_foundation_roles_test" \
            "$GITHUB_WORKSPACE/rust_hft/scripts/cargo-scoped.sh" test -p hft-research-platform --features control,gateway,publisher --test persistent_platform paused_database_roles_enforce_real_read_write_and_lock_boundaries --locked -- --ignored

  rust_fast_gates:
    name: Rust Fast Gates
    needs: scope
    if: ${{ contains(needs.scope.outputs.jobs, ',ci/rust,') || contains(needs.scope.outputs.jobs, ',ci/rust-shell-scripts,') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CARGO_TERM_COLOR: always
      CARGO_TARGET_DIR: ${{ github.workspace }}/rust_hft/target
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Enforce Monday module layout
        working-directory: .
        run: |
          set -euo pipefail
          test ! -e products/ploy
          test -f rust_hft/prediction-markets/Cargo.toml
          test -f rust_hft/data-pipelines/adapters/adapter-polymarket/Cargo.toml
          test -f rust_hft/execution-gateway/adapters/adapter-polymarket/Cargo.toml

      - name: Enforce Rust-only research and runtime source
        working-directory: .
        run: |
          set -euo pipefail

          forbidden_paths="$(git ls-files \
            ':(icase,glob)**/*.py' \
            ':(icase,glob)**/*.pyw' \
            ':(icase,glob)**/*.ipynb' \
            ':(icase,glob)**/*.py[cod]' \
            ':(icase,glob)**/requirements*.txt' \
            ':(icase,glob)**/pyproject.toml' \
            ':(icase,glob)**/Pipfile' \
            ':(icase,glob)**/poetry.lock' \
            ':(icase,glob)**/pytest.ini' \
            ':(icase,glob)**/tox.ini' \
            ':(icase,glob)**/setup.py')"
          if [ -n "${forbidden_paths}" ]; then
            echo "tracked Py""thon source, notebook, bytecode, or packaging artifact is forbidden" >&2
            printf '%s\n' "${forbidden_paths}" >&2
            exit 1
          fi

          reject_python_text() {
            label="$1"
            pattern="$2"
            shift 2
            grep_args=(-n -I -E)
            allow_match_regex=
            while :; do
              case "${1:-}" in
                --ignore-case)
                  grep_args+=(-i)
                  shift
                  ;;
                --allow-match-regex)
                  allow_match_regex="$2"
                  shift 2
                  ;;
                *) break ;;
              esac
            done
            set +e
            matches="$(git grep "${grep_args[@]}" "${pattern}" -- "$@")"
            scan_status=$?
            set -e
            case "${scan_status}" in
              0)
                if [ -n "${allow_match_regex}" ]; then
                  set +e
                  unexpected_matches="$(printf '%s\n' "${matches}" \
                    | grep -E -v "${allow_match_regex}")"
                  allow_status=$?
                  set -e
                  case "${allow_status}" in
                    0) matches="${unexpected_matches}" ;;
                    1) return 0 ;;
                    *)
                      echo "${label} allowlist scanner failed with status ${allow_status}" >&2
                      exit "${allow_status}"
                      ;;
                  esac
                fi
                echo "tracked ${label} is forbidden" >&2
                printf '%s\n' "${matches}" >&2
                exit 1
                ;;
              1)
                return 0
                ;;
              *)
                echo "${label} scanner failed with status ${scan_status}" >&2
                exit "${scan_status}"
                ;;
            esac
          }

          shebang_pathspecs=(
            ':(exclude,glob)**/*.md'
            ':(exclude,glob)**/docs/archive/**'
            ':(exclude,glob)**/docs/plans/**'
            ':(exclude,glob)**/docs/reviews/**'
            ':(exclude,glob)**/docs/superpowers/**'
            ':(exclude,glob)**/tasks/research_evidence/**'
          )
          reject_python_text \
            "Python shebang" \
            '^#!.*python([0-9]+([.][0-9]+)?)?([[:space:]]|$)' \
            --ignore-case \
            "${shebang_pathspecs[@]}"

          inline_command_pathspecs=(
            ':(icase,glob)**/*.sh'
            ':(icase,glob)**/*.bash'
            ':(icase,glob)**/*.zsh'
            ':(icase,glob)**/*.yml'
            ':(icase,glob)**/*.yaml'
            ':(icase,glob)**/*.toml'
            ':(icase,glob)**/*.service'
            ':(icase,glob)**/*.timer'
            ':(icase,glob)**/*.socket'
            ':(icase,glob)**/*.conf'
            ':(icase,glob)**/Dockerfile*'
            ':(icase,glob)**/Makefile'
            ':(icase,glob)**/Justfile'
            ':(icase,glob)**/bin/*'
            ':(icase,glob)**/scripts/*'
            ':(icase,glob)**/scripts/**/*'
            ':(exclude,glob)**/docs/archive/**'
            ':(exclude,glob)**/docs/plans/**'
            ':(exclude,glob)**/docs/reviews/**'
            ':(exclude,glob)**/docs/superpowers/**'
            ':(exclude,glob)**/tasks/research_evidence/**'
          )
          # Root-only migration controls may identify the already-installed
          # legacy runtime for parity and rollback, but may not add executable
          # Python/package-manager commands. Every permitted match is anchored
          # to an exact file and identity-only line; everything else is rejected.
          legacy_runtime_reference_allowlist='^(deployment/aliyun/polymarket-raw-ops-cutover[.]sh:[0-9]+:readonly LEGACY_EXEC="/usr/bin/pyth[o]n3 [$]LEGACY_COLLECTOR"|deployment/aliyun/polymarket-raw-ops-cutover[.]sh:[0-9]+:readonly LEGACY_REFERENCE_UPLOAD_EXEC="/usr/bin/pyth[o]n3 [$]LEGACY_UPLOADER --spool-dir /data/monday/spool/polymarket-reference --dataset crypto_expiry_reference --quote-depth-levels 0 --quote-sample-ms 0"|deployment/aliyun/polymarket-raw-ops-shadow-gate[.]sh:[0-9]+:readonly LEGACY_EXEC=[^[:alnum:]]/usr/bin/pyth[o]n3 /opt/monday/bin/polymarket_reference_collector[.]py[^[:alnum:]]|deployment/aliyun/test-polymarket-raw-ops-control-plane[.]sh:[0-9]+:[[:space:]]+(exec_start|cmdline):"/usr/bin/pyth[o]n3 /opt/monday/bin/polymarket_reference_collector[.]py",|deployment/aliyun/test-polymarket-raw-ops-control-plane[.]sh:[0-9]+:[[:space:]]+LEGACY_EXEC=[^[:alnum:]]/usr/bin/pyth[o]n3 /opt/monday/bin/polymarket_reference_collector[.]py[^[:alnum:]])$'
          reject_python_text \
            "Python runtime or package-manager command" \
            'actions/setup-pyth[o]n@|astral-sh/setup-u[v]@|(^|[;&|()/[:space:]])(python([0-9]+([.][0-9]+)?)?|pip([0-9]+)?|pipx|pytest|poetry|pdm|rye|conda|mamba|hatch|tox|virtualenv)([[:space:]]|$)|(^|[;&|()/[:space:]])uv[[:space:]]+(run|sync|pip|venv|python)([[:space:]]|$)' \
            --ignore-case \
            --allow-match-regex "${legacy_runtime_reference_allowlist}" \
            "${inline_command_pathspecs[@]}"

          if git grep -n -E '(name = "(burn-tch|tch|torch-sys|pyo3[^"]*|cpython|rust-cpython|python3-sys|rustpython[^"]*)"|^[[:space:]]*(burn-tch|tch|torch-sys|pyo3([-_][A-Za-z0-9_-]+)?|cpython|rust-cpython|python3-sys|rustpython([-_][A-Za-z0-9_-]+)?)[[:space:]]*=)' -- \
            ':(glob)**/Cargo.toml' ':(glob)**/Cargo.lock'; then
            echo "PyTorch/libtorch and Python-runtime Rust bindings are forbidden" >&2
            exit 1
          fi

      - name: Setup Rust toolchain (fmt)
        if: ${{ (needs.scope.outputs.loop == 'true') }}
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: 1.98.1
          components: rustfmt

      - name: Format Loop Engineer packages
        if: ${{ (needs.scope.outputs.loop == 'true') }}
        working-directory: rust_hft
        run: |
          "$GITHUB_WORKSPACE/rust_hft/scripts/cargo-scoped.sh" fmt --check --package alpha-domain
          "$GITHUB_WORKSPACE/rust_hft/scripts/cargo-scoped.sh" fmt --check --package alpha-store
          "$GITHUB_WORKSPACE/rust_hft/scripts/cargo-scoped.sh" fmt --check --package alpha-engine
          "$GITHUB_WORKSPACE/rust_hft/scripts/cargo-scoped.sh" fmt --check --package alpha-onnx-evaluator
          "$GITHUB_WORKSPACE/rust_hft/scripts/cargo-scoped.sh" fmt --check --package alpha-harness
          "$GITHUB_WORKSPACE/rust_hft/scripts/cargo-scoped.sh" fmt --check --package hft-harnessctl
          "$GITHUB_WORKSPACE/rust_hft/scripts/cargo-scoped.sh" fmt --check --package hft-research-ml

  market_recorder_contract:
    name: Market Recorder Release Contract
    needs: scope
    if: ${{ contains(needs.scope.outputs.jobs, ',ci/market-recorder-contract,') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify market recorder release contract
        working-directory: rust_hft
        run: |
          MONDAY_TEST_RECORDER_IMAGE=1 SOURCE_REVISION="$GITHUB_SHA" \
            ../deployment/aliyun/test-polymarket-market-recorder-release.sh

  deployment_artifacts:
    name: Production Image And Kubernetes Contract
    needs: scope
    if: ${{ contains(needs.scope.outputs.jobs, ',ci/deployment-artifacts,') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        if: needs.scope.outputs.production_trading_image == 'true' || needs.scope.outputs.production_collector_image == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build production trading image
        if: needs.scope.outputs.production_trading_image == 'true'
        uses: docker/build-push-action@v7
        with:
          context: rust_hft
          file: rust_hft/deployment/docker/Dockerfile.trading
          push: false
          tags: hft-trading:${{ github.sha }}
          cache-from: type=gha,scope=hft-trading-image
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=min,scope=hft-trading-image' || '' }}

      # This is the same production collector Dockerfile and cache used by ACR.
      # A build-dependency failure must fail the required CI gate before release.
      - name: Build production collector image
        if: needs.scope.outputs.production_collector_image == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: rust_hft
          file: rust_hft/deployment/docker/Dockerfile.binance-lob-archiver
          target: runtime
          platforms: linux/amd64
          push: false
          load: true
          tags: monday-collector-check:${{ github.sha }}
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=acr-binance-lob-archiver
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=min,scope=acr-binance-lob-archiver' || '' }}
          provenance: false
          sbom: false
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Verify production collector binary source and self-test
        if: needs.scope.outputs.production_collector_image == 'true'
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          image="monday-collector-check:$SOURCE_REVISION"
          docker run --rm --network none --read-only --cap-drop ALL \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777 \
            --entrypoint /usr/local/bin/binance-lob-archiver "$image" --version \
            | grep -Fqx "binance-lob-archiver $SOURCE_REVISION"
          docker run --rm --network none --read-only --cap-drop ALL \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777 \
            --entrypoint /usr/local/bin/binance-lob-archiver "$image" --self-test

      - name: Preserve the tested collector image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.scope.outputs.production_collector_image == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/save-tested-image.sh "monday-collector-check:$GITHUB_SHA" binance-lob-archiver 'Production Image And Kubernetes Contract' tested-collector

      - name: Upload the tested collector image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.scope.outputs.production_collector_image == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tested-image-binance-lob-archiver-${{ github.sha }}-${{ github.run_attempt }}
          path: tested-collector/
          if-no-files-found: error
          retention-days: 7

      - name: Validate Kubernetes manifests without a cluster
        run: |
          docker run --rm \
            -v "$PWD:/work:ro" \
            ghcr.io/yannh/kubeconform:v0.7.0 \
            -strict -summary \
            /work/rust_hft/deployment/k8s \
            /work/deployment/aliyun/research/k8s

  polymarket_evidence_compiler_image:
    name: Polymarket Evidence Compiler Image
    needs: scope
    if: ${{ contains(needs.scope.outputs.jobs, ',ci/polymarket-evidence-compiler-image,') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build and inspect Polymarket evidence compiler image
        run: |
          image=polymarket-evidence-compiler:${{ github.sha }}
          docker build \
            --build-arg "SOURCE_REVISION=${{ github.sha }}" \
            --file rust_hft/deployment/docker/Dockerfile.polymarket-evidence-compiler \
            --tag "$image" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            rust_hft
          docker run --rm --entrypoint /usr/local/bin/polymarket-raw-ops "$image" \
            publish-polymarket-evidence --help >/dev/null
          docker run --rm --entrypoint /usr/local/bin/polymarket-raw-ops "$image" \
            --version | grep -Fqx "polymarket-raw-ops ${{ github.sha }}"
          docker run --rm --entrypoint /usr/local/bin/aliyun "$image" version >/dev/null
          docker run --rm --entrypoint /bin/sh "$image" -ec \
            'test ! -e /usr/local/bin/binance-lob-archiver'
          actual_source_revision=$(docker image inspect \
            --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' \
            "$image")
          test "$actual_source_revision" = "${{ github.sha }}"

  rust_hft_engine_fast_lane:
    name: Rust HFT Engine Fast Lane
    needs: scope
    if: ${{ contains(needs.scope.outputs.jobs, ',ci/rust-hft-engine-fast-lane,') }}
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      CARGO_TARGET_DIR: ${{ github.workspace }}/rust_hft/target
      CARGO_INCREMENTAL: "0"
    defaults:
      run:
        working-directory: rust_hft
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: 1.98.1
          components: rustfmt

      - name: Install Linux build tools
        run: bash "$GITHUB_WORKSPACE/.github/workflows/install-ubuntu-packages.sh" clang mold protobuf-compiler

      - name: Record cache dimensions
        id: cache-info
        shell: bash
        run: echo "rust=$(rustc -Vv | awk '/^release:/ {print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            rust_hft
          key: hft-engine-fast-lane-${{ steps.cache-info.outputs.rust }}-${{ hashFiles('rust_hft/runtime/Cargo.lock') }}
          cache-all-crates: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Audit unbounded channels
        run: |
          "$GITHUB_WORKSPACE/rust_hft/scripts/cargo-scoped.sh" test -p hft-engine --test queue_topology_contract --locked

      - name: Format hft-engine
        run: |
          "$GITHUB_WORKSPACE/rust_hft/scripts/cargo-scoped.sh" fmt --check --package hft-engine

      - name: Check hft-engine
        run: |
          "$GITHUB_WORKSPACE/rust_hft/scripts/cargo-scoped.sh" check -p hft-engine --locked

      - name: Test Binance MD fast lane
        run: |
          "$GITHUB_WORKSPACE/rust_hft/scripts/cargo-scoped.sh" test -p hft-binance-depth --locked --lib

      - name: Enforce quote-to-worker latency budgets
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/rust_hft/scripts/cargo-scoped.sh" test -p hft-engine --bench hotpath_latency_p99 --release --locked -- --nocapture \
            | tee "$RUNNER_TEMP/engine-latency.log"

      - name: Record engine latency metrics
        if: ${{ always() }}
        run: |
          if [[ -f "$RUNNER_TEMP/engine-latency.log" ]]; then
            {
              printf '### Local quote-to-worker latency\n\nSource: %s\n\n' "$GITHUB_SHA"
              grep '^quote_to_worker_queue ' "$RUNNER_TEMP/engine-latency.log" || true
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  node_install:
    name: Node Install (root)
    needs: scope
    if: ${{ contains(needs.scope.outputs.jobs, ',ci/node-install,') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Detect Node lockfile
        id: node-lock
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            echo "manager=npm" >> "$GITHUB_OUTPUT"
            echo "cache=npm" >> "$GITHUB_OUTPUT"
          elif [ -f pnpm-lock.yaml ]; then
            echo "manager=pnpm" >> "$GITHUB_OUTPUT"
            echo "cache=pnpm" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "manager=yarn" >> "$GITHUB_OUTPUT"
            echo "cache=yarn" >> "$GITHUB_OUTPUT"
          else
            echo "manager=none" >> "$GITHUB_OUTPUT"
            echo "cache=npm" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.node-lock.outputs.manager != 'none'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: ${{ steps.node-lock.outputs.cache }}

      - name: Install dependencies
        if: steps.node-lock.outputs.manager != 'none'
        run: |
          case "${{ steps.node-lock.outputs.manager }}" in
            npm)
              npm ci --prefer-offline --no-audit --fund=false
              ;;
            pnpm)
              corepack enable
              pnpm install --frozen-lockfile
              ;;
            yarn)
              corepack enable
              yarn install --immutable || yarn install --frozen-lockfile
              ;;
          esac

      - name: Skip Node install
        if: steps.node-lock.outputs.manager == 'none'
        run: echo "No root Node lockfile found; skipping Node install."

  ci-gate:
    name: Monorepo CI gate
    needs:
      - selector
      - scope
      - control_contracts
      - monitor_contracts
      - ci_contracts
      - rust_shell_scripts
      - rust
      - rust_loop_nextest_archive
      - rust_loop_nextest_shard
      - clippy_strict
      - rust_fast_gates
      - research_foundation
      - market_recorder_contract
      - deployment_artifacts
      - polymarket_evidence_compiler_image
      - rust_hft_engine_fast_lane
      - node_install
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608 # v4.1.0
      - name: Require selected jobs to pass
        working-directory: .
        env:
          GATE_NEEDS: ${{ toJson(needs) }}
          EXPECTED_JOBS: ${{ needs.scope.outputs.jobs }}
        run: printf '%s' "$GATE_NEEDS" | bash .github/scripts/verify-ci-gate.sh --job-prefix ci --expected-jobs "$EXPECTED_JOBS"
      - name: Require loop nextest shards when loop tests are selected
        working-directory: .
        env:
          LOOP: ${{ needs.scope.outputs.loop }}
          SELECTED_JOBS: ${{ needs.scope.outputs.jobs }}
          ARCHIVE_RESULT: ${{ needs.rust_loop_nextest_archive.result }}
          SHARD_RESULT: ${{ needs.rust_loop_nextest_shard.result }}
        run: bash .github/scripts/loop-nextest-gate.sh
