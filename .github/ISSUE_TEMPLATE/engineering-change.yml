name: Engineering change
description: Record one independently verifiable improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: What observable behavior should change, and why?
    validations:
      required: true
  - type: textarea
    id: proof
    attributes:
      label: Proof
      description: What smallest check will prove the outcome?
    validations:
      required: true
