name: Runtime outcome
description: Request and record one bounded live outcome
labels: ["enhancement", "runtime"]
body:
  - type: input
    id: target
    attributes:
      label: Exact target
    validations:
      required: true
  - type: input
    id: controller
    attributes:
      label: One controller
    validations:
      required: true
  - type: textarea
    id: candidate
    attributes:
      label: Candidate identity
    validations:
      required: true
  - type: textarea
    id: configuration
    attributes:
      label: Configuration identity
    validations:
      required: true
  - type: textarea
    id: rollback
    attributes:
      label: Rollback identity and procedure
    validations:
      required: true
  - type: textarea
    id: stop
    attributes:
      label: Stop and cleanup rules
    validations:
      required: true
  - type: textarea
    id: proof
    attributes:
      label: Success and direct readback
    validations:
      required: true
