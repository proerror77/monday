name: Runtime outcome
description: Authorize and record one bounded live outcome
labels: ["enhancement", "runtime"]
body:
  - type: input
    id: target
    attributes:
      label: Exact target
    validations:
      required: true
  - type: input
    id: controller
    attributes:
      label: One controller
    validations:
      required: true
  - type: textarea
    id: identities
    attributes:
      label: Candidate and rollback identities
    validations:
      required: true
  - type: textarea
    id: stop
    attributes:
      label: Stop and cleanup rules
    validations:
      required: true
  - type: textarea
    id: proof
    attributes:
      label: Success and direct readback
    validations:
      required: true
